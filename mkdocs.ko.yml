      - 입력 방식 선택: getting-started/ingestion-paths.md
      - 런타임 수명주기: getting-started/runtime-lifecycle.md
      - 시작 시 재바인딩: getting-started/startup-rebinding.md
      - 저장소 마이그레이션: getting-started/storage-migrations.md
      - Capability Explorer: getting-started/schema-explorer.md
  - 핵심 개념:
      - SchemaRouter란?: concepts/schema-router.md
      - RAG와 capability 검색: concepts/capability-catalog.md
      - 설계 원칙: concepts/design-principles.md
      - Tool/Endpoint 계약: concepts/tool-endpoint.md
