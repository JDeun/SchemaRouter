INHERIT: mkdocs.yml

site_name: SchemaRouter 문서
site_description: LLM/RAG 에이전트를 위한 타입 기반 capability 검색과 스키마 인식 실행
site_url: https://jdeun.github.io/SchemaRouter/ko/
docs_dir: .build/docs-ko
site_dir: site/ko
edit_uri: edit/main/docs_ko/

theme:
  language: ko

plugins:
  - search:
      lang:
        - ko
        - en

nav:
  - 홈: index.md
  - 시작하기:
      - 설치: getting-started/installation.md
      - 빠른 시작: getting-started/quickstart.md
