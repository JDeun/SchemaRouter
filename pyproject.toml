[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "schemarouter"
version = "0.1.0a1"
description = "Schema-aware planning and execution layer for LLM tool ecosystems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yong-eun Cho" }]
keywords = ["llm", "agents", "mcp", "openapi", "tool-routing", "schema"]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]
langchain = [
  "langchain-core>=1.6,<2",
]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/JDeun/SchemaRouter"
Repository = "https://github.com/JDeun/SchemaRouter"
Issues = "https://github.com/JDeun/SchemaRouter/issues"
Research = "https://github.com/JDeun/paper_SchemaRouter"

[tool.hatch.build.targets.wheel]
packages = ["src/schemarouter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
