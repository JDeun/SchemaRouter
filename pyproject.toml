[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "schemarouter"
version = "0.6.0.dev0"
description = "Schema-aware planning and execution layer for LLM tool ecosystems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yong-eun Cho" }]
license = "MIT"
keywords = ["llm", "agents", "mcp", "openapi", "optimade", "tool-routing", "schema"]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
schemarouter = "schemarouter.cli:main"

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]
langchain = [
  "langchain-core>=1.6,<2",
]
langgraph = [
  "langgraph>=1.2,<2",
]
llamaindex = [
  "llama-index-core>=0.14,<1",
]
jev = [
  "typesafe-sdk>=0.7,<1",
]
laya = [
  "laya>=0.3.6,<1",
]
otel = [
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
]
docs = [
  "mkdocs-material>=9.7,<10",
  "mkdocstrings>=1,<2",
  "mkdocstrings-python>=2,<3",
]
dev = [
  "build>=1.2",
  "pyright>=1.1,<2",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5,<8",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/JDeun/SchemaRouter"
Repository = "https://github.com/JDeun/SchemaRouter"
Documentation = "https://jdeun.github.io/SchemaRouter/"
Issues = "https://github.com/JDeun/SchemaRouter/issues"
Research = "https://github.com/JDeun/paper_SchemaRouter"
Brand = "https://jdeun.github.io/SchemaRouter/project/brand/"

[tool.hatch.build.targets.wheel]
packages = ["src/schemarouter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
  "mcp_integration: requires the optional MCP SDK and a real local protocol server",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src/schemarouter"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["schemarouter"]

[tool.coverage.report]
fail_under = 82
show_missing = true
skip_covered = false
