name: Research V6A Schema ADB DEV

on:
  push:
    branches:
      - "research/0.13-schema-derived-adb"
    paths:
      - ".github/workflows/research-v6a-schema-adb-dev.yml"
      - "scripts/evaluate_schema_derived_adb_v6a.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SOURCE: "acaffa8844294d7425be5e772362810ecfbcd383"
  DEV_SHA256: "55f6332ee39b16fd565ed8c495b253566557b86dc41bde131f3996d4a75f4740"
  CONFIRM_SHA256: "5aa344bb7fa3f623129d8f3f2cc8b588bb1a68c32ef9d092a6eba8d15854df0e"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Verify frozen behavior and corpus source
        run: |
          git diff --exit-code "${FROZEN_SOURCE}" --             benchmarks/operation-routing-v6a-schema-adb-preregistration.json             benchmarks/schema_derived_adb.py             benchmarks/operation_routing_v6a_catalog.py             scripts/generate_operation_routing_v6a.py             tests/test_schema_derived_adb.py             tests/test_operation_routing_v6a_protocol.py

      - name: Validate evaluator and frozen protocol
        run: |
          ruff check scripts/evaluate_schema_derived_adb_v6a.py
          pytest -q             tests/test_schema_derived_adb.py             tests/test_operation_routing_v6a_protocol.py

  evaluate-development:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"

      - name: Recreate both frozen corpora
        run: |
          python scripts/generate_operation_routing_v6a.py             --out-dir artifacts/operation-routing-v6a

      - name: Verify both frozen corpus identities before scoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/operation-routing-v6a")
          freeze = json.loads((root / "freeze-manifest.json").read_text())
          if freeze["development"]["corpus_sha256"] != os.environ["DEV_SHA256"]:
              raise SystemExit("DEV corpus identity drifted")
          if freeze["confirmation"]["corpus_sha256"] != os.environ["CONFIRM_SHA256"]:
              raise SystemExit("confirmation corpus identity drifted")
          if freeze["development"]["case_count"] != 552:
              raise SystemExit("unexpected DEV case count")
          if freeze["confirmation"]["case_count"] != 552:
              raise SystemExit("unexpected confirmation case count")
          if freeze["development"]["adb_ready_routes"] != 19:
              raise SystemExit("unexpected DEV ADB-ready route count")
          if freeze["confirmation"]["adb_ready_routes"] != 19:
              raise SystemExit("unexpected confirmation ADB-ready route count")
          print("both frozen corpus identities verified; confirmation remains unscored")
          PY

      - name: Score development only
        run: |
          python scripts/evaluate_schema_derived_adb_v6a.py             --development artifacts/operation-routing-v6a/development.json             --out artifacts/operation-routing-v6a/dev-analysis.json

      - name: Validate governance and authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/operation-routing-v6a/dev-analysis.json").read_text()
          )
          policy = data["policy"]
          if policy["confirmation_scored"]:
              raise SystemExit("confirmation was scored before DEV pass")
          if policy["prior_failed_rows_used_for_tuning"]:
              raise SystemExit("prior failed evidence leaked into candidate")
          if not policy["raw_bge_is_sole_positive_selector"]:
              raise SystemExit("raw BGE positive authority changed")
          if not policy["adb_veto_only"]:
              raise SystemExit("ADB must remain veto-only")
          if policy["adb_positive_rerank"] or policy["endpoint_switch"]:
              raise SystemExit("ADB gained forbidden positive route authority")
          if policy["benchmark_labels_used_for_boundary_fit"]:
              raise SystemExit("benchmark labels leaked into boundary fit")
          if policy["oos_examples_used_for_boundary_fit"]:
              raise SystemExit("baseline unexpectedly used OOS fit examples")
          if policy["confidence_or_margin_threshold_grid"]:
              raise SystemExit("forbidden threshold grid detected")
          if policy["cross_tool_fallback"] or policy["pseudo_route"]:
              raise SystemExit("forbidden route authority detected")

          metrics = data["metrics"]
          if metrics["positive_route_switches"] != 0:
              raise SystemExit("boundary switched to another positive route")
          if metrics["authority_violations"] != 0:
              raise SystemExit("authority violation")
          if metrics["execution_errors"] != 0:
              raise SystemExit("execution errors")

          print("quality_pass=", data["quality_pass"])
          print("runtime_gate=", data["runtime_gate"])
          print("surface_pass=", data["surface_pass"])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operation-routing-v6a-dev-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v6a/dev-analysis.json
            artifacts/operation-routing-v6a/development-manifest.json
            artifacts/operation-routing-v6a/confirmation-manifest.json
            benchmarks/operation-routing-v6a-schema-adb-preregistration.json
          if-no-files-found: warn
          retention-days: 30
