name: Host Field Contract Policy Witness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/schemarouter/host_field_contract.py"
      - "tests/test_host_field_contract.py"
      - ".github/workflows/host-field-contract-policy-witness.yml"

permissions:
  contents: read

concurrency:
  group: host-policy-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  same-object-policy-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install unit and scoped runtime
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Verify policy content digest and same-object revocation
        run: |
          ruff check src/schemarouter/host_field_contract.py tests/test_host_field_contract.py
          python -m pytest -q tests/test_host_field_contract.py tests/test_host_field_contract_enum_satisfiability.py
