name: Pinned Scaled DEV Evidence Audit

on:
  pull_request:
    paths:
      - "benchmarks/scaled-authorized-dev-frozen-source.json"
      - "scripts/research_scaled_authorized_report_audit.py"
      - "tests/test_research_scaled_authorized_report_audit.py"
      - "research/autoresearch/scaled-authorized-evidence-audit.md"
      - ".github/workflows/research-scaled-authorized-evidence-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-scaled-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-authentic-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install current source and zero-inference testing tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - name: Fail-closed synthetic evidence tamper counterexamples
        run: python -m pytest -q tests/test_research_scaled_authorized_report_audit.py
      - name: Fetch exact previously successful real Actions report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=38839753512
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          [[ "$(jq -r '.conclusion' <<<"$RUN")" == "success" ]] ||
            { echo "Pinned Actions report is not a successful run"; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$RUN")" == "research/1428-scaled-authorized-adapter-dev" ]] ||
            { echo "Pinned source branch mismatch"; exit 1; }
          mkdir -p artifacts/scaled-dev-audit/source
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY"             --name "scaled-authorized-dev-$RUN_ID"             --dir artifacts/scaled-dev-audit/source
          test -s artifacts/scaled-dev-audit/source/report.json
          echo "a076df488754229f8090db5f9fdf69310f21ccad018af4fe1dee22afe6f496c0  artifacts/scaled-dev-audit/source/report.json" |
            sha256sum --check --status
      - name: Independently audit every paired score and cost metric
        run: |
          python -m scripts.research_scaled_authorized_report_audit             --input artifacts/scaled-dev-audit/source/report.json             --manifest benchmarks/scaled-authorized-dev-frozen-source.json             --output artifacts/scaled-dev-audit/audit.json
      - name: Archive immutable raw evidence and negative audit decisions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinned-scaled-authorized-audit-${{ github.run_id }}
          path: artifacts/scaled-dev-audit/
          if-no-files-found: warn
          retention-days: 90
# Read-only source verification. No model API, GPU, agent, product or release writes.
