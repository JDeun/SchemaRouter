name: Paired Fixed5 Agent Task Success E0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_paired_agent_fixed5_e0.py"
      - "tests/test_research_paired_agent_fixed5_e0.py"
      - "research/autoresearch/paired-fixed5-agent-e0-report.md"
      - ".github/workflows/research-paired-fixed5-agent-e0.yml"

permissions:
  contents: read

concurrency:
  group: paired-agent-e0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-paired-dev-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install E0-only test/runtime tools
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Validate paired synthetic E0 task success contract
        run: |
          ruff check scripts/research_paired_agent_fixed5_e0.py tests/test_research_paired_agent_fixed5_e0.py
          python -m pytest -q tests/test_research_paired_agent_fixed5_e0.py
