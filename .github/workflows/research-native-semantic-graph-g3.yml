name: Native Host-Attested Semantic Graph G3 E0

on:
  pull_request:
    paths:
      - "scripts/research_native_semantic_graph_g3.py"
      - "scripts/research_authorized_native_graph_edges_g1.py"
      - "scripts/research_verified_graph_paths_g2.py"
      - "tests/test_research_native_semantic_graph_g3.py"
      - ".github/workflows/research-native-semantic-graph-g3.yml"
      - "research/autoresearch/native-attested-semantic-graph-g3.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-semantic-g3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-semantic-graph-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install checked out source and test tooling
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1"
      - name: Native attestation and G2 parity
        run: |
          ruff check scripts/research_native_semantic_graph_g3.py scripts/research_verified_graph_paths_g2.py tests/test_research_native_semantic_graph_g3.py
          python -m pytest -q tests/test_research_native_semantic_graph_g3.py tests/test_research_verified_graph_paths_g2.py
