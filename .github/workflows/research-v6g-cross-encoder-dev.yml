name: Research V6G Relative Cross Encoder DEV

on:
  push:
    branches:
      - "research/0.13-relative-cross-encoder-gate"
    paths:
      - ".github/workflows/research-v6g-cross-encoder-dev.yml"
      - "scripts/evaluate_schema_cross_encoder_v6g.py"
  pull_request:
    paths:
      - ".github/workflows/research-v6g-cross-encoder-dev.yml"
      - "scripts/evaluate_schema_cross_encoder_v6g.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SOURCE: "ffe0e7921ae7fd98e8f446cef0075e9bc7961442"
  DEV_SHA256: "1b0f4f6d117b17cba527661c8dc11f874a642fd25c698ec7efa63401bdbbc4fb"
  CONFIRM_SHA256: "ed79e9f55c719c7f83e006d879a1e2056a3dd9252b4dfce9832f91fadbc7e353"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Verify frozen V6G behavior and corpus source
        run: |
          git diff --exit-code "${FROZEN_SOURCE}" -- \
            benchmarks/operation-routing-v6g-relative-cross-encoder-preregistration.json \
            benchmarks/operation_routing_v6g_catalog.py \
            benchmarks/schema_cross_encoder_membership.py \
            scripts/generate_operation_routing_v6g.py \
            tests/test_schema_cross_encoder_membership.py \
            tests/test_operation_routing_v6g_protocol.py

      - name: Validate evaluator and frozen protocol
        run: |
          ruff check scripts/evaluate_schema_cross_encoder_v6g.py
          PYTHONPATH=. pytest -q \
            tests/test_schema_cross_encoder_membership.py \
            tests/test_operation_routing_v6g_protocol.py

  evaluate-development:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"

      - name: Recreate both frozen V6G corpora
        run: |
          python scripts/generate_operation_routing_v6g.py \
            --out-dir artifacts/operation-routing-v6g

      - name: Verify both frozen identities before scoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/operation-routing-v6g")
          freeze = json.loads(
              (root / "freeze-manifest.json").read_text(encoding="utf-8")
          )
          if freeze["development"]["corpus_sha256"] != os.environ["DEV_SHA256"]:
              raise SystemExit("V6G DEV corpus identity drifted")
          if freeze["confirmation"]["corpus_sha256"] != os.environ["CONFIRM_SHA256"]:
              raise SystemExit("V6G confirmation corpus identity drifted")
          for role in ("development", "confirmation"):
              manifest = freeze[role]
              if manifest["case_count"] != 552:
                  raise SystemExit(f"unexpected {role} case count")
              if manifest["supported_cases"] != 228:
                  raise SystemExit(f"unexpected {role} supported count")
              if manifest["near_domain_cases"] != 252:
                  raise SystemExit(f"unexpected {role} near-domain count")
              if manifest["out_of_domain_cases"] != 72:
                  raise SystemExit(f"unexpected {role} OOD count")
          print("frozen V6G identities verified; confirmation remains unscored")
          PY

      - name: Score development only
        run: |
          python scripts/evaluate_schema_cross_encoder_v6g.py \
            --development artifacts/operation-routing-v6g/development.json \
            --out artifacts/operation-routing-v6g/dev-analysis.json

      - name: Validate authority and governance invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/operation-routing-v6g/dev-analysis.json")
              .read_text(encoding="utf-8")
          )
          policy = data["policy"]
          if policy["confirmation_scored"]:
              raise SystemExit("confirmation scored before DEV pass")
          if policy["prior_failed_rows_used_for_tuning"]:
              raise SystemExit("prior failed evidence leaked")
          if not policy["raw_bge_is_sole_positive_selector"]:
              raise SystemExit("positive route authority changed")
          if not policy["cross_encoder_veto_only"]:
              raise SystemExit("cross-encoder gained positive authority")
          if not policy["registered_supported_documents"]:
              raise SystemExit("supported evidence provenance missing")
          if not policy["schema_derived_complement_documents"]:
              raise SystemExit("counterfactual evidence provenance missing")
          if not policy["frozen_background_documents"]:
              raise SystemExit("background evidence provenance missing")
          if policy["benchmark_rows_used_for_evidence_fit"]:
              raise SystemExit("benchmark rows used for evidence fit")
          if policy["positive_rerank"] or policy["endpoint_switch"]:
              raise SystemExit("forbidden positive route mutation")
          if policy["rank2_fallback"] or policy["pseudo_route"]:
              raise SystemExit("forbidden fallback authority")
          if policy["probability_threshold"] is not None:
              raise SystemExit("probability threshold detected")
          if policy["margin_threshold"] is not None:
              raise SystemExit("margin threshold detected")
          if policy["temperature"] is not None or policy["score_normalization"] is not None:
              raise SystemExit("score transformation detected")
          if not policy["exact_ties_preserve"]:
              raise SystemExit("tie rule drifted")
          if policy["dev_selected_hyperparameters"]:
              raise SystemExit("DEV-selected tuning detected")
          metrics = data["metrics"]
          if metrics["positive_route_switches"] != 0:
              raise SystemExit("positive route switch detected")
          if metrics["authority_violations"] != 0:
              raise SystemExit("authority violation")
          if metrics["execution_errors"] != 0:
              raise SystemExit("execution errors")
          print("quality_pass=", data["quality_pass"])
          print("runtime_gate=", data["runtime_gate"])
          print("surface_pass=", data["surface_pass"])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operation-routing-v6g-dev-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v6g/dev-analysis.json
            artifacts/operation-routing-v6g/development-manifest.json
            artifacts/operation-routing-v6g/confirmation-manifest.json
            artifacts/operation-routing-v6g/freeze-manifest.json
            benchmarks/operation-routing-v6g-relative-cross-encoder-preregistration.json
          if-no-files-found: warn
          retention-days: 30
