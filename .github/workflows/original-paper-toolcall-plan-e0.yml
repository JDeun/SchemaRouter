name: Original Paper Typed ToolCall Plan E0

on:
  pull_request:
    paths:
      - "scripts/research_legacy_posting_rank.py"
      - "src/schemarouter/paper_field_retrieval.py"
      - "src/schemarouter/paper_typed_tool_plan.py"
      - "src/schemarouter/paper_observed_binding.py"
      - "src/schemarouter/paper_consumer_execution.py"
      - "src/schemarouter/paper_understood_graph_plan.py"
      - "src/schemarouter/paper_understood_direct_plan.py"
      - "src/schemarouter/paper_understood_concept_plan.py"
      - "tests/test_original_paper_cross_source_projection.py"
      - "tests/fixtures/original_paper_cross_source_projection.json"
      - "src/schemarouter/paper_query_understanding.py"
      - "src/schemarouter/paper_planning.py"
      - "src/schemarouter/field_routing_session.py"
      - "src/schemarouter/planner.py"
      - "src/schemarouter/executor.py"
      - "src/schemarouter/models.py"
      - "src/schemarouter/runtime.py"
      - "tests/test_paper_algorithm1_execution.py"
      - "tests/test_paper_configured_planning.py"
      - "tests/test_public_direct_sdk_real_denials.py"
      - "tests/test_prepared_model_query_routing.py"
      - "tests/test_prepared_understood_routing.py"
      - "src/schemarouter/adapters/optimade.py"
      - "src/schemarouter/native_graph_index.py"
      - "src/schemarouter/native_semantic_index.py"
      - "src/schemarouter/paper_native_rank.py"
      - "tests/test_paper_native_rank.py"
      - "tests/test_paper_original_rank.py"
      - "tests/fixtures/original_paper_rank_replay.json"
      - "src/schemarouter/paper_query_needs.py"
      - "tests/test_original_paper_arxiv_input_output.py"
      - "tests/fixtures/original_paper_arxiv_input_output.json"
      - "tests/test_original_paper_full_replay.py"
      - "scripts/research_original_paper_inventory.py"
      - "scripts/research_original_paper_model_replay.py"
      - "tests/test_paper_direct_union_parameters.py"
      - "tests/fixtures/original_paper_full_replay.json"
      - "tests/test_original_paper_mp_projection_replay.py"
      - "tests/fixtures/original_paper_mp_projection.json"
      - "src/schemarouter/field_group_retrieval.py"
      - "tests/test_optimade_paper_contract.py"
      - "research/autoresearch/paper-optimade-source-contract-e0-plan.md"
      - "src/schemarouter/__init__.py"
      - "scripts/research_paper_scoped_agent_episode_e0.py"
      - "scripts/research_paper_measured_episode_e0.py"
      - "scripts/research_paper_paired_agent_e0.py"
      - "scripts/research_paper_ranked_direct_a8_e0.py"
      - "scripts/research_paper_no_fit_calibration_a10_e0.py"
      - "tests/test_paper_typed_tool_plan.py"
      - "tests/test_paper_direct_sdk_execution.py"
      - "tests/test_public_execution_wiring_contract.py"
      - "benchmarks/public-execution-wiring-v1.json"
      - "tests/test_research_paper_scoped_agent_real_e0.py"
      - "tests/test_research_paper_measured_episode_e0.py"
      - "tests/test_research_paper_paired_agent_e0.py"
      - "tests/test_research_paper_ranked_direct_a8_e0.py"
      - "tests/test_research_paper_no_fit_calibration_a10_e0.py"
      - "tests/test_paper_observed_binding.py"
      - "tests/test_paper_consumer_execution.py"
      - "tests/test_paper_understood_graph_plan.py"
      - "tests/test_paper_understood_observed_graph_a9_e0.py"
      - "scripts/research_paper_scoped_observed_graph_a9_e0.py"
      - "tests/test_research_paper_scoped_observed_graph_a9_e0.py"
      - "scripts/research_paper_scoped_answered_graph_a9_e0.py"
      - "tests/test_research_paper_scoped_answered_graph_a9_e0.py"
      - "tests/test_public_api.py"
      - "tests/test_native_graph_shared_root_forks.py"
      - "tests/test_native_graph_host_root.py"
      - "research/autoresearch/paper-toolcall-implementation-e0.md"
      - "research/autoresearch/paper-a7-understand-metering-design.md"
      - "research/autoresearch/paper-a7-understand-metering-plan.md"
      - "research/autoresearch/paper-a7-paired-agent-e0-design.md"
      - "research/autoresearch/paper-a7-paired-agent-e0-plan.md"
      - "research/autoresearch/paper-a7-counterbalanced-pairs-e0-design.md"
      - "research/autoresearch/paper-a7-counterbalanced-pairs-e0-plan.md"
      - "research/autoresearch/paper-a8-ranked-direct-e0-design.md"
      - "research/autoresearch/paper-a8-ranked-direct-e0-plan.md"
      - "research/autoresearch/paper-a10-source-pinned-no-fit-design.md"
      - "research/autoresearch/paper-a10-source-pinned-no-fit-plan.md"
      - "research/autoresearch/paper-understood-observed-graph-a9-e0-design.md"
      - "research/autoresearch/paper-understood-observed-graph-a9-e0-plan.md"
      - "research/autoresearch/paper-scoped-answered-graph-a9-e0-design.md"
      - "research/autoresearch/paper-scoped-answered-graph-a9-e0-plan.md"
      - ".github/workflows/original-paper-toolcall-plan-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-paper-typed-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original source and no-model test tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1"
      - name: Verify original cross-provider source-local group projection
        run: |
          ruff check src/schemarouter/paper_understood_direct_plan.py src/schemarouter/paper_understood_concept_plan.py src/schemarouter/paper_query_understanding.py tests/test_original_paper_cross_source_projection.py src/schemarouter/native_semantic_index.py src/schemarouter/paper_understood_graph_plan.py
          python -m pytest -q tests/test_original_paper_cross_source_projection.py tests/test_paper_understood_direct_plan.py tests/test_understood_multi_concept.py tests/test_understood_typed_group_composition.py
      - name: Verify original direct Rank comparator and focus
        run: |
          ruff check src/schemarouter/paper_native_rank.py tests/test_paper_original_rank.py tests/test_paper_native_rank.py
          python -m pytest -q tests/test_paper_original_rank.py
          python -m pytest -q tests/test_paper_native_rank.py -k original_direct_focus
      - name: Verify original literature input and output concept separation
        run: |
          ruff check src/schemarouter/paper_query_needs.py src/schemarouter/paper_query_conditions.py src/schemarouter/paper_typed_tool_plan.py tests/test_original_paper_arxiv_input_output.py tests/test_paper_direct_union_parameters.py
          python -m pytest -q tests/test_original_paper_arxiv_input_output.py tests/test_paper_query_needs.py tests/test_query_input_conditions.py tests/test_paper_direct_union_parameters.py
      - name: Replay all 110 original archived queries on the full frozen catalog
        run: |
          ruff check tests/test_original_paper_full_replay.py tests/test_original_paper_mp_projection_replay.py
          ruff check scripts/research_original_paper_inventory.py scripts/research_original_paper_model_replay.py
          python -m pytest -q -s tests/test_original_paper_full_replay.py tests/test_original_paper_mp_projection_replay.py
        env:
          SCHEMAROUTER_PAPER_REPLAY_REPORT: ${{ runner.temp }}/original-paper-110-replay.json
      - name: Prove original typed calls, observed source bindings and bounded consumers
        run: |
          ruff check src/schemarouter/adapters/optimade.py src/schemarouter/native_graph_index.py src/schemarouter/field_group_retrieval.py src/schemarouter/paper_field_retrieval.py src/schemarouter/paper_typed_tool_plan.py src/schemarouter/paper_observed_binding.py src/schemarouter/paper_consumer_execution.py tests/test_paper_typed_tool_plan.py tests/test_paper_direct_sdk_execution.py tests/test_public_execution_wiring_contract.py tests/test_paper_observed_binding.py tests/test_paper_consumer_execution.py tests/test_native_graph_shared_root_forks.py tests/test_native_graph_host_root.py tests/test_optimade_paper_contract.py src/schemarouter/__init__.py
          python -m pytest -q tests/test_paper_typed_tool_plan.py tests/test_paper_direct_sdk_execution.py tests/test_public_execution_wiring_contract.py tests/test_paper_observed_binding.py tests/test_paper_consumer_execution.py tests/test_native_graph_shared_root_forks.py tests/test_native_graph_host_root.py tests/test_paper_field_retrieval.py tests/test_optimade_paper_contract.py
      - name: Verify Algorithm 1 configured planning and direct product execution
        run: |
          ruff check src/schemarouter/paper_planning.py src/schemarouter/paper_query_understanding.py scripts/research_legacy_planning/planner.py src/schemarouter/executor.py src/schemarouter/models.py src/schemarouter/runtime.py src/schemarouter/field_routing_session.py tests/test_paper_algorithm1_execution.py tests/test_paper_configured_planning.py tests/test_public_direct_sdk_real_denials.py
          python -m pytest -q tests/test_paper_algorithm1_execution.py tests/test_paper_configured_planning.py tests/test_public_direct_sdk_real_denials.py
      - name: Verify original scoped A5 agent and opt-in A7 meter on Python 3.12
        run: |
          ruff check scripts/research_paper_scoped_agent_episode_e0.py scripts/research_paper_measured_episode_e0.py scripts/research_paper_paired_agent_e0.py tests/test_research_paper_scoped_agent_real_e0.py tests/test_research_paper_measured_episode_e0.py tests/test_research_paper_paired_agent_e0.py
          python -m pytest -q tests/test_research_paper_scoped_agent_real_e0.py tests/test_research_paper_measured_episode_e0.py tests/test_research_paper_paired_agent_e0.py
      - name: Verify Algorithm 1 A7 baseline/paper two-order crossover and fail-closed boundaries
        run: python -m pytest -q tests/test_research_paper_paired_agent_e0.py -k 'counterbalance or counterbalanced or paper_first or execution_order'
      - name: Verify opt-in source-scoped A8 paper K5 research integration on Python 3.12
        run: |
          ruff check scripts/research_paper_ranked_direct_a8_e0.py tests/test_research_paper_ranked_direct_a8_e0.py
          python -m pytest -q tests/test_research_paper_ranked_direct_a8_e0.py
      - name: Verify bounded A9 named one/two-hop observed executor on Python 3.12
        run: |
          ruff check src/schemarouter/paper_understood_graph_plan.py src/schemarouter/paper_consumer_execution.py scripts/research_paper_scoped_observed_graph_a9_e0.py tests/test_paper_understood_graph_plan.py tests/test_paper_understood_observed_graph_a9_e0.py tests/test_research_paper_scoped_observed_graph_a9_e0.py tests/test_public_api.py
          ruff check src/schemarouter/paper_query_understanding.py src/schemarouter/field_routing_session.py tests/test_prepared_model_query_routing.py tests/test_prepared_understood_routing.py
          python -m pytest -q tests/test_paper_understood_graph_plan.py tests/test_prepared_model_query_routing.py tests/test_prepared_understood_routing.py tests/test_paper_understood_observed_graph_a9_e0.py tests/test_research_paper_scoped_observed_graph_a9_e0.py tests/test_public_api.py
      - name: Verify research-only A9 projected observation to tool-free answer
        run: |
          ruff check scripts/research_paper_scoped_answered_graph_a9_e0.py tests/test_research_paper_scoped_answered_graph_a9_e0.py
          python -m pytest -q tests/test_research_paper_scoped_answered_graph_a9_e0.py
      - name: Verify source-pinned Algorithm 1 A10 no-fit diagnostics on Python 3.12
        run: |
          ruff check scripts/research_paper_no_fit_calibration_a10_e0.py tests/test_research_paper_no_fit_calibration_a10_e0.py
          python -m pytest -q tests/test_research_paper_no_fit_calibration_a10_e0.py tests/test_research_paper_refusal_eval_e0.py tests/test_independent_native_e2_intake.py
      - name: Preserve full conditional paper replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-paper-110-conditional-replay
          path: ${{ runner.temp }}/original-paper-110-replay.json
          if-no-files-found: warn
