name: Local Qwen E5 Fixed5 Agent Fixture E0 DEV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_real_local_agent_fixed5_e0_pilot.py"
      - "tests/test_research_real_local_agent_fixed5_e0_pilot.py"
      - "research/autoresearch/real-local-qwen-e5-agent-fixture-pilot.md"
      - ".github/workflows/research-real-qwen-e5-fixed5-agent-e0-dev.yml"

permissions:
  contents: read

concurrency:
  group: real-agent-e0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-source-and-untrusted-model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install E0 no-model testing dependencies
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Validate frozen 84→12 exact DEV input, fixed K5 and fake provenance
        run: |
          ruff check scripts/research_real_local_agent_fixed5_e0_pilot.py tests/test_research_real_local_agent_fixed5_e0_pilot.py
          python -m pytest -q tests/test_research_real_local_agent_fixed5_e0_pilot.py tests/test_research_paired_agent_fixed5_e0.py
          python -m scripts.research_real_local_agent_fixed5_e0_pilot --mode validate

  real-qwen-real-e5-agent-fixture-dev:
    needs: frozen-source-and-untrusted-model-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install local CPU-only model inference
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Execute actual pinned Qwen and E5 on 12 source-verified fixture tasks
        run: |
          python -m scripts.research_real_local_agent_fixed5_e0_pilot \
            --mode real-cpu \
            --out artifacts/agent-fixed5-e5-qwen-dev/report.json
      - name: Publish strictly unqualified real-model DEV fixture metrics
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("artifacts/agent-fixed5-e5-qwen-dev/report.json").read_text(encoding="utf-8"))
          assert report["evidence_tier"] == "REAL_LOCAL_QWEN_E5_FIXTURE_TASK_DEV_ONLY"
          assert report["real_agent_generation_measured"] is True
          assert report["real_e5_inference_measured"] is True
          assert report["independent_e2_qualified"] is False
          assert report["real_native_provider_execution"] is False
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Actual pinned local Qwen + E5 K5 **fixture task completion, DEV/E0 ONLY**\n\n")
              f.write("Previously exposed *synthetic* source queries; 12 small EN/KO/JA cases, six single-read steps and six unsupported operations. Actual agent generations but simulated read-only tool results (FrozenCorpusExecutor), **NO live native provider, E2, calibrated no-fit, or final-answer factual correctness**.\n\n")
              f.write("| Arm | Fixture task pass | EN | KO | JA | Unsupported attempted tool calls |\n|---|---:|---:|---:|---:|---:|\n")
              for arm, row in report["agent_task_fixture_pass"]["summary"].items():
                  f.write(f"| {arm} | {row['task_pass_rate']:.3f} | {row['by_language']['en']['pass_rate']:.3f} | {row['by_language']['ko']['pass_rate']:.3f} | {row['by_language']['ja']['pass_rate']:.3f} | {row['unsupported_executed_observed']} |\n")
              f.write(f"\nExact source: `{report['source_revision']}` · original DEV corpus SHA256: `{report['source_corpus_sha256']}`. Frozen #432 and v0.18 release remain unchanged.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: real-local-qwen-e5-agent-fixture-e0-${{ github.run_id }}
          path: artifacts/agent-fixed5-e5-qwen-dev/report.json
          if-no-files-found: error
          retention-days: 30
