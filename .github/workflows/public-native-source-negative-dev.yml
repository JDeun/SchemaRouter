name: Public Native Graph Record Vector Negative DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "src/schemarouter/executor.py"
      - "src/schemarouter/adapters/graph_native.py"
      - "src/schemarouter/adapters/record_native.py"
      - "src/schemarouter/adapters/vector_native.py"
      - "tests/test_public_native_source_execution_negative.py"
      - ".github/workflows/public-native-source-negative-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-native-registered-denials:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install registered native test fixtures
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Verify three native vendor-shaped clients deny before backend I/O
        run: |
          ruff check tests/test_public_native_source_execution_negative.py
          python -m pytest -q tests/test_public_native_source_execution_negative.py
