name: Research operation sentinel parallel once

on:
  push:
    branches:
      - research/operation-explicit-abstention
    paths:
      - .github/workflows/research-operation-sentinel-once.yml

permissions:
  contents: read

jobs:
  compare-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            split: dev
            min_score: "0.01"
            explicit_abstention: "false"
          - variant: baseline
            split: calibration
            min_score: "0.01"
            explicit_abstention: "false"
          - variant: explicit-abstention
            split: dev
            min_score: "0.0"
            explicit_abstention: "true"
          - variant: explicit-abstention
            split: calibration
            min_score: "0.0"
            explicit_abstention: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Evaluate frozen v5 configuration
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
          SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: BAAI/bge-reranker-v2-m3
          VARIANT: ${{ matrix.variant }}
          SPLIT: ${{ matrix.split }}
          MIN_SCORE: ${{ matrix.min_score }}
          EXPLICIT_ABSTENTION: ${{ matrix.explicit_abstention }}
        run: |
          set -euo pipefail
          OUT="artifacts/operation-sentinel/${VARIANT}/${SPLIT}"
          mkdir -p "${OUT}"
          EXTRA=()
          if [[ "${EXPLICIT_ABSTENTION}" == "true" ]]; then
            EXTRA+=(--operation-fit-explicit-abstention)
          fi
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v5-operation-calibration.json \
            --split "${SPLIT}" \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_reranker:score_pairs \
            --operation-fit-min-score "${MIN_SCORE}" \
            "${EXTRA[@]}" \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --planner-name "keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out "${OUT}/report.json" \
            --csv-out "${OUT}/rows.csv" \
            --html-out "${OUT}/report.html"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          backend = "keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation"
          path = (
              Path("artifacts/operation-sentinel")
              / os.environ["VARIANT"]
              / os.environ["SPLIT"]
              / "report.json"
          )
          report = json.loads(path.read_text())
          summary = report["summary"][backend]
          rows = [row for row in report["rows"] if row["backend"] == backend]
          supported = [row for row in rows if row["expected"] is not None]
          near = [
              row for row in rows
              if row["category"] == "near_domain_unsupported_operation"
          ]
          supported_acc = sum(row["correct"] for row in supported) / len(supported)
          rejection = sum(row["correct"] for row in near) / len(near)
          compact = {
              "variant": os.environ["VARIANT"],
              "split": os.environ["SPLIT"],
              "overall_accuracy": summary["accuracy"],
              "supported_routed_accuracy": supported_acc,
              "near_domain_rejection": rejection,
              "balanced_operation_score": (supported_acc + rejection) / 2,
              "mean_latency_ms": summary["mean_latency_ms"],
              "failure_stage_counts": summary.get("failure_stage_counts", {}),
              "error_taxonomy": summary.get("error_taxonomy", {}),
          }
          (path.parent / "comparison.json").write_text(
              json.dumps(compact, indent=2) + "\n"
          )
          print(json.dumps(compact, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-sentinel-${{ matrix.variant }}-${{ matrix.split }}-${{ github.run_id }}
          path: artifacts/operation-sentinel/${{ matrix.variant }}/${{ matrix.split }}/
          if-no-files-found: error
          retention-days: 30
