name: V4 BGE GTE Consensus

on:
  pull_request:
    branches:
      - "research/v4-bge-m3-robust-candidate"
    paths:
      - ".github/workflows/research-v4-bge-gte-consensus.yml"
      - "benchmarks/operation-routing-v4-bge-gte-consensus.json"
      - "scripts/analyze_bge_gte_consensus_v4.py"
      - "tests/test_bge_gte_consensus_v4.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"
  REFERENCE_RUN_ID: "36325967632"
  REFERENCE_ARTIFACT_ID: "10934635124"
  REFERENCE_ARTIFACT_DIGEST: "sha256:aabe4321e039dbb2e0b0805553e4dfd7d6c4bcf63893e23da028ceb668608462"

concurrency:
  group: v4-bge-gte-consensus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate consensus contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-bge-gte-consensus.json >/dev/null
          ruff check scripts/analyze_bge_gte_consensus_v4.py tests/test_bge_gte_consensus_v4.py
          pytest -q tests/test_bge_gte_consensus_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"

      - name: Download and validate frozen BGE authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/reference
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}" \
            -o /tmp/reference-meta.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("/tmp/reference-meta.json").read_text())
          if int(data["workflow_run"]["id"]) != int(os.environ["REFERENCE_RUN_ID"]):
              raise SystemExit("reference workflow run mismatch")
          if data.get("digest") != os.environ["REFERENCE_ARTIFACT_DIGEST"]:
              raise SystemExit("reference artifact digest mismatch")
          if data.get("expired"):
              raise SystemExit("reference artifact expired")
          print("reference artifact metadata verified")
          PY
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/reference.zip
          unzip -q /tmp/reference.zip -d /tmp/reference
          REPORT="$(find /tmp/reference -type f -path '*v4-bge-m3-frozen-candidate/report.json' -print -quit)"
          if [ -z "${REPORT}" ]; then
            echo "reference report.json not found"
            exit 1
          fi
          echo "REFERENCE_REPORT=${REPORT}" >> "${GITHUB_ENV}"

      - name: Generate immutable canonical DEV
        run: |
          OUT="artifacts/v4-bge-gte-consensus"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${GITHUB_SHA}" \
            --out "${OUT}/corpus.json" \
            --manifest "${OUT}/corpus-manifest.json"

      - name: Verify and audit canonical DEV
        run: |
          OUT="artifacts/v4-bge-gte-consensus"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("artifacts/v4-bge-gte-consensus/corpus-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest.get("corpus_sha256") != os.environ["V4_DEV_SHA256"]:
              raise SystemExit("canonical DEV SHA mismatch")
          if manifest.get("case_count") != 1800:
              raise SystemExit("canonical DEV case-count mismatch")
          if manifest.get("tuning_eligible") is not True:
              raise SystemExit("canonical DEV must remain tuning-eligible")
          print("canonical DEV identity verified")
          PY
          python scripts/audit_operation_routing_corpus.py \
            --corpus "${OUT}/corpus.json" \
            --out "${OUT}/corpus-audit.json" \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50

      - name: Run threshold-free BGE GTE consensus
        run: |
          OUT="artifacts/v4-bge-gte-consensus"
          python scripts/analyze_bge_gte_consensus_v4.py \
            --corpus "${OUT}/corpus.json" \
            --reference-report "${REFERENCE_REPORT}" \
            --out "${OUT}/analysis.json"

      - name: Validate technical completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/v4-bge-gte-consensus/analysis.json").read_text(
                  encoding="utf-8"
              )
          )
          summary = data["summary"]
          if summary["cases"] != 1800:
              raise SystemExit("analysis did not score all 1800 cases")
          if summary["execution_errors"] != 0:
              raise SystemExit("analysis contains execution errors")
          if summary["authority_violations"] != 0:
              raise SystemExit("analysis contains authority violations")
          policy = data["policy"]
          if policy["score_threshold"] or policy["margin_threshold"]:
              raise SystemExit("consensus experiment must remain threshold-free")
          if policy["gte_can_change_route"]:
              raise SystemExit("GTE must remain veto-only")
          print("quality_gate_pass:", summary["quality_gate_pass"])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-bge-gte-consensus-${{ github.run_id }}
          path: |
            artifacts/v4-bge-gte-consensus/analysis.json
            artifacts/v4-bge-gte-consensus/corpus-manifest.json
            artifacts/v4-bge-gte-consensus/corpus-audit.json
            benchmarks/operation-routing-v4-bge-gte-consensus.json
          if-no-files-found: warn
          retention-days: 30
