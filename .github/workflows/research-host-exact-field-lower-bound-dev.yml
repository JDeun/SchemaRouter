name: Research Host Exact Field Lower Bound CPU DEV

on:
  pull_request:
    paths:
      - "scripts/research_host_exact_field_scan_lower_bound_dev.py"
      - "tests/test_research_host_exact_field_scan_lower_bound_dev.py"
      - "research/autoresearch/host-exact-field-lower-bound-dev.md"
      - ".github/workflows/research-host-exact-field-lower-bound-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-exact-field-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out current product and test dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "PyYAML>=6,<7"
      - name: Validate no-action and fail-closed research comparator
        run: python -m pytest -q tests/test_research_host_exact_field_scan_lower_bound_dev.py
      - name: Compare actual full authorized selector against scoped typed-scan lower bound
        run: |
          python -m scripts.research_host_exact_field_scan_lower_bound_dev \
            --repeats 2 --output artifacts/host-exact-field-dev/report.json
      - name: Archive source-pinned original 108 paired DEV sample records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-exact-field-dev-${{ github.run_id }}
          path: artifacts/host-exact-field-dev/
          if-no-files-found: warn
          retention-days: 60
# Read-only source benchmark; no product change, remote provider execution,
# inferred host intent, paid LLM, GPU, release or privileged credential.
