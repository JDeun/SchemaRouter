name: Scoped Visible Field Metadata Boundary E0

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "tests/test_scoped_visible_field_metadata.py"
      - ".github/workflows/scoped-visible-field-metadata-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-visible-field-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Security and host contract noninterference E0
        run: |
          python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1" "pyright>=1.1,<2"
          ruff check src/schemarouter/runtime.py tests/test_scoped_visible_field_metadata.py
          python -m pytest -q tests/test_scoped_visible_field_metadata.py tests/test_scoped_input_schema_metadata.py tests/test_scoped_schema_ref_safety.py tests/test_host_field_contract.py tests/test_data_scope_authorization.py
          pyright src/schemarouter/runtime.py
      - name: Evidence limitation
        if: success()
        run: |
          echo "Scoped visible FieldSpec descriptive metadata canary regression on original registry E0. Retains canonical/semantic field identity and trusted execution contracts. Does not prove all free-text side channels, E2 model utility or release qualification." >> "$GITHUB_STEP_SUMMARY"
