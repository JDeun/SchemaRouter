name: Qwen Strict Final Failure Diagnosis Real Provider E1

on:
  pull_request:
    paths:
      - "scripts/research_real_qwen_open_meteo_two_hop_e1.py"
      - "scripts/research_qwen_state_ready_open_meteo_e1.py"
      - "tests/test_research_qwen_final_mismatch_diagnostic_e1.py"
      - ".github/workflows/research-qwen-final-mismatch-e1.yml"
      - "research/autoresearch/qwen-final-mismatch-e1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-final-diag-e1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-source-final-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify unchanged original strict scorer and sanitized categories
        run: |
          python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1" "pyright>=1.1.400"
          ruff check scripts/research_real_qwen_open_meteo_two_hop_e1.py scripts/research_qwen_state_ready_open_meteo_e1.py tests/test_research_qwen_final_mismatch_diagnostic_e1.py
          python -m pytest -q tests/test_research_qwen_final_mismatch_diagnostic_e1.py tests/test_research_real_qwen_open_meteo_two_hop_e1.py tests/test_research_open_meteo_transport_retry_e1.py tests/test_research_qwen_state_ready_open_meteo_e1.py
          pyright scripts/research_real_qwen_open_meteo_two_hop_e1.py scripts/research_qwen_state_ready_open_meteo_e1.py

  actual-pinned-qwen-source-observation:
    needs: strict-source-final-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original pinned Qwen CPU and Open-Meteo source host
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "transformers>=4.51,<5"
      - name: Actually execute paired model tools through original HTTPS provider
        run: |
          python -m scripts.research_qwen_state_ready_open_meteo_e1 --out artifacts/qwen-final-diagnostic/report.json --transport-retry-budget 1
      - name: Publish bounded final failure categories and leave failures unchanged
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          d=json.loads(Path("artifacts/qwen-final-diagnostic/report.json").read_text())
          assert d["study"]=="REAL_QWEN_OPEN_METEO_SOURCE_READY_E1_EXPOSED_DEV_NOT_E2"
          assert d["model_revision"]=="c1899de289a04d12100db370d81485cdf75e47ca"
          assert d["case_count_per_arm"]==3
          assert d["shared_host_transport_retry_budget"]==1
          assert set(d["by_arm"])=={"all_visible","state_ready"}
          assert not d["independent_e2_qualified"] and not d["release_qualified"]
          permitted={None,"invalid_json","invalid_shape","invalid_types",
                     "temperature_mismatch","unit_mismatch","timestamp_mismatch",
                     "multiple_source_fields"}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("## Actual Qwen3 + original live Open-Meteo, final failure diagnosis (exposed E1, not E2)\n\n")
              out.write("| Arm | Lang | Strict full | Original validated calls | Safe final category |\n|---|---|---|---:|---|\n")
              for arm,entry in d["by_arm"].items():
                  for lang,row in entry["by_language"].items():
                      family=row["trusted_final_validation_failure_kind"]
                      assert family in permitted
                      if row["strict_complete"] or row["termination_reason"]!="incorrect_final_value_or_format":
                          assert family is None
                      out.write(f"| {arm} | {lang} | {row['strict_complete']} | {row['validated_geocodes']+row['validated_forecasts']} | {family or 'n/a'} |\n")
              out.write("\nNo raw source values or model text; this is diagnostic, not repaired output or private E2.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qwen-final-failure-diagnostic-e1-${{ github.run_id }}
          path: artifacts/qwen-final-diagnostic/report.json
          if-no-files-found: warn
          retention-days: 60
