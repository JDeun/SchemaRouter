name: ServiceNow Interleaved Request Latency DEV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_servicenow_interleaved_latency_dev.py"
      - "tests/test_research_servicenow_interleaved_latency_dev.py"
      - ".github/workflows/research-servicenow-interleaved-latency-dev.yml"
      - "research/autoresearch/servicenow-interleaved-latency-dev.md"

permissions:
  contents: read

# Source-native schema capture, no tenant credentials, tool calls, or paid model.
jobs:
  actual-upstream-readonly-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UPSTREAM_REVISION: 5bcb83b29ab5b30aee07cabaa8df974881c47126
      PACKAGE_DIR: benchmarks/external-validation-servicenow-platform-mcp-dev-v1
      OUT_DIR: artifacts/servicenow-interleaved-latency-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install product, test tools, and pinned real MCP provider
        run: |
          python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
          python -m pip install "git+https://github.com/Xerrion/servicenow-platform-mcp.git@$UPSTREAM_REVISION"
      - name: Test strict sample provenance and genuine request-level p95
        run: |
          ruff check scripts/research_servicenow_interleaved_latency_dev.py \
            tests/test_research_servicenow_interleaved_latency_dev.py
          python -m pytest -q tests/test_research_servicenow_interleaved_latency_dev.py
      - name: Capture actual readonly MCP tools/list from pinned source
        run: |
          mkdir -p "$OUT_DIR"
          python scripts/capture_servicenow_platform_mcp_tools.py \
            --upstream-revision "$UPSTREAM_REVISION" \
            --out "$OUT_DIR/servicenow-readonly-tools.json"
      - name: Run interleaved hot request timing on original DEV queries
        run: |
          python -m scripts.research_servicenow_interleaved_latency_dev \
            --package-dir "$PACKAGE_DIR" \
            --snapshot "$OUT_DIR/servicenow-readonly-tools.json" \
            --repeats 20 --seed 20261016 \
            --implementation-revision "$(git rev-parse HEAD)" \
            --out "$OUT_DIR/report.json"
      - name: Audit evidence role and exact raw sample cardinality
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["OUT_DIR"]) / "report.json").read_text()
          )
          assert report["status"] == "source_pinned_visible_development_not_independent"
          assert report["independent_confirmation"] is False
          assert report["performance_evidence_for_commercial_release"] is False
          assert report["tool_execution"] is False
          assert report["live_service_requests"] == report["model_calls"] == 0
          assert len(report["samples"]) == 24 * 20 * 3
          assert report["protocol"]["primary_width_maintainer_preferred"] == 5
          for arm in ("static_readonly", "schemarouter_k3", "schemarouter_k5"):
              assert report["summary"][arm]["request_samples"] == 480
          PY
      - name: Preserve source, checkout and CPU provenance
        run: |
          git rev-parse HEAD > "$OUT_DIR/schemarouter-revision.txt"
          python --version > "$OUT_DIR/python-version.txt"
          python -m pip freeze > "$OUT_DIR/pip-freeze.txt"
          lscpu > "$OUT_DIR/lscpu.txt"
          sha256sum "$OUT_DIR/"*.json > "$OUT_DIR/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: servicenow-interleaved-request-latency-dev
          path: artifacts/servicenow-interleaved-latency-dev
          if-no-files-found: error
