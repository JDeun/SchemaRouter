name: Public MCP HTTP Registered Availability DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "src/schemarouter/executor.py"
      - "src/schemarouter/adapters/mcp.py"
      - "tests/fixtures/mcp_http_server.py"
      - "tests/test_public_mcp_http_execution_negative.py"
      - ".github/workflows/public-mcp-http-negative-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-streamable-mcp-http-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install exact MCPServer native HTTP fixture dependencies
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Verify source audited HTTP MCP denial and recovery
        run: |
          ruff check tests/test_public_mcp_http_execution_negative.py
          python -m pytest -q tests/test_public_mcp_http_execution_negative.py
