name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.state.outputs.should_release }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      release_notes: ${{ steps.metadata.outputs.release_notes }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout current main
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify successful CI still refers to current main
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --tags
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$TESTED_SHA" ]]; then
            echo "CI passed for stale main SHA $TESTED_SHA; current main is $current_main."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Resolve release metadata and target SHA
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          output_path = Path(os.environ["GITHUB_OUTPUT"])

          def emit(**values: object) -> None:
              with output_path.open("a", encoding="utf-8") as output:
                  for key, value in values.items():
                      print(f"{key}={value}", file=output)

          if os.environ.get("SKIP_RELEASE") == "true":
              emit(releasable="false")
              raise SystemExit(0)

          def read_version_at(ref: str | None = None) -> str:
              if ref is None:
                  content = Path("pyproject.toml").read_bytes()
              else:
                  content = subprocess.check_output(
                      ["git", "show", f"{ref}:pyproject.toml"]
                  )
              return tomllib.loads(content.decode("utf-8"))["project"]["version"]

          version = read_version_at()
          if ".dev" in version:
              emit(releasable="false")
              raise SystemExit(0)

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?", version):
              raise SystemExit(
                  f"unsupported automatic release version format: {version!r}"
              )

          release_notes = Path("docs") / "releases" / f"{version}.md"
          if not release_notes.is_file():
              raise SystemExit(f"missing release notes: {release_notes}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## {version} -" not in changelog:
              raise SystemExit(
                  f"CHANGELOG.md is missing a dated {version} release heading"
              )

          tag = f"v{version}"
          event_name = os.environ["EVENT_NAME"]

          if event_name == "push":
              pushed_tag = os.environ["PUSHED_TAG"]
              if pushed_tag != tag:
                  raise SystemExit(
                      f"tag {pushed_tag!r} does not match package version {tag!r}"
                  )
              subprocess.check_call(["git", "fetch", "origin", "tag", tag, "--force"])
              release_sha = subprocess.check_output(
                  ["git", "rev-list", "-n", "1", tag],
                  text=True,
              ).strip()
          else:
              tested_sha = os.environ["TESTED_SHA"]
              remote = subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      "--exit-code",
                      "--tags",
                      "origin",
                      f"refs/tags/{tag}",
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if remote.returncode == 0:
                  subprocess.check_call(
                      ["git", "fetch", "origin", "tag", tag, "--force"]
                  )
                  release_sha = subprocess.check_output(
                      ["git", "rev-list", "-n", "1", tag],
                      text=True,
                  ).strip()
                  if release_sha != tested_sha:
                      ancestor = subprocess.run(
                          [
                              "git",
                              "merge-base",
                              "--is-ancestor",
                              release_sha,
                              tested_sha,
                          ],
                          check=False,
                      )
                      if ancestor.returncode != 0:
                          raise SystemExit(
                              f"existing {tag} points to {release_sha}, which is not "
                              f"an ancestor of green main {tested_sha}"
                          )
                      tagged_version = read_version_at(release_sha)
                      if tagged_version != version:
                          raise SystemExit(
                              f"existing {tag} contains package version "
                              f"{tagged_version!r}, expected {version!r}"
                          )
              else:
                  release_sha = tested_sha

          prerelease = bool(re.search(r"(?:a|b|rc)\d+(?:$|[.+-])", version))
          emit(
              releasable="true",
              version=version,
              tag=tag,
              release_sha=release_sha,
              release_notes=release_notes.as_posix(),
              prerelease="true" if prerelease else "false",
          )
          PY

      - name: Create annotated tag when missing
        if: >-
          github.event_name == 'workflow_run' &&
          steps.metadata.outputs.releasable == 'true'
        env:
          RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "SchemaRouter $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Check whether GitHub release already exists
        id: state
        if: steps.metadata.outputs.releasable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG is already published on GitHub."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      release_notes: ${{ needs.prepare.outputs.release_notes }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}
      tag: ${{ needs.prepare.outputs.tag }}
      release_sha: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify release checkout metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = os.environ["RELEASE_VERSION"]
          if version != expected:
              raise SystemExit(
                  f"release checkout version {version!r} does not match {expected!r}"
              )
          PY
      - run: python -m pip install --upgrade pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Verify release artifacts
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import subprocess
          import sys
          import tempfile
          import venv
          import zipfile
          from pathlib import Path

          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          wheel_names = zipfile.ZipFile(wheel).namelist()
          assert any(name.endswith("/licenses/LICENSE") for name in wheel_names), wheel_names

          import tarfile

          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = archive.getnames()
          assert any(name.endswith("/LICENSE") for name in sdist_names), sdist_names

          for artifact in (wheel, sdist):
              with tempfile.TemporaryDirectory() as root:
                  env = Path(root) / "venv"
                  venv.EnvBuilder(with_pip=True).create(env)
                  python = env / (
                      "Scripts/python.exe" if sys.platform == "win32" else "bin/python"
                  )
                  subprocess.check_call([str(python), "-m", "pip", "install", artifact])
                  subprocess.check_call(
                      [
                          str(python),
                          "-c",
                          (
                              "from importlib.metadata import version; "
                              "import schemarouter; "
                              f"assert schemarouter.__version__ == "
                              f"{os.environ['RELEASE_VERSION']!r}; "
                              f"assert version('schemarouter') == "
                              f"{os.environ['RELEASE_VERSION']!r}"
                          ),
                      ]
                  )
                  subprocess.check_call([str(python), "examples/quickstart.py"])
          PY
      - name: Prepare SBOM output directory
        run: mkdir -p artifacts
      - name: Generate SPDX release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: artifacts/schemarouter-${{ needs.prepare.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
          sbom-path: artifacts/schemarouter-${{ needs.prepare.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: artifacts/*.spdx.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ needs.prepare.outputs.release_notes }}
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom
          path: sbom
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: release-notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: release-notes/${{ needs.prepare.outputs.version }}.md
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease_args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" dist/* sbom/*             --title "SchemaRouter $RELEASE_VERSION"             --notes-file "$RELEASE_NOTES"             "${prerelease_args[@]}"             --verify-tag

  pypi:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/schemarouter/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  post-publish:
    needs: [prepare, github-release, pypi]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        verification: ["wheel", "sdist", "integration-extras"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.verification != 'integration-extras'
        with:
          name: python-dist
          path: dist
      - run: python -m pip install --upgrade pip
      - name: Verify published artifact digest matches release build
        if: matrix.verification != 'integration-extras'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          VERIFY_KIND: ${{ matrix.verification }}
        run: |
          mkdir -p /tmp/pypi-artifact
          download_args=(
            --no-deps
            --no-cache-dir
            --index-url https://pypi.org/simple
            --dest /tmp/pypi-artifact
            --only-binary=schemarouter
          )
          if [[ "$VERIFY_KIND" == "sdist" ]]; then
            download_args=(
              --no-deps
              --no-cache-dir
              --index-url https://pypi.org/simple
              --dest /tmp/pypi-artifact
              --no-binary=schemarouter
            )
          fi

          downloaded=false
          for attempt in {1..18}; do
            rm -f /tmp/pypi-artifact/*
            if python -m pip download "${download_args[@]}" "schemarouter==$RELEASE_VERSION"; then
              downloaded=true
              break
            fi
            if [[ "$attempt" -eq 18 ]]; then
              break
            fi
            echo "PyPI artifact not downloadable yet (attempt $attempt/18); retrying in 10s."
            sleep 10
          done

          if [[ "$downloaded" != "true" ]]; then
            echo "Failed to download exact PyPI release $RELEASE_VERSION as $VERIFY_KIND."
            exit 1
          fi

          python scripts/verify_artifact_digest.py \
            --built-dir dist \
            --published-dir /tmp/pypi-artifact \
            --artifact-kind "$VERIFY_KIND"
      - name: Install exact published release from PyPI
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          VERIFY_KIND: ${{ matrix.verification }}
        run: |
          install_args=(
            --no-cache-dir
            --index-url https://pypi.org/simple
            --only-binary=schemarouter
          )
          package="schemarouter==$RELEASE_VERSION"
          if [[ "$VERIFY_KIND" == "sdist" ]]; then
            install_args=(
              --no-cache-dir
              --index-url https://pypi.org/simple
              --no-binary=schemarouter
            )
          elif [[ "$VERIFY_KIND" == "integration-extras" ]]; then
            package="schemarouter[mcp,langchain,langgraph,llamaindex,jev,otel]==$RELEASE_VERSION"
          fi

          installed=false
          for attempt in {1..18}; do
            if python -m pip install "${install_args[@]}" "$package"; then
              installed=true
              break
            fi
            if [[ "$attempt" -eq 18 ]]; then
              break
            fi
            echo "PyPI release not installable yet (attempt $attempt/18); retrying in 10s."
            sleep 10
          done

          if [[ "$installed" != "true" ]]; then
            echo "Failed to install exact PyPI release $RELEASE_VERSION as $VERIFY_KIND."
            exit 1
          fi
          python -m pip check
      - name: Verify exact published release outside the checkout
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          VERIFY_KIND: ${{ matrix.verification }}
        run: |
          artifact_kind="$VERIFY_KIND"
          framework_args=()
          if [[ "$VERIFY_KIND" == "integration-extras" ]]; then
            artifact_kind="wheel"
            framework_args+=(--framework-integrations --lightweight-extras)
          fi

          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/published_pypi_smoke.py" \
            --artifact-kind "$artifact_kind" \
            --expected-version "$RELEASE_VERSION" \
            "${framework_args[@]}"

