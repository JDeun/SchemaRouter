name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          PY
      - run: python -m pip install --upgrade pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Verify release artifact
        run: |
          python - <<'PY'
          import glob
          import subprocess
          import sys
          import tempfile
          import venv
          import zipfile
          from pathlib import Path

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(name.endswith("/licenses/LICENSE") for name in names), names

          with tempfile.TemporaryDirectory() as root:
              env = Path(root) / "venv"
              venv.EnvBuilder(with_pip=True).create(env)
              python = env / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
              subprocess.check_call([str(python), "-m", "pip", "install", wheel])
              subprocess.check_call([
                  str(python),
                  "-c",
                  "import schemarouter; assert schemarouter.__version__ == '0.2.0a1'",
              ])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SchemaRouter 0.2.0a1" \
            --notes-file "docs/releases/0.2.0a1.md" \
            --prerelease \
            --verify-tag

  pypi:
    needs: build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/schemarouter/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
