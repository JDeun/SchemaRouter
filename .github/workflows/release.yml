name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_notes: ${{ steps.metadata.outputs.release_notes }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve and verify release metadata
        id: metadata
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          if ".dev" in version:
              raise SystemExit("development versions cannot be published by the release workflow")

          release_notes = Path("docs") / "releases" / f"{version}.md"
          if not release_notes.is_file():
              raise SystemExit(f"missing release notes: {release_notes}")

          prerelease = bool(re.search(r"(?:a|b|rc)\d+(?:$|[.+-])", version))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"release_notes={release_notes.as_posix()}", file=output)
              print(f"prerelease={'true' if prerelease else 'false'}", file=output)
          PY
      - run: python -m pip install --upgrade pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Verify release artifact
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import subprocess
          import sys
          import tempfile
          import venv
          import zipfile
          from pathlib import Path

          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          wheel_names = zipfile.ZipFile(wheel).namelist()
          assert any(name.endswith("/licenses/LICENSE") for name in wheel_names), wheel_names

          import tarfile

          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = archive.getnames()
          assert any(name.endswith("/LICENSE") for name in sdist_names), sdist_names

          for artifact in (wheel, sdist):
              with tempfile.TemporaryDirectory() as root:
                  env = Path(root) / "venv"
                  venv.EnvBuilder(with_pip=True).create(env)
                  python = env / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
                  subprocess.check_call([str(python), "-m", "pip", "install", artifact])
                  subprocess.check_call([
                      str(python),
                      "-c",
                      (
                          "from importlib.metadata import version; "
                          "import schemarouter; "
                          f"assert schemarouter.__version__ == {os.environ['RELEASE_VERSION']!r}; "
                          f"assert version('schemarouter') == {os.environ['RELEASE_VERSION']!r}"
                      ),
                  ])
                  subprocess.check_call([str(python), "examples/quickstart.py"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTES: ${{ needs.build.outputs.release_notes }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          prerelease_args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "SchemaRouter $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES" \
              "${prerelease_args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "SchemaRouter $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES" \
              "${prerelease_args[@]}" \
              --verify-tag
          fi

  pypi:
    needs: build
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/schemarouter/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
