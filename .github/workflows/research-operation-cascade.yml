name: Operation Cascade Dev Sweep

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"

concurrency:
  group: operation-cascade-dev-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  config-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_bge_cascade.py tests/test_operation_v14_protocol.py tests/test_operation_final_freeze.py

  full-bge-baseline:
    needs: config-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Run frozen full-BGE v5 dev baseline
        run: |
          OUT="artifacts/operation-cascade/full-bge-baseline"
          mkdir -p "$OUT"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v5-operation-calibration.json \
            --split dev \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out "$OUT/report.json" \
            --csv-out "$OUT/rows.csv" \
            --html-out "$OUT/report.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-cascade-full-bge-${{ github.run_id }}
          path: artifacts/operation-cascade/
          if-no-files-found: error
          retention-days: 30

  cascade-sweep:
    needs: config-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: r025-a055
            reject_below: "0.25"
            accept_above: "0.55"
            accept_margin: "0.03"
          - name: r030-a055
            reject_below: "0.30"
            accept_above: "0.55"
            accept_margin: "0.03"
          - name: r030-a060
            reject_below: "0.30"
            accept_above: "0.60"
            accept_margin: "0.03"
          - name: r035-a060
            reject_below: "0.35"
            accept_above: "0.60"
            accept_margin: "0.03"
          - name: r035-a065
            reject_below: "0.35"
            accept_above: "0.65"
            accept_margin: "0.03"
          - name: r030-a060-m005
            reject_below: "0.30"
            accept_above: "0.60"
            accept_margin: "0.05"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Run preregistered v5 dev cascade candidate
        env:
          SCHEMAROUTER_BENCHMARK_CASCADE_REJECT_BELOW: ${{ matrix.reject_below }}
          SCHEMAROUTER_BENCHMARK_CASCADE_ACCEPT_ABOVE: ${{ matrix.accept_above }}
          SCHEMAROUTER_BENCHMARK_CASCADE_ACCEPT_MARGIN: ${{ matrix.accept_margin }}
        run: |
          OUT="artifacts/operation-cascade/${{ matrix.name }}"
          mkdir -p "$OUT"
          export SCHEMAROUTER_BENCHMARK_CASCADE_TELEMETRY="$OUT/telemetry.jsonl"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v5-operation-calibration.json \
            --split dev \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_cascade:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out "$OUT/report.json" \
            --csv-out "$OUT/rows.csv" \
            --html-out "$OUT/report.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-cascade-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts/operation-cascade/
          if-no-files-found: error
          retention-days: 30
