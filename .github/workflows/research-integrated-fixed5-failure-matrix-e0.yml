name: Integrated Fixed5 Failure Matrix E0

on:
  pull_request:
    paths:
      - "tests/test_integrated_fixed5_failure_matrix_e0.py"
      - ".github/workflows/research-integrated-fixed5-failure-matrix-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-five-existing-executor-no-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing evaluator six-failure matrix and stage privacy
        run: |
          python -m pip install -e ".[dev]"
          ruff check tests/test_integrated_fixed5_failure_matrix_e0.py
          python -m pytest -q tests/test_integrated_fixed5_failure_matrix_e0.py tests/test_integrated_fixed5_agent_selector.py
