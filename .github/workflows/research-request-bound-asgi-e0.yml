name: Request Bound ASGI Identity Synthetic E0 DEV

on:
  pull_request:
    paths:
      - "scripts/research_request_bound_signed_fixture_e0.py"
      - "tests/test_research_request_bound_signed_fixture_e0.py"
      - "research/autoresearch/request-bound-signed-asgi-e0.md"
      - ".github/workflows/research-request-bound-asgi-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-path-and-body-bound-proof-no-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install read-only no-provider test dependencies
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Check strict E0 request binding, identity and credential scrubbing
        run: |
          ruff check scripts/research_request_bound_signed_fixture_e0.py tests/test_research_request_bound_signed_fixture_e0.py
          pyright scripts/research_request_bound_signed_fixture_e0.py
          python -m pytest -q tests/test_research_request_bound_signed_fixture_e0.py
