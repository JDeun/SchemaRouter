name: CodeGraph G5 Path Order Cue E1 DEV

on:
  pull_request:
    paths:
      - "scripts/research_codegraph_surgical_agent_e1.py"
      - "scripts/research_codegraph_local_multiroute_e1.py"
      - "scripts/research_codegraph_qwen17_local_e1.py"
      - "tests/test_research_codegraph_surgical_agent_e1.py"
      - "tests/test_research_codegraph_local_multiroute_e1.py"
      - "research/autoresearch/codegraph-qwen-path-order-cue-e1.md"
      - ".github/workflows/codegraph-g5-path-order-cue-e1-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-original-source-path-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        model: [qwen06, qwen17]
        language: [en, ko, ja]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
      MODEL_VARIANT: ${{ matrix.model }}
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned public local inference and E1 verification dependencies
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "transformers>=4.51,<5" "huggingface-hub>=0.30,<2" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1"
      - name: Check unchanged strict parser, source boundary and opt-in-only cue
        run: |
          ruff check scripts/research_codegraph_surgical_agent_e1.py scripts/research_codegraph_local_multiroute_e1.py scripts/research_codegraph_qwen17_local_e1.py tests/test_research_codegraph_surgical_agent_e1.py tests/test_research_codegraph_local_multiroute_e1.py
          python -m pytest -q tests/test_research_codegraph_action_shape_e1.py tests/test_research_codegraph_surgical_agent_e1.py tests/test_research_codegraph_local_multiroute_e1.py
      - name: Assert GitHub Linux CPU headroom
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          ram = int(next(line for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemTotal:")).split()[1])
          disk = shutil.disk_usage(".").free / (1024**3)
          assert ram >= 12_000_000 and disk >= 7, (ram, disk)
          PY
      - name: Download immutable original public Qwen checkpoint
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import model_info, snapshot_download
          from scripts.agent_utility_v7_dev_agent import MODEL_NAME, MODEL_REVISION
          from scripts.research_qwen17_live_open_meteo_comparison_e1 import MODEL_ID, REVISION
          if os.environ["MODEL_VARIANT"] == "qwen06":
              name, sha = MODEL_NAME, MODEL_REVISION
              assert (name, sha) == ("Qwen/Qwen3-0.6B", "c1899de289a04d12100db370d81485cdf75e47ca")
          else:
              name, sha = MODEL_ID, REVISION
              assert (name, sha) == ("Qwen/Qwen3-1.7B", "70d244cc86ccca08cf5af4e1e306ecf908b1ad5e")
              assert model_info(name, revision=sha).sha == sha
          snapshot_download(repo_id=name, revision=sha,
              allow_patterns=("*.json","*.safetensors","*.model","tokenizer*","*.jinja"))
          PY
      - name: Measure model-only path-order cue against exact original four arms
        run: |
          mkdir -p artifacts/codegraph-g5-path-order-cue
          if [ "$MODEL_VARIANT" = "qwen06" ]; then
            HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
              python -m scripts.research_codegraph_local_multiroute_e1 \
              --cohort local-source --catalog-size 4 --language "$LANGUAGE" \
              --diagnose-model-actions --experimental-single-step-prompt \
              --experimental-bare-schema-request --experimental-graph-path-order-prompt \
              --out "artifacts/codegraph-g5-path-order-cue/${{ matrix.model }}-${{ matrix.language }}.json"
          else
            python -m scripts.research_codegraph_qwen17_local_e1 \
              --cohort four-route --language "$LANGUAGE" \
              --diagnose-model-actions --experimental-single-step-prompt \
              --experimental-bare-schema-request --experimental-graph-path-order-prompt \
              --out "artifacts/codegraph-g5-path-order-cue/${{ matrix.model }}-${{ matrix.language }}.json"
          fi
      - name: Verify exact E1-only provenance and strict original native receipts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.research_codegraph_action_shape_e1 import CATEGORIES
          variant, lang = os.environ["MODEL_VARIANT"], os.environ["LANGUAGE"]
          report = json.loads(Path(f"artifacts/codegraph-g5-path-order-cue/{variant}-{lang}.json").read_text())
          assert report["language"] == lang and report["source_route_count"] == 4
          assert report["requested_k"] == 5 and report["max_model_turns"] == 5
          assert report["status"] == "E1_MEASURED_LOCAL_FOUR_ARM_NOT_E2"
          assert report["prompt_treatment"] == "EXACTLY_ONE_NATIVE_ACTION_PER_TURN"
          assert report["bare_schema_request_treatment"] == "STRICT_HOST_OFFERED_SCHEMA_ONLY"
          assert report["graph_path_order_treatment"] == "STATIC_G5_DEPENDENCY_ORDER_CUE"
          assert report["original_provider_e1"] is False
          assert report["independent_e2_qualified"] is False
          assert report["release_qualified"] is False
          assert len(report["outcomes"]) == 4
          assert report["qualified_task_denominator"] == {arm: 1 for arm in report["arms"]}
          assert (report["model_id"], report["model_revision"]) == (
              ("Qwen/Qwen3-0.6B", "c1899de289a04d12100db370d81485cdf75e47ca")
              if variant == "qwen06" else
              ("Qwen/Qwen3-1.7B", "70d244cc86ccca08cf5af4e1e306ecf908b1ad5e"))
          allowed = {
              "unexpected_argument_keys", "missing_argument_keys",
              "unexpected_and_missing_argument_keys",
              "argument_value_mismatch", "unsupported_bound_path",
          }
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write(f"## Graph path order E1 — {variant}, {lang}\n\n")
              out.write("Author-declared local source, not independent E2.\n\n")
              out.write("| Arm | Turns | Schemas | Native calls | Tokens | Full task | Stop | Argument alignment |\n|---|---:|---:|---:|---:|---|---|---|\n")
              for row in report["outcomes"]:
                  assert len(row["action_structure_labels"]) == row["model_turns"]
                  assert set(row["action_structure_labels"]) <= CATEGORIES
                  assert 0 <= row["actual_source_calls"] <= 2
                  assert row["full_task_complete"] in (True, False)
                  assert row["total_model_tokens"] is None or row["total_model_tokens"] >= 0
                  if row["condition"] == "surgical_g5_e1":
                      assert set(row["argument_alignment_labels"]) <= allowed
                      assert len(row["argument_alignment_labels"]) <= 1
                      assert bool(row["argument_alignment_labels"]) == (
                          row["status"] == "unbound_source_arguments")
                      assert 0 <= row["bare_schema_request_normalizations"] <= row["schema_requests"] <= 1
                  else:
                      assert "argument_alignment_labels" not in row
                      assert "bare_schema_request_normalizations" not in row
                  out.write(f"| {row['condition']} | {row['model_turns']} | {row['schema_requests']} | {row['actual_source_calls']} | {row['total_model_tokens']} | {row['full_task_complete']} | {row['status']} | {','.join(row.get('argument_alignment_labels', []))} |\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codegraph-g5-path-order-cue-e1-${{ matrix.model }}-${{ matrix.language }}-${{ github.run_id }}
          path: artifacts/codegraph-g5-path-order-cue/*.json
          retention-days: 30
          if-no-files-found: warn
