name: G5 Synthetic Selectivity Matrix E0

on:
  pull_request:
    paths:
      - "scripts/benchmark_indexed_g5_selectivity_e0.py"
      - "scripts/benchmark_indexed_native_graph_g5_cpu_e0.py"
      - "tests/test_benchmark_indexed_g5_selectivity_e0.py"
      - ".github/workflows/indexed-g5-selectivity-e0.yml"
      - "research/autoresearch/indexed-g5-selectivity-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-selectivity-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out source and test tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Validate no-fit, permission-filtering and strict K scenarios
        run: |
          ruff check scripts/benchmark_indexed_g5_selectivity_e0.py tests/test_benchmark_indexed_g5_selectivity_e0.py
          python -m pytest -q tests/test_benchmark_indexed_g5_selectivity_e0.py tests/test_benchmark_indexed_native_graph_g5_cpu_e0.py tests/test_native_graph_index.py tests/test_native_semantic_index.py
          pyright scripts/benchmark_indexed_g5_selectivity_e0.py
      - name: Record 5k+ native route density and broad-posting profile (E0 only)
        run: python -m scripts.benchmark_indexed_g5_selectivity_e0 --noise-routes 5100 --iterations 20 --broad-iterations 3
