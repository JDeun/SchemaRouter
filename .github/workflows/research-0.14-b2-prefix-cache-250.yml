name: Research 0.14 B2 ARM64 250 Prefix Cache Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "research/0.14-b2-prefix-cache-250-run"
    paths:
      - ".github/b2-prefix-cache-250-trigger.json"

permissions:
  contents: read

concurrency:
  group: research-0.14-b2-prefix-cache-250
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_ATTN_IMPLEMENTATION: "sdpa"
  B2_STATIC_PREFIX_CACHE: "1"
  B2_PROGRESS_TRACE: "1"

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - run: pip install -e .
      - id: hf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "b2-smollm3-arm64-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"
      - name: Populate exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
          )
          PY
      - name: Verify frozen prefix-cache 250 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          trigger = json.loads(
              Path(".github/b2-prefix-cache-250-trigger.json")
              .read_text(encoding="utf-8")
          )
          assert trigger["catalog_size"] == 250
          assert trigger["task_id"] == "multi-create-send"
          assert trigger["condition"] == "FULL"
          assert trigger["static_prefix_cache"] is True
          assert trigger["semantic_tuning_allowed"] is False
          PY
      - name: Run 250-tool FULL with static prefix cache
        run: |
          mkdir -p artifacts/b2-prefix-cache-250
          /usr/bin/time -v -o artifacts/b2-prefix-cache-250/time.txt \
            python -u scripts/evaluate_agent_utility_phase_b_smollm3.py \
              --catalog-sizes "250" \
              --task-ids "multi-create-send" \
              --conditions "FULL" \
              --out artifacts/b2-prefix-cache-250/result.json
      - name: Record operational verdict
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          result = json.loads(
              Path("artifacts/b2-prefix-cache-250/result.json")
              .read_text(encoding="utf-8")
          )
          assert result["catalog_sizes"] == [250]
          assert result["task_ids"] == ["multi-create-send"]
          assert result["conditions"] == ["FULL"]
          assert len(result["rows"]) == 1
          timing = Path(
              "artifacts/b2-prefix-cache-250/time.txt"
          ).read_text(encoding="utf-8")
          rss = re.search(
              r"Maximum resident set size \(kbytes\):\s*(\d+)",
              timing,
          )
          assert rss is not None
          row = result["rows"][0]
          verdict = {
              "completed": True,
              "episode_wall_latency_ms": row["episode_wall_latency_ms"],
              "peak_rss_kib": int(rss.group(1)),
              "peak_rss_gib": int(rss.group(1)) / 1024 / 1024,
              "input_tokens": row["input_tokens"],
              "output_tokens": row["output_tokens"],
              "tool_schema_tokens": row["tool_schema_tokens"],
              "semantic_result_used_for_tuning": False,
          }
          Path(
              "artifacts/b2-prefix-cache-250/verdict.json"
          ).write_text(
              json.dumps(verdict, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(verdict, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "b2-prefix-cache-250-${{ github.run_id }}"
          path: artifacts/b2-prefix-cache-250/
          if-no-files-found: warn
          retention-days: 30
