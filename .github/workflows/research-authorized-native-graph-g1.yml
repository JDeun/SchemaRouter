name: Authorized Native Dependency Graph G1

on:
  pull_request:
    paths:
      - "scripts/research_authorized_native_graph_edges_g1.py"
      - "tests/test_research_authorized_native_graph_edges_g1.py"
      - "research/autoresearch/authorized-native-dependency-graph-g1.md"
      - ".github/workflows/research-authorized-native-graph-g1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-graph-g1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typed-native-edges:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out source and offline tests
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1"
      - name: Check native graph edges, principal scope and no execution
        run: |
          ruff check scripts/research_authorized_native_graph_edges_g1.py tests/test_research_authorized_native_graph_edges_g1.py
          python -m pytest -q tests/test_research_authorized_native_graph_edges_g1.py
# No model, provider network, invoker, agent loop, independent E2 or release.
