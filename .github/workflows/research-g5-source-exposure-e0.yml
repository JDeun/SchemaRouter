name: G5 Source-Attested Schema Exposure 500 5000 E0

on:
  pull_request:
    paths:
      - "scripts/research_g5_source_schema_exposure_e0.py"
      - "tests/test_research_g5_source_schema_exposure_e0.py"
      - "research/autoresearch/g5-source-verified-schema-exposure-e0.md"
      - ".github/workflows/research-g5-source-exposure-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g5-source-native-schema-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        registered_routes: [500, 5000]
        mixed_scope: [normal, mixed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned static test dependencies and source
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1"
      - name: Verify current-source G5 and policy safety preflight
        run: |
          ruff check scripts/research_g5_source_schema_exposure_e0.py tests/test_research_g5_source_schema_exposure_e0.py
          python -m pytest -q tests/test_research_g5_source_schema_exposure_e0.py
      - name: Run source-native 3-language strict-K5 fork and exposure measurement
        run: |
          mkdir -p artifacts/g5-native-source-exposure
          python -m scripts.research_g5_source_schema_exposure_e0 \
            --registered-routes ${{ matrix.registered_routes }} \
            ${{ matrix.mixed_scope == 'mixed' && '--mixed-scope' || '' }} \
            --out artifacts/g5-native-source-exposure/g5-${{ matrix.registered_routes }}-${{ matrix.mixed_scope }}.json
      - name: Verify unchanged original oracle, safe exposure and no E2/model claims
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          roots = Path("artifacts/g5-native-source-exposure").glob("*.json")
          files = list(roots)
          assert len(files) == 1, files
          r = json.loads(files[0].read_text())
          assert r["schema_version"] == "native-g5-source-verified-schema-exposure-e0-v1"
          assert r["registered_native_routes"] in (500, 5000)
          assert r["strict_k"] == 5
          assert r["supported_language_query_count"] == 3
          assert r["same_snapshot_health_revocation_denied"] is True
          assert r["independent_e2_qualified"] is False
          assert r["release_qualified"] is False
          assert r["all_model_tokens_measured"] is False
          assert r["unbounded_full_is_matched_k5_agent_control"] is False
          assert len(r["frozen_original_source_budget_digest"]) == 64
          assert [row["language"] for row in r["rows"]] == ["en", "ko", "ja"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## G5 source attested cost E0 — NOT task/token savings\n\n")
              f.write("| Language | G5 source fork | Source-oracle match | G5 bytes | Unbounded principal FULL bytes |\n")
              f.write("|---|---|---|---:|---:|\n")
              for row in r["rows"]:
                  assert row["qualified_distinct_native_routes"] == 3
                  assert row["qualified_g5_fork_count"] == 1
                  assert row["source_oracle_exact_match"] is True
                  assert row["typed_producer_consumer_binding"] is True
                  assert row["g5_original_source_schema_bytes"] == row["same_success_oracle_schema_bytes"]
                  assert row["unbounded_full_principal_source_schema_bytes"] >= row["g5_original_source_schema_bytes"]
                  f.write(f"| {row['language']} | {row['qualified_distinct_native_routes']} original routes | {row['source_oracle_exact_match']} | {row['g5_original_source_schema_bytes']} | {row['unbounded_full_principal_source_schema_bytes']} |\n")
              f.write("\nUnbounded FULL is an inventory upper bound and is NOT a matched K5 control.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g5-attested-exposure-${{ matrix.registered_routes }}-${{ matrix.mixed_scope }}-${{ github.run_id }}
          path: artifacts/g5-native-source-exposure/*.json
          retention-days: 30
          if-no-files-found: warn
