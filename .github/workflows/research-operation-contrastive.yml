name: Operation Contrastive Dev Sweep

on:
  pull_request:
    paths:
      - ".github/workflows/research-operation-contrastive.yml"
      - "benchmarks/bge_contrastive.py"
      - "benchmarks/operation-fit-0.10-cycle.json"
      - "scripts/benchmark_decision_routing.py"
      - "tests/test_benchmark_corpus.py"
      - "tests/test_pairwise_decision_backend.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}

concurrency:
  group: operation-contrastive-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  config-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_pairwise_decision_backend.py tests/test_benchmark_corpus.py

  dev-sweep:
    needs: config-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        beta: ["0.00", "0.25", "0.50", "1.00", "2.00"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Run preregistered v5 dev contrastive sweep
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
          SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: ${{ matrix.beta }}
        run: |
          SAFE_BETA="${SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA//./_}"
          OUT="artifacts/operation-contrastive/dev-beta-${SAFE_BETA}"
          mkdir -p "${OUT}"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v5-operation-calibration.json \
            --split dev \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out "${OUT}/report.json" \
            --csv-out "${OUT}/rows.csv" \
            --html-out "${OUT}/report.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-contrastive-dev-beta-${{ matrix.beta }}-${{ github.run_id }}
          path: artifacts/operation-contrastive/
          if-no-files-found: error
          retention-days: 30
