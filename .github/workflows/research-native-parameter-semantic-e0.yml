name: Native Parameter Semantic Contract E0

on:
  pull_request:
    paths:
      - "src/schemarouter/models.py"
      - "tests/test_native_input_semantic_contract.py"
      - ".github/workflows/research-native-parameter-semantic-e0.yml"
      - "research/autoresearch/native-input-semantic-contract-e0.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-param-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-fingerprint-and-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out source and test/lint tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1"
      - name: Legacy serialization fingerprints and denied authority
        run: |
          ruff check src/schemarouter/models.py tests/test_native_input_semantic_contract.py
          python -m pytest -q tests/test_native_input_semantic_contract.py
# No new inferred tool facts, permission, provider call, agent loop or release.
