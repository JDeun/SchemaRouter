name: PydanticAI ToolSearch Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/external_validation_pydanticai.py"
      - "tests/test_external_validation_pydanticai.py"
      - "docs/project/external-validation-pydanticai.md"
      - ".github/workflows/pydanticai-toolsearch-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install frozen downstream environment
        run: |
          python -m pip install .
          python -m pip install "pydantic-ai==2.51.0"

      - name: Run frozen PydanticAI scaling matrix
        run: |
          python scripts/external_validation_pydanticai.py \
            --matrix \
            --json-out artifacts/external-validation-pydanticai-matrix.json

      - name: Upload frozen result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-validation-pydanticai-matrix
          path: artifacts/external-validation-pydanticai-matrix.json
          if-no-files-found: error
