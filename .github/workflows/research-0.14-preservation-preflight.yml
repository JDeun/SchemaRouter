name: Research 0.14 Original Artifact Preservation Preflight
run-name: Read-only 0.14 original artifact verification (not cutover)

on:
  pull_request:
    paths:
      - "scripts/research_014_preservation_preflight.py"
      - ".github/workflows/research-0.14-preservation-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: "${{ github.repository == 'JDeun/SchemaRouter' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          name: heldout-corpus-38012340016
          run-id: "38012340016"
          repository: "${{ github.repository }}"
          github-token: "${{ github.token }}"
          path: artifacts/preservation-preflight
      - name: Verify original completed evaluator ZIPs, pinned runtime, and episode identities
        env:
          GH_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
        run: |
          python scripts/research_014_preservation_preflight.py \
            --corpus artifacts/preservation-preflight/heldout-corpus.json \
            --parent-run 38012340016 \
            --out artifacts/preservation-preflight/read-only-preservation-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "research-014-preservation-preflight-${{ github.run_id }}"
          path: artifacts/preservation-preflight/read-only-preservation-report.json
          if-no-files-found: warn
          retention-days: 14
