name: Python310 Minimum Health Regression E1

on:
  pull_request:
    paths:
      - ".github/workflows/research-minimum-health-python310-e1-repro.yml"
      - "scripts/research_bounded_health_model_turn_e1.py"
      - "scripts/research_long_lived_real_open_meteo_e1.py"
      - "tests/test_research_bounded_health_model_turn_e1.py"
      - "tests/test_research_long_lived_real_open_meteo_e1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-original-three-health-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"
      - name: Match minimum-dependencies versions exactly
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.2" "pytest-asyncio>=0.23" "hypothesis>=6.130,<7"
          python -m pip install "httpx==0.27.0" "jsonschema==4.23.0" "pydantic==2.8.0" "pyyaml==6.0.0"
          python -m pip install -e . --no-deps
          python -c 'import sys, httpx, pydantic; print("python",sys.version_info[:3],"httpx",httpx.__version__,"pydantic",pydantic.__version__)'
      - name: Verify three original E1 regressions on pinned Python 3.10
        run: |
          python -m pytest -q \
            tests/test_research_bounded_health_model_turn_e1.py::test_timed_out_cpu_thread_stays_quarantined_until_real_completion \
            tests/test_research_bounded_health_model_turn_e1.py::test_two_simultaneous_host_calls_admit_one_model_generation \
            tests/test_research_long_lived_real_open_meteo_e1.py::test_first_geocoder_transport_timeout_blocks_following_model_menus
