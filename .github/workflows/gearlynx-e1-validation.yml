name: Gearlynx E1 Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/external_validation_gearlynx.py"
      - "examples/external_validation/gearlynx-router/**"
      - "tests/test_external_validation_gearlynx.py"
      - ".github/workflows/gearlynx-e1-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install SchemaRouter
        run: python -m pip install .

      - name: Run frozen Gearlynx Phase A benchmark
        run: |
          python scripts/external_validation_gearlynx.py \
            --json-out artifacts/gearlynx-e1-summary.json

      - name: Upload frozen result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gearlynx-e1-summary
          path: artifacts/gearlynx-e1-summary.json
          if-no-files-found: error
