name: Research V6E kNN DEV

on:
  push:
    branches:
      - "research/0.13-knn-membership"
    paths:
      - ".github/workflows/research-v6e-knn-dev.yml"
      - "scripts/evaluate_schema_knn_v6e.py"
  pull_request:
    paths:
      - ".github/workflows/research-v6e-knn-dev.yml"
      - "scripts/evaluate_schema_knn_v6e.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SOURCE: "f2bf26d8537ecde3f4f824bd30a078c6cbf9f736"
  DEV_SHA256: "8e23375fa3858514415f9a62539a947dc4a488eff184f6c4e0a569e1df488e66"
  CONFIRM_SHA256: "bc09041a4ae10b9a1995748b86edd08cfd5f65914a809637c28c9e5b97be5001"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Verify frozen V6E behavior and corpus source
        run: |
          git diff --exit-code "${FROZEN_SOURCE}" -- \
            benchmarks/operation-routing-v6e-knn-membership-preregistration.json \
            benchmarks/operation_routing_v6e_catalog.py \
            benchmarks/schema_knn_membership.py \
            benchmarks/schema_adb_baseline.py \
            benchmarks/schema_hard_negative_ellipsoid.py \
            scripts/generate_operation_routing_v6e.py \
            tests/test_schema_knn_membership.py \
            tests/test_operation_routing_v6e_protocol.py

      - name: Validate evaluator and frozen protocol
        run: |
          ruff check scripts/evaluate_schema_knn_v6e.py
          PYTHONPATH=. pytest -q \
            tests/test_schema_knn_membership.py \
            tests/test_operation_routing_v6e_protocol.py

  evaluate-development:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"

      - name: Recreate both frozen V6E corpora
        run: |
          python scripts/generate_operation_routing_v6e.py \
            --out-dir artifacts/operation-routing-v6e

      - name: Verify both frozen identities before scoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/operation-routing-v6e")
          freeze = json.loads(
              (root / "freeze-manifest.json").read_text(encoding="utf-8")
          )
          if freeze["development"]["corpus_sha256"] != os.environ["DEV_SHA256"]:
              raise SystemExit("DEV corpus identity drifted")
          if freeze["confirmation"]["corpus_sha256"] != os.environ["CONFIRM_SHA256"]:
              raise SystemExit("confirmation corpus identity drifted")
          for role in ("development", "confirmation"):
              manifest = freeze[role]
              if manifest["case_count"] != 552:
                  raise SystemExit(f"unexpected {role} case count")
              if manifest["supported_cases"] != 228:
                  raise SystemExit(f"unexpected {role} supported count")
              if manifest["near_domain_cases"] != 252:
                  raise SystemExit(f"unexpected {role} near-domain count")
              if manifest["out_of_domain_cases"] != 72:
                  raise SystemExit(f"unexpected {role} OOD count")
              if manifest["knn_k"] != 3:
                  raise SystemExit("k drifted")
          print("frozen V6E identities verified; confirmation remains unscored")
          PY

      - name: Score development only
        run: |
          python scripts/evaluate_schema_knn_v6e.py \
            --development artifacts/operation-routing-v6e/development.json \
            --out artifacts/operation-routing-v6e/dev-analysis.json

      - name: Validate authority and governance invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/operation-routing-v6e/dev-analysis.json")
              .read_text(encoding="utf-8")
          )
          policy = data["policy"]
          if policy["confirmation_scored"]:
              raise SystemExit("confirmation scored before DEV pass")
          if policy["prior_failed_rows_used_for_tuning"]:
              raise SystemExit("prior failed evidence leaked")
          if not policy["raw_bge_is_sole_positive_selector"]:
              raise SystemExit("positive route authority changed")
          if not policy["knn_veto_only"]:
              raise SystemExit("kNN gained positive authority")
          if not policy["schema_derived_positive_bank"]:
              raise SystemExit("positive evidence provenance missing")
          if not policy["schema_derived_complement_bank"]:
              raise SystemExit("complement evidence provenance missing")
          if not policy["frozen_background_bank"]:
              raise SystemExit("background evidence provenance missing")
          if policy["background_anchor_count"] != 16:
              raise SystemExit("background bank drifted")
          if policy["benchmark_rows_used_for_knn_fit"]:
              raise SystemExit("benchmark rows used for kNN fit")
          if policy["positive_rerank"] or policy["endpoint_switch"]:
              raise SystemExit("forbidden positive route mutation")
          if policy["rank2_fallback"] or policy["pseudo_route"]:
              raise SystemExit("forbidden fallback authority")
          if policy["k"] != 3:
              raise SystemExit("k drifted")
          if policy["weighted_knn"]:
              raise SystemExit("neighbor weighting drifted")
          if (
              policy["distance_threshold"] is not None
              or policy["margin_threshold"] is not None
              or policy["ratio_threshold"] is not None
          ):
              raise SystemExit("forbidden threshold introduced")
          if policy["dev_selected_hyperparameters"]:
              raise SystemExit("DEV-selected tuning detected")
          metrics = data["metrics"]
          if metrics["positive_route_switches"] != 0:
              raise SystemExit("positive route switch detected")
          if metrics["authority_violations"] != 0:
              raise SystemExit("authority violation")
          if metrics["execution_errors"] != 0:
              raise SystemExit("execution errors")
          print("quality_pass=", data["quality_pass"])
          print("runtime_gate=", data["runtime_gate"])
          print("surface_pass=", data["surface_pass"])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operation-routing-v6e-dev-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v6e/dev-analysis.json
            artifacts/operation-routing-v6e/development-manifest.json
            artifacts/operation-routing-v6e/confirmation-manifest.json
            artifacts/operation-routing-v6e/freeze-manifest.json
            benchmarks/operation-routing-v6e-knn-membership-preregistration.json
          if-no-files-found: warn
          retention-days: 30
