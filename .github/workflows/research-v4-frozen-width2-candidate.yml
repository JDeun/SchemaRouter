name: V4 Frozen Width2 Candidate

on:
  push:
    branches:
      - "research/v4-frozen-width2-candidate"
    paths:
      - ".github/workflows/research-v4-frozen-width2-candidate.yml"
      - "benchmarks/operation-routing-v4-frozen-width2-candidate.json"
      - "benchmarks/operation-routing-v4-paired-candidate-harness.json"
      - "scripts/benchmark_operation_routing_v4_candidate.py"
      - "scripts/benchmark_decision_routing.py"
      - "src/schemarouter/pairwise.py"
      - "src/schemarouter/planner.py"
      - "tests/test_operation_routing_v4_candidate_harness.py"
      - "tests/test_pairwise_decision_backend.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: v4-frozen-width2-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate frozen candidate contracts
        run: |
          ruff check \
            scripts/benchmark_operation_routing_v4_candidate.py \
            tests/test_operation_routing_v4_candidate_harness.py \
            src/schemarouter/pairwise.py
          pytest -q \
            tests/test_operation_routing_v4_candidate_harness.py \
            tests/test_pairwise_decision_backend.py \
            tests/test_planner.py
          python scripts/benchmark_operation_routing_v4_candidate.py --help >/dev/null

  candidate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate identical fresh v4 development corpus
        run: |
          mkdir -p artifacts/v4-frozen-width2
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out artifacts/v4-frozen-width2/corpus.json \
            --manifest artifacts/v4-frozen-width2/corpus-manifest.json
      - name: Audit corpus before model scoring
        run: |
          python scripts/audit_operation_routing_corpus.py \
            --corpus artifacts/v4-frozen-width2/corpus.json \
            --out artifacts/v4-frozen-width2/corpus-audit.json \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50
      - name: Run counterbalanced frozen candidate
        env:
          ROUTE_THRESHOLDS: >-
            {"calendar.create":0.0004207907551704739,"calendar.list":0.0004693468047293043,"finance.history":0.000041384542881440935,"finance.quote":0.013738197840866963,"inventory.search":0.007700659268386702,"inventory.update":0.016340143422138256,"materials.search":0.000239197628484152,"materials.structure":0.0018750830305426453,"papers.citations":0.0019093025002166364,"papers.search":0.0014375698120041836,"support.create_ticket":0.7359367946501093,"support.search":0.00413790789853153,"users.lookup":0.0016116826714426718,"users.update":0.0004977282132914147,"weather.current":0.016015052007939637,"weather.forecast":0.24072465268769136}
        run: |
          python scripts/benchmark_operation_routing_v4_candidate.py \
            --corpus artifacts/v4-frozen-width2/corpus.json \
            --candidate-recall-limit 2 \
            --candidate-thresholds-json "${ROUTE_THRESHOLDS}" \
            --warmup-cases 24 \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 frozen width2 paired" \
            --out artifacts/v4-frozen-width2/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v4-frozen-width2-candidate-${{ github.run_id }}
          path: |
            artifacts/v4-frozen-width2/result.json
            artifacts/v4-frozen-width2/corpus-manifest.json
            artifacts/v4-frozen-width2/corpus-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce preregistered development gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/v4-frozen-width2/result.json").read_text(encoding="utf-8")
          )
          print(json.dumps(result["gates"], indent=2, sort_keys=True))
          if not result["all_gates_passed"]:
              raise SystemExit("frozen v4 candidate failed one or more preregistered gates")
          PY
