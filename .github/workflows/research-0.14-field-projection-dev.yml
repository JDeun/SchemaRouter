name: Research 0.14 Field Projection DEV
run-name: Research 0.14 Field Projection DEV source=${{ inputs.source_sha }}

# Development screen for #506, on the frozen B1 small agent.
#
# It shares one frozen corpus, generator, condition set and scorer with the
# confirmation arm, so it is DIAGNOSTIC ONLY: its results may never be reported
# as confirmation, and may not change conditions, task content, thresholds, the
# scorer, harness semantics, row inclusion, or the frozen source.
#
# source_sha must be a revision that contains the #506 scripts. The conveyor
# freezes and content-checks it; the preflight step below fails closed if a stage
# is ever dispatched against a revision that predates the experiment.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact SchemaRouter source revision to freeze for this screen
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: research-0.14-projection-dev-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/src"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  DEV_MODEL: "Qwen/Qwen3-0.6B"
  DEV_REVISION: "c1899de289a04d12100db370d81485cdf75e47ca"
  DEV_CACHE_KEY: "v7-dev-qwen3-0.6b-c1899de289a04d12100db370d81485cdf75e47ca-torch2.14"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: "${{ steps.matrix.outputs.matrix }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Refuse a source revision that cannot run this experiment
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          required = [
              "scripts/agent_utility_v7_projection.py",
              "scripts/agent_utility_v7_dev_agent.py",
              "scripts/generate_agent_utility_v7_projection_corpus.py",
              "scripts/validate_agent_utility_v7_projection_corpus.py",
              "scripts/evaluate_agent_utility_v7_projection.py",
              "scripts/aggregate_agent_utility_v7_projection.py",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              print(
                  "This checkout does not contain the #506 experiment. The stage "
                  "was dispatched against a source revision that predates it.",
                  file=sys.stderr,
              )
              for path in missing:
                  print("  missing: " + path, file=sys.stderr)
              raise SystemExit(1)
          print("projection experiment present in this checkout")
          PY
      - name: Lint the experiment surface
        run: |
          ruff check \
            scripts/agent_utility_v7_projection.py \
            scripts/agent_utility_v7_dev_agent.py \
            scripts/generate_agent_utility_v7_projection_corpus.py \
            scripts/validate_agent_utility_v7_projection_corpus.py \
            scripts/evaluate_agent_utility_v7_projection.py \
            scripts/aggregate_agent_utility_v7_projection.py \
            tests/test_agent_utility_v7_projection.py
      - run: python -m pytest tests/test_agent_utility_v7_projection.py -q
      - name: Generate and validate the projection corpus
        run: |
          mkdir -p artifacts/projection
          python scripts/generate_agent_utility_v7_projection_corpus.py \
            --source-revision "${{ inputs.source_sha }}" \
            --out artifacts/projection/projection-corpus.json
          python scripts/validate_agent_utility_v7_projection_corpus.py \
            --corpus artifacts/projection/projection-corpus.json
      - id: matrix
        name: Export the shard matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("artifacts/projection/projection-corpus.json").read_text(encoding="utf-8")
          )
          ids = [str(task["semantic_task_id"]) for task in data["tasks"]]
          chunks = [ids[index:index + 6] for index in range(0, len(ids), 6)]
          include = []
          for catalog in data["catalog_sizes"]:
              for index, chunk in enumerate(chunks):
                  include.append(
                      {
                          "job_id": f"c{catalog}-g{index:02d}",
                          "catalog_size": catalog,
                          "task_ids": ",".join(chunk),
                      }
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps({"include": include}, separators=(",", ":")) + "\n")
          print(f"jobs={len(include)} tasks={len(ids)}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "projection-dev-corpus-${{ github.run_id }}"
          path: artifacts/projection/projection-corpus.json
          if-no-files-found: error
          retention-days: 30

  model-cache:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - run: pip install -e .
      - id: hf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.DEV_CACHE_KEY }}"
      - name: Populate the exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(repo_id=os.environ["DEV_MODEL"], revision=os.environ["DEV_REVISION"])
          PY
      - name: Verify the cached revision offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python - <<'PY'
          import os
          from transformers import AutoConfig, AutoTokenizer

          for loader in (AutoConfig, AutoTokenizer):
              loader.from_pretrained(
                  os.environ["DEV_MODEL"],
                  revision=os.environ["DEV_REVISION"],
                  local_files_only=True,
                  trust_remote_code=False,
              )
          PY

  evaluate:
    needs:
      - prepare
      - model-cache
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: "${{ fromJSON(needs.prepare.outputs.matrix) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.DEV_CACHE_KEY }}"
          fail-on-cache-miss: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "projection-dev-corpus-${{ github.run_id }}"
          path: artifacts/projection
      - name: Evaluate one development shard
        run: |
          mkdir -p artifacts/projection-shard
          python -u scripts/evaluate_agent_utility_v7_projection.py \
            --corpus artifacts/projection/projection-corpus.json \
            --catalog-size "${{ matrix.catalog_size }}" \
            --task-ids "${{ matrix.task_ids }}" \
            --runtime dev \
            --out "artifacts/projection-shard/${{ matrix.job_id }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "projection-dev-shard-${{ matrix.job_id }}-${{ github.run_id }}"
          path: artifacts/projection-shard/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: "${{ success() }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "projection-dev-corpus-${{ github.run_id }}"
          path: artifacts/projection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          pattern: "projection-dev-shard-*-${{ github.run_id }}"
          path: artifacts/projection-shards
      - name: Aggregate the development screen
        run: |
          python scripts/aggregate_agent_utility_v7_projection.py \
            --input-dir artifacts/projection-shards \
            --out artifacts/projection-dev-screen.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "projection-dev-screen-${{ github.run_id }}"
          path: |
            artifacts/projection-dev-screen.json
            artifacts/projection/projection-corpus.json
            benchmarks/agent-utility-v7-field-projection-preregistration.json
          if-no-files-found: error
          retention-days: 30
