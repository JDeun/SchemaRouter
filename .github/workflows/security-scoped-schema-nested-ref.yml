name: Scoped Output Schema Nested Reference Security
on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "tests/test_scoped_schema_ref_safety.py"
      - ".github/workflows/security-scoped-schema-nested-ref.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate minimal masked-schema shape and all existing authorization tests
        run: |
          python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
          ruff check tests/test_scoped_schema_ref_safety.py
          python -m pytest -q tests/test_scoped_schema_ref_safety.py tests/test_authorization.py
