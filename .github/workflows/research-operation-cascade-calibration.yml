name: Operation Cascade Calibration

on:
  pull_request:
    paths:
      - ".github/workflows/research-operation-cascade-calibration.yml"
      - "benchmarks/operation-fit-0.10-cascade-cycle.json"
      - "benchmarks/bge_cascade.py"
      - "tests/test_operation_cascade_calibration_protocol.py"
      - "tests/test_bge_cascade.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  SCHEMAROUTER_BENCHMARK_CASCADE_REJECT_BELOW: "0.30"
  SCHEMAROUTER_BENCHMARK_CASCADE_ACCEPT_ABOVE: "0.60"
  SCHEMAROUTER_BENCHMARK_CASCADE_ACCEPT_MARGIN: "0.05"

concurrency:
  group: operation-cascade-calibration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paired-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"

      - name: Validate frozen calibration protocol
        run: |
          pytest -q \
            tests/test_bge_cascade.py \
            tests/test_operation_cascade_calibration_protocol.py \
            tests/test_operation_v14_protocol.py

      - name: Run full-BGE v5 calibration baseline
        run: |
          OUT="artifacts/operation-cascade-calibration/full-bge"
          mkdir -p "$OUT"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v5-operation-calibration.json \
            --split calibration \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU; paired calibration" \
            --json-out "$OUT/report.json" \
            --csv-out "$OUT/rows.csv" \
            --html-out "$OUT/report.html" \
            > "$OUT/stdout.json"

      - name: Run frozen cascade v5 calibration candidate
        run: |
          OUT="artifacts/operation-cascade-calibration/frozen-cascade"
          mkdir -p "$OUT"
          export SCHEMAROUTER_BENCHMARK_CASCADE_TELEMETRY="$OUT/telemetry.jsonl"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v5-operation-calibration.json \
            --split calibration \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_cascade:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU; paired calibration" \
            --json-out "$OUT/report.json" \
            --csv-out "$OUT/rows.csv" \
            --html-out "$OUT/report.html" \
            > "$OUT/stdout.json"

      - name: Compare paired calibration evidence
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path("artifacts/operation-cascade-calibration")
          backend = (
              "keyword+semantic-recall+capability-fit+"
              "operation-fit+endpoint-disambiguation"
          )

          def load_metrics(path: Path) -> dict[str, object]:
              report = json.loads(path.read_text(encoding="utf-8"))
              summary = report["summary"][backend]
              rows = [row for row in report["rows"] if row["backend"] == backend]
              routed = [row for row in rows if row["expected"] is not None]
              near = [
                  row
                  for row in rows
                  if row["category"] == "near_domain_unsupported_operation"
              ]
              if not routed or not near:
                  raise SystemExit("paired calibration corpus categories are incomplete")
              return {
                  "cases": len(rows),
                  "overall_accuracy": sum(bool(row["correct"]) for row in rows) / len(rows),
                  "supported_operation_routed_accuracy": (
                      sum(bool(row["correct"]) for row in routed) / len(routed)
                  ),
                  "near_domain_unsupported_operation_rejection": (
                      sum(bool(row["correct"]) for row in near) / len(near)
                  ),
                  "mean_latency_ms": summary["mean_latency_ms"],
                  "p50_latency_ms": summary["p50_latency_ms"],
                  "p95_latency_ms": summary["p95_latency_ms"],
                  "invalid_plan_rate": summary["invalid_plan_rate"],
                  "errors": summary["errors"],
                  "error_taxonomy": summary["error_taxonomy"],
                  "corpus_sha256": report["reproducibility"]["corpus_sha256"],
              }

          baseline = load_metrics(root / "full-bge" / "report.json")
          candidate = load_metrics(root / "frozen-cascade" / "report.json")
          if baseline["corpus_sha256"] != candidate["corpus_sha256"]:
              raise SystemExit("paired runs used different calibration corpora")

          telemetry_path = root / "frozen-cascade" / "telemetry.jsonl"
          path_counts: Counter[str] = Counter()
          if telemetry_path.exists():
              for line in telemetry_path.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      path_counts[json.loads(line)["path"]] += 1

          supported_floor = 0.60
          rejection_floor = 0.95
          quality_passed = (
              candidate["supported_operation_routed_accuracy"] >= supported_floor
              and candidate["near_domain_unsupported_operation_rejection"] >= rejection_floor
              and candidate["invalid_plan_rate"] == 0.0
              and candidate["errors"] == 0
          )
          latency_passed = candidate["mean_latency_ms"] < baseline["mean_latency_ms"]
          latency_reduction = (
              (baseline["mean_latency_ms"] - candidate["mean_latency_ms"])
              / baseline["mean_latency_ms"]
          )
          promotion_passed = bool(quality_passed and latency_passed)

          result = {
              "cycle": "0.10-operation-cascade-v2",
              "status": (
                  "paired_calibration_passed"
                  if promotion_passed
                  else "paired_calibration_rejected"
              ),
              "tuning_eligible": False,
              "source_revision": os.environ["SOURCE_REVISION"],
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "corpus": "benchmarks/decision-routing-v5-operation-calibration.json",
              "split": "calibration",
              "frozen_candidate": {
                  "name": "r030-a060-m005",
                  "reject_below": 0.30,
                  "accept_above": 0.60,
                  "accept_margin": 0.05,
                  "bge_beta": 1.0,
                  "operation_fit_min_score": 0.01,
                  "operation_fit_min_margin": 0.0,
              },
              "preregistered_gates": {
                  "supported_operation_floor": supported_floor,
                  "near_domain_unsupported_rejection_floor": rejection_floor,
                  "candidate_must_be_faster_than_full_bge_in_same_job": True,
              },
              "full_bge_baseline": baseline,
              "frozen_cascade_candidate": candidate,
              "cascade_path_counts": dict(sorted(path_counts.items())),
              "mean_latency_reduction_vs_full_bge_fraction": latency_reduction,
              "decision": {
                  "quality_passed": bool(quality_passed),
                  "latency_passed": bool(latency_passed),
                  "promotion_passed": promotion_passed,
              },
          }
          out = root / "paired-result.json"
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          checksums = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS.txt":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  checksums.append(f"{digest}  {path.relative_to(root)}")
          (root / "SHA256SUMS.txt").write_text("\n".join(checksums) + "\n", encoding="utf-8")

          print(json.dumps(result, indent=2, sort_keys=True))
          if not promotion_passed:
              raise SystemExit("frozen cascade failed the preregistered paired calibration gate")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-cascade-calibration-${{ github.run_id }}
          path: artifacts/operation-cascade-calibration/
          if-no-files-found: error
          retention-days: 30
