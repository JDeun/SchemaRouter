name: Public OpenRPC OData Execution DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "src/schemarouter/adapters/openrpc.py"
      - "src/schemarouter/adapters/odata.py"
      - "benchmarks/public-execution-remote-protocol-v1.json"
      - "tests/test_public_remote_protocol_execution_wiring.py"
      - ".github/workflows/public-remote-protocol-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registered-remote-readonly-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install exact local protocol test dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Verify registered OpenRPC/OData and denied/stale transport
        run: |
          ruff check tests/test_public_remote_protocol_execution_wiring.py
          python -m pytest -q tests/test_public_remote_protocol_execution_wiring.py
