name: Central Egress Admission Synthetic E0 DEV

on:
  pull_request:
    paths:
      - "scripts/research_central_egress_admission_e0.py"
      - "tests/test_research_central_egress_admission_e0.py"
      - "research/autoresearch/distributed-central-egress-contract-e0.md"
      - ".github/workflows/research-central-egress-admission-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  in-memory-authz-and-atomic-handoff-no-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install test-only E0 and static check dependencies
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Validate abstract gateway does NOT forward real HTTP
        run: |
          ruff check scripts/research_central_egress_admission_e0.py tests/test_research_central_egress_admission_e0.py
          pyright scripts/research_central_egress_admission_e0.py
          python -m pytest -q tests/test_research_central_egress_admission_e0.py
