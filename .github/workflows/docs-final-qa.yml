name: Docs Browser and Link QA

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs_ko/**"
      - "mkdocs*.yml"
      - "scripts/qa_docs_browser.py"
      - "scripts/qa_docs_links.py"
      - "tests/test_docs_final_qa.py"
      - ".github/workflows/docs-final-qa.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs_ko/**"
      - "mkdocs*.yml"
      - "scripts/qa_docs_browser.py"
      - "scripts/qa_docs_links.py"
      - "tests/test_docs_final_qa.py"
      - ".github/workflows/docs-final-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-final-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/docs-final-qa.yml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[docs]" "pytest>=8.2" "pytest-asyncio>=0.23" "playwright==1.55.0"
      - run: python -m playwright install --with-deps chromium
      - name: Verify final QA harness regressions
        run: python -m pytest -q tests/test_docs_final_qa.py
      - name: Prepare Korean documentation tree
        run: python scripts/prepare_korean_docs.py
      - name: Build English strict
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict -f mkdocs.yml
      - name: Build Korean strict
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict -f mkdocs.ko.yml
      - name: Verify software citation and bilingual AI source navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          english = Path("site/llms.txt").read_text(encoding="utf-8")
          korean = Path("site/ko/llms.txt").read_text(encoding="utf-8")
          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          assert "https://jdeun.github.io/SchemaRouter/research/routing-status/" in english
          assert "https://jdeun.github.io/SchemaRouter/ko/research/routing-status/" in korean
          assert "최종 결과" in korean
          assert "#432" in english and "#424" in english
          assert "#432" in korean and "#424" in korean
          assert "cff-version: 1.2.0" in citation
          assert "repository-code: \"https://github.com/JDeun/SchemaRouter\"" in citation
          PY
      - name: Check every rendered internal link and asset
        run: python scripts/qa_docs_links.py site
      - name: Check all rendered pages and language switching in Chromium
        run: python scripts/qa_docs_browser.py site --screenshots .build/docs-qa-screenshots
      - name: Upload representative page screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-browser-screenshots
          path: .build/docs-qa-screenshots/
          retention-days: 14
          if-no-files-found: warn
