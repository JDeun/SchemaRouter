name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs_ko/**"
      - "README.md"
      - "README.ko.md"
      - "mkdocs.yml"
      - "mkdocs.ko.yml"
      - "scripts/prepare_korean_docs.py"
      - "scripts/check_rendered_docs.py"
      - "scripts/check_bilingual_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/docs.yml
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled; deployment will be skipped."
          fi
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[docs]"
      - name: Validate documented public API contracts
        run: python scripts/check_docs_api_contracts.py
      - name: Verify bilingual source integrity
        run: python scripts/check_bilingual_docs.py
      - name: Prepare Korean documentation tree
        run: python scripts/prepare_korean_docs.py
      - name: Build English documentation
        run: mkdocs build --strict -f mkdocs.yml
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Build Korean documentation
        run: mkdocs build --strict -f mkdocs.ko.yml
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Verify rendered Markdown/code-block structure
        run: |
          python scripts/check_rendered_docs.py site
      - name: Verify rendered bilingual integrity
        run: python scripts/check_bilingual_docs.py --site site
      - name: Verify bilingual Pages layout
        run: |
          python - <<'PY'
          from pathlib import Path

          english = Path("site/index.html")
          korean = Path("site/ko/index.html")
          translated = Path("site/ko/getting-started/quickstart/index.html")
          translated_graphql = Path("site/ko/guides/graphql/index.html")

          for path in (english, korean, translated, translated_graphql):
              assert path.is_file(), f"missing bilingual docs output: {path}"

          english_html = english.read_text(encoding="utf-8")
          korean_html = korean.read_text(encoding="utf-8")
          assert 'hreflang="ko"' in english_html, "English site is missing Korean alternate"
          assert 'hreflang="en"' in korean_html, "Korean site is missing English alternate"
          assert "/SchemaRouter/ko/" in english_html, "English selector is missing Korean site link"
          assert "/SchemaRouter/" in korean_html, "Korean selector is missing English site link"
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify-published:
    needs: [build, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/docs.yml
      - run: python -m pip install "playwright==1.55.0"
      - run: python -m playwright install --with-deps chromium
      - name: Verify live GitHub Pages navigation and locale fallback
        run: python scripts/qa_docs_browser.py --base-url https://jdeun.github.io/SchemaRouter/ --smoke-only --screenshots .build/docs-published-screenshots
      - name: Save live-site screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-published-screenshots
          path: .build/docs-published-screenshots/
          retention-days: 14
          if-no-files-found: warn
