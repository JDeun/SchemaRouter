name: V4 BGE-M3 ColBERT Operation Gate

on:
  push:
    branches:
      - "research/v4-bge-m3-colbert-operation-gate"
    paths:
      - ".github/workflows/research-v4-bge-m3-colbert-operation-gate.yml"
      - "benchmarks/operation-routing-v4-bge-m3-colbert-operation-gate.json"
      - "scripts/analyze_bge_m3_colbert_operation_gate_v4.py"
      - "tests/test_bge_m3_colbert_operation_gate_v4.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"
  BGE_MODEL: "BAAI/bge-m3"
  BGE_REVISION: "5617a9f61b028005a4858fdac845db406aefb181"
  FLAGEMBEDDING_VERSION: "1.4.2"
  REFERENCE_RUN_ID: "36325967632"
  REFERENCE_ARTIFACT_ID: "10934635124"
  REFERENCE_ARTIFACT_DIGEST: "sha256:aabe4321e039dbb2e0b0805553e4dfd7d6c4bcf63893e23da028ceb668608462"

concurrency:
  group: v4-bge-m3-colbert-operation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate preregistered contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-bge-m3-colbert-operation-gate.json >/dev/null
          ruff check scripts/analyze_bge_m3_colbert_operation_gate_v4.py tests/test_bge_m3_colbert_operation_gate_v4.py
          pytest -q tests/test_bge_m3_colbert_operation_gate_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install pinned CPU runtime
        run: |
          pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.57.6" "FlagEmbedding==${FLAGEMBEDDING_VERSION}"
          pip install -e ".[dev]"

      - name: Download exact BGE-M3 snapshot
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          path = snapshot_download(
              repo_id=os.environ["BGE_MODEL"],
              revision=os.environ["BGE_REVISION"],
              local_dir="/tmp/bge-m3-pinned",
          )
          print(path)
          PY

      - name: Smoke BGE-M3 multi-function API
        run: |
          python - <<'PY'
          from FlagEmbedding import BGEM3FlagModel

          model = BGEM3FlagModel(
              "/tmp/bge-m3-pinned",
              use_fp16=False,
              devices="cpu",
          )
          out = model.encode(
              ["current weather"],
              batch_size=1,
              max_length=32,
              return_dense=True,
              return_sparse=True,
              return_colbert_vecs=True,
          )
          required = {"dense_vecs", "lexical_weights", "colbert_vecs"}
          missing = sorted(required - set(out))
          if missing:
              raise SystemExit(f"missing BGE-M3 output(s): {missing}")
          if len(out["dense_vecs"]) != 1:
              raise SystemExit("unexpected dense output count")
          if len(out["lexical_weights"]) != 1:
              raise SystemExit("unexpected sparse output count")
          if len(out["colbert_vecs"]) != 1:
              raise SystemExit("unexpected ColBERT output count")
          print("BGE-M3 multi-function smoke passed")
          PY

      - name: Download and validate frozen #259 authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/reference
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}"             -o /tmp/reference-meta.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("/tmp/reference-meta.json").read_text())
          if int(data["workflow_run"]["id"]) != int(os.environ["REFERENCE_RUN_ID"]):
              raise SystemExit("reference workflow run mismatch")
          if data.get("digest") != os.environ["REFERENCE_ARTIFACT_DIGEST"]:
              raise SystemExit(
                  f"reference artifact digest mismatch: {data.get('digest')!r}"
              )
          if data.get("expired"):
              raise SystemExit("reference artifact expired")
          print("reference artifact metadata verified")
          PY

          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip"             -o /tmp/reference.zip
          unzip -q /tmp/reference.zip -d /tmp/reference
          REPORT="$(find /tmp/reference -type f -path '*v4-bge-m3-frozen-candidate/report.json' -print -quit)"
          if [ -z "${REPORT}" ]; then
            echo "reference report.json not found"
            find /tmp/reference -maxdepth 5 -type f -print
            exit 1
          fi
          echo "REFERENCE_REPORT=${REPORT}" >> "${GITHUB_ENV}"

      - name: Generate immutable canonical DEV
        run: |
          OUT="artifacts/v4-bge-m3-colbert-operation-gate"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py             --seed "${V4_DEV_SEED}"             --source-revision "${GITHUB_SHA}"             --out "${OUT}/corpus.json"             --manifest "${OUT}/corpus-manifest.json"

      - name: Verify and audit corpus
        run: |
          OUT="artifacts/v4-bge-m3-colbert-operation-gate"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(
                  "artifacts/v4-bge-m3-colbert-operation-gate/corpus-manifest.json"
              ).read_text(encoding="utf-8")
          )
          actual = manifest.get("corpus_sha256")
          expected = os.environ["V4_DEV_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"corpus SHA mismatch: expected {expected}, got {actual}"
              )
          if manifest.get("case_count") != 1800:
              raise SystemExit(
                  f"unexpected case count: {manifest.get('case_count')}"
              )
          if manifest.get("tuning_eligible") is not True:
              raise SystemExit("canonical DEV must remain tuning-eligible")
          print(f"verified canonical DEV sha256={actual}")
          PY
          python scripts/audit_operation_routing_corpus.py             --corpus "${OUT}/corpus.json"             --out "${OUT}/corpus-audit.json"             --near-duplicate-threshold 0.80             --max-duplicate-examples 50

      - name: Run BGE-M3 ColBERT operation-contract diagnostic
        run: |
          OUT="artifacts/v4-bge-m3-colbert-operation-gate"
          python scripts/analyze_bge_m3_colbert_operation_gate_v4.py             --corpus "${OUT}/corpus.json"             --reference-report "${REFERENCE_REPORT}"             --model-path /tmp/bge-m3-pinned             --out "${OUT}/analysis.json"

      - name: Validate technical completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "artifacts/v4-bge-m3-colbert-operation-gate/analysis.json"
              ).read_text(encoding="utf-8")
          )
          summary = data["summary"]
          if summary["cases"] != 1800:
              raise SystemExit("analysis did not score all 1800 cases")
          if summary["execution_errors"] != 0:
              raise SystemExit(
                  f"execution errors: {summary['execution_errors']}"
              )
          if summary["authority_violations"] != 0:
              raise SystemExit(
                  f"authority violations: {summary['authority_violations']}"
              )
          print(
              "technical completion valid; candidate-worthy rules:",
              summary["candidate_worthy_rule_count"],
          )
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-bge-m3-colbert-operation-gate-${{ github.run_id }}
          path: |
            artifacts/v4-bge-m3-colbert-operation-gate/analysis.json
            artifacts/v4-bge-m3-colbert-operation-gate/corpus-manifest.json
            artifacts/v4-bge-m3-colbert-operation-gate/corpus-audit.json
            benchmarks/operation-routing-v4-bge-m3-colbert-operation-gate.json
          if-no-files-found: warn
          retention-days: 30
