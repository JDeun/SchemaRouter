name: Qwen3 1.7B Real Open-Meteo Two-Hop Fixed E1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_qwen17_live_open_meteo_comparison_e1.py"
      - "tests/test_research_qwen17_live_open_meteo_comparison_e1.py"
      - "research/autoresearch/qwen17-live-open-meteo-comparison-e1.md"
      - ".github/workflows/research-qwen17-live-open-meteo-e1.yml"

permissions:
  contents: read

concurrency:
  group: qwen17-open-meteo-e1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-identity-and-existing-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Lint and original two-hop source/authority tests
        run: |
          python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
          ruff check scripts/research_qwen17_live_open_meteo_comparison_e1.py tests/test_research_qwen17_live_open_meteo_comparison_e1.py
          python -m pytest -q tests/test_research_qwen17_live_open_meteo_comparison_e1.py tests/test_research_real_qwen_open_meteo_two_hop_e1.py tests/test_research_open_meteo_live_two_hop_e1.py

  pinned-qwen17-cpu-real-provider:
    needs: source-identity-and-existing-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned Qwen CPU inference stack
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "transformers>=4.51,<5" "huggingface-hub>=0.30,<2"
      - name: Verify GitHub runner minimum safe CPU RAM and disk
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          ram = int(next(x for x in Path("/proc/meminfo").read_text().splitlines() if x.startswith("MemTotal:")).split()[1])
          disk = shutil.disk_usage(".").free / (1024**3)
          print("RAM KiB", ram, "free disk GiB", round(disk, 1))
          assert ram >= 12_000_000 and disk >= 7
          PY
      - name: Actual pinned Qwen3-1.7B generates native tool calls on live provider
        run: |
          python -m scripts.research_qwen17_live_open_meteo_comparison_e1 \
            --out artifacts/real-qwen17-open-meteo/report.json
      - name: Assert truthful host-accounted results and no E2 promotion
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          d = json.loads(Path("artifacts/real-qwen17-open-meteo/report.json").read_text())
          assert d["model_id"] == "Qwen/Qwen3-1.7B"
          assert d["model_revision"] == "70d244cc86ccca08cf5af4e1e306ecf908b1ad5e"
          assert d["case_count"] == 3 and len(d["outcomes"]) == 3
          assert d["actual_pinned_model_inference"] and d["real_provider_observed"]
          assert d["candidate_only_checkpoint_changed"]
          assert not d["independently_authored_private_e2"]
          assert not d["independent_e2_qualified"]
          assert not d["released_or_promoted"]
          assert not d["product_default_changed"]
          assert not d["release_qualified"]
          assert {row["language"] for row in d["outcomes"]} == {"en", "ko", "ja"}
          assert d["model_generated_full_task_successes"] == sum(row["full_task_complete"] for row in d["outcomes"])
          assert d["total_real_source_calls"] == sum(
              row["real_geocoding_calls"] + row["real_forecast_calls"] for row in d["outcomes"]
          )
          assert d["total_real_http_attempts"] == sum(
              row["real_geocoding_http_attempts"] + row["real_forecast_http_attempts"]
              for row in d["outcomes"]
          )
          assert d["total_real_http_attempts"] >= d["total_real_source_calls"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Qwen3-1.7B on original Open-Meteo 2-hop E1 DEV\n\n")
              f.write("Same published tasks, source authority and original strict final oracle as Qwen3-0.6B (previous real-API 1/3). Dynamic time/weather and separate-run results cannot establish model superiority.\n\n")
              f.write("| Language | HTTP attempts | Validated geocode | Validated weather | Strict complete | Stop | Failure stage |\n|---|---:|---:|---:|---|---|---|\n")
              for row in d["outcomes"]:
                  assert row["trusted_failure_stage"] is None or row["termination_reason"] == "host_or_native_source_denied"
                  f.write(f"| {row['language']} | {row['real_geocoding_http_attempts'] + row['real_forecast_http_attempts']} | {row['real_geocoding_calls']} | {row['real_forecast_calls']} | {row['full_task_complete']} | {row['termination_reason']} | {row['trusted_failure_stage']} |\n")
              f.write("\nNo private provider-authored E2, no authority widening, no model release. v0.18 HOLD.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-qwen17-open-meteo-e1-${{ github.run_id }}
          path: artifacts/real-qwen17-open-meteo/report.json
          if-no-files-found: warn
          retention-days: 60
