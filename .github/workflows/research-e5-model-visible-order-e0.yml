name: E5 Model Visible K5 Order Paired Qwen CPU DEV

on:
  pull_request:
    paths:
      - "scripts/agent_utility_generated_common.py"
      - "scripts/research_e5_model_visible_order_e0.py"
      - "tests/test_research_e5_model_visible_order_e0.py"
      - ".github/workflows/research-e5-model-visible-order-e0.yml"
      - "research/autoresearch/e5-model-visible-order-e0.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e5-ranked-visible-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-model-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install local E0 harness dependencies
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Validate original source and no-model ordered-visibility invariants
        run: |
          ruff check scripts/research_e5_model_visible_order_e0.py tests/test_research_e5_model_visible_order_e0.py
          pyright scripts/research_e5_model_visible_order_e0.py
          python -m pytest -q tests/test_research_e5_model_visible_order_e0.py tests/test_research_fixed5_model_visible_order_e0.py tests/test_integrated_fixed5_agent_selector.py
          python -m scripts.research_e5_model_visible_order_e0 --mode validate

  pinned-qwen-e5-order-paired-cpu:
    needs: no-model-source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned local CPU inference
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Execute 12 public original tasks times four counterbalanced ABBA
        run: |
          python -m scripts.research_e5_model_visible_order_e0 \
            --mode real-cpu \
            --out artifacts/ranked-visible-order-e0/report.json
      - name: Enforce unchanged source fixed K and honest metric labels
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path("artifacts/ranked-visible-order-e0/report.json").read_text(encoding="utf-8"))
          assert r["evidence_tier"] == "REAL_LOCAL_QWEN_E5_MODEL_VISIBLE_ORDER_PUBLIC_DEV_NOT_E2"
          assert r["source_sha256"] == "dc8b0a7c9325c8767d9b323b24040e0dfe94f3fd170b829b6f977c0e629b2110"
          assert r["agent_model_revision"] == "c1899de289a04d12100db370d81485cdf75e47ca"
          assert r["e5_model_revision"] == "fd1525a9fd15316a2d503bf26ab031a61d056e98"
          assert r["arms"] == ["alphabetical_control", "e5_ranked_order"]
          assert r["sequence"] == ["alphabetical_control", "e5_ranked_order", "e5_ranked_order", "alphabetical_control"]
          assert r["schema_version"] == 2
          assert r["posthoc_secondary_no_call_terminal_diagnostic"] is True
          assert r["actual_agent_model_measured"] is True
          assert r["actual_e5_model_measured"] is True
          assert r["device"] == "cpu"
          assert r["cases"] == 12 and r["executions"] == 48 and r["fixed_k"] == 5
          assert r["candidate_set_paired_identical"] is True
          assert r["same_original_source_and_fixture"] is True
          assert r["independent_e2_qualified"] is False
          assert r["real_provider_execution"] is False
          assert r["calibrated_no_fit"] is False
          assert r["actual_final_answer_correctness_measured"] is False
          assert r["production_default_changed"] is False
          assert 0 <= r["paired_pass_differences"] <= 24
          for arm in r["arms"]:
              for lang, row in r["strata"][arm].items():
                  assert lang in ("en", "ko", "ja")
                  assert row["unsupported_no_call"] + row["unsupported_tool_attempted"] == row["unsupported"] == 4
                  assert row["unsupported_strict_no_call"] <= row["unsupported_no_call"]
                  assert row["unsupported_no_call_terminal_mismatch"] <= row["unsupported_no_call"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Real pinned Qwen/E5 K5 order-only ABBA; public synthetic DEV\n\n")
              f.write("**No E2, live provider or calibrated no-fit claim.** Same 12 disclosed tasks, 2 A and 2 B orderings per task, K5 fixed and same candidate set; ABBA partly counterbalances position but is not randomization.\n\n")
              f.write(f"Cases with nonalphabetical E5 shortlist: {r['order_changed_in_cases']}/12. Paired pass discrepancies across 24 A/B observations: {r['paired_pass_differences']}/24.\n\n")
              f.write("| Presentation | Language | Supported completed /4 | Unsupported exact no-call /4 | Unsupported tool attempts /4 | Unauthorized destructive |\n|---|---|---:|---:|---:|---:|\n")
              for arm in r["arms"]:
                  for lang, row in r["strata"][arm].items():
                      f.write(f"| {arm} | {lang} | {row['supported_pass']}/4 | {row['unsupported_strict_no_call']}/4 | {row['unsupported_tool_attempted']}/4 | {row['unauthorized_destructive']} |\n")
              f.write("\n### Secondary post-hoc diagnostic, not original preregistered primary outcome\n\n")
              f.write("| Presentation | Language | Unsupported no-call /4 | No-call wrong terminal /4 | Unsupported wrong terminal total /4 |\n|---|---|---:|---:|---:|\n")
              for arm in r["arms"]:
                  for lang, row in r["strata"][arm].items():
                      f.write(f"| {arm} | {lang} | {row['unsupported_no_call']}/4 | {row['unsupported_no_call_terminal_mismatch']}/4 | {row['unsupported_terminal_mismatch']}/4 |\n")
              f.write("\nNo source/gold/raw outputs exported. This is not qualified E2 evidence or a release gate.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e5-ranked-visible-qwen-ordered-dev-${{ github.run_id }}
          path: artifacts/ranked-visible-order-e0/report.json
          if-no-files-found: error
          retention-days: 30
