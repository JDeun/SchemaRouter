name: Research V5H Corpus Freeze

on:
  push:
    branches:
      - "research/0.12-independent-capability-entailment"
    paths:
      - ".github/workflows/research-v5h-corpus-freeze.yml"
      - "benchmarks/operation-routing-v5h-independent-entailment-preregistration.json"
      - "benchmarks/independent_capability_entailment.py"
      - "benchmarks/operation_routing_v5h_catalog.py"
      - "scripts/generate_operation_routing_v5h.py"
      - "tests/test_independent_capability_entailment.py"
      - "tests/test_operation_routing_v5h_protocol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate preregistration and protocol
        run: |
          python -m json.tool benchmarks/operation-routing-v5h-independent-entailment-preregistration.json >/dev/null
          ruff check             benchmarks/independent_capability_entailment.py             benchmarks/operation_routing_v5h_catalog.py             scripts/generate_operation_routing_v5h.py             tests/test_independent_capability_entailment.py             tests/test_operation_routing_v5h_protocol.py
          pytest -q             tests/test_independent_capability_entailment.py             tests/test_operation_routing_v5h_protocol.py

      - name: Generate DEV and confirmation together before scoring
        run: |
          python scripts/generate_operation_routing_v5h.py             --out-dir artifacts/operation-routing-v5h
          cat artifacts/operation-routing-v5h/freeze-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operation-routing-v5h-freeze-${{ github.run_id }}
          path: artifacts/operation-routing-v5h/
          retention-days: 30
