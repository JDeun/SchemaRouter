name: Authorized Retrieval Phase Profile DEV CPU

on:
  pull_request:
    paths:
      - "scripts/research_authorized_retrieval_phase_profile.py"
      - "tests/test_research_authorized_retrieval_phase_profile.py"
      - "research/autoresearch/authorized-retrieval-profile-dev.md"
      - ".github/workflows/research-authorized-retrieval-profile-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-phase-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-authorized-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install source and local zero-inference contract tests
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - name: Verify finite phase instrumentation and authorization guards
        run: python -m pytest -q tests/test_research_authorized_retrieval_phase_profile.py
      - name: Profile real public authorized retrieval at 100 250 and 500 typed routes
        run: |
          python -m scripts.research_authorized_retrieval_phase_profile \
            --sizes 100 250 500 --repeats 2 \
            --output artifacts/authorized-phase-dev/report.json
      - name: Archive negative and positive per-phase original DEV evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authorized-phase-dev-${{ github.run_id }}
          path: artifacts/authorized-phase-dev/
          if-no-files-found: warn
          retention-days: 30
# Linux CPU only. Source immutable by HEAD; no external provider, model, agents,
# tool execution, credentials, product writes, or release permission.
