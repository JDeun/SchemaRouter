name: Compatibility Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "src/schemarouter/adapters/**"
      - "src/schemarouter/ingestion.py"
      - "src/schemarouter/provider_profiles.py"
      - "src/schemarouter/runtime.py"
      - "scripts/live_*"
      - "scripts/aggregate_compatibility_matrix.py"
      - "scripts/published_pypi_smoke.py"
      - "scripts/installed_extras_smoke.py"
      - "scripts/compatibility_scope.py"
      - "tests/test_compatibility_scope.py"
      - ".github/workflows/compatibility.yml"

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.scope.outputs.openapi }}
      optimade: ${{ steps.scope.outputs.optimade }}
      providers: ${{ steps.scope.outputs.providers }}
      vector: ${{ steps.scope.outputs.vector }}
      record: ${{ steps.scope.outputs.record }}
      graph: ${{ steps.scope.outputs.graph }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify compatibility surface
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            python scripts/compatibility_scope.py .github/workflows/compatibility.yml --github-output >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" |
              python scripts/compatibility_scope.py --github-output >> "$GITHUB_OUTPUT"
          fi

  public-openapi:
    needs: changes
    if: ${{ needs.changes.outputs.openapi == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m pip check
      - run: python scripts/live_openapi_smoke.py --json-out artifacts/openapi-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-openapi-${{ github.run_id }}
          path: artifacts/openapi-compatibility.json
          if-no-files-found: warn
          retention-days: 30


  public-optimade:
    needs: changes
    if: ${{ needs.changes.outputs.optimade == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m pip check
      - run: python scripts/live_optimade_smoke.py --json-out artifacts/optimade-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-optimade-${{ github.run_id }}
          path: artifacts/optimade-compatibility.json
          if-no-files-found: warn
          retention-days: 30


  public-graphql:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m pip check
      - run: python scripts/live_graphql_smoke.py --json-out artifacts/graphql-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-graphql-${{ github.run_id }}
          path: artifacts/graphql-compatibility.json
          if-no-files-found: warn
          retention-days: 30


  public-materials-project-provider:
    needs: changes
    if: ${{ needs.changes.outputs.providers == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m pip check
      - name: Register and execute Materials Project by provider identity
        run: |
          python scripts/live_materials_project_provider_smoke.py \
            --json-out artifacts/materials-project-provider-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-materials-project-provider-${{ github.run_id }}
          path: artifacts/materials-project-provider-compatibility.json
          if-no-files-found: warn
          retention-days: 30


  public-crossref-provider:
    needs: changes
    if: ${{ needs.changes.outputs.providers == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m pip check
      - name: Register and execute Crossref by provider identity
        run: |
          python scripts/live_crossref_provider_smoke.py \
            --json-out artifacts/crossref-provider-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-crossref-provider-${{ github.run_id }}
          path: artifacts/crossref-provider-compatibility.json
          if-no-files-found: warn
          retention-days: 30


  public-tavily-provider:
    needs: changes
    if: ${{ needs.changes.outputs.providers == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m pip check
      - name: Validate Tavily provider identity and execute when key is available
        run: |
          python scripts/live_tavily_provider_smoke.py \
            --json-out artifacts/tavily-provider-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-tavily-provider-${{ github.run_id }}
          path: artifacts/tavily-provider-compatibility.json
          if-no-files-found: warn
          retention-days: 30



  qdrant-live:
    needs: changes
    if: ${{ needs.changes.outputs.vector == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . "qdrant-client>=1.15,<2"
      - run: python -m pip check
      - name: Start Qdrant
        run: docker run -d --name schemarouter-qdrant -p 6333:6333 qdrant/qdrant:v1.15.4
      - name: Wait for Qdrant
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6333/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs schemarouter-qdrant
          exit 1
      - name: Exercise Qdrant discovery, projection, and trusted filtering
        run: >-
          python scripts/live_qdrant_smoke.py
          --json-out artifacts/qdrant-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-qdrant-${{ github.run_id }}
          path: artifacts/qdrant-compatibility.json
          if-no-files-found: error
          retention-days: 30

  pgvector-live:
    needs: changes
    if: ${{ needs.changes.outputs.vector == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . "sqlalchemy>=2,<3" "psycopg[binary]>=3,<4" "pgvector>=0.4,<1"
      - run: python -m pip check
      - name: Start PostgreSQL with pgvector
        run: >-
          docker run -d --name schemarouter-pgvector
          -e POSTGRES_PASSWORD=schemarouter
          -e POSTGRES_DB=schemarouter
          -p 5432:5432
          pgvector/pgvector:pg16
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec schemarouter-pgvector pg_isready -U postgres -d schemarouter; then
              exit 0
            fi
            sleep 1
          done
          docker logs schemarouter-pgvector
          exit 1
      - name: Exercise pgvector discovery, projection, and trusted filtering
        run: >-
          python scripts/live_pgvector_smoke.py
          --url postgresql+psycopg://postgres:schemarouter@127.0.0.1:5432/schemarouter
          --json-out artifacts/pgvector-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-pgvector-${{ github.run_id }}
          path: artifacts/pgvector-compatibility.json
          if-no-files-found: error
          retention-days: 30

  mongodb-live:
    needs: changes
    if: ${{ needs.changes.outputs.record == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . "pymongo==4.18.2"
      - run: python -m pip check
      - name: Start MongoDB
        run: docker run -d --name schemarouter-mongodb -p 27017:27017 mongo:8.0.32-noble
      - name: Wait for MongoDB
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          last_error = None
          for _ in range(30):
              try:
                  client = MongoClient("mongodb://127.0.0.1:27017", serverSelectionTimeoutMS=1000)
                  client.admin.command("ping")
                  client.close()
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          raise SystemExit(f"MongoDB did not become ready: {last_error}")
          PY
      - name: Exercise MongoDB discovery, projection, and trusted filtering
        run: >-
          python scripts/live_mongodb_smoke.py
          --json-out artifacts/mongodb-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-mongodb-${{ github.run_id }}
          path: artifacts/mongodb-compatibility.json
          if-no-files-found: error
          retention-days: 30

  chroma-live:
    needs: changes
    if: ${{ needs.changes.outputs.vector == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . "chromadb==1.5.2"
      - run: python -m pip check
      - name: Exercise in-process Chroma discovery, projection, and trusted filtering
        run: >-
          python scripts/live_chroma_smoke.py
          --json-out artifacts/chroma-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-chroma-${{ github.run_id }}
          path: artifacts/chroma-compatibility.json
          if-no-files-found: error
          retention-days: 30

  clickhouse-live:
    needs: changes
    if: ${{ needs.changes.outputs.record == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . "clickhouse-connect==1.9.0"
      - run: python -m pip check
      - name: Start ClickHouse
        run: >-
          docker run -d --name schemarouter-clickhouse
          -e CLICKHOUSE_PASSWORD=schemarouter
          -p 8123:8123
          clickhouse/clickhouse-server:26.8.11.7
      - name: Wait for ClickHouse
        run: |
          python - <<'PY'
          import time
          import clickhouse_connect

          last_error = None
          for _ in range(30):
              try:
                  client = clickhouse_connect.get_client(
                      host="127.0.0.1",
                      port=8123,
                      username="default",
                      password="schemarouter",
                  )
                  client.command("SELECT 1")
                  client.close()
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          raise SystemExit(f"ClickHouse did not become ready: {last_error}")
          PY
      - name: Exercise ClickHouse discovery, time bounds, projection, and trusted filtering
        run: >-
          python scripts/live_clickhouse_smoke.py
          --json-out artifacts/clickhouse-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-clickhouse-${{ github.run_id }}
          path: artifacts/clickhouse-compatibility.json
          if-no-files-found: error
          retention-days: 30

  falkordb-live:
    needs: changes
    if: ${{ needs.changes.outputs.graph == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . "FalkorDB>=1,<2"
      - run: python -m pip check
      - name: Start FalkorDB
        run: docker run -d --name schemarouter-falkordb -p 6379:6379 falkordb/falkordb:latest
      - name: Exercise native FalkorDB discovery and bounded traversal
        run: >-
          python scripts/live_falkordb_smoke.py
          --json-out artifacts/falkordb-compatibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-falkordb-${{ github.run_id }}
          path: artifacts/falkordb-compatibility.json
          if-no-files-found: error
          retention-days: 30

  adapter-compatibility-matrix:
    needs: changes
    if: ${{ needs.changes.outputs.matrix == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install SchemaRouter with deterministic reference support
        run: |
          pip install ".[dev,mcp]"
          python -m pip check
      - name: Run protocol compatibility matrix
        shell: bash
        run: |
          mkdir -p artifacts

          run_public_smoke() {
            set +e
            python "$@"
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::warning::public compatibility smoke unavailable: $* (exit $code)"
            fi
          }

          run_reference_smoke() {
            set +e
            python "$@"
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::error::reference compatibility smoke failed: $* (exit $code)"
            fi
          }

          run_public_smoke scripts/live_openapi_smoke.py \
            --json-out artifacts/openapi-compatibility.json
          run_public_smoke scripts/live_optimade_smoke.py \
            --json-out artifacts/optimade-compatibility.json
          run_public_smoke scripts/live_odata_smoke.py \
            --json-out artifacts/odata-compatibility.json
          run_public_smoke scripts/live_provider_first_protocol_smoke.py \
            --provider apis-guru \
            --json-out artifacts/provider-apis-guru-compatibility.json
          run_public_smoke scripts/live_provider_first_protocol_smoke.py \
            --provider odata-v4-reference \
            --json-out artifacts/provider-odata-v4-reference-compatibility.json

          run_reference_smoke scripts/reference_protocol_contract_smoke.py \
            --adapter openapi-reference \
            --json-out artifacts/openapi-reference-contract-compatibility.json \
            tests/test_openapi_auth_contract.py \
            tests/test_openapi_compatibility.py \
            tests/test_openapi_discriminator.py \
            tests/test_openapi_external_refs.py \
            tests/test_openapi_nested_fields.py \
            tests/test_openapi_nullable.py \
            tests/test_openapi_parameter_serialization.py \
            tests/test_openapi_ref_composition.py \
            tests/test_openapi_root_body.py \
            tests/test_openapi_serialization_properties.py \
            tests/test_openapi_yaml.py
          run_reference_smoke scripts/reference_protocol_contract_smoke.py \
            --adapter odata-reference \
            --json-out artifacts/odata-reference-contract-compatibility.json \
            tests/test_odata_adapter.py
          run_reference_smoke scripts/live_reference_openrpc_smoke.py \
            --json-out artifacts/openrpc-compatibility.json
          run_reference_smoke scripts/live_reference_mcp_smoke.py \
            --json-out artifacts/mcp-compatibility.json
          run_reference_smoke scripts/live_reference_graphql_smoke.py \
            --json-out artifacts/graphql-reference-compatibility.json

          python scripts/aggregate_compatibility_matrix.py \
            --reports-dir artifacts \
            --json-out artifacts/adapter-compatibility-matrix.json \
            --markdown-out artifacts/adapter-compatibility-matrix.md \
            --required-reference-report openapi-reference-contract-compatibility.json \
            --required-reference-report odata-reference-contract-compatibility.json \
            --required-reference-report openrpc-compatibility.json \
            --required-reference-report mcp-compatibility.json \
            --required-reference-report graphql-reference-compatibility.json \
            --require-reference-success

          cat artifacts/adapter-compatibility-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-adapter-matrix-${{ github.run_id }}
          path: |
            artifacts/*-compatibility.json
            artifacts/adapter-compatibility-matrix.json
            artifacts/adapter-compatibility-matrix.md
          if-no-files-found: warn
          retention-days: 30


  published-pypi:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        artifact-kind: ["wheel", "sdist"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install latest stable SchemaRouter from PyPI
        run: |
          if [ "${{ matrix.artifact-kind }}" = "wheel" ]; then
            python -m pip install --no-cache-dir --only-binary=schemarouter schemarouter
          else
            python -m pip install --no-cache-dir --no-binary=schemarouter schemarouter
          fi
          python -m pip check
      - name: Run published-package smoke outside the checkout
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/published_pypi_smoke.py" \
            --artifact-kind "${{ matrix.artifact-kind }}" \
            --json-out "$GITHUB_WORKSPACE/artifacts/pypi-${{ matrix.artifact-kind }}-compatibility.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-pypi-${{ matrix.artifact-kind }}-${{ github.run_id }}
          path: artifacts/pypi-${{ matrix.artifact-kind }}-compatibility.json
          if-no-files-found: warn
          retention-days: 30


  published-pypi-lightweight:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install latest stable SchemaRouter lightweight extras from PyPI
        run: |
          python -m pip install --no-cache-dir "schemarouter[mcp,jev,otel]"
          python -m pip check
      - name: Run isolated published lightweight-extras smoke outside the checkout
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/published_pypi_smoke.py" \
            --artifact-kind wheel \
            --lightweight-extras \
            --json-out "$GITHUB_WORKSPACE/artifacts/pypi-lightweight-compatibility.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-pypi-lightweight-${{ github.run_id }}
          path: artifacts/pypi-lightweight-compatibility.json
          if-no-files-found: warn
          retention-days: 30


  published-pypi-integrations:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install latest stable SchemaRouter integration extras from PyPI
        run: |
          python -m pip install --no-cache-dir \
            "schemarouter[mcp,langchain,langgraph,llamaindex,jev,otel]"
          python -m pip check
      - name: Run published integration smoke outside the checkout
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/published_pypi_smoke.py" \
            --artifact-kind wheel \
            --framework-integrations \
            --lightweight-extras \
            --json-out "$GITHUB_WORKSPACE/artifacts/pypi-integrations-compatibility.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-pypi-integrations-${{ github.run_id }}
          path: artifacts/pypi-integrations-compatibility.json
          if-no-files-found: warn
          retention-days: 30
