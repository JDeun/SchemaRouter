name: Public Direct SDK Real Denials DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/field_routing_session.py"
      - "src/schemarouter/paper_typed_tool_plan.py"
      - "src/schemarouter/runtime.py"
      - "tests/test_public_direct_sdk_real_denials.py"
      - "tests/test_public_execution_wiring_contract.py"
      - "benchmarks/public-execution-wiring-v1.json"
      - "tests/test_research_paper_scoped_native_direct_e1.py"
      - ".github/workflows/public-direct-sdk-real-denials-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-registered-direct-denials:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install deterministic native source tests
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Validate real registered direct SDK denials
        run: |
          ruff check tests/test_public_direct_sdk_real_denials.py tests/test_public_execution_wiring_contract.py
          python -m pytest -q tests/test_public_direct_sdk_real_denials.py tests/test_public_execution_wiring_contract.py
