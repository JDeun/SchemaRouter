name: Real Open-Meteo Authorized E5 Passage Ablation DEV

on:
  pull_request:
    paths:
      - "scripts/research_real_open_meteo_field_text_ablation_dev.py"
      - "tests/test_research_real_open_meteo_field_text_ablation_dev.py"
      - "research/autoresearch/real-open-meteo-field-text-ablation-dev.md"
      - ".github/workflows/research-real-open-meteo-passage-ablation-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-meteo-passage-ablation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-pinned-encoder-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install source and offline trust-boundary tests
        run: |
          python -m pip install . "PyYAML>=6,<7" "pytest>=8,<10" "pytest-asyncio>=0.23"
          python -m pytest -q tests/test_research_real_open_meteo_field_text_ablation_dev.py
      - name: Fetch exact nine Open-Meteo upstream schema documents
        shell: bash
        run: |
          set -euo pipefail
          commit=b0ff3ebbbafa890000ab8bc5f9598a2e4ef64dc4
          dir=artifacts/passage-ablation/source
          mkdir -p "$dir"
          for name in air-quality climate elevation ensemble flood forecast historical-weather marine seasonal; do
            curl --fail --silent --show-error --location --retry 2 \
              --connect-timeout 15 --max-time 90 \
              "https://raw.githubusercontent.com/open-meteo/open-meteo/$commit/openapi/$name.yml" \
              --output "$dir/$name.yml"
            test -s "$dir/$name.yml"
          done
          python - <<'PY'
          from pathlib import Path
          from scripts.research_open_meteo_real_openapi_dev import load_contracts
          tools, failures, evidence = load_contracts(
              Path("benchmarks/open-meteo-openapi-real-source-dev-manifest.json"),
              Path("artifacts/passage-ablation/source"),
          )
          assert not failures and len(tools) == 9, failures
          print("All nine publisher source blobs and adapters verified.")
          PY
      - name: Install locally executed E5 CPU encoder dependencies
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Measure original vs parameters-only vs described-parameters E5
        run: |
          python -m scripts.research_real_open_meteo_field_text_ablation_dev \
            --manifest benchmarks/open-meteo-openapi-real-source-dev-manifest.json \
            --source-dir artifacts/passage-ablation/source \
            --output artifacts/passage-ablation/report.json
      - name: Preserve source, exact result/permutation and negative cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-open-meteo-passage-ablation-${{ github.run_id }}
          path: artifacts/passage-ablation/
          if-no-files-found: warn
          retention-days: 90
# No product changes, hosted inference, live Open-Meteo API calls, GPU, agent
# execution, authenticated identity, default model promotion or release.
