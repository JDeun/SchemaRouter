name: V4 Pinned Laya Noul Veto

on:
  push:
    branches:
      - "research/v4-laya-noul-veto"
    paths:
      - ".github/workflows/research-v4-laya-noul-veto.yml"
      - "benchmarks/operation-routing-v4-laya-noul-veto.json"
      - "scripts/analyze_laya_noul_veto_v4.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "scripts/benchmark_decision_routing.py"
      - "benchmarks/bge_m3_frozen_candidate.py"
      - "tests/test_laya_noul_veto_v4.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"
  LAYA_HUB_REVISION: "458d7563c5cab85ff9f7f6e06cf2dd166fb697e2"
  USE_TF: "0"

concurrency:
  group: v4-laya-noul-veto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate pinned Laya noul contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-laya-noul-veto.json >/dev/null
          ruff check scripts/analyze_laya_noul_veto_v4.py tests/test_laya_noul_veto_v4.py
          pytest -q tests/test_laya_noul_veto_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "sentence-transformers>=3,<6" "laya==0.3.11"
      - run: pip install -e ".[dev]"

      - name: Materialize exact Laya snapshot
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          path = snapshot_download(
              repo_id="convaiinnovations/laya",
              revision=os.environ["LAYA_HUB_REVISION"],
              local_dir="/tmp/laya-pinned",
              allow_patterns=[
                  "rl_agent_config.json",
                  "model.safetensors",
                  "tokenizer/*",
                  "encoder/*",
                  "multilingual/rl_agent_config.json",
                  "multilingual/model.safetensors",
                  "multilingual/tokenizer/*",
                  "multilingual/encoder/*",
              ],
          )
          print(path)
          PY
          test -f /tmp/laya-pinned/rl_agent_config.json
          test -f /tmp/laya-pinned/model.safetensors
          test -f /tmp/laya-pinned/multilingual/rl_agent_config.json
          test -f /tmp/laya-pinned/multilingual/model.safetensors

      - name: Generate immutable v4 tuning DEV
        run: |
          OUT="artifacts/v4-laya-noul-veto"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out "${OUT}/corpus.json" \
            --manifest "${OUT}/corpus-manifest.json"

      - name: Verify corpus identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/v4-laya-noul-veto/corpus-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          actual = manifest.get("corpus_sha256")
          expected = os.environ["V4_DEV_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"corpus SHA mismatch: expected {expected}, got {actual}"
              )
          if manifest.get("case_count") != 1800:
              raise SystemExit(
                  f"unexpected case count: {manifest.get('case_count')}"
              )
          print(f"verified corpus sha256={actual}")
          PY

      - name: Audit tuning DEV
        run: |
          OUT="artifacts/v4-laya-noul-veto"
          python scripts/audit_operation_routing_corpus.py \
            --corpus "${OUT}/corpus.json" \
            --out "${OUT}/corpus-audit.json" \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50

      - name: Run pinned Laya noul veto
        run: |
          OUT="artifacts/v4-laya-noul-veto"
          python scripts/analyze_laya_noul_veto_v4.py \
            --corpus "${OUT}/corpus.json" \
            --snapshot-dir /tmp/laya-pinned \
            --out "${OUT}/analysis.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-laya-noul-veto-${{ github.run_id }}
          path: |
            artifacts/v4-laya-noul-veto/analysis.json
            artifacts/v4-laya-noul-veto/corpus-manifest.json
            artifacts/v4-laya-noul-veto/corpus-audit.json
            benchmarks/operation-routing-v4-laya-noul-veto.json
          if-no-files-found: error
          retention-days: 30
