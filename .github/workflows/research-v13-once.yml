name: V13 Blind Final One Shot

on:
  push:
    branches:
      - research/v13-blind-final
    paths:
      - ".github/workflows/research-v13-once.yml"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"

jobs:
  blind-final:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"

      - name: Verify frozen candidate state
        run: |
          pytest -q tests/test_operation_final_freeze.py tests/test_operation_contrastive_protocol.py

      - name: Generate sealed v13 corpus
        run: |
          mkdir -p /tmp/schemarouter-v13 artifacts/v13-blind-final
          python scripts/generate_decision_routing_v13.py \
            --seed "${GITHUB_RUN_ID}" \
            --out /tmp/schemarouter-v13/corpus.json \
            --manifest /tmp/schemarouter-v13/generation.json \
            --source-revision "${GITHUB_SHA}" \
            --candidate-freeze-revision "14e1977011c5b926476731736f7a4a9e1876367a"

      - name: Score frozen candidate on sealed v13 corpus
        run: |
          python scripts/benchmark_decision_routing.py \
            --corpus /tmp/schemarouter-v13/corpus.json \
            --split test \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/v13-blind-final/report.json \
            --csv-out artifacts/v13-blind-final/rows.csv \
            --html-out artifacts/v13-blind-final/report.html

      - name: Seal evaluated evidence
        run: |
          cp /tmp/schemarouter-v13/corpus.json artifacts/v13-blind-final/corpus.json
          cp /tmp/schemarouter-v13/generation.json artifacts/v13-blind-final/generation.json
          (
            cd artifacts/v13-blind-final
            sha256sum corpus.json generation.json report.json rows.csv report.html > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v13-blind-final-${{ github.run_id }}
          path: artifacts/v13-blind-final/
          if-no-files-found: error
          retention-days: 30
