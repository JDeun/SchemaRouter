name: Research 0.14 Structural Fixed3 V4 Confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - "research/0.14-structural-fixed3-v4-run"
    paths:
      - ".github/structural-fixed3-v4-trigger.json"

permissions:
  contents: read

concurrency:
  group: research-0.14-structural-fixed3-v4-confirmation
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  TOKENIZER_MODEL: "HuggingFaceTB/SmolLM3-3B"
  TOKENIZER_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "jinja2==3.1.6"
      - run: pip install -e ".[dev]"
      - id: tokenizer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: "adaptive-smollm3-tokenizer-a07cc9a04f16550a088caea529712d1d335b0ac1"
      - name: Populate exact tokenizer revision on cache miss
        if: steps.tokenizer-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["TOKENIZER_MODEL"],
              revision=os.environ["TOKENIZER_REVISION"],
              allow_patterns=[
                  "config.json",
                  "tokenizer*",
                  "special_tokens_map.json",
                  "*.jinja",
                  "*.model",
              ],
          )
          PY
      - name: Verify one-shot authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          trigger = json.loads(
              Path(".github/structural-fixed3-v4-trigger.json")
              .read_text(encoding="utf-8")
          )
          assert trigger["issue"] == 430
          assert trigger["experiment"] == "structural-fixed-depth-k3-v4"
          assert trigger["surface"] == "fresh_confirmation"
          assert trigger["candidate"] == "STRUCT-FIXED-3"
          assert trigger["confirmation_attempt"] == 1
          assert trigger["tuning_allowed_after_scoring"] is False
          assert trigger["b2_outcomes_used"] is False
          assert trigger["product_default_changed"] is False
          PY
      - name: Verify fixed3 confirmation contracts
        run: |
          pytest -q tests/test_agent_utility_structural_fixed3_confirmation.py
      - name: Freeze fresh confirmation before scoring
        run: |
          mkdir -p artifacts/structural-fixed3-v4
          python scripts/generate_agent_utility_v5_structural_fixed3_confirmation.py \
            --out-dir artifacts/structural-fixed3-v4/freeze
      - name: Verify frozen independence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path(
                  "artifacts/structural-fixed3-v4/freeze/"
                  "freeze-manifest.json"
              ).read_text(encoding="utf-8")
          )
          assert manifest["status"] == "frozen_before_scoring"
          assert manifest["semantic_task_count"] == 240
          assert manifest["cell_count"] == 48
          assert manifest[
              "exact_normalized_adaptive_dev_query_overlap_count"
          ] == 0
          assert manifest[
              "exact_normalized_structural_v2_confirmation_query_overlap_count"
          ] == 0
          assert manifest[
              "confirmation_rows_inspected_before_freeze"
          ] is False
          assert set(manifest["catalogs"]) == {"100", "250", "500"}
          assert all(
              item["shared_prior_routes_are_canonical_only"] is True
              for item in manifest["catalogs"].values()
          )
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Score fixed Top-3 and Top-5 once
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python scripts/evaluate_agent_utility_v5_structural_fixed3_confirmation.py \
            --freeze-dir artifacts/structural-fixed3-v4/freeze \
            --out artifacts/structural-fixed3-v4/result.json \
            --local-files-only
      - name: Verify result boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/structural-fixed3-v4/result.json")
              .read_text(encoding="utf-8")
          )
          assert result["surface"] == "fresh_confirmation"
          assert result["row_count"] == 720
          assert result["candidate"]["k"] == 3
          assert result["control"]["k"] == 5
          assert result["confirmation_surface_tuning_used"] is False
          assert result["b2_outcomes_used"] is False
          assert result["product_default_changed"] is False
          print(
              json.dumps(
                  {
                      "confirmation_passed": result[
                          "confirmation_passed"
                      ],
                      "gates": result["gates"],
                      "candidate_per_catalog": result[
                          "candidate"
                      ]["per_catalog"],
                      "candidate_mean_schema_tokens": result[
                          "candidate"
                      ]["all_row_schema_tokens"]["mean"],
                      "control_mean_schema_tokens": result[
                          "control"
                      ]["all_row_schema_tokens"]["mean"],
                  },
                  sort_keys=True,
              )
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "structural-fixed3-v4-${{ github.run_id }}"
          path: artifacts/structural-fixed3-v4/
          if-no-files-found: warn
          retention-days: 30
