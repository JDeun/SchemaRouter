name: V4 Kev 0.8B System One

on:
  push:
    branches:
      - "research/v4-kev-08b-system-one"
    paths:
      - ".github/workflows/research-v4-kev-08b-system-one.yml"
      - "benchmarks/operation-routing-v4-kev-08b-system-one.json"
      - "scripts/analyze_kev_system_one_v4.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "scripts/benchmark_decision_routing.py"
      - "tests/test_kev_system_one_v4.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"
  KEV_SOURCE_REVISION: "d32a973cc2375f1c76e898cbf6e759c4499042de"
  KEV_MODEL_RUN: "jaredpalmer/kev-0.8b@9a45d25eb2ab761841196625383fa1dff0e56c1e"
  KEV_DTYPE: "fp32"

concurrency:
  group: v4-kev-08b-system-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate Kev experiment contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-kev-08b-system-one.json >/dev/null
          ruff check scripts/analyze_kev_system_one_v4.py tests/test_kev_system_one_v4.py
          pytest -q tests/test_kev_system_one_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install pinned Kev runtime
        run: |
          git clone --filter=blob:none https://github.com/jaredpalmer/kev.git /tmp/kev
          git -C /tmp/kev checkout "${KEV_SOURCE_REVISION}"
          pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -e "/tmp/kev[serve]"
          pip install "typesafe-sdk==0.7.2"
          pip install -e ".[dev]"
          test "$(git -C /tmp/kev rev-parse HEAD)" = "${KEV_SOURCE_REVISION}"

      - name: Start pinned Kev server
        run: |
          START_NS="$(date +%s%N)"
          python -m kev.serve \
            --run "${KEV_MODEL_RUN}" \
            --port 8009 \
            > /tmp/kev-server.log 2>&1 &
          echo "$!" > /tmp/kev-server.pid

          READY=0
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8009/v1/models >/dev/null; then
              READY=1
              break
            fi
            sleep 10
          done
          if [ "${READY}" -ne 1 ]; then
            cat /tmp/kev-server.log
            exit 1
          fi

          END_NS="$(date +%s%N)"
          LOAD_MS="$(( (END_NS - START_NS) / 1000000 ))"
          echo "KEV_SERVER_LOAD_MS=${LOAD_MS}" >> "${GITHUB_ENV}"
          echo "Kev server ready in ${LOAD_MS} ms"

      - name: Generate immutable v4 tuning DEV
        run: |
          OUT="artifacts/v4-kev-08b-system-one"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out "${OUT}/corpus.json" \
            --manifest "${OUT}/corpus-manifest.json"

      - name: Verify corpus identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/v4-kev-08b-system-one/corpus-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          actual = manifest.get("corpus_sha256")
          expected = os.environ["V4_DEV_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"corpus SHA mismatch: expected {expected}, got {actual}"
              )
          if manifest.get("case_count") != 1800:
              raise SystemExit(
                  f"unexpected case count: {manifest.get('case_count')}"
              )
          print(f"verified corpus sha256={actual}")
          PY

      - name: Audit tuning DEV
        run: |
          OUT="artifacts/v4-kev-08b-system-one"
          python scripts/audit_operation_routing_corpus.py \
            --corpus "${OUT}/corpus.json" \
            --out "${OUT}/corpus-audit.json" \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50

      - name: Run Kev choice+noul diagnostic
        run: |
          OUT="artifacts/v4-kev-08b-system-one"
          python scripts/analyze_kev_system_one_v4.py \
            --corpus "${OUT}/corpus.json" \
            --out "${OUT}/analysis.json" \
            --base-url http://127.0.0.1:8009 \
            --api-key local \
            --model kev-latest

      - name: Stop Kev server
        if: always()
        run: |
          if [ -f /tmp/kev-server.pid ]; then
            kill "$(cat /tmp/kev-server.pid)" || true
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-kev-08b-system-one-${{ github.run_id }}
          path: |
            artifacts/v4-kev-08b-system-one/analysis.json
            artifacts/v4-kev-08b-system-one/corpus-manifest.json
            artifacts/v4-kev-08b-system-one/corpus-audit.json
            benchmarks/operation-routing-v4-kev-08b-system-one.json
            /tmp/kev-server.log
          if-no-files-found: warn
          retention-days: 30
