name: V4 Operation Surface Diagnostic

on:
  push:
    branches:
      - "research/v4-operation-surface-diagnostic"
    paths:
      - ".github/workflows/research-v4-operation-surface-diagnostic.yml"
      - "benchmarks/operation-routing-v4-operation-surface-diagnostic.json"
      - "scripts/benchmark_decision_routing.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "src/schemarouter/planner.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: v4-operation-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate selector surface
        run: |
          python -m py_compile scripts/benchmark_decision_routing.py src/schemarouter/planner.py
          ruff check scripts/benchmark_decision_routing.py src/schemarouter/planner.py
          pytest -q tests/test_planner.py

  diagnostic:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate identical v4 development corpus
        run: |
          mkdir -p artifacts/v4-operation-surface
          python scripts/generate_decision_routing_quality_v4.py --seed "${V4_DEV_SEED}" --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" --out artifacts/v4-operation-surface/corpus.json --manifest artifacts/v4-operation-surface/corpus-manifest.json
      - name: Audit corpus before model scoring
        run: |
          python scripts/audit_operation_routing_corpus.py --corpus artifacts/v4-operation-surface/corpus.json --out artifacts/v4-operation-surface/corpus-audit.json --near-duplicate-threshold 0.80 --max-duplicate-examples 50
      - name: Run intentionally ungated operation-fit score surface
        run: |
          CANDIDATE="keyword+semantic-recall+operation-fit+accepted-selector"
          python scripts/benchmark_decision_routing.py --corpus artifacts/v4-operation-surface/corpus.json --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed --candidate-recall-limit 2 --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs --operation-fit-min-score 0.0 --operation-fit-min-margin 0.0 --operation-fit-select-accepted --counterbalanced --warmup-cases 24 --planner-name "${CANDIDATE}" --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 ungated operation diagnostic" --json-out artifacts/v4-operation-surface/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-routing-v4-operation-surface-${{ github.run_id }}
          path: |
            artifacts/v4-operation-surface/report.json
            artifacts/v4-operation-surface/corpus-manifest.json
            artifacts/v4-operation-surface/corpus-audit.json
          if-no-files-found: error
          retention-days: 30
