name: V4 Lightweight Negative + GTE Executable

on:
  push:
    branches:
      - "research/v4-lightweight-negative-gte-executable"
    paths:
      - ".github/workflows/research-v4-lightweight-negative-gte-executable.yml"
      - "benchmarks/operation-routing-v4-lightweight-negative-gte-executable.json"
      - "scripts/analyze_lightweight_negative_gte_executable_v4.py"
      - "tests/test_lightweight_negative_gte_executable_v4.py"
      - "benchmarks/bge_m3_frozen_candidate.py"
      - "scripts/analyze_embedding_backbone_screen_v4.py"
      - "scripts/analyze_dual_view_embedding_v4.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"
  REFERENCE_RUN_ID: "36379888054"
  REFERENCE_ARTIFACT_ID: "10951119927"
  REFERENCE_ARTIFACT_SHA256: "1e86c0ebd881ff98f73d30d65ea618ff4525ead164f7f8a0b04c4ccf98190303"

concurrency:
  group: v4-lightweight-negative-gte-executable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate executable candidate contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-lightweight-negative-gte-executable.json >/dev/null
          ruff check scripts/analyze_lightweight_negative_gte_executable_v4.py tests/test_lightweight_negative_gte_executable_v4.py
          pytest -q tests/test_lightweight_negative_gte_executable_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"

      - name: Download and validate frozen offline reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/reference
          python - <<'PY'
          import json
          import os
          import urllib.request

          artifact_id = int(os.environ["REFERENCE_ARTIFACT_ID"])
          run_id = int(os.environ["REFERENCE_RUN_ID"])
          expected_digest = "sha256:" + os.environ["REFERENCE_ARTIFACT_SHA256"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              data = json.load(response)
          if data.get("expired"):
              raise SystemExit("offline reference artifact is expired")
          if int(data["workflow_run"]["id"]) != run_id:
              raise SystemExit("offline reference workflow mismatch")
          if data.get("digest") != expected_digest:
              raise SystemExit(
                  f"offline reference digest mismatch: {data.get('digest')}"
              )
          print(
              f"validated reference artifact={artifact_id} "
              f"run={run_id} digest={expected_digest}"
          )
          PY
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip"             -o /tmp/reference.zip
          unzip -q /tmp/reference.zip -d /tmp/reference
          REFERENCE_ANALYSIS="$(find /tmp/reference -type f -name analysis.json -print -quit)"
          test -n "${REFERENCE_ANALYSIS}"
          echo "REFERENCE_ANALYSIS=${REFERENCE_ANALYSIS}" >> "${GITHUB_ENV}"

      - name: Generate canonical development corpus
        run: |
          OUT="artifacts/v4-lightweight-negative-gte-executable"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py             --seed "${V4_DEV_SEED}"             --source-revision "${SCHEMAROUTER_SOURCE_REVISION}"             --out "${OUT}/corpus.json"             --manifest "${OUT}/corpus-manifest.json"

      - name: Verify and audit corpus
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              "artifacts/v4-lightweight-negative-gte-executable/corpus-manifest.json"
          )
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("corpus_sha256") != os.environ["V4_DEV_SHA256"]:
              raise SystemExit("canonical DEV corpus SHA mismatch")
          if manifest.get("case_count") != 1800:
              raise SystemExit("unexpected DEV case count")
          print(f"verified corpus sha256={manifest['corpus_sha256']}")
          PY
          python scripts/audit_operation_routing_corpus.py             --corpus artifacts/v4-lightweight-negative-gte-executable/corpus.json             --out artifacts/v4-lightweight-negative-gte-executable/corpus-audit.json             --near-duplicate-threshold 0.80             --max-duplicate-examples 50

      - name: Run executable lightweight candidate
        run: |
          python scripts/analyze_lightweight_negative_gte_executable_v4.py             --corpus artifacts/v4-lightweight-negative-gte-executable/corpus.json             --reference-analysis "${REFERENCE_ANALYSIS}"             --out artifacts/v4-lightweight-negative-gte-executable/analysis.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-lightweight-negative-gte-executable-${{ github.run_id }}
          path: |
            artifacts/v4-lightweight-negative-gte-executable/analysis.json
            artifacts/v4-lightweight-negative-gte-executable/corpus-manifest.json
            artifacts/v4-lightweight-negative-gte-executable/corpus-audit.json
            benchmarks/operation-routing-v4-lightweight-negative-gte-executable.json
          if-no-files-found: warn
          retention-days: 30
