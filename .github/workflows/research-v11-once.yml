name: Consume V11 Holdout Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/research-v11-once.yml"

permissions:
  contents: read

concurrency:
  group: consume-v11-holdout-once
  cancel-in-progress: false

jobs:
  frozen-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Consume frozen v11 operation-generalization holdout
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
        run: |
          mkdir -p artifacts/operation-fit/heldout-v11
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v11-operation-generalization-holdout.json \
            --split test \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_reranker:score_pairs \
            --operation-fit-min-score 0.01 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/operation-fit/heldout-v11/report.json \
            --csv-out artifacts/operation-fit/heldout-v11/rows.csv \
            --html-out artifacts/operation-fit/heldout-v11/report.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-operation-fit-v11-heldout-${{ github.run_id }}
          path: artifacts/operation-fit/heldout-v11/
          if-no-files-found: error
          retention-days: 30
