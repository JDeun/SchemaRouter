name: Prospective No-Match Audit (Synthetic Only)

on:
  pull_request:
    paths:
      - ".github/workflows/prospective-no-match-audit.yml"
      - "scripts/audit_prospective_no_match.py"
      - "tests/test_audit_prospective_no_match.py"
      - "research/prospective-open-set-evaluation.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install local package
        run: python -m pip install -e ".[dev]"
      - name: Ruff and synthetic unscored evaluation
        run: |
          ruff check scripts/audit_prospective_no_match.py \
            tests/test_audit_prospective_no_match.py
          python -m pytest -q tests/test_audit_prospective_no_match.py
