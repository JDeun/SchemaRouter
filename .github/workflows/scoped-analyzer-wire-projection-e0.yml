name: Scoped Analyzer Wire Projection E0

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "tests/test_scoped_analyzer_wire_projection.py"
      - ".github/workflows/scoped-analyzer-wire-projection-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-wire-contract-e0:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify private wire selector absent from scoped analyzer E0
        run: |
          python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1" "pyright>=1.1,<2"
          ruff check src/schemarouter/runtime.py tests/test_scoped_analyzer_wire_projection.py
          python -m pytest -q tests/test_scoped_analyzer_wire_projection.py tests/test_server_projection.py tests/test_scoped_tool_endpoint_descriptions.py tests/test_scoped_visible_field_metadata.py tests/test_scoped_input_schema_metadata.py tests/test_host_field_contract.py tests/test_data_scope_authorization.py
          pyright src/schemarouter/runtime.py
      - name: Honest evidence label
        if: success()
        run: |
          echo "E0 synthetic scoped analyzer wire-selector metadata canary. Original trusted source-side projection remains. Not broad noninterference, model E2, or deployment authorization." >> "$GITHUB_STEP_SUMMARY"
