name: Research 0.14 Structural K3 Agent Utility

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Research 0.14 B2 SmolLM3 Full"
    types:
      - completed
  push:
    branches:
      - "research/0.14-structural-k3-agent-run"
    paths:
      - ".github/structural-k3-agent-trigger.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: research-0.14-structural-k3-agent
  cancel-in-progress: true

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/src"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_CACHE_KEY: "b2-smollm3-arm64-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"
  B2_ATTN_IMPLEMENTATION: "sdpa"
  B2_PROGRESS_TRACE: "1"
  CANONICAL_B2_RUN: "36642658406"
  K3_IMPLEMENTATION_SHA: "8e92f69f0d9cd05336d07244af6b2955a7c29ebe"

jobs:
  authorize:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.id == 36642658406 &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: "${{ steps.plan.outputs.matrix }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ env.K3_IMPLEMENTATION_SHA }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Require frozen preregistration and terminal canonical B2
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPOSITORY: "${{ github.repository }}"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          prereg = json.loads(
              Path(
                  "benchmarks/"
                  "agent-utility-v5-structural-fixed3-agent-preregistration.json"
              ).read_text(encoding="utf-8")
          )
          assert prereg["experiment"] == "structural-fixed3-agent-utility-v5"
          assert prereg["independence"]["canonical_b2_run"] == 36642658406
          assert prereg["independence"]["b2_terminal_required_before_launch"] is True
          assert os.environ["K3_IMPLEMENTATION_SHA"] == "8e92f69f0d9cd05336d07244af6b2955a7c29ebe"
          assert prereg["frozen_agent_surface"]["expected_episodes"] == 184
          assert prereg["frozen_agent_surface"]["conditions"] == [
              "STRUCT-FIXED-3",
              "STRUCT-FIXED-5",
          ]

          url = (
              "https://api.github.com/repos/"
              + os.environ["GH_REPOSITORY"]
              + "/actions/runs/"
              + os.environ["CANONICAL_B2_RUN"]
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              run = json.load(response)
          assert run["status"] == "completed", (
              "canonical B2 must be terminal before launch; "
              f"current status={run['status']}"
          )
          assert run["conclusion"] == "success", (
              "canonical B2 must complete successfully before launch; "
              f"conclusion={run['conclusion']}"
          )
          print(
              "canonical B2 successful terminal status verified; "
              "outcomes not inspected"
          )
          PY
      - name: Verify frozen structural agent harness
        run: |
          python -m pytest -q tests/test_structural_fixed3_agent_utility.py
      - id: plan
        name: Export exact 92-job matrix
        run: |
          python - <<'PY'
          import json
          import os

          from benchmarks.agent_utility_v1_catalog import CATALOG_SIZES, TASKS

          include = []
          for catalog_size in CATALOG_SIZES:
              for task in TASKS:
                  include.append(
                      {
                          "job_id": f"c{catalog_size}-{task.task_id}",
                          "catalog_size": catalog_size,
                          "task_id": task.task_id,
                          "expected_episodes": 2,
                      }
                  )
          assert len(include) == 92
          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write(
                  "matrix="
                  + json.dumps(
                      {"include": include},
                      separators=(",", ":"),
                  )
                  + "\n"
              )
          PY

  model-cache:
    needs: authorize
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ env.K3_IMPLEMENTATION_SHA }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - id: hf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Populate exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
          )
          PY
      - name: Verify exact cached revision is loadable offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python - <<'PY'
          import os
          from transformers import AutoConfig, AutoTokenizer

          AutoConfig.from_pretrained(
              os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
              local_files_only=True,
              trust_remote_code=False,
          )
          AutoTokenizer.from_pretrained(
              os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
              local_files_only=True,
              trust_remote_code=False,
          )
          print("exact SmolLM3 ARM64 cache verified")
          PY

  evaluate:
    needs:
      - authorize
      - model-cache
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: "${{ fromJSON(needs.authorize.outputs.matrix) }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ env.K3_IMPLEMENTATION_SHA }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
          fail-on-cache-miss: true
      - name: Verify exact ARM64 SDPA runtime
        run: |
          python - <<'PY'
          import os
          import platform
          import torch
          import transformers

          assert platform.python_version() == "3.12.14"
          assert platform.machine() in {"aarch64", "arm64"}
          assert os.environ["B2_ATTN_IMPLEMENTATION"] == "sdpa"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          PY
      - name: Evaluate frozen structural K3/K5 pair
        run: |
          mkdir -p artifacts/structural-k3-agent
          /usr/bin/time -v python -u             scripts/evaluate_structural_fixed3_agent_utility.py               --catalog-sizes "${{ matrix.catalog_size }}"               --task-ids "${{ matrix.task_id }}"               --out "artifacts/structural-k3-agent/${{ matrix.job_id }}.json"
          python - <<'PY'
          import json
          from pathlib import Path

          path = next(
              Path("artifacts/structural-k3-agent").glob("*.json")
          )
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["model"]["attention_implementation"] == "sdpa"
          assert len(data["rows"]) == 2
          assert {row["condition"] for row in data["rows"]} == {
              "STRUCT-FIXED-3",
              "STRUCT-FIXED-5",
          }
          assert all(row["structural_retrieval"] for row in data["rows"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "structural-k3-agent-${{ matrix.job_id }}-${{ github.run_id }}"
          path: artifacts/structural-k3-agent/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: "${{ success() }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ env.K3_IMPLEMENTATION_SHA }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          pattern: "structural-k3-agent-*-${{ github.run_id }}"
          path: artifacts/structural-k3-agent-shards
      - name: Aggregate exact 184 paired episodes
        run: |
          python scripts/aggregate_structural_fixed3_agent_utility.py             --input-dir artifacts/structural-k3-agent-shards             --out artifacts/structural-k3-agent-canonical.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/structural-k3-agent-canonical.json")
              .read_text(encoding="utf-8")
          )
          assert data["episode_count"] == 184
          assert data["expected_episode_count"] == 184
          assert data["unique_semantic_tasks"] == 23
          assert data["conditions"] == [
              "STRUCT-FIXED-3",
              "STRUCT-FIXED-5",
          ]
          print(json.dumps(data["overall"], sort_keys=True))
          print(
              json.dumps(
                  data["paired_task_pass_delta_k3_minus_k5"],
                  sort_keys=True,
              )
          )
          print(json.dumps(data["primary_gate"], sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "structural-k3-agent-canonical-${{ github.run_id }}"
          path: |
            artifacts/structural-k3-agent-canonical.json
            benchmarks/agent-utility-v5-structural-fixed3-agent-preregistration.json
          if-no-files-found: error
          retention-days: 30
