name: Research Indexed Direct E5 CPU Paired DEV

on:
  pull_request:
    paths:
      - "scripts/research_indexed_direct_e5_paired_dev.py"
      - "scripts/research_indexed_decision_backend_ranker_e0.py"
      - "tests/test_research_indexed_direct_e5_paired_dev.py"
      - "tests/test_research_indexed_decision_backend_ranker_e0.py"
      - "src/schemarouter/native_semantic_index.py"
      - ".github/workflows/research-indexed-direct-e5-cpu-paired-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-indexed-direct-e5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-model-paired-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install indexed native contract dependencies
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1"
      - name: Qualify original source and scorer-only baseline
        run: |
          ruff check scripts/research_indexed_direct_e5_paired_dev.py tests/test_research_indexed_direct_e5_paired_dev.py
          python -m pytest -q tests/test_research_indexed_direct_e5_paired_dev.py tests/test_research_indexed_decision_backend_ranker_e0.py
          python -m scripts.research_indexed_direct_e5_paired_dev --mode validate --out artifacts/indexed-direct-e5/no-model.json

  pinned-model-paired-cpu-dev:
    needs: no-model-paired-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install actual pinned-model CPU dependencies
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Execute actual pinned E5 on source-scoped 30-query DEV cohort
        run: |
          python -m scripts.research_indexed_direct_e5_paired_dev \
            --mode real-e5-cpu --out artifacts/indexed-direct-e5/model-paired.json
      - name: Check model identity, paired cohorts, and nonproduction evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/indexed-direct-e5/model-paired.json")
              .read_text(encoding="utf-8")
          )
          model = report["model_runtime"]
          assert report["evidence_tier"] == "REAL_PINNED_E5_DIRECT_INDEX_PUBLIC_SYNTHETIC_DEV_ONLY"
          assert report["real_model_routing_measured"] is True
          assert model["model_id"] == "intfloat/multilingual-e5-small"
          assert model["model_revision"] == "fd1525a9fd15316a2d503bf26ab031a61d056e98"
          assert model["device"] == "cpu"
          assert report["independent_publisher_gold"] is False
          assert report["agent_task_success_measured"] is False
          assert report["calibrated_no_fit"] is False
          assert report["product_default_promoted"] is False
          assert report["supported_cases"] == 27
          assert report["ood_cases"] == 3
          assert report["eligible_complete_candidates"] == 24
          assert report["k"] == 5
          assert len(report["input_roster_sha256"]) == 64
          assert report["total_lookup_calls_measured"] == 30
          assert report["baseline_total_lookup_calls_measured"] == 30
          assert set(report["by_language"]) == {"en", "ko", "ja"}
          for language, row in report["by_language"].items():
              assert row["supported_count"] == 9, language
              assert row["ood_count"] == 1, language
              assert 0 <= row["hits_at_5"] <= 9, language
              assert 0 <= row["baseline_hits_at_5"] <= 9, language
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8",
          ) as output:
              output.write(
                  "## Indexed native direct K5 — real pinned E5 CPU DEV\\n\\n"
                  "Public synthetic gold only, no independent E2 or production SLO.\\n\\n"
                  f"- First-K Recall@5: {report['baseline_supported_recall_at_5']:.3f}\\n"
                  f"- Actual E5 Recall@5: {report['supported_recall_at_5']:.3f}\\n"
                  f"- E5 abstentions on supported: {report['supported_abstentions']}/27\\n"
                  f"- OOD nonempty: {report['ood_nonempty']}/3\\n"
                  f"- Baseline p95: {report['baseline_latency_ms_p95']:.2f} ms\\n"
                  f"- E5 p95: {report['latency_ms_p95']:.2f} ms\\n"
              )
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexed-direct-e5-cpu-paired-dev-${{ github.run_id }}
          path: artifacts/indexed-direct-e5/model-paired.json
          retention-days: 30
          if-no-files-found: error
