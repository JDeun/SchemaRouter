name: Public HTTP JSON and GraphQL Negative DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "src/schemarouter/executor.py"
      - "src/schemarouter/adapters/http_json.py"
      - "src/schemarouter/adapters/graphql.py"
      - "tests/test_public_http_graphql_execution_negative.py"
      - ".github/workflows/public-http-graphql-negative-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registered-http-and-graphql-failclosed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install local HTTP fixture test dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Verify registered HTTP and GraphQL zero-I/O denials and recovery
        run: |
          ruff check tests/test_public_http_graphql_execution_negative.py
          python -m pytest -q tests/test_public_http_graphql_execution_negative.py
