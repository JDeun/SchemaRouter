name: Native Heterogeneous Churn Phase DEV

on:
  pull_request:
    paths:
      - "scripts/benchmark_native_heterogeneous_churn_e0.py"
      - "tests/test_benchmark_native_heterogeneous_churn_e0.py"
      - ".github/workflows/native-heterogeneous-churn-phase-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-five-thousand-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install production package plus lightweight regression tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Lint churn measurement and test
        run: ruff check scripts/benchmark_native_heterogeneous_churn_e0.py tests/test_benchmark_native_heterogeneous_churn_e0.py
      - name: Profile exact 5,000 original routes and three source snapshots
        run: >-
          python scripts/benchmark_native_heterogeneous_churn_e0.py
          --registered-routes 5000
          --iterations 1 > native-heterogeneous-churn-phases-5000.json
      - name: Guard original proof invariants and report measured phases
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          report = json.loads(Path("native-heterogeneous-churn-phases-5000.json").read_text())
          phases = report["phase_wall_ms"]
          assert report["registered_source_routes"] == 5000
          assert report["paired_checks"] == 288
          assert report["source_snapshot_count"] == 3
          assert report["registry_version_count"] == 3
          assert report["stale_index_rejections"] == 2
          assert report["journal_and_full_rebuild_exact_parity"] is True
          assert report["source_authorization_oracle_checked"] is True
          assert report["independent_e2_qualified"] is False
          assert report["default_routing_changed"] is False
          assert len(phases["journal_refresh"]) == 2
          assert all(len(phases[name]) == 3 for name in (
              "fresh_rebuild", "scope_matrix", "health_checks"
          ))
          assert all(
              math.isfinite(value) and value >= 0
              for name, value in phases.items()
              for value in (value if isinstance(value, list) else [value])
          )
          print(json.dumps(phases, indent=2, sort_keys=True))
          with Path("native-heterogeneous-churn-phase-summary.md").open("w") as f:
              f.write("## 5,000-route E0 churn phase profiling (not an SLA)\n\n")
              f.write("| Phase | Observed seconds |\n| --- | ---: |\n")
              for name, value in phases.items():
                  elapsed = sum(value) if isinstance(value, list) else value
                  f.write(f"| {name} | {elapsed / 1000:.3f} |\n")
          PY
          cat native-heterogeneous-churn-phase-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact-head raw timing receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-heterogeneous-churn-phases-${{ github.run_id }}
          path: |
            native-heterogeneous-churn-phases-5000.json
            native-heterogeneous-churn-phase-summary.md
          if-no-files-found: warn
          retention-days: 14
