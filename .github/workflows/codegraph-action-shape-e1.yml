name: CodeGraph Private Action Shape E1 DEV

on:
  pull_request:
    paths:
      - "scripts/research_codegraph_action_shape_e1.py"
      - "scripts/research_codegraph_surgical_agent_e1.py"
      - "scripts/research_codegraph_local_multiroute_e1.py"
      - "tests/test_research_codegraph_action_shape_e1.py"
      - ".github/workflows/codegraph-action-shape-e1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-model-strict-action-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original schema tools and regression deps
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1"
      - name: Lint fixed diagnostics and modified research harnesses
        run: |
          ruff check scripts/research_codegraph_action_shape_e1.py scripts/research_codegraph_surgical_agent_e1.py scripts/research_codegraph_local_multiroute_e1.py tests/test_research_codegraph_action_shape_e1.py
      - name: Verify failing closed, scoped original executor and no private reflection
        run: |
          python -m pytest -q tests/test_research_codegraph_action_shape_e1.py tests/test_research_codegraph_local_multiroute_e1.py tests/test_research_codegraph_surgical_agent_e1.py
