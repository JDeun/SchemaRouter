name: Native Index Same-Callable Availability Recheck E0

on:
  pull_request:
    paths:
      - "src/schemarouter/native_graph_index.py"
      - "src/schemarouter/native_semantic_index.py"
      - "tests/test_native_graph_index.py"
      - "tests/test_native_semantic_index.py"
      - ".github/workflows/native-index-same-callable-availability-e0.yml"
      - "research/autoresearch/native-availability-same-callback-final-recheck-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-live-health-lookup-final-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install original package and test/static tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Strict source-owned G5 availability and posting safety
        run: |
          ruff check src/schemarouter/native_graph_index.py src/schemarouter/native_semantic_index.py tests/test_native_graph_index.py tests/test_native_semantic_index.py
          python -m pytest -q tests/test_native_graph_index.py tests/test_native_semantic_index.py
          pyright src/schemarouter/native_graph_index.py src/schemarouter/native_semantic_index.py
