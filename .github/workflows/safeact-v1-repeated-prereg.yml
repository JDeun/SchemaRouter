name: SafeAct V1 Repeated Preregistration Integrity (Unscored)

on:
  pull_request:
    paths:
      - ".github/workflows/safeact-v1-repeated-prereg.yml"
      - "scripts/check_safeact_v1_repeated_prereg.py"
      - "tests/test_check_safeact_v1_repeated_prereg.py"
      - "research/safeact-v1/repeated-prereg-validation.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeact-prereg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-prereg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout unscored preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install no-model test dependencies
        run: python -m pip install "pytest>=8.2,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Ruff scan
        run: |
          ruff check scripts/check_safeact_v1_repeated_prereg.py \
            tests/test_check_safeact_v1_repeated_prereg.py
      - name: Exercise synthetic 131-case paired schedule and blind review checks
        run: python -m pytest -q tests/test_check_safeact_v1_repeated_prereg.py
