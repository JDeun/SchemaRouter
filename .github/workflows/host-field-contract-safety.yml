name: Host Field Contract Safety CPU

on:
  pull_request:
    paths:
      - "src/schemarouter/host_field_contract.py"
      - "src/schemarouter/__init__.py"
      - "tests/test_host_field_contract.py"
      - "docs/host-verified-field-contract.md"
      - ".github/workflows/host-field-contract-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-field-contract-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install real product package and test runner
        run: |
          python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - name: Assert no-call/role/data-scope/truncation invariants
        run: |
          python -m pytest -q tests/test_host_field_contract.py
# No model, GPU, endpoint invocation, external service, agent or release.
