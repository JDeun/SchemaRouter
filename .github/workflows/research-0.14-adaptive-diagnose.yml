name: Research 0.14 Adaptive Retrieval Diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - "research/0.14-adaptive-diagnose-run"
    paths:
      - ".github/adaptive-diagnose-trigger.json"

permissions:
  contents: read

concurrency:
  group: research-0.14-adaptive-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify diagnosis tests
        run: |
          pytest -q tests/test_agent_utility_adaptive_retrieval_diagnosis.py
      - name: Diagnose frozen DEV retrieval misses
        run: |
          mkdir -p artifacts/adaptive-diagnosis
          python scripts/diagnose_agent_utility_v5_retrieval.py \
            --out artifacts/adaptive-diagnosis/result.json
      - name: Verify diagnostic-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/adaptive-diagnosis/result.json")
              .read_text(encoding="utf-8")
          )
          assert result["issue"] == 430
          assert result["surface"] == "development"
          assert result["diagnostic_only"] is True
          assert result["scorer_changed"] is False
          assert result["top_k"] == 10
          assert result["row_count"] == 540
          assert result["required_route_count"] > result["row_count"]
          assert set(result["per_catalog"]) == {"100", "250", "500"}
          print(
              json.dumps(
                  {
                      "required_route_recall_at_10": result[
                          "required_route_recall_at_10"
                      ],
                      "miss_classes": result["miss_classes"],
                      "per_catalog": result["per_catalog"],
                  },
                  sort_keys=True,
              )
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "adaptive-retrieval-diagnosis-${{ github.run_id }}"
          path: artifacts/adaptive-diagnosis/
          if-no-files-found: error
          retention-days: 30
