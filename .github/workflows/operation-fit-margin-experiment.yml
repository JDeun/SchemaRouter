name: Operation Fit Margin Experiment

on:
  pull_request:
    paths:
      - ".github/workflows/operation-fit-margin-experiment.yml"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: operation-fit-margin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  devcal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        operation_similarity: [0.20, 0.25, 0.30, 0.35, 0.40]
        operation_margin: [0.00, 0.01, 0.02, 0.03, 0.05]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Run v5 dev/cal operation-fit grid
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          OPERATION_SIMILARITY: ${{ matrix.operation_similarity }}
          OPERATION_MARGIN: ${{ matrix.operation_margin }}
        run: |
          SAFE_S="${OPERATION_SIMILARITY//./_}"
          SAFE_M="${OPERATION_MARGIN//./_}"
          ROOT="artifacts/operation-fit-margin/sim-${SAFE_S}-margin-${SAFE_M}"
          for SPLIT in dev calibration; do
            OUT="${ROOT}/${SPLIT}"
            mkdir -p "${OUT}"
            python scripts/benchmark_decision_routing.py \
              --corpus benchmarks/decision-routing-v5-operation-calibration.json \
              --split "${SPLIT}" \
              --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
              --candidate-recall-limit 2 \
              --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
              --candidate-fit-min-similarity 0.25 \
              --operation-fit-embedding-callable benchmarks.multilingual_embedder:embed \
              --operation-fit-min-similarity "${OPERATION_SIMILARITY}" \
              --operation-fit-min-margin "${OPERATION_MARGIN}" \
              --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
              --endpoint-disambiguation-min-margin 0.03 \
              --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
              --json-out "${OUT}/report.json" \
              --csv-out "${OUT}/rows.csv" \
              --html-out "${OUT}/report.html"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-fit-margin-s${{ matrix.operation_similarity }}-m${{ matrix.operation_margin }}-${{ github.run_id }}
          path: artifacts/operation-fit-margin/
          if-no-files-found: error
          retention-days: 30
