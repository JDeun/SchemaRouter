name: Research V5C Hierarchical Ontology DEV

on:
  push:
    branches:
      - "research/0.12-hierarchical-capability-ontology"
    paths:
      - ".github/workflows/research-v5c-hierarchical-ontology-dev.yml"
      - "scripts/evaluate_hierarchical_capability_ontology_v5c.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SOURCE: "9777e1c76df27bff38cb3060d672d4f8baf65334"
  DEV_SHA256: "3731ade0c1cfc69fbf234c00e9090a35b8fca5340af98077e1a18f98782d2a4a"
  CONFIRM_SHA256: "1e965111a7835af002b397d0be6b4776ea2a9295f417991f5b7733f79f23a24e"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify frozen ontology and corpus source
        run: |
          git diff --exit-code "${FROZEN_SOURCE}" --             benchmarks/operation-routing-v5c-hierarchical-ontology-preregistration.json             benchmarks/hierarchical_capability_ontology.py             benchmarks/operation_routing_v5c_catalog.py             scripts/generate_operation_routing_v5c.py             tests/test_hierarchical_capability_ontology.py             tests/test_operation_routing_v5c_protocol.py
      - name: Validate evaluator
        run: |
          ruff check scripts/evaluate_hierarchical_capability_ontology_v5c.py
          pytest -q             tests/test_hierarchical_capability_ontology.py             tests/test_operation_routing_v5c_protocol.py

  evaluate-development:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"

      - name: Recreate both frozen corpora
        run: |
          python scripts/generate_operation_routing_v5c.py             --out-dir artifacts/operation-routing-v5c

      - name: Verify both frozen identities before scoring
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/operation-routing-v5c")
          freeze = json.loads((root / "freeze-manifest.json").read_text())
          if freeze["development"]["corpus_sha256"] != os.environ["DEV_SHA256"]:
              raise SystemExit("DEV corpus identity drifted")
          if freeze["confirmation"]["corpus_sha256"] != os.environ["CONFIRM_SHA256"]:
              raise SystemExit("confirmation corpus identity drifted")
          if freeze["development"]["case_count"] != 564:
              raise SystemExit("unexpected DEV case count")
          if freeze["confirmation"]["case_count"] != 576:
              raise SystemExit("unexpected confirmation case count")
          print("both frozen corpus identities verified")
          PY

      - name: Score development only
        run: |
          python scripts/evaluate_hierarchical_capability_ontology_v5c.py             --development artifacts/operation-routing-v5c/development.json             --out artifacts/operation-routing-v5c/dev-analysis.json

      - name: Validate governance and authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/operation-routing-v5c/dev-analysis.json").read_text()
          )
          policy = data["policy"]
          if policy["confirmation_scored"]:
              raise SystemExit("confirmation was scored before DEV pass")
          if policy["prior_dev_used_for_tuning"]:
              raise SystemExit("prior DEV evidence leaked into candidate")
          if policy["route_specific_thresholds"]:
              raise SystemExit("route-specific threshold detected")
          if policy["learned_veto"]:
              raise SystemExit("learned veto detected")
          if policy["cross_tool_fallback"] or policy["pseudo_route"]:
              raise SystemExit("forbidden route authority detected")
          metrics = data["metrics"]
          if metrics["authority_violations"] != 0:
              raise SystemExit("authority violation")
          if metrics["execution_errors"] != 0:
              raise SystemExit("execution errors")
          print("development_pass=", data["surface_pass"])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operation-routing-v5c-dev-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v5c/dev-analysis.json
            artifacts/operation-routing-v5c/development-manifest.json
            artifacts/operation-routing-v5c/confirmation-manifest.json
            benchmarks/operation-routing-v5c-hierarchical-ontology-preregistration.json
          if-no-files-found: warn
          retention-days: 30
