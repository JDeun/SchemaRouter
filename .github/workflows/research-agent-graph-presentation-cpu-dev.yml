name: Graph presentation Qwen3 CPU DEV pilot
on:
  push:
    branches: [research/1897-agent-driven-ontology-poc]
    paths:
      - ".github/workflows/research-agent-graph-presentation-cpu-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-presentation-cpu-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  graph-presentation-dev:
    if: github.ref == 'refs/heads/research/1897-agent-driven-ontology-poc'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: research/agent-driven-ontology-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install isolated pinned research runtime
        run: |
          python -m pip install -r requirements-local-py313.txt
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.57.1" "huggingface-hub==0.36.0"
          python -m pip check
      - name: Validate parity and frozen rubric without model
        run: python -m unittest -v test_graph_views test_agent_probe
      - name: Check hosted runner resources and preserve environment
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          ram = int(next(x for x in Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemTotal:')).split()[1])
          assert ram >= 12000000 and shutil.disk_usage('.').free >= 7 * 1024**3
          PY
          mkdir -p "$RUNNER_TEMP/graph-pilot"
          python -m pip freeze > "$RUNNER_TEMP/graph-pilot/packages.txt"
      - name: Obtain exact public model snapshot
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from cpu_agent_probe import MODEL_ID, MODEL_REVISION
          from pathlib import Path
          import os
          p = Path(snapshot_download(repo_id=MODEL_ID, revision=MODEL_REVISION, allow_patterns=['*.json', '*.safetensors', '*.model', '*.jinja', 'tokenizer*', 'vocab*', 'merges*']))
          assert p.name == MODEL_REVISION
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'GRAPH_MODEL_SNAPSHOT={p}\n')
          PY
      - name: Run genuine model generations without network backend
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          python cpu_agent_probe.py --snapshot "$GRAPH_MODEL_SNAPSHOT" --shard "$SHARD" --out "$RUNNER_TEMP/graph-pilot/shard-$SHARD"
      - name: Preserve results including partial/failing episodes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: graph-presentation-qwen3-dev-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/graph-pilot/
          if-no-files-found: warn
          retention-days: 30
