name: Research impact candidate discovery
on:
  schedule:
    - cron: '20 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search public metadata
        run: python scripts/check_research_impact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-impact-candidates
          path: research-impact-candidates.json
          if-no-files-found: warn
