name: Research 0.14 Held-out Recovery Failure Forensics

on:
  workflow_run:
    workflows: ["Research 0.14 Held-out Shard Recovery"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Terminal or active research 0.14 pinned recovery run ID
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: research-014-recovery-forensics-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: "${{ github.repository == 'JDeun/SchemaRouter' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
      - name: Snapshot failed microshard job and runner state, never outcomes
        env:
          GH_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          RECOVERY_RUN_ID: "${{ github.event.workflow_run.id || inputs.run_id }}"
        run: |
          python -m scripts.research_014_recovery_forensics \
            --run-id "$RECOVERY_RUN_ID" \
            --out artifacts/recovery-forensics/diagnosis.json
      - name: Retain unscored, source-pinned failure diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "research-014-recovery-forensics-${{ github.run_id }}"
          path: artifacts/recovery-forensics/
          if-no-files-found: warn
          retention-days: 30
