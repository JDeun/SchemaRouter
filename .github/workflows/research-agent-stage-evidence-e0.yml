name: Sanitized Agent Stage Witnesses E0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_agent_stage_evidence_e0.py"
      - "scripts/research_agent_fixture_safety_strata_e0.py"
      - "scripts/agent_utility_generated_common.py"
      - "tests/test_research_agent_stage_evidence_e0.py"
      - "tests/test_research_agent_fixture_safety_strata_e0.py"
      - "tests/test_research_authorized_agent_tool_surface.py"
      - "research/autoresearch/agent-stage-evidence-e0.md"
      - "research/autoresearch/agent-final-observation-e0.md"
      - ".github/workflows/research-agent-stage-evidence-e0.yml"

permissions:
  contents: read

concurrency:
  group: stage-e0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-stage-redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install isolated Python quality tools
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Verify strict stage classification and artifact redaction
        run: |
          ruff check scripts/research_agent_stage_evidence_e0.py scripts/research_agent_fixture_safety_strata_e0.py scripts/agent_utility_generated_common.py tests/test_research_agent_stage_evidence_e0.py tests/test_research_agent_fixture_safety_strata_e0.py tests/test_research_authorized_agent_tool_surface.py
          python -m pytest -q tests/test_research_agent_stage_evidence_e0.py tests/test_research_agent_fixture_safety_strata_e0.py tests/test_research_authorized_agent_tool_surface.py
