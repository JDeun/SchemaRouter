name: Research 0.14 Corrective Shard Recovery

run-name: Corrective recovery parent=${{ inputs.parent_run_id }} shards=${{ inputs.shard_ids }}

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: Canonical corrective run whose successful shard artifacts are reused
        required: true
        type: string
      evidence_digest:
        description: Exact canonical B2 artifact digest
        required: true
        type: string
      source_sha:
        description: Exact frozen SchemaRouter source revision
        required: true
        type: string
      shard_ids:
        description: Comma-separated frozen shard IDs, for example c250-g10,c250-g17
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-0.14-corrective-recovery-${{ inputs.parent_run_id }}
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_CACHE_KEY: "b2-smollm3-arm64-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"
  B2_ATTN_IMPLEMENTATION: "sdpa"
  CANONICAL_B2_RUN: "36642658406"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: "${{ steps.matrix.outputs.matrix }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify recovery provenance
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPOSITORY: "${{ github.repository }}"
          PARENT_RUN_ID: "${{ inputs.parent_run_id }}"
          SOURCE_SHA: "${{ inputs.source_sha }}"
          EXPECTED_DIGEST: "${{ inputs.evidence_digest }}"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          base = "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"]
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)

          parent = get(base + "/actions/runs/" + os.environ["PARENT_RUN_ID"])
          assert parent["path"].endswith("research-0.14-corrective-reretrieval.yml")
          assert parent["head_sha"] == os.environ["SOURCE_SHA"]

          b2 = get(base + "/actions/runs/" + os.environ["CANONICAL_B2_RUN"])
          assert b2["status"] == "completed" and b2["conclusion"] == "success"
          artifacts = get(
              base + "/actions/runs/" + os.environ["CANONICAL_B2_RUN"]
              + "/artifacts?per_page=100"
          )["artifacts"]
          matches = [
              item for item in artifacts
              if item["name"].startswith("b2-smollm3-canonical-")
              and not item["expired"]
          ]
          assert len(matches) == 1
          assert matches[0]["digest"] == os.environ["EXPECTED_DIGEST"]
          print("parent run, source SHA, and canonical B2 digest verified")
          PY
      - name: Recreate exact frozen corrective corpus
        run: |
          mkdir -p artifacts/corrective
          python scripts/generate_agent_utility_v6_corrective_corpus.py \
            --source-revision "${{ inputs.source_sha }}" \
            --out artifacts/corrective/corrective-corpus.json
          python scripts/validate_agent_utility_v6_corrective_corpus.py \
            --corpus artifacts/corrective/corrective-corpus.json
      - id: matrix
        name: Select only requested frozen shards
        env:
          SHARD_IDS: "${{ inputs.shard_ids }}"
        run: |
          python scripts/select_corrective_recovery_shards.py \
            --corpus artifacts/corrective/corrective-corpus.json \
            --shard-ids "$SHARD_IDS" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "corrective-recovery-corpus-${{ github.run_id }}"
          path: artifacts/corrective/corrective-corpus.json
          if-no-files-found: error
          retention-days: 30

  recover:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: "${{ fromJSON(needs.prepare.outputs.matrix) }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .
      - uses: actions/cache@0057852bfaa89a56745b974a628896c90dbdf5c8093 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
          fail-on-cache-miss: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "corrective-recovery-corpus-${{ github.run_id }}"
          path: artifacts/corrective
      - name: Verify exact ARM64 SDPA runtime
        run: |
          python - <<'PY'
          import os, platform, torch, transformers
          assert platform.python_version() == "3.12.14"
          assert platform.machine() in {"aarch64", "arm64"}
          assert os.environ["B2_ATTN_IMPLEMENTATION"] == "sdpa"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          PY
      - name: Evaluate selected frozen corrective shard
        run: |
          mkdir -p artifacts/corrective-shard
          python -u scripts/evaluate_agent_utility_v6_corrective.py \
            --corpus artifacts/corrective/corrective-corpus.json \
            --catalog-size "${{ matrix.catalog_size }}" \
            --task-ids "${{ matrix.task_ids }}" \
            --out "artifacts/corrective-shard/${{ matrix.job_id }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "corrective-recovery-shard-${{ matrix.job_id }}-${{ github.run_id }}"
          path: artifacts/corrective-shard/
          if-no-files-found: warn
          retention-days: 30
