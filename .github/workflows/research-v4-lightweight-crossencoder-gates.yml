name: V4 Lightweight Cross-Encoder Gates

on:
  push:
    branches:
      - "research/v4-lightweight-crossencoder-gates"
    paths:
      - ".github/workflows/research-v4-lightweight-crossencoder-gates.yml"
      - "benchmarks/lightweight_cross_encoder.py"
      - "benchmarks/operation-routing-v4-lightweight-crossencoder-gates.json"
      - "tests/test_lightweight_cross_encoder.py"
      - "scripts/benchmark_decision_routing.py"
      - "scripts/analyze_operation_routing_v4_bounded_rerank.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "benchmarks/multilingual_embedder.py"
      - "src/schemarouter/planner.py"
      - "src/schemarouter/pairwise.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: v4-lightweight-crossencoder-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate preregistration and scorer contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-lightweight-crossencoder-gates.json >/dev/null
          ruff check benchmarks/lightweight_cross_encoder.py tests/test_lightweight_cross_encoder.py
          pytest -q tests/test_lightweight_cross_encoder.py tests/test_pairwise_decision_backend.py

  evaluate:
    needs: contracts
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: mmarco-minilm
            model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
          - id: gte-multilingual-base
            model: Alibaba-NLP/gte-multilingual-reranker-base
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6" "einops>=0.7"
      - run: pip install -e ".[dev]"
      - name: Generate frozen v4 development corpus
        run: |
          OUT="artifacts/v4-lightweight-crossencoder-${{ matrix.id }}"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out "${OUT}/corpus.json" \
            --manifest "${OUT}/corpus-manifest.json"
      - name: Audit corpus
        run: |
          OUT="artifacts/v4-lightweight-crossencoder-${{ matrix.id }}"
          python scripts/audit_operation_routing_corpus.py \
            --corpus "${OUT}/corpus.json" \
            --out "${OUT}/corpus-audit.json" \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50
      - name: Run raw width-2 winner diagnostic
        run: |
          OUT="artifacts/v4-lightweight-crossencoder-${{ matrix.id }}"
          python scripts/benchmark_decision_routing.py \
            --corpus "${OUT}/corpus.json" \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --operation-fit-pairwise-callable benchmarks.lightweight_cross_encoder:score_pairs \
            --operation-fit-min-score 0.0 \
            --operation-fit-min-margin 0.0 \
            --operation-fit-threshold-application rank_then_gate \
            --operation-fit-scope all_candidates \
            --operation-fit-select-accepted \
            --counterbalanced \
            --warmup-cases 24 \
            --planner-name "keyword+semantic-recall+operation-fit-all-candidates+accepted-selector" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU ${{ matrix.id }}" \
            --json-out "${OUT}/report.json"
      - name: Analyze winner-only route-local frontier
        run: |
          OUT="artifacts/v4-lightweight-crossencoder-${{ matrix.id }}"
          python scripts/analyze_operation_routing_v4_bounded_rerank.py \
            --report "${OUT}/report.json" \
            --out "${OUT}/analysis.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-lightweight-crossencoder-${{ matrix.id }}-${{ github.run_id }}
          path: |
            artifacts/v4-lightweight-crossencoder-${{ matrix.id }}/report.json
            artifacts/v4-lightweight-crossencoder-${{ matrix.id }}/analysis.json
            artifacts/v4-lightweight-crossencoder-${{ matrix.id }}/corpus-manifest.json
            artifacts/v4-lightweight-crossencoder-${{ matrix.id }}/corpus-audit.json
            benchmarks/operation-routing-v4-lightweight-crossencoder-gates.json
          if-no-files-found: error
          retention-days: 30
