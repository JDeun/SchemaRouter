name: Post-merge Qualification Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: post-merge-qualification-watchdog-${{ github.repository }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify recent main commits have exact-main qualification
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          LOOKBACK_COMMITS: "12"
          MISSING_GRACE_MINUTES: "20"
          STALE_RUN_MINUTES: "105"
          INITIAL_QUALIFICATION_SHA: "d3c4cb486c6556e50dee035ddd58b49ca66b4543"
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          lookback = int(os.environ["LOOKBACK_COMMITS"])
          missing_grace_minutes = int(os.environ["MISSING_GRACE_MINUTES"])
          stale_run_minutes = int(os.environ["STALE_RUN_MINUTES"])

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "schemarouter-post-merge-watchdog",
          }

          def get_json(path: str, params: dict[str, str | int]) -> dict | list:
              query = urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  f"{api}{path}?{query}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          # Follow only main's first-parent chain. The commits brought in as
          # the second parent of the initial integration merge were never
          # independently pushed to main and must not be treated as missing
          # post-merge qualification runs.
          baseline_sha = os.environ["INITIAL_QUALIFICATION_SHA"]
          main_ref = get_json(f"/repos/{repository}/git/ref/heads/main", {})
          cursor = main_ref["object"]["sha"]
          commits: list[dict] = []
          for _ in range(lookback):
              commit = get_json(f"/repos/{repository}/commits/{cursor}", {})
              commits.append(commit)
              if cursor == baseline_sha:
                  break
              parents = commit.get("parents", [])
              if not parents:
                  break
              cursor = parents[0]["sha"]
          runs_payload = get_json(
              f"/repos/{repository}/actions/workflows/post-merge-qualification.yml/runs",
              {"branch": "main", "event": "push", "per_page": 100},
          )
          runs = runs_payload.get("workflow_runs", [])
          now = datetime.now(timezone.utc)

          runs_by_sha: dict[str, list[dict]] = {}
          for run in runs:
              if run.get("name") != "Post-merge Qualification":
                  continue
              head_sha = run.get("head_sha")
              if isinstance(head_sha, str):
                  runs_by_sha.setdefault(head_sha, []).append(run)

          def latest_run(sha: str) -> dict | None:
              # A fresh dispatch gets a higher run ID; a rerun of the same
              # dispatch increments its attempt. Older successes must never
              # mask a newer failed qualification of the same source tree.
              return max(
                  runs_by_sha.get(sha, []),
                  key=lambda run: (
                      int(run.get("id") or 0), int(run.get("run_attempt") or 0)
                  ),
                  default=None,
              )

          # The first integration push was cancelled by its original 30-minute
          # limit. Its historical failure must remain visible, but a later
          # successful qualification of a first-parent descendant tests that
          # entire integrated tree under the corrected 90-minute limit.
          # Never excuse the cancellation while the latest main run is pending
          # or failed; never excuse an unrelated commit's failed run.
          newest_main_sha = commits[0]["sha"]
          newest_main_run = latest_run(newest_main_sha)
          newest_main_qualified = (
              newest_main_run is not None
              and newest_main_run.get("status") == "completed"
              and newest_main_run.get("conclusion") == "success"
          )

          report: list[dict[str, object]] = []
          failures: list[str] = []

          for commit in commits:
              sha = commit["sha"]
              committed_at_raw = commit["commit"]["committer"]["date"]
              committed_at = datetime.fromisoformat(
                  committed_at_raw.replace("Z", "+00:00")
              )
              age_minutes = (now - committed_at).total_seconds() / 60.0

              record: dict[str, object] = {
                  "sha": sha,
                  "committed_at": committed_at_raw,
                  "age_minutes": round(age_minutes, 2),
              }

              latest = latest_run(sha)
              if latest is None:
                  record["qualification"] = "within_grace"
                  if age_minutes >= missing_grace_minutes:
                      record["qualification"] = "missing"
                      failures.append(
                          f"{sha}: no Post-merge Qualification push run "
                          f"after {age_minutes:.1f} minutes"
                      )
                  report.append(record)
                  continue

              record.update(
                  {
                      "qualification": latest.get("status"),
                      "run_id": latest.get("id"),
                      "run_attempt": latest.get("run_attempt"),
                      "conclusion": latest.get("conclusion"),
                      "run_url": latest.get("html_url"),
                  }
              )

              if latest.get("status") == "completed":
                  if latest.get("conclusion") != "success":
                      if (
                          sha == baseline_sha
                          and sha != newest_main_sha
                          and latest.get("conclusion") == "cancelled"
                          and newest_main_qualified
                      ):
                          record["qualification"] = "superseded_by_successful_main"
                          record["superseded_by"] = newest_main_sha
                      else:
                          failures.append(
                              f"{sha}: qualification run {latest.get('id')} "
                              f"completed as {latest.get('conclusion')!r}"
                          )
              elif age_minutes >= stale_run_minutes:
                  failures.append(
                      f"{sha}: qualification run {latest.get('id')} is still "
                      f"{latest.get('status')!r} after {age_minutes:.1f} minutes"
                  )

              report.append(record)

          output = {
              "schema_version": 1,
              "repository": repository,
              "checked_at": now.isoformat(),
              "lookback_commits": lookback,
              "missing_grace_minutes": missing_grace_minutes,
              "stale_run_minutes": stale_run_minutes,
              "commits": report,
              "failures": failures,
          }

          artifact = Path("artifacts/post-merge-qualification-watchdog.json")
          artifact.parent.mkdir(parents=True, exist_ok=True)
          artifact.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(output, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(
                  "post-merge qualification watchdog detected failures:\n- "
                  + "\n- ".join(failures)
              )
          PY

      - name: Publish watchdog evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-merge-qualification-watchdog-${{ github.run_id }}
          path: artifacts/post-merge-qualification-watchdog.json
          if-no-files-found: error
          retention-days: 30
