name: Post-merge Qualification Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: post-merge-qualification-watchdog-${{ github.repository }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify recent main commits have exact-main qualification
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          LOOKBACK_COMMITS: "12"
          MISSING_GRACE_MINUTES: "20"
          STALE_RUN_MINUTES: "45"
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          lookback = int(os.environ["LOOKBACK_COMMITS"])
          missing_grace_minutes = int(os.environ["MISSING_GRACE_MINUTES"])
          stale_run_minutes = int(os.environ["STALE_RUN_MINUTES"])

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "schemarouter-post-merge-watchdog",
          }

          def get_json(path: str, params: dict[str, str | int]) -> dict | list:
              query = urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  f"{api}{path}?{query}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          commits = get_json(
              f"/repos/{repository}/commits",
              {"sha": "main", "per_page": lookback},
          )
          runs_payload = get_json(
              f"/repos/{repository}/actions/runs",
              {"branch": "main", "event": "push", "per_page": 100},
          )
          runs = runs_payload.get("workflow_runs", [])
          now = datetime.now(timezone.utc)

          runs_by_sha: dict[str, list[dict]] = {}
          for run in runs:
              if run.get("name") != "Post-merge Qualification":
                  continue
              head_sha = run.get("head_sha")
              if isinstance(head_sha, str):
                  runs_by_sha.setdefault(head_sha, []).append(run)

          report: list[dict[str, object]] = []
          failures: list[str] = []

          for commit in commits:
              sha = commit["sha"]
              committed_at_raw = commit["commit"]["committer"]["date"]
              committed_at = datetime.fromisoformat(
                  committed_at_raw.replace("Z", "+00:00")
              )
              age_minutes = (now - committed_at).total_seconds() / 60.0

              record: dict[str, object] = {
                  "sha": sha,
                  "committed_at": committed_at_raw,
                  "age_minutes": round(age_minutes, 2),
              }

              matching = sorted(
                  runs_by_sha.get(sha, []),
                  key=lambda run: int(run.get("run_attempt") or 0),
                  reverse=True,
              )
              if not matching:
                  record["qualification"] = "within_grace"
                  if age_minutes >= missing_grace_minutes:
                      record["qualification"] = "missing"
                      failures.append(
                          f"{sha}: no Post-merge Qualification push run "
                          f"after {age_minutes:.1f} minutes"
                      )
                  report.append(record)
                  continue

              latest = matching[0]
              record.update(
                  {
                      "qualification": latest.get("status"),
                      "run_id": latest.get("id"),
                      "run_attempt": latest.get("run_attempt"),
                      "conclusion": latest.get("conclusion"),
                      "run_url": latest.get("html_url"),
                  }
              )

              if latest.get("status") == "completed":
                  if latest.get("conclusion") != "success":
                      failures.append(
                          f"{sha}: qualification run {latest.get('id')} "
                          f"completed as {latest.get('conclusion')!r}"
                      )
              elif age_minutes >= stale_run_minutes:
                  failures.append(
                      f"{sha}: qualification run {latest.get('id')} is still "
                      f"{latest.get('status')!r} after {age_minutes:.1f} minutes"
                  )

              report.append(record)

          output = {
              "schema_version": 1,
              "repository": repository,
              "checked_at": now.isoformat(),
              "lookback_commits": lookback,
              "missing_grace_minutes": missing_grace_minutes,
              "stale_run_minutes": stale_run_minutes,
              "commits": report,
              "failures": failures,
          }

          artifact = Path("artifacts/post-merge-qualification-watchdog.json")
          artifact.parent.mkdir(parents=True, exist_ok=True)
          artifact.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(output, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(
                  "post-merge qualification watchdog detected failures:\n- "
                  + "\n- ".join(failures)
              )
          PY

      - name: Publish watchdog evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-merge-qualification-watchdog-${{ github.run_id }}
          path: artifacts/post-merge-qualification-watchdog.json
          if-no-files-found: error
          retention-days: 30
