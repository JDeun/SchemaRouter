name: CodeGraph Surgical Qwen Local Agent E1 DEV

on:
  pull_request:
    paths:
      - "scripts/research_codegraph_local_multiroute_e1.py"
      - "scripts/research_codegraph_surgical_agent_e1.py"
      - "scripts/research_codegraph_scoped_materializer.py"
      - "tests/test_research_codegraph_local_multiroute_e1.py"
      - "tests/test_research_codegraph_surgical_agent_e1.py"
      - "tests/test_research_codegraph_scoped_materializer.py"
      - ".github/workflows/codegraph-surgical-qwen-cpu-e1-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-local-qwen-three-languages:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [en, ko, ja]
        catalog_size: [4, 12]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install CPU inference, original runtime and bounded regression dependencies
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "transformers>=4.51,<5" "huggingface-hub>=0.30,<2" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1"
      - name: Prove source-local fail-closed controls, without model inference
        run: |
          ruff check scripts/research_codegraph_local_multiroute_e1.py scripts/research_codegraph_surgical_agent_e1.py scripts/research_codegraph_scoped_materializer.py tests/test_research_codegraph_local_multiroute_e1.py tests/test_research_codegraph_surgical_agent_e1.py tests/test_research_codegraph_scoped_materializer.py
          python -m pytest -q tests/test_research_codegraph_local_multiroute_e1.py tests/test_research_codegraph_surgical_agent_e1.py tests/test_research_codegraph_scoped_materializer.py
      - name: Check bounded runner RAM and disk before fetching public pinned weights
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          ram = int(next(x for x in Path("/proc/meminfo").read_text().splitlines() if x.startswith("MemTotal:")).split()[1])
          disk = shutil.disk_usage(".").free / (1024 ** 3)
          print("RAM KiB:", ram, "free disk GiB:", round(disk, 1))
          assert ram >= 12_000_000 and disk >= 7
          PY
      - name: Fetch exactly the original public Qwen3-0.6B revision
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from scripts.agent_utility_v7_dev_agent import MODEL_NAME, MODEL_REVISION
          assert MODEL_NAME == "Qwen/Qwen3-0.6B"
          assert MODEL_REVISION == "c1899de289a04d12100db370d81485cdf75e47ca"
          path = snapshot_download(
              repo_id=MODEL_NAME, revision=MODEL_REVISION,
              allow_patterns=("*.json", "*.safetensors", "*.model", "tokenizer*", "*.jinja"),
          )
          print("Original pinned public model cached:", bool(path))
          PY
      - name: Generate model-derived real local tool calls and measure all turns
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m scripts.research_codegraph_local_multiroute_e1 \
            --cohort local-source --language ${{ matrix.language }} \
            --catalog-size ${{ matrix.catalog_size }} \
            --out artifacts/codegraph-local-qwen/${{ matrix.language }}-${{ matrix.catalog_size }}.json
      - name: Verify genuine model receipts and truthful comparison blockers
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lang = "${{ matrix.language }}"
          size = int("${{ matrix.catalog_size }}")
          report = json.loads(Path(f"artifacts/codegraph-local-qwen/{lang}-{size}.json").read_text(encoding="utf-8"))
          assert report["model_id"] == "Qwen/Qwen3-0.6B"
          assert report["model_revision"] == "c1899de289a04d12100db370d81485cdf75e47ca"
          expected_status = (
              "E1_MEASURED_LOCAL_FOUR_ARM_NOT_E2"
              if size == 4 else "INCOMPARABLE_FULL_MENU_CAP"
          )
          assert report["status"] == expected_status, report["status"]
          assert report["evidence_tier"] == "E1_LOCAL_SOURCE_CONTROL"
          assert report["independent_e2_qualified"] is False and report["release_qualified"] is False
          assert report["original_provider_e1"] is False
          assert report["language"] == lang and report["requested_k"] == 5
          assert report["source_route_count"] == size
          if size == 12:
              assert report["task_success_rate"] is None
              assert report["qualified_task_denominator"] is None
          else:
              assert report["qualified_task_denominator"] == {
                  arm: 1 for arm in report["arms"]
              }
              assert set(report["task_success_rate"]) == set(report["arms"])
              assert all(value in (0.0, 1.0)
                         for value in report["task_success_rate"].values())
          outcomes = report["outcomes"]
          assert len(outcomes) == 4
          assert outcomes[0]["condition"] == "all_visible"
          if size == 12:
              assert outcomes[0]["status"] == "BLOCKED_MENU_CAP"
              assert outcomes[0]["model_turns"] == 0
          else:
              assert outcomes[0]["status"] != "BLOCKED_MENU_CAP"
              assert outcomes[0]["model_turns"] >= 1
          active = [
              row for row in outcomes
              if size == 4 or row["condition"] != "all_visible"
          ]
          assert all(type(row["model_turns"]) is int for row in active)
          assert any(row["model_turns"] >= 1 for row in active), "model inference never ran"
          for row in active:
              for key in ("model_input_tokens", "tool_schema_tokens", "model_output_tokens", "total_model_tokens"):
                  value = row.get(key)
                  assert value is None or (type(value) is int and value >= 0)
              assert type(row["actual_source_calls"]) is int and row["actual_source_calls"] >= 0
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write(f"## Genuine pinned Qwen local E1 control — {lang}, {size} routes\n\n")
              if size == 12:
                  out.write("FULL blocked by the unchanged K5 menu cap; four-arm outcome incomparable.\n\n")
              else:
                  out.write("Four original read-only routes let FULL fit K5 without bypass; one local synthetic task, not E2.\n\n")
              out.write("No live provider, independent E2, validated cost win or default promotion.\n\n")
              out.write("| Arm | Turns | Host calls | Reported tokens | Completion | Stop |\n|---|---:|---:|---:|---|---|\n")
              for row in outcomes:
                  out.write(f"| {row['condition']} | {row['model_turns']} | {row['actual_source_calls']} | {row['total_model_tokens']} | {row['full_task_complete']} | {row['status']} |\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codegraph-qwen-local-e1-${{ matrix.language }}-${{ matrix.catalog_size }}-${{ github.run_id }}
          path: artifacts/codegraph-local-qwen/*.json
          retention-days: 30
          if-no-files-found: warn
