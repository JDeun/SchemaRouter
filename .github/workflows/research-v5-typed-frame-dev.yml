name: Research V5 Typed Frame DEV

on:
  push:
    branches:
      - "research/0.12-query-first-typed-frame"
    paths:
      - ".github/workflows/research-v5-typed-frame-dev.yml"
      - "benchmarks/operation-routing-v5-typed-frame-preregistration.json"
      - "benchmarks/query_first_typed_frame.py"
      - "benchmarks/operation_routing_v5_catalog.py"
      - "scripts/generate_operation_routing_v5.py"
      - "scripts/evaluate_query_first_typed_frame_v5.py"
      - "tests/test_query_first_typed_frame.py"
      - "tests/test_operation_routing_v5_protocol.py"
      - "tests/test_query_first_typed_frame_protocol.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_SHA256: "79a7cb9672e6633739e0acd08882019f5cfeff479df103f8199aabacb8501a9f"
  CONFIRM_SHA256: "15587c646d64b4f3462127742c05d59092938f68a4c047b731e9a8c78c0eb673"

concurrency:
  group: research-v5-typed-frame-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate exact preregistered source
        run: |
          ruff check \
            benchmarks/query_first_typed_frame.py \
            benchmarks/operation_routing_v5_catalog.py \
            scripts/generate_operation_routing_v5.py \
            scripts/evaluate_query_first_typed_frame_v5.py \
            tests/test_query_first_typed_frame.py \
            tests/test_operation_routing_v5_protocol.py \
            tests/test_query_first_typed_frame_protocol.py
          pytest -q \
            tests/test_query_first_typed_frame.py \
            tests/test_operation_routing_v5_protocol.py \
            tests/test_query_first_typed_frame_protocol.py

  evaluate-development:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"

      - name: Recreate both frozen corpora
        run: |
          python scripts/generate_operation_routing_v5.py \
            --out-dir artifacts/operation-routing-v5

      - name: Verify both corpus identities before scoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/operation-routing-v5")
          dev = json.loads((root / "development-manifest.json").read_text())
          confirm = json.loads((root / "confirmation-manifest.json").read_text())
          if dev["corpus_sha256"] != os.environ["DEV_SHA256"]:
              raise SystemExit("development corpus SHA mismatch")
          if confirm["corpus_sha256"] != os.environ["CONFIRM_SHA256"]:
              raise SystemExit("confirmation corpus SHA mismatch")
          if dev["case_count"] != 936 or confirm["case_count"] != 1008:
              raise SystemExit("frozen corpus case-count mismatch")
          print("both 0.12 corpus identities verified; confirmation remains unscored")
          PY

      - name: Score development only
        run: |
          python scripts/evaluate_query_first_typed_frame_v5.py \
            --corpus artifacts/operation-routing-v5/development.json \
            --out artifacts/operation-routing-v5/development-analysis.json

      - name: Validate authority and data-governance invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/operation-routing-v5/development-analysis.json")
              .read_text(encoding="utf-8")
          )
          policy = data["policy"]
          forbidden = (
              "old_0_11_dev_used_for_selection",
              "fresh_270_used",
              "fresh_287_used",
              "fresh_326_used",
              "issue_338_holdout_used",
              "calibration_or_blind_used",
              "learned_veto",
              "route_specific_thresholds",
              "pseudo_route",
              "rank2_fallback",
              "confirmation_scored",
          )
          if any(policy[key] for key in forbidden):
              raise SystemExit("research-governance invariant failed")
          metrics = data["metrics"]
          if metrics["authority_violations"] != 0:
              raise SystemExit("execution authority violation")
          if metrics["execution_errors"] != 0:
              raise SystemExit("routing execution error")
          print("development_pass=", data["development_pass"])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operation-routing-v5-dev-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v5/development-analysis.json
            artifacts/operation-routing-v5/development-manifest.json
            artifacts/operation-routing-v5/confirmation-manifest.json
            benchmarks/operation-routing-v5-typed-frame-preregistration.json
          if-no-files-found: warn
          retention-days: 30
