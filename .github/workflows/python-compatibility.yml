name: Python Compatibility Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * 1"

permissions:
  contents: read

concurrency:
  group: python-compatibility
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - name: Install full compatibility dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -e ".[dev,mcp,langchain,langgraph,llamaindex,jev,otel,database]"
          else
            pip install -e ".[dev]"
          fi
      - run: ruff check .
      - name: Run full supported-version suite
        run: pytest -q -m "not mcp_integration"
      - run: python examples/quickstart.py
      - run: python examples/database_quickstart.py
      - run: python scripts/consumer_acceptance.py
