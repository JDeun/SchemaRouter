name: Graph Frozen Candidate Calibration

on:
  pull_request:
    paths:
      - ".github/workflows/research-operation-graph-calibration.yml"
      - "scripts/generate_decision_routing_graph_calibration_v1.py"
      - "scripts/compare_graph_calibration.py"
      - "scripts/benchmark_decision_routing.py"
      - "benchmarks/operation-fit-0.10-graph-cycle.json"
      - "benchmarks/operation-fit-0.10-graph-frozen-candidate.json"
      - "benchmarks/operation-fit-0.10-graph-static-cache-dev-result.json"
      - "benchmarks/operation-fit-0.10-graph-calibration-plan.json"
      - "tests/test_graph_calibration_generator.py"
      - "tests/test_graph_calibration_comparison.py"
      - "tests/test_operation_graph_protocol.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  GRAPH_CALIBRATION_SEED: "graph-v1-calibration-2026-09-27"

concurrency:
  group: operation-graph-calibration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint frozen calibration surface
        run: |
          ruff check \
            scripts/generate_decision_routing_graph_calibration_v1.py \
            scripts/compare_graph_calibration.py \
            tests/test_graph_calibration_generator.py \
            tests/test_graph_calibration_comparison.py \
            tests/test_operation_graph_protocol.py
      - name: Validate frozen calibration contracts
        run: |
          pytest -q \
            tests/test_graph_calibration_generator.py \
            tests/test_graph_calibration_comparison.py \
            tests/test_operation_graph_protocol.py \
            tests/test_graph_routing.py \
            tests/test_embedding_decision_backend.py

  calibration:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate fresh confirmation-only calibration corpus
        run: |
          mkdir -p artifacts/calibration
          python scripts/generate_decision_routing_graph_calibration_v1.py \
            --seed "${GRAPH_CALIBRATION_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out artifacts/calibration/corpus.json \
            --manifest artifacts/calibration/corpus-manifest.json
      - name: Run frozen candidate on fresh calibration
        run: |
          BASELINE="keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation"
          CANDIDATE="keyword+graph-operation+graph-semantic-seed+graph-propagation+graph-corroboration+graph-static-option-cache+selective-semantic-recall+selective-capability-fit+selective-operation-fit+selective-endpoint-disambiguation"
          python scripts/benchmark_decision_routing.py \
            --corpus artifacts/calibration/corpus.json \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --graph-operation-gate \
            --graph-semantic-seed-embedding-callable benchmarks.multilingual_embedder:embed \
            --graph-semantic-seed-min-similarity 0.45 \
            --graph-semantic-seed-min-margin 0.10 \
            --graph-semantic-direct-min-similarity 0.55 \
            --graph-semantic-direct-min-margin 0.15 \
            --graph-semantic-propagation \
            --graph-semantic-propagation-scope ranked_only \
            --graph-semantic-propagation-limit 2 \
            --graph-semantic-propagation-on-abstain reject \
            --graph-semantic-corroborate-abstain \
            --graph-cache-static-embedding-options \
            --counterbalanced \
            --warmup-cases 24 \
            --planner-name "${BASELINE}" \
            --planner-name "${CANDIDATE}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU frozen graph calibration" \
            --json-out artifacts/calibration/report.json
      - name: Apply preregistered frozen calibration gates
        run: |
          python scripts/compare_graph_calibration.py \
            --report artifacts/calibration/report.json \
            --out artifacts/calibration/comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-graph-calibration-${{ github.run_id }}
          path: |
            artifacts/calibration/report.json
            artifacts/calibration/comparison.json
            artifacts/calibration/corpus-manifest.json
          if-no-files-found: error
          retention-days: 30
