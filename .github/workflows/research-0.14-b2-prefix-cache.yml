name: Research 0.14 B2 Prefix Cache Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - "research/0.14-b2-prefix-cache-run"
    paths:
      - ".github/b2-prefix-cache-trigger.json"

permissions:
  contents: read

concurrency:
  group: research-0.14-b2-prefix-cache-benchmark
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_ATTN_IMPLEMENTATION: "sdpa"
  B2_STATIC_PREFIX_CACHE: "1"
  B2_PROGRESS_TRACE: "1"

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - run: pip install -e .
      - id: hf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "b2-smollm3-arm64-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"
      - name: Populate exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
          )
          PY
      - name: Verify prefix-cache benchmark contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          trigger = json.loads(
              Path(".github/b2-prefix-cache-trigger.json")
              .read_text(encoding="utf-8")
          )
          assert trigger["catalog_size"] == 20
          assert trigger["task_id"] == "multi-create-send"
          assert trigger["condition"] == "FULL"
          assert trigger["static_prefix_cache"] is True
          assert trigger["semantic_tuning_allowed"] is False
          PY
      - name: Run cached-prefix episode
        run: |
          mkdir -p artifacts/b2-prefix-cache
          /usr/bin/time -v -o artifacts/b2-prefix-cache/time.txt \
            python -u scripts/evaluate_agent_utility_phase_b_smollm3.py \
              --catalog-sizes "20" \
              --task-ids "multi-create-send" \
              --conditions "FULL" \
              --out artifacts/b2-prefix-cache/result.json
      - name: Require exact behavioral identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          from scripts.compare_b2_attention_backends import _normalize

          result = json.loads(
              Path("artifacts/b2-prefix-cache/result.json")
              .read_text(encoding="utf-8")
          )
          normalized = _normalize(result)
          encoded = json.dumps(
              normalized,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          digest = hashlib.sha256(encoded).hexdigest()
          expected = (
              "18c73f3ea2127463d57b4a67ca21b687"
              "5bb9f7965dd7be850b38f09b86e3d7a8"
          )
          assert digest == expected, (digest, expected)

          timing = Path("artifacts/b2-prefix-cache/time.txt").read_text(
              encoding="utf-8"
          )
          rss = re.search(
              r"Maximum resident set size \(kbytes\):\s*(\d+)",
              timing,
          )
          assert rss is not None
          verdict = {
              "behavior_sha256": digest,
              "behavior_identical": True,
              "episode_wall_latency_ms": result["rows"][0][
                  "episode_wall_latency_ms"
              ],
              "peak_rss_kib": int(rss.group(1)),
          }
          Path("artifacts/b2-prefix-cache/verdict.json").write_text(
              json.dumps(verdict, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(verdict, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "b2-prefix-cache-${{ github.run_id }}"
          path: artifacts/b2-prefix-cache/
          if-no-files-found: warn
          retention-days: 30
