name: SQLite Source-Owned Posting Journal E0

on:
  pull_request:
    paths:
      - "src/schemarouter/native_semantic_index.py"
      - "src/schemarouter/registry.py"
      - "tests/test_sqlite_native_posting_journal_e0.py"
      - "tests/test_sqlite_registry_mutation_journal_e0.py"
      - ".github/workflows/sqlite-source-owned-posting-journal-e0.yml"
      - "research/autoresearch/sqlite-native-posting-journal-fastpath-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-journal-source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install native package and bounded test tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Validate SQLite journal ownership, source parity, and negative tests
        run: |
          ruff check src/schemarouter/native_semantic_index.py tests/test_sqlite_native_posting_journal_e0.py tests/test_sqlite_registry_mutation_journal_e0.py
          python -m pytest -q tests/test_sqlite_native_posting_journal_e0.py tests/test_sqlite_registry_mutation_journal_e0.py tests/test_registry_mutation_journal_e0.py tests/test_native_semantic_index.py
          pyright src/schemarouter/native_semantic_index.py
