name: Original Operation Identity E5 Base CPU DEV

on:
  pull_request:
    paths:
      - "scripts/research_source_operation_channel_e5_base_cpu_dev.py"
      - "tests/test_research_source_operation_channel_e5_base_cpu_dev.py"
      - "research/autoresearch/source-operation-e5-base-500-cpu-dev.md"
      - ".github/workflows/research-source-operation-e5-base-500-cpu-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-native-source-no-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify untouched 500 routes and no-gold source-only scoring
        run: |
          python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1" "pyright>=1.1,<2"
          ruff check scripts/research_source_operation_channel_e5_base_cpu_dev.py tests/test_research_source_operation_channel_e5_base_cpu_dev.py
          python -m pytest -q tests/test_research_source_operation_channel_e5_base_cpu_dev.py tests/test_research_authorized_fixed5_decision_bridge.py
          pyright scripts/research_source_operation_channel_e5_base_cpu_dev.py
          python -m scripts.research_source_operation_channel_e5_base_cpu_dev --mode validate

  real-pinned-e5-base-cpu:
    needs: fixed-native-source-no-model
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install original pinned CPU encoder
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Compare original description against original operation channel
        run: |
          python -m scripts.research_source_operation_channel_e5_base_cpu_dev --mode real-cpu --out artifacts/source-operation-channel-e5-cpu/report.json
      - name: Publish fixed-case comparisons and honest limitations
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          doc = json.loads(Path("artifacts/source-operation-channel-e5-cpu/report.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Source-only 500-native-route E5-base description/operation channel E1 DEV\n\n")
              out.write("No typed FieldSpec in this catalog, no translation, no provider execution, no calibrated no-fit, no independent E2.\n\n")
              out.write("| Language | Arm | Top1/6 | Top5/6 | Unsupported K5 returned /2 | Median selection ms |\n|---|---|---:|---:|---:|---:|\n")
              for arm, languages in doc["summary"].items():
                  for language, stats in languages.items():
                      out.write(f"| {language} | {arm} | {stats['top1']}/6 | {stats['top5']}/6 | {stats['unsupported_nonempty']}/2 | {stats['selection_median_ms']} |\n")
              out.write(f"\nOne-time 1000 passage embeddings: {doc['source_passage_precompute_ms']} ms. Original source commit: {doc['source_commit']}. No default model/ranking promotion.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-operation-channel-e5-base-500-cpu-dev
          path: artifacts/source-operation-channel-e5-cpu/report.json
          retention-days: 30
          if-no-files-found: error
