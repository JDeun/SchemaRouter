name: Native Indexed Paired Top-K5 Research DEV E0

on:
  pull_request:
    paths:
      - "scripts/research_indexed_paired_ranking_dev.py"
      - "tests/test_research_indexed_paired_ranking_dev.py"
      - "scripts/research_indexed_decision_backend_ranker_e0.py"
      - "src/schemarouter/native_semantic_index.py"
      - "research/autoresearch/paper-indexed-paired-ranking-dev-e0.md"
      - ".github/workflows/research-indexed-paired-ranking-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexed-paired-ranking-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-model-paired-index-ranking:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install source and E0 test tools
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Check source contracts, paired scorer and type boundary
        run: |
          ruff check scripts/research_indexed_paired_ranking_dev.py tests/test_research_indexed_paired_ranking_dev.py
          pyright scripts/research_indexed_paired_ranking_dev.py
          python -m pytest -q tests/test_research_indexed_paired_ranking_dev.py tests/test_research_indexed_decision_backend_ranker_e0.py
      - name: Run independent no-model paired corpus validation
        run: |
          python -m scripts.research_indexed_paired_ranking_dev --mode validate             --out artifacts/indexed-paired-dev/validate.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/indexed-paired-dev/validate.json").read_text())
          assert r["evidence_tier"] == "E0_NO_MODEL_INDEXED_SYNTHETIC_DEV_ONLY"
          assert r["route_count"] == 24 and r["case_count"] == 30
          assert r["supported_case_count"] == 27 and r["ood_case_count"] == 3
          assert r["model_used"] is False
          assert r["real_model_runtime_attested"] is False
          assert r["independent_publisher_gold"] is False
          assert r["agent_task_success_measured"] is False
          assert r["calibrated_no_fit"] is False
          assert r["product_default_changed"] is False
          assert r["per_language"]["lexical5"]["en"]["recall_at_5"] == 1.0
          assert r["per_language"]["lexical5"]["ko"]["recall_at_5"] == 1 / 9
          assert r["per_language"]["lexical5"]["ja"]["recall_at_5"] == 1 / 9
          PY

  real-pinned-e5-indexed-cpu-dev:
    needs: no-model-paired-index-ranking
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install real pinned E5 CPU environment
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Run actual source-authorized E5 direct index paired DEV
        run: |
          python -m scripts.research_indexed_paired_ranking_dev \
            --mode real-e5-cpu \
            --out artifacts/indexed-paired-dev/pinned-e5.json
      - name: Enforce actual model and non-production evidence boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/indexed-paired-dev/pinned-e5.json").read_text())
          assert r["evidence_tier"] == "REAL_PINNED_E5_CPU_INDEXED_PUBLIC_SYNTHETIC_DEV_ONLY"
          assert r["real_model_runtime_attested"] is True
          assert r["model_used"] is True
          assert r["route_count"] == 24
          assert r["supported_case_count"] == 27 and r["ood_case_count"] == 3
          assert r["model_runtime"]["model_revision"] == "fd1525a9fd15316a2d503bf26ab031a61d056e98"
          assert r["model_runtime"]["model_id"] == "intfloat/multilingual-e5-small"
          assert r["model_runtime"]["device"] == "cpu"
          assert r["source_revision"] and len(r["source_revision"]) == 40
          assert r["independent_publisher_gold"] is False
          assert r["agent_task_success_measured"] is False
          assert r["calibrated_no_fit"] is False
          assert r["product_default_changed"] is False
          assert all(r["per_language"]["e5_5"][lang]["supported"] == 9 for lang in ("en", "ko", "ja"))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-indexed-e5-paired-dev-${{ github.run_id }}
          path: artifacts/indexed-paired-dev/pinned-e5.json
          if-no-files-found: error
          retention-days: 30
