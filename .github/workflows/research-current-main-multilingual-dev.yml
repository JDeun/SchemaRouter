name: Current API Multilingual Typed Retrieval DEV

on:
  pull_request:
    paths:
      - ".github/workflows/research-current-main-multilingual-dev.yml"
      - "scripts/research_current_main_multilingual_dev.py"
      - "tests/test_research_current_main_multilingual_dev.py"
      - "benchmarks/agent_utility_v5_catalog.py"
      - "research/current-main-multilingual-dev.md"
  workflow_dispatch:
    inputs:
      full_cohort:
        description: "Run all 240 historical DEV tasks per catalog (vs 48-case balanced smoke)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research-current-main-multilingual-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multilingual-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out package and guarded test dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - name: Verify data/provenance/scorer invariants and current code path
        run: python -m pytest -q tests/test_research_current_main_multilingual_dev.py
      - name: Run balanced development-only multilingual retrieval assessment
        env:
          FULL_COHORT: ${{ inputs.full_cohort == true && 'true' || 'false' }}
        run: |
          if test "$FULL_COHORT" = "true"; then
            GROUP_COUNT=5
          else
            GROUP_COUNT=1
          fi
          python -m scripts.research_current_main_multilingual_dev \
            --sizes 100 250 500 \
            --cases-per-group "$GROUP_COUNT" \
            --output artifacts/current-main-multilingual-dev/report.json
      - name: Preserve exact-case failure data and source fingerprints
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-api-multilingual-dev-${{ github.run_id }}
          path: artifacts/current-main-multilingual-dev/report.json
          if-no-files-found: error
          retention-days: 90
# Read-only, synthetic known-DEV experiment. No hosted inference, secrets,
# mutable evaluation gold, tool dispatch or product/release qualification.
