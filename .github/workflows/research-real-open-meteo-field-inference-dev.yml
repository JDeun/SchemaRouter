name: Real OpenMeteo Multilingual Field Inference E5 CPU DEV

on:
  pull_request:
    paths:
      - "scripts/research_real_open_meteo_e5_field_inference_dev.py"
      - "tests/test_research_real_open_meteo_e5_field_inference_dev.py"
      - "research/autoresearch/real-open-meteo-e5-field-inference-dev.md"
      - ".github/workflows/research-real-open-meteo-field-inference-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e5-real-field-inference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-local-model-field-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install current source and model-free control tests
        run: |
          python -m pip install . "PyYAML>=6,<7" "pytest>=8,<10" "pytest-asyncio>=0.23"
          python -m pytest -q tests/test_research_real_open_meteo_e5_field_inference_dev.py
      - name: Download exactly source-pinned published Open-Meteo OpenAPI schemas
        shell: bash
        run: |
          set -euo pipefail
          commit=b0ff3ebbbafa890000ab8bc5f9598a2e4ef64dc4
          directory=artifacts/real-field-inference/source
          mkdir -p "$directory"
          for name in air-quality climate elevation ensemble flood forecast historical-weather marine seasonal; do
            curl --fail --silent --show-error --location --retry 2 \
              --connect-timeout 15 --max-time 90 \
              "https://raw.githubusercontent.com/open-meteo/open-meteo/$commit/openapi/$name.yml" \
              --output "$directory/$name.yml"
            test -s "$directory/$name.yml"
          done
          python - <<'PY'
          from pathlib import Path
          from scripts.research_open_meteo_real_openapi_dev import load_contracts
          tools, failures, evidence = load_contracts(
              Path("benchmarks/open-meteo-openapi-real-source-dev-manifest.json"),
              Path("artifacts/real-field-inference/source"),
          )
          assert len(tools) == 9 and not failures, (len(tools), failures)
          print("Verified nine genuine provider-authored source blobs")
          PY
      - name: Install pinned open-source local E5 CPU runtime
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Predict source-defined enum fields without any gold requirement
        run: |
          python -m scripts.research_real_open_meteo_e5_field_inference_dev \
            --manifest benchmarks/open-meteo-openapi-real-source-dev-manifest.json \
            --source-dir artifacts/real-field-inference/source \
            --output artifacts/real-field-inference/report.json
      - name: Preserve actual predicted fields, missed cases and raw publisher docs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-open-meteo-field-inference-${{ github.run_id }}
          path: artifacts/real-field-inference/
          if-no-files-found: warn
          retention-days: 90
# Research-only, no real provider tool calls, hosted LLM, GPU, release,
# inference-authorized execution, human-oracle injection or credentials.
