name: SmartMCP Development Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/external-validation-smart-mcp-dev-v1/**"
      - "scripts/external_validation_smart_mcp.py"
      - "scripts/external_validation_provenance.py"
      - "scripts/run_lexical_external_validation.py"
      - "scripts/run_schemarouter_external_validation.py"
      - "scripts/run_smartmcp_external_validation.py"
      - ".github/workflows/smartmcp-development-smoke.yml"

permissions:
  contents: read

env:
  SMARTMCP_REVISION: c4d6602cfabb6f514bf06a1d1ae10b610ff7d573
  MCP_VERSION: "1.29.0"
  PACKAGE_DIR: benchmarks/external-validation-smart-mcp-dev-v1
  TOKENIZERS_PARALLELISM: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install SchemaRouter and pinned SmartMCP
        run: |
          python -m pip install .
          # SmartMCP's pinned revision predates the MCP Python SDK v2 API rename
          # (Tool.inputSchema -> Tool.input_schema). Its pyproject currently says
          # mcp>=1.0 without a <2 upper bound, so reproduce the compatible v1 line.
          python -m pip install "mcp==${MCP_VERSION}"
          python -m pip install "git+https://github.com/spak2005/smart-mcp.git@${SMARTMCP_REVISION}"

      - name: Record environment
        run: |
          mkdir -p artifacts/smartmcp-dev-smoke
          python --version > artifacts/smartmcp-dev-smoke/python-version.txt
          python -m pip freeze > artifacts/smartmcp-dev-smoke/pip-freeze.txt
          uname -a > artifacts/smartmcp-dev-smoke/uname.txt
          lscpu > artifacts/smartmcp-dev-smoke/lscpu.txt
          git rev-parse HEAD > artifacts/smartmcp-dev-smoke/schemarouter-revision.txt
          printf '%s\n' "${SMARTMCP_REVISION}" > artifacts/smartmcp-dev-smoke/smartmcp-revision.txt
          printf '%s\n' "${MCP_VERSION}" > artifacts/smartmcp-dev-smoke/mcp-version.txt

      - name: Validate development fixture
        run: |
          python scripts/external_validation_smart_mcp.py validate \
            --package-dir "${PACKAGE_DIR}"

      - name: Run SmartMCP native semantic discovery
        run: |
          python scripts/run_smartmcp_external_validation.py \
            --package-dir "${PACKAGE_DIR}" \
            --implementation-revision "${SMARTMCP_REVISION}" \
            --out artifacts/smartmcp-dev-smoke/smartmcp-result.json

      - name: Run SchemaRouter typed retrieval
        run: |
          python scripts/run_schemarouter_external_validation.py \
            --package-dir "${PACKAGE_DIR}" \
            --out artifacts/smartmcp-dev-smoke/schemarouter-result.json

      - name: Run lexical baseline
        run: |
          python scripts/run_lexical_external_validation.py \
            --package-dir "${PACKAGE_DIR}" \
            --out artifacts/smartmcp-dev-smoke/lexical-result.json

      - name: Score all conditions
        run: |
          python scripts/external_validation_smart_mcp.py score \
            --package-dir "${PACKAGE_DIR}" \
            --results artifacts/smartmcp-dev-smoke/smartmcp-result.json \
            --out artifacts/smartmcp-dev-smoke/smartmcp-score.json
          python scripts/external_validation_smart_mcp.py score \
            --package-dir "${PACKAGE_DIR}" \
            --results artifacts/smartmcp-dev-smoke/schemarouter-result.json \
            --out artifacts/smartmcp-dev-smoke/schemarouter-score.json
          python scripts/external_validation_smart_mcp.py score \
            --package-dir "${PACKAGE_DIR}" \
            --results artifacts/smartmcp-dev-smoke/lexical-result.json \
            --out artifacts/smartmcp-dev-smoke/lexical-score.json

      - name: Write comparison summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/smartmcp-dev-smoke")
          rows = []
          for key, label in [
              ("smartmcp", "SmartMCP"),
              ("schemarouter", "SchemaRouter"),
              ("lexical", "Lexical"),
          ]:
              payload = json.loads((root / f"{key}-score.json").read_text())
              s = payload["summary"]
              rows.append(
                  [
                      label,
                      s["supported_recall_at_1"],
                      s["supported_recall_at_3"],
                      s["supported_recall_at_5"],
                      s["supported_full_coverage_at_5"],
                      s["supported_mrr"],
                      s["median_retrieval_ms"],
                      s["p95_retrieval_ms"],
                      s["mean_exposed_contract_bytes"],
                      s["index_build_ms"],
                  ]
              )

          lines = [
              "# SmartMCP development-only smoke",
              "",
              "> Visible development fixture; not held-out evidence.",
              "",
              "| Condition | R@1 | R@3 | R@5 | Full@5 | MRR | median ms | p95 ms | mean exposed bytes | build ms |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for row in rows:
              rendered = [row[0]] + [
                  "n/a" if value is None else f"{value:.6f}" if isinstance(value, float) else str(value)
                  for value in row[1:]
              ]
              lines.append("| " + " | ".join(rendered) + " |")

          summary = "\n".join(lines) + "\n"
          (root / "comparison-summary.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

      - name: Upload development smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smartmcp-development-smoke
          path: artifacts/smartmcp-dev-smoke
          if-no-files-found: error
