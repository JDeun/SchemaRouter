name: Archive V13 Blind Evidence

on:
  push:
    branches:
      - research/v13-blind-final
    paths:
      - ".github/workflows/archive-v13-evidence.yml"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download sealed first-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10907304722/zip" \
            -o /tmp/v13.zip
          echo "0ca1cb673bee4d64999194252de8ddfe13a408548b7b53f0980c70b2d4719460  /tmp/v13.zip" | sha256sum -c -
          rm -rf /tmp/v13-artifact
          mkdir -p /tmp/v13-artifact
          unzip -q /tmp/v13.zip -d /tmp/v13-artifact
          (
            cd /tmp/v13-artifact
            sha256sum -c SHA256SUMS.txt
          )

      - name: Record consumed evidence
        run: |
          cp /tmp/v13-artifact/corpus.json benchmarks/decision-routing-v13-operation-contrastive-holdout.json
          cp /tmp/v13-artifact/generation.json benchmarks/decision-routing-v13-generation.json
          cp /tmp/v13-artifact/SHA256SUMS.txt benchmarks/decision-routing-v13-artifact-SHA256SUMS.txt
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/v13-artifact/report.json").read_text(encoding="utf-8"))
          generation = json.loads(Path("/tmp/v13-artifact/generation.json").read_text(encoding="utf-8"))
          key = "keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation"
          metrics = report["summary"][key]
          categories = metrics["category_accuracy"]
          supported = categories["blind_operation_generalization"]
          unsupported = categories["near_domain_unsupported_operation"]
          harmonic = 2 * supported * unsupported / (supported + unsupported)

          result = {
              "cycle": "0.10-operation-contrastive-v1",
              "status": "consumed_blind_final",
              "tuning_eligible": False,
              "candidate_freeze_revision": "14e1977011c5b926476731736f7a4a9e1876367a",
              "source_revision": generation["source_revision"],
              "workflow_run_id": 36246386089,
              "workflow_run_conclusion": "success",
              "workflow_completed_at": "2026-09-26T14:05:57Z",
              "artifact_id": 10907304722,
              "artifact_sha256": "0ca1cb673bee4d64999194252de8ddfe13a408548b7b53f0980c70b2d4719460",
              "seed": generation["seed"],
              "corpus_sha256": generation["corpus_sha256"],
              "case_count": metrics["cases"],
              "overall_accuracy": metrics["accuracy"],
              "overall_accuracy_ci95": metrics["accuracy_ci95"],
              "supported_operation_routed_accuracy": supported,
              "supported_operation_routed_accuracy_ci95": metrics["category_accuracy_ci95"]["blind_operation_generalization"],
              "near_domain_unsupported_operation_rejection": unsupported,
              "near_domain_unsupported_operation_rejection_ci95": metrics["category_accuracy_ci95"]["near_domain_unsupported_operation"],
              "out_of_domain_rejection": categories["out_of_domain"],
              "out_of_domain_rejection_ci95": metrics["category_accuracy_ci95"]["out_of_domain"],
              "harmonic_mean_supported_rejection": harmonic,
              "expected_no_route_recall": metrics["expected_no_route_recall"],
              "invalid_plan_rate": metrics["invalid_plan_rate"],
              "errors": metrics["errors"],
              "mean_latency_ms": metrics["mean_latency_ms"],
              "p50_latency_ms": metrics["p50_latency_ms"],
              "p95_latency_ms": metrics["p95_latency_ms"],
              "language_accuracy": metrics["language_accuracy"],
              "error_taxonomy": metrics["error_taxonomy"],
              "failure_stage_counts": metrics["failure_stage_counts"],
              "interpretation": "The frozen beta=1 sibling-contrastive BGE candidate preserved supported-route accuracy near calibration while maintaining very high near-domain unsupported-operation rejection on the first blind-final v13 run.",
              "post_consumption_policy": "v13 is permanently consumed and may be used only for reporting or clearly labeled diagnostics; it must never be used for tuning."
          }
          Path("benchmarks/operation-fit-0.10-v13-result.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          protocol_path = Path("benchmarks/decision-routing-v13-blind-protocol.json")
          protocol = json.loads(protocol_path.read_text(encoding="utf-8"))
          protocol.update({
              "status": "consumed_blind_final",
              "corpus_exists": True,
              "corpus_path": "benchmarks/decision-routing-v13-operation-contrastive-holdout.json",
              "generation_manifest": "benchmarks/decision-routing-v13-generation.json",
              "result_manifest": "benchmarks/operation-fit-0.10-v13-result.json",
              "consumed_run_id": 36246386089,
              "consumed_source_revision": generation["source_revision"],
              "consumed_corpus_sha256": generation["corpus_sha256"],
              "consumed_artifact_id": 10907304722,
              "consumed_artifact_sha256": "0ca1cb673bee4d64999194252de8ddfe13a408548b7b53f0980c70b2d4719460",
              "consumed_at": "2026-09-26T14:05:57Z",
          })
          protocol_path.write_text(
              json.dumps(protocol, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_operation_final_freeze.py")
          test_path.write_text(
              '''import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CONFIRMED = ROOT / "benchmarks" / "operation-fit-0.10-confirmed-candidate.json"
          V13_PROTOCOL = ROOT / "benchmarks" / "decision-routing-v13-blind-protocol.json"
          V13_RESULT = ROOT / "benchmarks" / "operation-fit-0.10-v13-result.json"


          def test_operation_candidate_freeze_precedes_consumed_v13() -> None:
              confirmed = json.loads(CONFIRMED.read_text(encoding="utf-8"))
              protocol = json.loads(V13_PROTOCOL.read_text(encoding="utf-8"))
              result = json.loads(V13_RESULT.read_text(encoding="utf-8"))

              assert confirmed["status"] == "candidate_confirmed_and_frozen_before_blind_final"
              assert confirmed["selected_candidate"]["beta"] == 1.0
              assert confirmed["selected_candidate"]["operation_fit_min_score"] == 0.01
              assert confirmed["selected_candidate"]["operation_fit_min_margin"] == 0.0
              assert confirmed["calibration_confirmation"]["workflow_run_id"] == 36245567627
              assert confirmed["decision"]["calibration_passed_both_floors"] is True

              assert protocol["status"] == "consumed_blind_final"
              assert protocol["corpus_exists"] is True
              assert protocol["tuning_eligible"] is False
              assert protocol["consumed_run_id"] == 36246386089
              assert protocol["consumed_corpus_sha256"] == result["corpus_sha256"]
              assert result["candidate_freeze_revision"] == "14e1977011c5b926476731736f7a4a9e1876367a"
              assert result["tuning_eligible"] is False
          ''',
              encoding="utf-8",
          )

          corpus_test = Path("tests/test_benchmark_corpus.py")
          corpus_test_text = corpus_test.read_text(encoding="utf-8")
          old_v13_test = (
              'def test_v13_blind_protocol_has_no_generated_corpus() -> None:\n'
              '    protocol = json.loads(V13_PROTOCOL.read_text(encoding="utf-8"))\n'
              '\n'
              '    assert protocol["status"] == "protocol_reserved_not_generated"\n'
              '    assert protocol["corpus_exists"] is False\n'
              '    assert protocol["tuning_eligible"] is False\n'
              '    assert protocol["generation_timing"] == "only_after_complete_candidate_configuration_is_frozen"\n'
          )
          new_v13_test = (
              'def test_consumed_v13_blind_protocol_is_archived_and_not_tunable() -> None:\n'
              '    protocol = json.loads(V13_PROTOCOL.read_text(encoding="utf-8"))\n'
              '\n'
              '    assert protocol["status"] == "consumed_blind_final"\n'
              '    assert protocol["corpus_exists"] is True\n'
              '    assert protocol["tuning_eligible"] is False\n'
              '    assert protocol["consumed_run_id"] == 36246386089\n'
              '    assert protocol["generation_timing"] == "only_after_complete_candidate_configuration_is_frozen"\n'
          )
          if old_v13_test not in corpus_test_text:
              raise RuntimeError("expected pre-consumption v13 test block not found")
          corpus_test.write_text(
              corpus_test_text.replace(old_v13_test, new_v13_test, 1),
              encoding="utf-8",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = (
              "- consumed the post-freeze v13 blind-final corpus exactly once with sibling-contrastive "
              "BGE (beta=1.0): 75.0% overall accuracy, 61.719% supported-operation routed accuracy, "
              "98.438% near-domain unsupported-operation rejection, 100% OOD rejection, and 75.869% "
              "supported/rejection harmonic mean with zero invalid plans or execution errors; v13 is "
              "now permanently ineligible for tuning.\n"
          )
          marker = "### Added\n\n"
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text, encoding="utf-8")
          PY

      - name: Validate archived state
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q tests/test_operation_final_freeze.py tests/test_benchmark_corpus.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          corpus = Path("benchmarks/decision-routing-v13-operation-contrastive-holdout.json")
          result = json.loads(Path("benchmarks/operation-fit-0.10-v13-result.json").read_text())
          assert hashlib.sha256(corpus.read_bytes()).hexdigest() == result["corpus_sha256"]
          assert result["workflow_run_id"] == 36246386089
          assert result["errors"] == 0
          assert result["invalid_plan_rate"] == 0.0
          PY

      - name: Commit immutable consumed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             CHANGELOG.md             benchmarks/decision-routing-v13-operation-contrastive-holdout.json             benchmarks/decision-routing-v13-generation.json             benchmarks/decision-routing-v13-artifact-SHA256SUMS.txt             benchmarks/decision-routing-v13-blind-protocol.json             benchmarks/operation-fit-0.10-v13-result.json             benchmarks/operation-fit-0.10-v13-run.json             scripts/generate_decision_routing_v13.py             tests/test_operation_final_freeze.py \\
            tests/test_benchmark_corpus.py
          git rm .github/workflows/research-v13-once.yml
          git rm .github/workflows/archive-v13-evidence.yml
          git commit -m "research: record consumed v13 blind evidence"
          git push origin HEAD:research/v13-blind-final
