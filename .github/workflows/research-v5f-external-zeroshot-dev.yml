name: Research V5F External Zero-Shot Membership DEV

on:
  push:
    branches:
      - "research/0.12-external-zeroshot-membership"
    paths:
      - ".github/workflows/research-v5f-external-zeroshot-dev.yml"
      - "scripts/evaluate_external_zeroshot_membership_v5f.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SOURCE: "6c02c313a022740100377ead5890fd1f0d782978"
  DEV_SHA256: "64a89e96a2beaf90e9b44febdef033a2ec9a17c60459c909a0718b759dd9baae"
  CONFIRM_SHA256: "9beebb5957f1bfd264a14349582c74ad9b15627c6530324f792d3e1d249ecbe9"
  ZERO_SHOT_MODEL: "Horizon-Labs/multilingual-zeroshot-small"
  ZERO_SHOT_TAG: "v1.1"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Verify frozen behavior and corpus source
        run: |
          git diff --exit-code "${FROZEN_SOURCE}" --             benchmarks/operation-routing-v5f-external-zeroshot-preregistration.json             benchmarks/external_zeroshot_membership.py             benchmarks/operation_routing_v5f_catalog.py             scripts/generate_operation_routing_v5f.py             tests/test_external_zeroshot_membership.py             tests/test_operation_routing_v5f_protocol.py

      - name: Validate evaluator and frozen protocol tests
        run: |
          ruff check scripts/evaluate_external_zeroshot_membership_v5f.py
          pytest -q             tests/test_external_zeroshot_membership.py             tests/test_operation_routing_v5f_protocol.py

  evaluate-development:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "sentence-transformers>=3,<6" "huggingface_hub>=0.34" einops
      - run: pip install -e ".[dev]"

      - name: Recreate both frozen corpora
        run: |
          python scripts/generate_operation_routing_v5f.py             --out-dir artifacts/operation-routing-v5f

      - name: Verify both frozen corpus identities before scoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/operation-routing-v5f")
          freeze = json.loads((root / "freeze-manifest.json").read_text())
          if freeze["development"]["corpus_sha256"] != os.environ["DEV_SHA256"]:
              raise SystemExit("DEV corpus identity drifted")
          if freeze["confirmation"]["corpus_sha256"] != os.environ["CONFIRM_SHA256"]:
              raise SystemExit("confirmation corpus identity drifted")
          if freeze["development"]["case_count"] != 552:
              raise SystemExit("unexpected DEV case count")
          if freeze["confirmation"]["case_count"] != 552:
              raise SystemExit("unexpected confirmation case count")
          print("both frozen corpus identities verified; confirmation remains unscored")
          PY

      - name: Resolve immutable external model revision
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import model_info

          info = model_info(
              os.environ["ZERO_SHOT_MODEL"],
              revision=os.environ["ZERO_SHOT_TAG"],
          )
          sha = str(info.sha)
          if len(sha) != 40:
              raise SystemExit(f"unexpected Hugging Face revision SHA: {sha!r}")
          Path("artifacts/operation-routing-v5f/zero-shot-revision.txt").write_text(
              sha + "\n",
              encoding="utf-8",
          )
          print("resolved zero-shot revision:", sha)
          PY

      - name: Score development only
        run: |
          ZERO_SHOT_REVISION="$(cat artifacts/operation-routing-v5f/zero-shot-revision.txt)"
          python scripts/evaluate_external_zeroshot_membership_v5f.py             --development artifacts/operation-routing-v5f/development.json             --zero-shot-revision "$ZERO_SHOT_REVISION"             --out artifacts/operation-routing-v5f/dev-analysis.json

      - name: Validate governance and authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/operation-routing-v5f/dev-analysis.json").read_text()
          )
          policy = data["policy"]
          if policy["confirmation_scored"]:
              raise SystemExit("confirmation was scored before DEV pass")
          if policy["prior_failed_rows_used_for_tuning"]:
              raise SystemExit("prior failed evidence leaked into candidate")
          if not policy["raw_bge_is_sole_positive_selector"]:
              raise SystemExit("raw BGE positive authority changed")
          if not policy["external_classifier_veto_only"]:
              raise SystemExit("external classifier is not veto-only")
          if policy["external_classifier_positive_rerank"] or policy["endpoint_filter"]:
              raise SystemExit("external classifier gained positive route authority")
          if policy["confidence_or_similarity_threshold"]:
              raise SystemExit("forbidden threshold detected")
          if policy["learned_on_schemarouter"]:
              raise SystemExit("forbidden SchemaRouter training detected")
          if policy["cross_tool_fallback"] or policy["pseudo_route"]:
              raise SystemExit("forbidden fallback authority detected")

          metrics = data["metrics"]
          if metrics["positive_route_switches"] != 0:
              raise SystemExit("external classifier switched a positive route")
          if metrics["authority_violations"] != 0:
              raise SystemExit("authority violation")
          if metrics["execution_errors"] != 0:
              raise SystemExit("execution errors")

          print("quality_pass=", data["quality_pass"])
          print("runtime_gate=", data["runtime_gate"])
          print("surface_pass=", data["surface_pass"])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operation-routing-v5f-dev-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v5f/dev-analysis.json
            artifacts/operation-routing-v5f/development-manifest.json
            artifacts/operation-routing-v5f/confirmation-manifest.json
            artifacts/operation-routing-v5f/zero-shot-revision.txt
            benchmarks/operation-routing-v5f-external-zeroshot-preregistration.json
          if-no-files-found: warn
          retention-days: 30
