name: Declared Concept Agent Fixed5 E0

on:
  pull_request:
    paths:
      - "src/schemarouter/concept_retrieval.py"
      - "src/schemarouter/field_group_retrieval.py"
      - "scripts/research_authorized_concept_fixed5_agent_bridge.py"
      - "tests/test_research_authorized_concept_fixed5_agent_bridge.py"
      - ".github/workflows/research-declared-concept-agent-e0.yml"
      - "research/autoresearch/declared-concept-agent-fixed5-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-scoped-concept-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out source
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1"
      - name: Reuse original agent E0 and native concept contracts
        run: |
          ruff check scripts/research_authorized_concept_fixed5_agent_bridge.py tests/test_research_authorized_concept_fixed5_agent_bridge.py
          python -m pytest -q tests/test_research_authorized_concept_fixed5_agent_bridge.py tests/test_integrated_fixed5_agent_selector.py tests/test_native_concept_retrieval.py
