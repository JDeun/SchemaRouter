name: Indexed Native Typed Graph G5 E0

on:
  pull_request:
    paths:
      - "src/schemarouter/native_graph_index.py"
      - "src/schemarouter/native_semantic_index.py"
      - "src/schemarouter/__init__.py"
      - "tests/test_native_graph_index.py"
      - "tests/test_public_api.py"
      - ".github/workflows/indexed-native-typed-graph-g5-e0.yml"
      - "research/autoresearch/indexed-native-typed-graph-g5-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexed-typed-source-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out source and test prerequisites
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Reuse typed graph composer and source-scoped native field index
        run: |
          ruff check src/schemarouter/native_graph_index.py tests/test_native_graph_index.py
          python -m pytest -q tests/test_native_graph_index.py tests/test_native_semantic_index.py tests/test_research_discovered_native_graph_g4.py tests/test_public_api.py
          pyright src/schemarouter/native_graph_index.py
