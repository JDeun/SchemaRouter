name: Research 0.14 Conveyor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/research-0.14-conveyor.yml"
      - ".github/workflows/research-0.14-corrective-recovery.yml"
      - ".github/workflows/research-0.14-heldout-recovery.yml"
      - "scripts/research_014_heldout_recovery.py"
      - ".github/workflows/research-0.14-structural-k3-agent.yml"
      - ".github/workflows/research-0.14-field-projection-dev.yml"
      - ".github/workflows/research-0.14-field-projection.yml"
      - "scripts/research_014_conveyor.py"
      - "benchmarks/agent-utility-0.14-conveyor-preregistration.json"
  # GITHUB_TOKEN-triggered workflow_dispatch chains are not guaranteed to
  # emit a downstream workflow_run event. The canonical held-out job can
  # complete after the latest event-driven pass has already returned "waiting".
  # Periodically reconcile immutable completed runs; the controller's provenance
  # markers deduplicate every downstream workflow dispatch.
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_run:
    workflows:
      - CI
      - Post-merge Qualification
      - Research 0.14 B2 SmolLM3 Full
      - Research 0.14 Structural K3 Agent Utility
      - Research 0.14 Corrective Re-retrieval
      - Research 0.14 Corrective Shard Recovery
      - Research 0.14 Held-out Generalization
      - Research 0.14 Held-out Shard Recovery
      - Research 0.14 Final Answer
      - Research 0.14 Field Projection DEV
      - Research 0.14 Field Projection Confirmation
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: research-0.14-conveyor
  cancel-in-progress: false

jobs:
  advance:
    if: "${{ github.repository == 'JDeun/SchemaRouter' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.14"
      - name: Advance only preregistered ready stages
        env:
          GH_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          EVENT_NAME: "${{ github.event_name }}"
        run: |
          RECOVERY=()
          if [ "${EVENT_NAME}" = "schedule" ]; then
            RECOVERY+=(--recover-missing-k3)
          fi
          # Release-0.18 integration freeze (#1345/#1346): dry-run only.
          # Historical 0.14 artifacts stay immutable; do not dispatch another
          # costly #506 confirmation/retry while protected CI is prioritized.
          # Restore --execute only through a separately reviewed post-release PR.
          python scripts/research_014_conveyor.py \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --ref main \
            "${RECOVERY[@]}" \
            --state-out artifacts/research-0.14-conveyor-state.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: "research-0.14-conveyor-state-${{ github.run_id }}"
          path: artifacts/research-0.14-conveyor-state.json
          if-no-files-found: warn
          retention-days: 30
