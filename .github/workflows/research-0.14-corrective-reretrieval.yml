name: Research 0.14 Corrective Re-retrieval
run-name: Research 0.14 Corrective ${{ inputs.evidence_digest }} source=${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      evidence_digest:
        description: Exact canonical B2 artifact digest
        required: true
        type: string
      source_sha:
        description: Exact SchemaRouter source revision to freeze for this stage
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-0.14-corrective-${{ inputs.evidence_digest }}
  cancel-in-progress: false

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/src"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_CACHE_KEY: "b2-smollm3-arm64-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"
  B2_ATTN_IMPLEMENTATION: "sdpa"
  CANONICAL_B2_RUN: "36642658406"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: "${{ steps.matrix.outputs.matrix }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify exact successful B2 artifact digest without reading outcomes
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPOSITORY: "${{ github.repository }}"
          EXPECTED_DIGEST: "${{ inputs.evidence_digest }}"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          run_url = (
              "https://api.github.com/repos/"
              + os.environ["GH_REPOSITORY"]
              + "/actions/runs/"
              + os.environ["CANONICAL_B2_RUN"]
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          with urllib.request.urlopen(
              urllib.request.Request(run_url, headers=headers)
          ) as response:
              run = json.load(response)
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"

          page = 1
          matches = []
          while True:
              url = run_url + f"/artifacts?per_page=100&page={page}"
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers)
              ) as response:
                  payload = json.load(response)
              batch = payload.get("artifacts", [])
              matches.extend(
                  item
                  for item in batch
                  if item["name"].startswith("b2-smollm3-canonical-")
                  and not item["expired"]
              )
              if len(batch) < 100:
                  break
              page += 1
          assert len(matches) == 1, matches
          assert matches[0]["digest"] == os.environ["EXPECTED_DIGEST"]
          print("canonical B2 success + artifact digest verified; outcomes unopened")
          PY
      - name: Generate and validate independent corrective corpus
        run: |
          mkdir -p artifacts/corrective
          python scripts/generate_agent_utility_v6_corrective_corpus.py             --source-revision "${{ inputs.source_sha }}"             --out artifacts/corrective/corrective-corpus.json
          python scripts/validate_agent_utility_v6_corrective_corpus.py             --corpus artifacts/corrective/corrective-corpus.json
      - id: matrix
        name: Export frozen 180-job evaluation matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("artifacts/corrective/corrective-corpus.json")
              .read_text(encoding="utf-8")
          )
          ids = [str(task["semantic_task_id"]) for task in data["tasks"]]
          chunks = [ids[index:index + 3] for index in range(0, len(ids), 3)]
          include = []
          for catalog in (100, 250, 500):
              for index, chunk in enumerate(chunks):
                  include.append(
                      {
                          "job_id": f"c{catalog}-g{index:02d}",
                          "catalog_size": catalog,
                          "task_ids": ",".join(chunk),
                      }
                  )
          assert len(include) == 180
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  "matrix="
                  + json.dumps({"include": include}, separators=(",", ":"))
                  + "\n"
              )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "corrective-corpus-${{ github.run_id }}"
          path: artifacts/corrective/corrective-corpus.json
          if-no-files-found: error
          retention-days: 30

  model-cache:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - run: pip install -e .
      - id: hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Populate exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
          )
          PY
      - name: Publish exact model cache before evaluator fan-out
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Verify exact cached model offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python - <<'PY'
          import os
          from transformers import AutoConfig, AutoTokenizer

          AutoConfig.from_pretrained(
              os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
              local_files_only=True,
              trust_remote_code=False,
          )
          AutoTokenizer.from_pretrained(
              os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
              local_files_only=True,
              trust_remote_code=False,
          )
          PY

  evaluate:
    needs:
      - prepare
      - model-cache
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: "${{ fromJSON(needs.prepare.outputs.matrix) }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .
      - id: evaluator-hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Recover exact model revision after cache eviction
        if: steps.evaluator-hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
          )
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          name: "corrective-corpus-${{ github.run_id }}"
          path: artifacts/corrective
      - name: Verify exact ARM64 SDPA runtime
        run: |
          python - <<'PY'
          import os
          import platform
          import torch
          import transformers

          assert platform.python_version() == "3.12.14"
          assert platform.machine() in {"aarch64", "arm64"}
          assert os.environ["B2_ATTN_IMPLEMENTATION"] == "sdpa"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          PY
      - name: Evaluate frozen corrective shard
        run: |
          mkdir -p artifacts/corrective-shard
          python -u scripts/evaluate_agent_utility_v6_corrective.py             --corpus artifacts/corrective/corrective-corpus.json             --catalog-size "${{ matrix.catalog_size }}"             --task-ids "${{ matrix.task_ids }}"             --out "artifacts/corrective-shard/${{ matrix.job_id }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "corrective-shard-${{ matrix.job_id }}-${{ github.run_id }}"
          path: artifacts/corrective-shard/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: "${{ success() }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          name: "corrective-corpus-${{ github.run_id }}"
          path: artifacts/corrective
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7
        with:
          pattern: "corrective-shard-*-${{ github.run_id }}"
          path: artifacts/corrective-shards
      - name: Aggregate exact frozen corrective surface
        run: |
          python scripts/aggregate_agent_utility_v6_corrective.py             --input-dir artifacts/corrective-shards             --corpus artifacts/corrective/corrective-corpus.json             --out artifacts/corrective-reretrieval-canonical.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "corrective-reretrieval-canonical-${{ github.run_id }}"
          path: |
            artifacts/corrective-reretrieval-canonical.json
            artifacts/corrective/corrective-corpus.json
            benchmarks/agent-utility-v6-corrective-reretrieval-preregistration.json
          if-no-files-found: error
          retention-days: 30
