name: Original Public Demo REST G5 Full Chain E1

on:
  pull_request:
    paths:
      - "scripts/research_g5_jsonplaceholder_live_e1.py"
      - "tests/test_research_g5_jsonplaceholder_live_e1.py"
      - "src/schemarouter/native_graph_index.py"
      - "src/schemarouter/native_graph_execution.py"
      - "research/autoresearch/g5-jsonplaceholder-native-live-e1.md"
      - ".github/workflows/research-g5-jsonplaceholder-live-e1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g5-jsonplaceholder-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-original-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check original public demo REST contract and strict G5 execution path
        run: |
          python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1" "pyright>=1.1,<2"
          ruff check scripts/research_g5_jsonplaceholder_live_e1.py tests/test_research_g5_jsonplaceholder_live_e1.py
          python -m pytest -q tests/test_research_g5_jsonplaceholder_live_e1.py tests/test_native_graph_bound_one_hop.py
          pyright scripts/research_g5_jsonplaceholder_live_e1.py

  real-https-demo-provider:
    needs: offline-original-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original runtime without any model
        run: python -m pip install .
      - name: TWO real fixed-host demo-provider HTTPS calls under G5
        run: |
          python -m scripts.research_g5_jsonplaceholder_live_e1 --out artifacts/g5-jsonplaceholder-e1.json
      - name: Source-vs-E2 assertion and no leaked raw source fields
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("artifacts/g5-jsonplaceholder-e1.json").read_text())
          assert result["study"] == "G5_ORIGINAL_DEMO_HTTPS_TWO_BOUND_CALLS_E1_NOT_E2"
          assert result["source_provider"] == "jsonplaceholder.typicode.com"
          assert result["provider_is_demo_fabricated_content"] is True
          assert result["source_http_attempts"] == {"post": 1, "user": 1}
          assert result["source_responses_verified"] == {"post": 1, "user": 1}
          assert result["g5_original_conjunctive_candidate_count"] == 1
          assert result["complete_field_bindings_observed"] is True
          assert result["host_selected_original_post_and_tool_sequence"] is True
          assert result["model_selected_tools"] is False
          assert result["independent_provider_identity"] is False
          assert result["independent_agent_e2"] is False
          assert result["product_default_changed"] is False
          assert result["release_qualified"] is False
          assert "username" not in result and "userId" not in result
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## G5 original public DEMO provider: LIVE E1 transport, NOT E2\n\n")
              out.write("Actual original HTTPS GET /posts/1 and GET /users/{id} under G5-verified typed single scalar and original registered execution authority. Content is seeded FAKE data, operations and alias chosen by host, no multilingual understanding, no agent planning, no independent task oracle, no production use or v0.18 release approval.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: original-demo-public-g5-e1-${{ github.run_id }}
          path: artifacts/g5-jsonplaceholder-e1.json
          retention-days: 90
          if-no-files-found: warn

  real-https-host-approved-source-root:
    needs: offline-original-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original runtime (no model, no paid provider)
        run: python -m pip install .
      - name: Execute actual dynamic GET posts/11 then observed user ID on original HTTPS
        run: |
          python -m scripts.research_g5_jsonplaceholder_live_e1 --post-id 11 --out artifacts/g5-host-root-e1.json
      - name: Reject incomplete or inflated E1 provenance claims
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          d = json.loads(Path("artifacts/g5-host-root-e1.json").read_text())
          assert d["study"] == "G5_HOST_PARAMETERIZED_ORIGINAL_DEMO_HTTPS_E1_NOT_E2"
          assert d["provider_is_demo_fabricated_content"] is True
          assert d["host_parameterized_source_root"] is True
          assert d["host_source_arguments_explicitly_provided"] is True
          assert d["source_paths"] == ["/posts/11", "/users/{id}"]
          assert d["source_http_attempts"] == {"post": 1, "user": 1}
          assert d["source_responses_verified"] == {"post": 1, "user": 1}
          assert d["g5_original_conjunctive_candidate_count"] == 1
          assert d["complete_field_bindings_observed"] is True
          assert d["model_selected_tools"] is False
          assert d["independent_provider_identity"] is False
          assert d["independent_agent_e2"] is False
          assert d["release_qualified"] is False
          assert "userId" not in d and "username" not in d
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## G5 explicitly host-parameterized original HTTPS root: E1 demo, not E2\\n\\n")
              f.write("Observed public seeded-fake GET /posts/11, projected real post userId, then typed GET /users/{id}. Host independently chose post=11 and allowed both calls; no model/tool selection, no independent provider or downstream task qualification.\\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g5-host-approved-dynamic-demo-e1-${{ github.run_id }}
          path: artifacts/g5-host-root-e1.json
          retention-days: 90
          if-no-files-found: warn
