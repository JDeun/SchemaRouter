name: V4 Action-Guided Single-Pair BGE Diagnostic

on:
  push:
    branches:
      - "research/v4-action-guided-single-bge-diagnostic"
    paths:
      - ".github/workflows/research-v4-action-guided-single-bge.yml"
      - "benchmarks/operation-routing-v4-action-guided-single-bge.json"
      - "benchmarks/action_guided_single_bge.py"
      - "scripts/benchmark_decision_routing.py"
      - "scripts/analyze_operation_routing_v4_bounded_rerank.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "tests/test_action_guided_single_bge_v4.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: v4-action-guided-single-bge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate preregistration and contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-action-guided-single-bge.json >/dev/null
          ruff check benchmarks/action_guided_single_bge.py scripts/benchmark_decision_routing.py tests/test_action_guided_single_bge_v4.py
          pytest -q tests/test_action_guided_single_bge_v4.py tests/test_pairwise_decision_backend.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate frozen v4 DEV corpus
        run: |
          OUT="artifacts/v4-action-guided-single-bge"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out "${OUT}/corpus.json" \
            --manifest "${OUT}/corpus-manifest.json"
      - name: Audit corpus
        run: |
          OUT="artifacts/v4-action-guided-single-bge"
          python scripts/audit_operation_routing_corpus.py \
            --corpus "${OUT}/corpus.json" \
            --out "${OUT}/corpus-audit.json" \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50
      - name: Run current v4 paired baseline
        run: |
          OUT="artifacts/v4-action-guided-single-bge"
          python scripts/benchmark_decision_routing.py \
            --corpus "${OUT}/corpus.json" \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --counterbalanced \
            --warmup-cases 24 \
            --planner-name "keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 paired baseline" \
            --json-out "${OUT}/baseline-report.json"
      - name: Run raw action-guided single-pair BGE diagnostic
        run: |
          OUT="artifacts/v4-action-guided-single-bge"
          python scripts/benchmark_decision_routing.py \
            --corpus "${OUT}/corpus.json" \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --operation-fit-pairwise-callable benchmarks.action_guided_single_bge:score_pairs \
            --operation-fit-option-text-callable benchmarks.action_guided_single_bge:option_payload \
            --operation-fit-min-score 0.0 \
            --operation-fit-min-margin 0.0 \
            --operation-fit-threshold-application rank_then_gate \
            --operation-fit-scope all_candidates \
            --operation-fit-select-accepted \
            --counterbalanced \
            --warmup-cases 24 \
            --planner-name "keyword+semantic-recall+operation-fit-all-candidates+accepted-selector" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU action-guided single-pair BGE" \
            --json-out "${OUT}/diagnostic-report.json"
      - name: Derive DEV-only route-local frontier
        run: |
          OUT="artifacts/v4-action-guided-single-bge"
          python scripts/analyze_operation_routing_v4_bounded_rerank.py \
            --report "${OUT}/diagnostic-report.json" \
            --out "${OUT}/analysis.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-action-guided-single-bge-${{ github.run_id }}
          path: |
            artifacts/v4-action-guided-single-bge/baseline-report.json
            artifacts/v4-action-guided-single-bge/diagnostic-report.json
            artifacts/v4-action-guided-single-bge/analysis.json
            artifacts/v4-action-guided-single-bge/corpus-manifest.json
            artifacts/v4-action-guided-single-bge/corpus-audit.json
            benchmarks/operation-routing-v4-action-guided-single-bge.json
          if-no-files-found: error
          retention-days: 30
