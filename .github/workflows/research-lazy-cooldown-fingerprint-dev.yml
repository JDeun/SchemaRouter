name: Lazy Cooldown Fingerprint Exact Parity DEV CPU

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "src/schemarouter/executor.py"
      - "tests/test_lazy_fingerprint_cooldown_guard.py"
      - "scripts/research_lazy_fingerprint_cooldown_dev.py"
      - "research/autoresearch/lazy-cooldown-fingerprint-dev.md"
      - ".github/workflows/research-lazy-cooldown-fingerprint-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lazy-fingerprint-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-eager-versus-lazy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install source and no-model testing tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - name: Assert active expired stale and cross-principal cooldown safety
        run: python -m pytest -q tests/test_lazy_fingerprint_cooldown_guard.py
      - name: Compare 162 exact public authorized responses and CPU p95
        run: |
          python -m scripts.research_lazy_fingerprint_cooldown_dev \
            --sizes 100 250 500 \
            --output artifacts/lazy-cooldown-fingerprint/report.json
      - name: Preserve exact-result fingerprints and speed regressions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lazy-cooldown-fingerprint-dev-${{ github.run_id }}
          path: artifacts/lazy-cooldown-fingerprint/
          if-no-files-found: warn
          retention-days: 30
# Read-only Ubuntu CPU verification. No external provider, LLM, GPU,
# agent, release token or real tool call.
