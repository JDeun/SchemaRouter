name: E0 Disposition Rubric Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_task_disposition_rubric_e0.py"
      - "tests/test_research_task_disposition_rubric_e0.py"
      - "research/autoresearch/task-disposition-rubric-e0.md"
      - ".github/workflows/research-disposition-rubric-e0.yml"

permissions:
  contents: read

concurrency:
  group: e0-disposition-rubric-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rubric-and-denominators:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install no-model rubric test dependencies
        run: python -m pip install "pytest>=8,<10" "ruff>=0.6,<1"
      - name: Validate five-class rubric and existing no-fit contract
        run: |
          ruff check scripts/research_task_disposition_rubric_e0.py tests/test_research_task_disposition_rubric_e0.py
          python -m pytest -q tests/test_research_task_disposition_rubric_e0.py tests/test_no_fit_evidence_contract.py
      - name: Declare source-independent E2 evidence unavailable
        run: |
          echo "Only self-authored no-model E0 synthetic classification tests run." >> "$GITHUB_STEP_SUMMARY"
          echo "Independent publisher/tool-author E2 = 0/19. v0.18/default promotion HOLD." >> "$GITHUB_STEP_SUMMARY"
