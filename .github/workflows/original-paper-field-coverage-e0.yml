name: Original Paper Required Field Coverage E0

on:
  pull_request:
    paths:
      - "src/schemarouter/paper_field_retrieval.py"
      - "src/schemarouter/paper_field_plan.py"
      - "src/schemarouter/__init__.py"
      - "tests/test_paper_field_retrieval.py"
      - "tests/test_paper_field_plan.py"
      - "scripts/benchmark_paper_indexed_direct_e0.py"
      - "tests/test_benchmark_paper_indexed_direct_e0.py"
      - "scripts/research_paper_field_fixed5_agent_bridge.py"
      - "tests/test_research_paper_field_fixed5_agent_bridge.py"
      - "tests/test_paper_field_real_adapters.py"
      - "tests/test_native_graph_shared_root_forks.py"
      - "research/autoresearch/paper-field-union-implementation-e0.md"
      - "docs/superpowers/specs/2026-10-24-paper-algorithm1-toolcall-design.md"
      - "docs/superpowers/plans/2026-10-24-paper-algorithm1-toolcall.md"
      - ".github/workflows/original-paper-field-coverage-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-paper-field-completeness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original source, lint and no-model tests
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1" "pyright>=1.1.400,<2"
      - name: Source-coded original Algorithm 1 required-field union tests
        run: |
          ruff check src/schemarouter/paper_field_retrieval.py tests/test_paper_field_retrieval.py tests/test_paper_field_real_adapters.py src/schemarouter/__init__.py
          ruff check src/schemarouter/paper_field_plan.py tests/test_paper_field_plan.py
          ruff check scripts/benchmark_paper_indexed_direct_e0.py tests/test_benchmark_paper_indexed_direct_e0.py
          ruff check scripts/research_paper_field_fixed5_agent_bridge.py tests/test_research_paper_field_fixed5_agent_bridge.py
          pyright src/schemarouter/paper_field_retrieval.py src/schemarouter/paper_field_plan.py scripts/benchmark_paper_indexed_direct_e0.py
          pyright scripts/research_paper_field_fixed5_agent_bridge.py
          python -m pytest -q tests/test_paper_field_retrieval.py tests/test_paper_field_real_adapters.py tests/test_native_graph_shared_root_forks.py tests/test_native_field_group_retrieval.py
          python -m pytest -q tests/test_paper_field_plan.py tests/test_native_graph_host_root.py
          python -m pytest -q tests/test_benchmark_paper_indexed_direct_e0.py
          python -m pytest -q tests/test_research_paper_field_fixed5_agent_bridge.py
