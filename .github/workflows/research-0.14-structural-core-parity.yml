name: Research 0.14 Structural Core Parity

on:
  workflow_dispatch:
  push:
    branches:
      - "research/0.14-structural-parity-run"
    paths:
      - ".github/structural-parity-trigger.json"

permissions:
  contents: read

concurrency:
  group: research-0.14-structural-core-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run structural unit tests
        run: |
          pytest -q tests/test_structural_retrieval.py
      - name: Verify exact research/core Top-10 parity
        run: |
          mkdir -p artifacts/structural-core-parity
          python scripts/verify_agent_utility_v5_structural_core_parity.py \
            --out artifacts/structural-core-parity/result.json
      - name: Verify confirmation remains sealed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/structural-core-parity/result.json")
              .read_text(encoding="utf-8")
          )
          assert data["candidate"] == "STRUCT-4.5-1.5"
          assert data["row_count"] == 720
          assert data["supported_row_count"] == 540
          assert data["top10_positions_checked"] == 7200
          assert data["exact_route_and_score_parity"] is True
          assert data["confirmation_surface_used"] is False
          assert data["product_default_enabled"] is False
          print(json.dumps(data, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "structural-core-parity-${{ github.run_id }}"
          path: artifacts/structural-core-parity/
          if-no-files-found: error
          retention-days: 30
