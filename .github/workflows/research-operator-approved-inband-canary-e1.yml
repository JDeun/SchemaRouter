name: Operator Approved Inband Open Meteo Canary E1

on:
  pull_request:
    paths:
      - "scripts/research_operator_approved_inband_canary_e1.py"
      - "tests/test_research_operator_approved_inband_canary_e1.py"
      - "research/autoresearch/operator-approved-inband-canary-e1.md"
      - ".github/workflows/research-operator-approved-inband-canary-e1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inband-no-network-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install bounded source and contract checks
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Verify in-band canary does not forge health and never exceeds budget
        run: |
          ruff check scripts/research_operator_approved_inband_canary_e1.py tests/test_research_operator_approved_inband_canary_e1.py
          pyright scripts/research_operator_approved_inband_canary_e1.py
          python -m pytest -q tests/test_research_operator_approved_inband_canary_e1.py tests/test_research_long_lived_real_open_meteo_e1.py

  bounded-real-inband-source-probe:
    needs: inband-no-network-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original bound source only
        run: python -m pip install ".[mcp]"
      - name: Explicit one-shot fixed <=6 actual public canary+source GETs
        run: |
          mkdir -p artifacts/open-meteo-inband-e1
          python -m scripts.research_operator_approved_inband_canary_e1 \
            --operator-approves-inband-business-gets > artifacts/open-meteo-inband-e1/summary.json
      - name: Publish and enforce evidence boundary without claiming uptime
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("artifacts/open-meteo-inband-e1/summary.json").read_text(encoding="utf-8"))
          assert report["evidence_tier"] == "OPERATOR_APPROVED_INBAND_PUBLIC_ENDPOINT_CANARY_E1_NOT_E2"
          assert report["schema_version"] == 1
          assert report["status"] in {
              "success", "probe_bootstrap_timeout", "inband_canary_unhealthy",
              "source_now_unavailable", "source_execution_rejected",
          }
          assert report["external_business_requests_maximum"] == 6
          assert 0 <= report["actual_https_get_attempts"] <= 6
          assert set(report["actual_get_attempts_by_endpoint"]) == {"geocoding","forecast"}
          assert sum(report["actual_get_attempts_by_endpoint"].values()) == report["actual_https_get_attempts"]
          assert set(report["actual_inband_canary_attempts_by_endpoint"]) == {"geocoding","forecast"}
          assert all(0 <= n <= 1 for n in report["actual_inband_canary_attempts_by_endpoint"].values())
          assert report["observed_native_calls_completed"] in (0, 1, 2)
          assert report["canary_uses_actual_business_endpoint"] is True
          for key in (
              "independent_dedicated_health_endpoint_verified",
              "long_term_availability_verified", "model_selected_routes",
              "independent_e2_qualified", "production_default_changed",
          ):
              assert report[key] is False
          assert report["model_generations"] == 0
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Explicit IN-BAND real Open-Meteo canary (NOT independent health API)\n\n")
              f.write(f"Observed result: **{report['status']}**. Canaries consume ACTUAL public data endpoint GET quota.\n\n")
              p = report["actual_inband_canary_attempts_by_endpoint"]
              v = report["actual_get_attempts_by_endpoint"]
              f.write(f"Canary GET attempts: geocoding {p['geocoding']}, forecast {p['forecast']}.\n\n")
              f.write(f"All source GET attempts: geocoding {v['geocoding']}, forecast {v['forecast']} = {report['actual_https_get_attempts']}/6. Native calls completed: {report['observed_native_calls_completed']}/2.\n\n")
              f.write("Not a source-designated independent health endpoint, sustained outage/recovery, uptime SLO or model correctness evaluation.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-inband-open-meteo-e1
          path: artifacts/open-meteo-inband-e1/summary.json
          retention-days: 30
          if-no-files-found: error
