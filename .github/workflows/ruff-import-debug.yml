name: Ruff Import Debug

on:
  push:
    branches: [fix/0.7-adversarial-hardening]

permissions:
  contents: read

jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.8"
      - name: Show Ruff import fix
        run: |
          ruff check --select I --fix --diff src/schemarouter/models.py || true
