name: Public Execution Wrappers DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "src/schemarouter/field_routing_session.py"
      - "src/schemarouter/__init__.py"
      - "benchmarks/public-execution-entrypoints-v1.json"
      - "benchmarks/public-execution-wiring-v1.json"
      - "tests/test_public_execution_wrappers.py"
      - "tests/test_public_execution_entrypoint_inventory.py"
      - "tests/test_public_execution_method_inventory.py"
      - ".github/workflows/public-execution-wrappers-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registered-public-wrapper-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install deterministic registered invoker test dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Validate exact public execution entrypoints and test contracts
        run: |
          ruff check tests/test_public_execution_wrappers.py tests/test_public_execution_entrypoint_inventory.py
          python -m pytest -q tests/test_public_execution_entrypoint_inventory.py tests/test_public_execution_method_inventory.py tests/test_public_execution_wiring_contract.py
      - name: Verify real registered callable dispatch and denied principal
        run: python -m pytest -q tests/test_public_execution_wrappers.py
