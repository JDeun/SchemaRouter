name: Graph Semantic Seed Development

on:
  pull_request:
    paths:
      - ".github/workflows/research-operation-graph-semantic-seed.yml"
      - "src/schemarouter/decisions.py"
      - "src/schemarouter/planner.py"
      - "src/schemarouter/models.py"
      - "scripts/benchmark_decision_routing.py"
      - "scripts/compare_graph_semantic_seed.py"
      - "scripts/generate_decision_routing_graph_v1.py"
      - "benchmarks/operation-fit-0.10-graph-cycle.json"
      - "tests/test_embedding_decision_backend.py"
      - "tests/test_graph_routing.py"
      - "tests/test_graph_semantic_seed_comparison.py"
      - "tests/test_operation_graph_protocol.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  GRAPH_DEV_SEED: "graph-v1-development-2026-09-26"

concurrency:
  group: operation-graph-semantic-seed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate semantic graph seed contracts
        run: |
          pytest -q             tests/test_embedding_decision_backend.py             tests/test_graph_routing.py             tests/test_graph_semantic_seed_comparison.py             tests/test_graph_dev_generator.py             tests/test_operation_graph_protocol.py

  sweep:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: s025-m010
            min_similarity: "0.25"
            min_margin: "0.10"
          - tag: s035-m010
            min_similarity: "0.35"
            min_margin: "0.10"
          - tag: s045-m010
            min_similarity: "0.45"
            min_margin: "0.10"
          - tag: s035-m015
            min_similarity: "0.35"
            min_margin: "0.15"
          - tag: s045-m015
            min_similarity: "0.45"
            min_margin: "0.15"
          - tag: s055-m015
            min_similarity: "0.55"
            min_margin: "0.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate fresh graph-v1 development corpus
        run: |
          mkdir -p artifacts/semantic-seed
          python scripts/generate_decision_routing_graph_v1.py             --seed "${GRAPH_DEV_SEED}"             --source-revision "${SCHEMAROUTER_SOURCE_REVISION}"             --out artifacts/semantic-seed/corpus.json             --manifest artifacts/semantic-seed/corpus-manifest.json
      - name: Run counterbalanced semantic graph seed candidate
        run: |
          BASELINE="keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation"
          CANDIDATE="keyword+graph-operation+graph-semantic-seed+selective-semantic-recall+selective-capability-fit+selective-operation-fit+selective-endpoint-disambiguation"
          python scripts/benchmark_decision_routing.py             --corpus artifacts/semantic-seed/corpus.json             --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed             --candidate-recall-limit 2             --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed             --candidate-fit-min-similarity 0.25             --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs             --operation-fit-min-score 0.01             --operation-fit-min-margin 0.0             --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed             --endpoint-disambiguation-min-margin 0.03             --graph-operation-gate             --graph-semantic-seed-embedding-callable benchmarks.multilingual_embedder:embed             --graph-semantic-seed-min-similarity "${{ matrix.min_similarity }}"             --graph-semantic-seed-min-margin "${{ matrix.min_margin }}"             --counterbalanced             --warmup-cases 24             --planner-name "${BASELINE}"             --planner-name "${CANDIDATE}"             --hardware-label "GitHub Actions ubuntu-latest x64 CPU counterbalanced"             --json-out "artifacts/semantic-seed/${{ matrix.tag }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-graph-semantic-seed-${{ matrix.tag }}-${{ github.run_id }}
          path: |
            artifacts/semantic-seed/${{ matrix.tag }}.json
            artifacts/semantic-seed/corpus-manifest.json
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: sweep
    if: always() && needs.sweep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: operation-graph-semantic-seed-*-${{ github.run_id }}
          path: artifacts/reports
          merge-multiple: true
      - name: Apply preregistered semantic-seed development gates
        shell: bash
        run: |
          REPORT_ARGS=()
          for report in artifacts/reports/s*-m*.json; do
            REPORT_ARGS+=(--report "${report}")
          done
          mkdir -p artifacts/comparison
          python scripts/compare_graph_semantic_seed.py             "${REPORT_ARGS[@]}"             --out artifacts/comparison/comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-graph-semantic-seed-comparison-${{ github.run_id }}
          path: artifacts/comparison/comparison.json
          if-no-files-found: error
          retention-days: 30
