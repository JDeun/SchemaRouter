name: Research 0.14 B2 SmolLM3 Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify B2 protocol and canonical freeze
        run: |
          pytest -q tests/test_agent_utility_b2_protocol.py
          python scripts/generate_agent_utility_b2_freeze.py \
            --out-dir artifacts/b2-freeze
          python scripts/verify_agent_utility_b2_candidate_sets.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b2-smollm3-protocol-${{ github.run_id }}
          path: artifacts/b2-freeze/
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .
      - name: Verify exact B2 smoke runtime
        run: |
          python - <<'PY'
          import platform
          import safetensors
          import tokenizers
          import torch
          import transformers

          assert platform.python_version() == "3.12.14"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          assert tokenizers.__version__ == "0.22.2"
          assert safetensors.__version__ == "0.8.0"
          print("exact B2 smoke runtime verified")
          PY
      - name: Run frozen SmolLM3 two-turn smoke
        run: |
          mkdir -p artifacts/b2-smoke
          python scripts/smoke_smollm3_tool_call.py \
            | tee artifacts/b2-smoke/smoke-output.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: b2-smollm3-smoke-${{ github.run_id }}
          path: artifacts/b2-smoke/
          if-no-files-found: warn
          retention-days: 30
