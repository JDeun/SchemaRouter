name: V4 BGE + Kev Noul Composition

on:
  workflow_dispatch:
    inputs:
      kev_artifact_id:
        description: "Artifact ID from terminal Kev workflow run 36366508183"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"
  KEV_SOURCE_RUN_ID: "36366508183"

concurrency:
  group: v4-bge-kev-noul-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate composition contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-bge-kev-noul-compose.json >/dev/null
          ruff check scripts/analyze_bge_kev_noul_compose_v4.py tests/test_bge_kev_noul_compose_v4.py
          pytest -q tests/test_bge_kev_noul_compose_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"

      - name: Validate and download exact Kev source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          KEV_ARTIFACT_ID: ${{ inputs.kev_artifact_id }}
        run: |
          mkdir -p /tmp/kev-artifact
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${KEV_ARTIFACT_ID}" \
            -o /tmp/kev-meta.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("/tmp/kev-meta.json").read_text())
          expected_run = int(os.environ["KEV_SOURCE_RUN_ID"])
          actual_run = int(data["workflow_run"]["id"])
          if actual_run != expected_run:
              raise SystemExit(
                  f"Kev artifact run mismatch: expected {expected_run}, got {actual_run}"
              )
          if data.get("expired"):
              raise SystemExit("Kev source artifact is expired")
          expected_name = f"v4-kev-08b-system-one-{expected_run}"
          if data.get("name") != expected_name:
              raise SystemExit(
                  f"Kev artifact name mismatch: expected {expected_name!r}, "
                  f"got {data.get('name')!r}"
              )
          print(f"validated Kev artifact id={data['id']} run={actual_run}")
          PY

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${KEV_ARTIFACT_ID}/zip" \
            -o /tmp/kev-artifact.zip
          unzip -q /tmp/kev-artifact.zip -d /tmp/kev-artifact

          KEV_ANALYSIS="$(find /tmp/kev-artifact -type f -name analysis.json -print -quit)"
          if [ -z "${KEV_ANALYSIS}" ]; then
            echo "Kev analysis.json not found"
            find /tmp/kev-artifact -maxdepth 5 -type f -print
            exit 1
          fi
          echo "KEV_ANALYSIS=${KEV_ANALYSIS}" >> "${GITHUB_ENV}"

      - name: Generate immutable v4 tuning DEV
        run: |
          OUT="artifacts/v4-bge-kev-noul-compose"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out "${OUT}/corpus.json" \
            --manifest "${OUT}/corpus-manifest.json"

      - name: Verify corpus identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/v4-bge-kev-noul-compose/corpus-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          actual = manifest.get("corpus_sha256")
          expected = os.environ["V4_DEV_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"corpus SHA mismatch: expected {expected}, got {actual}"
              )
          if manifest.get("case_count") != 1800:
              raise SystemExit(
                  f"unexpected case count: {manifest.get('case_count')}"
              )
          print(f"verified corpus sha256={actual}")
          PY

      - name: Run offline BGE + Kev noul composition
        run: |
          OUT="artifacts/v4-bge-kev-noul-compose"
          python scripts/analyze_bge_kev_noul_compose_v4.py \
            --corpus "${OUT}/corpus.json" \
            --kev-analysis "${KEV_ANALYSIS}" \
            --out "${OUT}/analysis.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-bge-kev-noul-compose-${{ github.run_id }}
          path: |
            artifacts/v4-bge-kev-noul-compose/analysis.json
            artifacts/v4-bge-kev-noul-compose/corpus-manifest.json
            benchmarks/operation-routing-v4-bge-kev-noul-compose.json
          if-no-files-found: error
          retention-days: 30
