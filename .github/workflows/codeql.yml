name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - name: Research-only CodeQL security rule identifiers (no paths or source)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          path = Path("..") / "results" / "python.sarif"
          if not path.is_file():
              print("security rule diagnostic unavailable")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              counts = collections.Counter()
              for run in data.get("runs", []):
                  rules = {
                      r.get("id"): r.get("properties", {})
                      for r in run.get("tool", {}).get("driver", {}).get("rules", [])
                  }
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId", "unknown")
                      prop = rules.get(rule_id, {})
                      try:
                          severity = float(prop.get("security-severity", 0))
                      except (ValueError, TypeError):
                          severity = 0
                      if severity >= 7:
                          counts[rule_id] += 1
              print("SANITIZED_SECURITY_RULE_COUNTS", sorted(counts.items()))
          PY
