name: Public Top-Level Execution Exports DEV

on:
  pull_request:
    paths:
      - "scripts/research_legacy_concept_retrieval.py"
      - "scripts/research_legacy_indexed_concept_graph.py"
      - "scripts/research_legacy_native_fork.py"
      - "scripts/research_legacy_fork_arm.py"
      - "src/schemarouter/__init__.py"
      - "scripts/research_legacy_planning/**"
      - "src/schemarouter/models.py"
      - "tests/test_legacy_plan_metadata_boundary.py"
      - "tests/test_retrieval_abstention.py"
      - "tests/test_retrieval_execution_gate.py"
      - "tests/test_paper_consumer_execution.py"
      - "tests/test_paper_understood_observed_graph_a9_e0.py"
      - "tests/test_public_export_surface_static_inventory.py"
      - "scripts/research_legacy_paper_graph_execution.py"
      - "scripts/research_legacy_paper_observed_binding.py"
      - "scripts/research_legacy_paper_field_retrieval.py"
      - "scripts/research_legacy_paper_typed_plan.py"
      - "scripts/research_legacy_paper_consumer_execution.py"
      - "tests/test_paper_observed_binding.py"
      - "benchmarks/public-execution-export-inventory-v1.json"
      - "benchmarks/public-method-boundary-v1.json"
      - "src/schemarouter/runtime.py"
      - "src/schemarouter/field_routing_session.py"
      - "tests/test_public_top_level_execution_exports.py"
      - "tests/test_public_method_boundary_inventory.py"
      - ".github/workflows/public-top-level-execution-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exported-registered-native-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install registered local invoker and test dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Verify current export inventory and historical graph execution proofs
        run: |
          ruff check tests/test_public_top_level_execution_exports.py tests/test_public_method_boundary_inventory.py tests/test_public_export_surface_static_inventory.py
          python -m pytest -q tests/test_public_method_boundary_inventory.py tests/test_public_export_surface_static_inventory.py tests/test_public_top_level_execution_exports.py -k "inventory or exports_match or standalone_executing"
          python -m pytest -q \
            tests/test_paper_consumer_execution.py::test_original_producer_and_each_consumer_execute_once_with_observed_id \
            tests/test_paper_consumer_execution.py::test_consumer_revokes_another_leaf_and_stops_without_partial_receipt \
            tests/test_paper_understood_observed_graph_a9_e0.py::test_registered_executor_observes_exact_named_path_and_binds_each_edge \
            tests/test_paper_understood_observed_graph_a9_e0.py::test_midflight_permission_revocation_blocks_downstream
      - name: Regress historical producer-only Field Union observation separately
        run: python -m pytest -q tests/test_paper_observed_binding.py
      - name: Verify product and historical plan wire separation
        run: python -m pytest -q tests/test_legacy_plan_metadata_boundary.py
      - name: Regress historical selective execution separately (not a product route)
        run: |
          python -m pytest -q tests/test_retrieval_abstention.py tests/test_retrieval_execution_gate.py tests/test_public_top_level_execution_exports.py -k "not inventory and not standalone_executing and not exports_match"
