name: Public Top-Level Execution Exports DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/__init__.py"
      - "src/schemarouter/retrieval_execution_gate.py"
      - "src/schemarouter/paper_consumer_execution.py"
      - "benchmarks/public-execution-export-inventory-v1.json"
      - "tests/test_public_top_level_execution_exports.py"
      - ".github/workflows/public-top-level-execution-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exported-registered-native-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install registered local invoker and test dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Verify full public export inventory and real top-level tool execution
        run: |
          ruff check tests/test_public_top_level_execution_exports.py
          python -m pytest -q tests/test_public_top_level_execution_exports.py
