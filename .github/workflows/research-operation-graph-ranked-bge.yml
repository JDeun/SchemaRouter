name: Graph Ranked Selective BGE Development

on:
  pull_request:
    paths:
      - ".github/workflows/research-operation-graph-ranked-bge.yml"
      - "src/schemarouter/decisions.py"
      - "src/schemarouter/pairwise.py"
      - "src/schemarouter/planner.py"
      - "src/schemarouter/models.py"
      - "scripts/benchmark_decision_routing.py"
      - "scripts/compare_graph_ranked_bge.py"
      - "scripts/generate_decision_routing_graph_v1.py"
      - "benchmarks/operation-fit-0.10-graph-cycle.json"
      - "benchmarks/operation-fit-0.10-graph-ranked-bge-dev-plan.json"
      - "tests/test_embedding_decision_backend.py"
      - "tests/test_pairwise_decision_backend.py"
      - "tests/test_graph_routing.py"
      - "tests/test_graph_ranked_bge_comparison.py"
      - "tests/test_operation_graph_protocol.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  GRAPH_DEV_SEED: "graph-v1-development-2026-09-26"

concurrency:
  group: operation-graph-ranked-bge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate ranked selective-BGE contracts
        run: |
          pytest -q \
            tests/test_embedding_decision_backend.py \
            tests/test_pairwise_decision_backend.py \
            tests/test_graph_routing.py \
            tests/test_graph_ranked_bge_comparison.py \
            tests/test_graph_dev_generator.py \
            tests/test_operation_graph_protocol.py

  sweep:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ranked_limit: [2, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate fresh graph-v1 development corpus
        run: |
          mkdir -p artifacts/ranked-bge
          python scripts/generate_decision_routing_graph_v1.py \
            --seed "${GRAPH_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out artifacts/ranked-bge/corpus.json \
            --manifest artifacts/ranked-bge/corpus-manifest.json
      - name: Run counterbalanced ranked selective-BGE candidate
        run: |
          BASELINE="keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation"
          CANDIDATE="keyword+graph-operation+graph-semantic-seed+graph-propagation+selective-semantic-recall+selective-capability-fit+selective-operation-fit+selective-endpoint-disambiguation"
          python scripts/benchmark_decision_routing.py \
            --corpus artifacts/ranked-bge/corpus.json \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --graph-operation-gate \
            --graph-semantic-seed-embedding-callable benchmarks.multilingual_embedder:embed \
            --graph-semantic-seed-min-similarity 0.45 \
            --graph-semantic-seed-min-margin 0.10 \
            --graph-semantic-direct-min-similarity 0.55 \
            --graph-semantic-direct-min-margin 0.15 \
            --graph-semantic-propagation \
            --graph-semantic-propagation-scope ranked \
            --graph-semantic-propagation-limit "${{ matrix.ranked_limit }}" \
            --graph-semantic-propagation-on-abstain reject \
            --counterbalanced \
            --warmup-cases 24 \
            --planner-name "${BASELINE}" \
            --planner-name "${CANDIDATE}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU ranked selective BGE" \
            --json-out "artifacts/ranked-bge/ranked-k${{ matrix.ranked_limit }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-graph-ranked-bge-k${{ matrix.ranked_limit }}-${{ github.run_id }}
          path: |
            artifacts/ranked-bge/ranked-k${{ matrix.ranked_limit }}.json
            artifacts/ranked-bge/corpus-manifest.json
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: sweep
    if: always() && needs.sweep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: operation-graph-ranked-bge-*-${{ github.run_id }}
          path: artifacts/reports
          merge-multiple: true
      - name: Apply preregistered ranked selective-BGE gates
        shell: bash
        run: |
          REPORT_ARGS=()
          for report in artifacts/reports/ranked-k*.json; do
            REPORT_ARGS+=(--report "${report}")
          done
          mkdir -p artifacts/comparison
          python scripts/compare_graph_ranked_bge.py \
            "${REPORT_ARGS[@]}" \
            --out artifacts/comparison/comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-graph-ranked-bge-comparison-${{ github.run_id }}
          path: artifacts/comparison/comparison.json
          if-no-files-found: error
          retention-days: 30
