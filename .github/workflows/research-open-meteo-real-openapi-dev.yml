name: Authentic Open-Meteo OpenAPI DEV CPU Contract

on:
  pull_request:
    paths:
      - "scripts/research_open_meteo_real_openapi_dev.py"
      - "tests/test_research_open_meteo_real_openapi_dev.py"
      - "benchmarks/open-meteo-openapi-real-source-dev-manifest.json"
      - "research/autoresearch/open-meteo-real-openapi-dev.md"
      - ".github/workflows/research-open-meteo-real-openapi-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-open-meteo-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-source-contract-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install current source plus offline YAML test dependencies
        run: python -m pip install . "PyYAML>=6,<7" "pytest>=8,<10" "pytest-asyncio>=0.23"
      - name: Validate source identity and source-only public router contract tests
        run: python -m pytest -q tests/test_research_open_meteo_real_openapi_dev.py
      - name: Download exactly nine publisher-authored OpenAPI 3.1 documents
        shell: bash
        run: |
          set -euo pipefail
          commit=b0ff3ebbbafa890000ab8bc5f9598a2e4ef64dc4
          dir=artifacts/open-meteo-real-schemas/source
          mkdir -p "$dir"
          for name in air-quality climate elevation ensemble flood forecast historical-weather marine seasonal; do
            curl --fail --silent --show-error --location \
              --retry 2 --connect-timeout 15 --max-time 90 \
              "https://raw.githubusercontent.com/open-meteo/open-meteo/$commit/openapi/$name.yml" \
              --output "$dir/$name.yml"
            test -s "$dir/$name.yml"
          done
          python - <<'PY'
          import hashlib,json,pathlib
          manifest=json.loads(pathlib.Path("benchmarks/open-meteo-openapi-real-source-dev-manifest.json").read_text())
          root=pathlib.Path("artifacts/open-meteo-real-schemas/source")
          for name, record in manifest["docs"].items():
              raw=(root/f"{name}.yml").read_bytes()
              fingerprint=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              assert fingerprint == record["git_blob_sha1"], (name,fingerprint)
              print(name, "git_blob", fingerprint, "bytes", len(raw), "sha256", hashlib.sha256(raw).hexdigest())
          PY
      - name: Evaluate exact current OpenAPI adapters and read-only authenticated-boundary simulation
        run: |
          python -m scripts.research_open_meteo_real_openapi_dev \
            --manifest benchmarks/open-meteo-openapi-real-source-dev-manifest.json \
            --source-dir artifacts/open-meteo-real-schemas/source \
            --output artifacts/open-meteo-real-schemas/report.json
      - name: Preserve original source, failures and route/field diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-open-meteo-schema-dev-${{ github.run_id }}
          path: artifacts/open-meteo-real-schemas/
          if-no-files-found: warn
          retention-days: 90
# Open-Meteo official CC BY 4.0 provider OpenAPI docs, source commit fixed.
# The experiment downloads original documentation ONLY, not the live APIs.
# Simulated viewer is not an authenticated host principal. No real tool calls,
# models, GPU, paid APIs, external coding agents, release or policy promotion.
