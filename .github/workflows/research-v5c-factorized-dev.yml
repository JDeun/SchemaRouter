name: Research V5C Factorized DEV

on:
  push:
    branches:
      - "research/0.12-factorized-resource-action"
    paths:
      - ".github/workflows/research-v5c-factorized-dev.yml"
      - "benchmarks/operation-routing-v5c-factorized-preregistration.json"
      - "benchmarks/factorized_resource_action.py"
      - "benchmarks/operation_routing_v5c_catalog.py"
      - "scripts/generate_operation_routing_v5c.py"
      - "scripts/evaluate_factorized_resource_action_v5c.py"
      - "tests/test_factorized_resource_action.py"
      - "tests/test_operation_routing_v5c_protocol.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FREEZE_SOURCE: "780c7d25aa11a41ca441f260691d398ff313aaf0"
  DEV_SHA256: "78b16324173f60ac2ec6b6c1adb2a8a957fef6c29e16c9607b1b39d0e2181df2"
  CONFIRM_SHA256: "3d514cae9fb20992481d9f67330b80f255930578546ddcf0a7e8fb31ab192951"

concurrency:
  group: research-v5c-factorized-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify frozen algorithm and corpus source
        run: |
          git diff --exit-code "${FREEZE_SOURCE}" --             benchmarks/factorized_resource_action.py             benchmarks/operation_routing_v5c_catalog.py             scripts/generate_operation_routing_v5c.py
      - name: Validate protocol
        run: |
          python -m json.tool benchmarks/operation-routing-v5c-factorized-preregistration.json >/dev/null
          ruff check             benchmarks/factorized_resource_action.py             benchmarks/operation_routing_v5c_catalog.py             scripts/generate_operation_routing_v5c.py             scripts/evaluate_factorized_resource_action_v5c.py             tests/test_factorized_resource_action.py             tests/test_operation_routing_v5c_protocol.py
          pytest -q             tests/test_factorized_resource_action.py             tests/test_operation_routing_v5c_protocol.py

  evaluate-development:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"

      - name: Recreate both frozen corpora
        run: |
          python scripts/generate_operation_routing_v5c.py             --out-dir artifacts/operation-routing-v5c

      - name: Verify both identities before scoring
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/operation-routing-v5c")
          dev = json.loads((root / "development-manifest.json").read_text())
          confirm = json.loads((root / "confirmation-manifest.json").read_text())
          if dev["corpus_sha256"] != os.environ["DEV_SHA256"]:
              raise SystemExit("development corpus SHA mismatch")
          if confirm["corpus_sha256"] != os.environ["CONFIRM_SHA256"]:
              raise SystemExit("confirmation corpus SHA mismatch")
          if dev["case_count"] != 504 or confirm["case_count"] != 552:
              raise SystemExit("frozen corpus case-count mismatch")
          print("both 0.12-C corpus identities verified; confirmation remains unscored")
          PY

      - name: Score development only
        run: |
          python scripts/evaluate_factorized_resource_action_v5c.py             --surface development             --corpus artifacts/operation-routing-v5c/development.json             --out artifacts/operation-routing-v5c/development-analysis.json

      - name: Validate governance and authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/operation-routing-v5c/development-analysis.json")
              .read_text(encoding="utf-8")
          )
          policy = data["policy"]
          if any(policy.values()):
              raise SystemExit("research-governance invariant failed")
          metrics = data["metrics"]
          if metrics["authority_violations"] != 0:
              raise SystemExit("authority violation")
          if metrics["execution_errors"] != 0:
              raise SystemExit("execution error")
          print("development_pass=", data["surface_pass"])
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operation-routing-v5c-dev-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v5c/development-analysis.json
            artifacts/operation-routing-v5c/development-manifest.json
            artifacts/operation-routing-v5c/confirmation-manifest.json
            benchmarks/operation-routing-v5c-factorized-preregistration.json
          if-no-files-found: warn
          retention-days: 30
