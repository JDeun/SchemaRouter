  laya-integration:
    needs: changes
    if: ${{ needs.changes.outputs.laya == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Contract tests do not need CUDA. Satisfy Laya's torch dependency from the
      # official CPU wheel index so CI does not download multi-gigabyte CUDA wheels.
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
