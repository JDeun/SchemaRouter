name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -m "not mcp_integration"
      - run: python examples/quickstart.py
      - run: python examples/database_quickstart.py
      - run: python scripts/consumer_acceptance.py

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -m "not mcp_integration"
      - run: python examples/quickstart.py
      - run: python examples/database_quickstart.py
      - run: python scripts/consumer_acceptance.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp,langchain,langgraph,llamaindex,jev,otel,database]"
      - run: pyright

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp,langchain,langgraph,llamaindex,jev,otel,database]"
      - run: pytest -q --cov=schemarouter --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
      - run: >-
          pytest -q
          tests/test_graph_native_adapters.py
          tests/test_falkordb_native_adapter.py
          tests/test_vector_native_adapters.py
          tests/test_record_native_adapters.py
          tests/test_record_native_extended_adapters.py
          --cov=schemarouter.adapters.graph_native
          --cov=schemarouter.adapters.vector_native
          --cov=schemarouter.adapters.record_native
          --cov-config=.coveragerc-native
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=60
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install "pytest>=8.2" "pytest-asyncio>=0.23" "hypothesis>=6.130,<7"
      - run: pip install "httpx==0.27.0" "jsonschema==4.23.0" "pydantic==2.8.0" "pyyaml==6.0.0"
      - run: pip install -e . --no-deps
      - run: pytest -q -m "not mcp_integration"
      - run: python examples/quickstart.py
      - run: python examples/database_quickstart.py
      - run: python scripts/consumer_acceptance.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: pip install "pip-audit>=2.9,<4"
      - run: python -m pip check
      - run: pip-audit --strict .

  package-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Verify license is packaged
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(name.endswith("/licenses/LICENSE") for name in names), names
          PY
      - run: python -m venv /tmp/schemarouter-wheel
      - run: /tmp/schemarouter-wheel/bin/python -m pip install --upgrade pip
      - run: /tmp/schemarouter-wheel/bin/pip install dist/*.whl
      - run: /tmp/schemarouter-wheel/bin/python -c "from importlib.metadata import version; import schemarouter; assert schemarouter.__version__ == version('schemarouter')"
      - run: /tmp/schemarouter-wheel/bin/schemarouter --help
      - name: Publish immutable package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  package-adapter-plugin:
    needs: package-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist
      - run: python -m venv /tmp/schemarouter-wheel-adapter-plugin
      - run: /tmp/schemarouter-wheel-adapter-plugin/bin/python -m pip install --upgrade pip
      - name: Install built wheel and downstream adapter distribution
        run: |
          WHEEL="$(pwd)/$(ls dist/*.whl)"
          /tmp/schemarouter-wheel-adapter-plugin/bin/pip install "$WHEEL"
          /tmp/schemarouter-wheel-adapter-plugin/bin/pip install --no-deps examples/adapter_plugin_demo
          /tmp/schemarouter-wheel-adapter-plugin/bin/pip check
      - name: Exercise downstream adapter plugin against built wheel
        run: /tmp/schemarouter-wheel-adapter-plugin/bin/python scripts/downstream_adapter_plugin_smoke.py

  package-pydanticai:
    needs: package-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist
      - run: python -m venv /tmp/schemarouter-wheel-pydanticai
      - run: /tmp/schemarouter-wheel-pydanticai/bin/python -m pip install --upgrade pip
      - name: Install built wheel and pinned PydanticAI validation dependency
        run: |
          WHEEL="$(pwd)/$(ls dist/*.whl)"
          /tmp/schemarouter-wheel-pydanticai/bin/pip install "$WHEEL"
          /tmp/schemarouter-wheel-pydanticai/bin/pip install -r examples/external_validation/pydanticai-tool-search/requirements.txt
          /tmp/schemarouter-wheel-pydanticai/bin/pip check
      - name: Run PydanticAI ToolSearch external validation
        run: |
          /tmp/schemarouter-wheel-pydanticai/bin/python scripts/external_validation_pydanticai.py \
            --json-out artifacts/external-validation-pydanticai.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-validation-pydanticai-${{ github.run_id }}
          path: artifacts/external-validation-pydanticai.json
          if-no-files-found: error
          retention-days: 30

  package-openai-agents:
    needs: package-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist
      - run: python -m venv /tmp/schemarouter-wheel-openai-agents
      - run: /tmp/schemarouter-wheel-openai-agents/bin/python -m pip install --upgrade pip
      - name: Install built wheel and pinned OpenAI Agents SDK validation dependency
        run: |
          WHEEL="$(pwd)/$(ls dist/*.whl)"
          /tmp/schemarouter-wheel-openai-agents/bin/pip install "$WHEEL"
          /tmp/schemarouter-wheel-openai-agents/bin/pip install -r examples/external_validation/openai_agents_mcp_filter/requirements.txt
          /tmp/schemarouter-wheel-openai-agents/bin/pip check
      - name: Run focused OpenAI Agents SDK MCP filter contract
        run: |
          /tmp/schemarouter-wheel-openai-agents/bin/python -m unittest \
            examples.external_validation.openai_agents_mcp_filter.contract_smoke -v
      - name: Run OpenAI Agents SDK dynamic MCP filter external validation
        run: |
          /tmp/schemarouter-wheel-openai-agents/bin/python scripts/external_validation_openai_agents.py \
            --json-out artifacts/external-validation-openai-agents.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-validation-openai-agents-${{ github.run_id }}
          path: artifacts/external-validation-openai-agents.json
          if-no-files-found: error
          retention-days: 30

  package-mcp-agent:
    needs: package-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist
      - run: python -m venv /tmp/schemarouter-wheel-mcp-agent
      - run: /tmp/schemarouter-wheel-mcp-agent/bin/python -m pip install --upgrade pip
      - name: Install built wheel and pinned mcp-agent validation dependencies
        run: |
          WHEEL="$(pwd)/$(ls dist/*.whl)"
          /tmp/schemarouter-wheel-mcp-agent/bin/pip install "$WHEEL"
          /tmp/schemarouter-wheel-mcp-agent/bin/pip install -r examples/external_validation/mcp_agent_catalog/requirements.txt
          /tmp/schemarouter-wheel-mcp-agent/bin/pip check
      - name: Run focused mcp-agent catalog contract
        run: |
          /tmp/schemarouter-wheel-mcp-agent/bin/python -m unittest \
            examples.external_validation.mcp_agent_catalog.contract_smoke -v
      - name: Run mcp-agent large-tool-catalog external validation
        run: |
          /tmp/schemarouter-wheel-mcp-agent/bin/python scripts/external_validation_mcp_agent.py \
            --json-out artifacts/external-validation-mcp-agent.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-validation-mcp-agent-${{ github.run_id }}
          path: artifacts/external-validation-mcp-agent.json
          if-no-files-found: error
          retention-days: 30

  package-runtime-smoke:
    needs: package-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist
      - run: python -m venv /tmp/schemarouter-wheel
      - run: /tmp/schemarouter-wheel/bin/python -m pip install --upgrade pip
      - run: /tmp/schemarouter-wheel/bin/pip install dist/*.whl
      - run: /tmp/schemarouter-wheel/bin/python examples/quickstart.py
      - run: /tmp/schemarouter-wheel/bin/python examples/database_quickstart.py
      - run: /tmp/schemarouter-wheel/bin/python examples/sdk_bound_demo.py
      - run: /tmp/schemarouter-wheel/bin/python examples/mixed_provider_demo.py
      - run: /tmp/schemarouter-wheel/bin/python examples/schema_drift_demo.py
      - run: /tmp/schemarouter-wheel/bin/python examples/context_reduction_demo.py
      - name: Install external-style decision backend demo against built wheel
        run: /tmp/schemarouter-wheel/bin/pip install --no-deps -e examples/decision_backend_plugin_demo
      - run: /tmp/schemarouter-wheel/bin/python examples/decision_backend_plugin_quickstart.py
      - run: /tmp/schemarouter-wheel/bin/python scripts/quickstart_provider_contract_smoke.py
      - run: /tmp/schemarouter-wheel/bin/python scripts/consumer_acceptance.py --json-out artifacts/consumer-acceptance-wheel.json
      - run: /tmp/schemarouter-wheel/bin/schemarouter --help
      - run: /tmp/schemarouter-wheel/bin/python scripts/benchmark_decision_routing.py --json-out /tmp/decision-benchmark.json --html-out /tmp/decision-benchmark.html
      - run: test -s /tmp/decision-benchmark.json
      - run: test -s /tmp/decision-benchmark.html
      - run: /tmp/schemarouter-wheel/bin/python scripts/render_benchmark_history.py /tmp/decision-benchmark.json --output /tmp/decision-benchmark-history.html
      - run: test -s /tmp/decision-benchmark-history.html
      - run: /tmp/schemarouter-wheel/bin/python examples/inspection_dashboard.py --registry /tmp/inspection-registry.sqlite3 --traces /tmp/inspection-traces.sqlite3 --output /tmp/inspection-dashboard.html
      - run: test -s /tmp/inspection-dashboard.html
      - name: Exercise installed inspection CLI
        run: |
          /tmp/schemarouter-wheel/bin/schemarouter inspect registry --db /tmp/inspection-registry.sqlite3 --json > /tmp/inspection-registry.json
          /tmp/schemarouter-wheel/bin/schemarouter inspect traces --db /tmp/inspection-traces.sqlite3 --complete --json > /tmp/inspection-traces.json
          /tmp/schemarouter-wheel/bin/python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("/tmp/inspection-registry.json").read_text())
          traces = json.loads(Path("/tmp/inspection-traces.json").read_text())
          assert registry["tool_count"] == 1, registry
          assert registry["endpoint_count"] == 1, registry
          assert len(traces) == 1, traces
          assert traces[0]["complete"] is True, traces
          assert traces[0]["terminal_event"] == "run.end", traces
          PY
          /tmp/schemarouter-wheel/bin/schemarouter dashboard --registry /tmp/inspection-registry.sqlite3 --traces /tmp/inspection-traces.sqlite3 --output /tmp/inspection-cli-dashboard.html
          test -s /tmp/inspection-cli-dashboard.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-acceptance-wheel-${{ github.run_id }}
          path: artifacts/consumer-acceptance-wheel.json
          if-no-files-found: error
          retention-days: 30

  package-lightweight-extras:
    needs: package-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist
      - run: python -m venv /tmp/schemarouter-wheel-lightweight
      - run: /tmp/schemarouter-wheel-lightweight/bin/python -m pip install --upgrade pip
      - name: Install wheel with isolated lightweight extras
        run: |
          WHEEL="$(pwd)/$(ls dist/*.whl)"
          /tmp/schemarouter-wheel-lightweight/bin/pip install "schemarouter[mcp,jev,otel] @ file://${WHEEL}"
          /tmp/schemarouter-wheel-lightweight/bin/pip check
      - run: /tmp/schemarouter-wheel-lightweight/bin/python scripts/installed_extras_smoke.py

  package-integration-extras:
    needs: package-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist
      - run: python -m venv /tmp/schemarouter-wheel-integrations
      - run: /tmp/schemarouter-wheel-integrations/bin/python -m pip install --upgrade pip
      - name: Install wheel with combined integration extras
        run: |
          WHEEL="$(pwd)/$(ls dist/*.whl)"
          /tmp/schemarouter-wheel-integrations/bin/pip install "schemarouter[mcp,langchain,langgraph,llamaindex,jev,otel,database] @ file://${WHEEL}"
          /tmp/schemarouter-wheel-integrations/bin/pip check
      - run: /tmp/schemarouter-wheel-integrations/bin/python scripts/installed_extras_smoke.py
      - run: /tmp/schemarouter-wheel-integrations/bin/python scripts/installed_database_smoke.py
      - run: /tmp/schemarouter-wheel-integrations/bin/python examples/langchain_quickstart.py
      - run: /tmp/schemarouter-wheel-integrations/bin/python examples/langgraph_quickstart.py
      - run: /tmp/schemarouter-wheel-integrations/bin/python examples/llamaindex_quickstart.py

  package-sdist:
    needs: package-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist-${{ github.run_id }}
          path: dist
      - run: python -m venv /tmp/schemarouter-sdist
      - run: /tmp/schemarouter-sdist/bin/python -m pip install --upgrade pip
      - run: /tmp/schemarouter-sdist/bin/pip install dist/*.tar.gz
      - run: /tmp/schemarouter-sdist/bin/python -c "from importlib.metadata import version; import schemarouter; assert schemarouter.__version__ == version('schemarouter')"
      - run: /tmp/schemarouter-sdist/bin/python examples/quickstart.py
      - run: /tmp/schemarouter-sdist/bin/python examples/database_quickstart.py
      - run: /tmp/schemarouter-sdist/bin/python scripts/quickstart_provider_contract_smoke.py
      - run: /tmp/schemarouter-sdist/bin/python scripts/consumer_acceptance.py --json-out artifacts/consumer-acceptance-sdist.json
      - run: /tmp/schemarouter-sdist/bin/schemarouter --help
      - name: Prepare isolated inspection fixtures for the sdist
        run: |
          /tmp/schemarouter-sdist/bin/python examples/inspection_dashboard.py \
            --registry /tmp/inspection-registry.sqlite3 \
            --traces /tmp/inspection-traces.sqlite3 \
            --output /tmp/inspection-dashboard-sdist.html
      - run: /tmp/schemarouter-sdist/bin/schemarouter inspect registry --db /tmp/inspection-registry.sqlite3 --json > /tmp/inspection-registry-sdist.json
      - run: /tmp/schemarouter-sdist/bin/python -c "import json; data=json.load(open('/tmp/inspection-registry-sdist.json')); assert data['tool_count'] == 1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-acceptance-sdist-${{ github.run_id }}
          path: artifacts/consumer-acceptance-sdist.json
          if-no-files-found: error
          retention-days: 30

  package:
    # Keep the protected-main required check name stable while making package
    # construction and qualification independently attributable and parallel.
    if: ${{ always() }}
    needs:
      - laya-integration
      - dependency-audit
      - database-integration
      - package-core
      - package-adapter-plugin
      - package-pydanticai
      - package-openai-agents
      - package-mcp-agent
      - package-runtime-smoke
      - package-lightweight-extras
      - package-integration-extras
      - package-sdist
    runs-on: ubuntu-latest
    steps:
      - name: Verify package qualification fan-out
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: payload["result"]
              for name, payload in needs.items()
              if payload["result"] != "success"
          }
          if failed:
              raise SystemExit(f"package qualification failed: {failed}")
          print("all package qualification jobs succeeded")
          PY

  langchain-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,langchain,langgraph]"
      - run: pytest -q tests/test_langchain_integration.py tests/test_langgraph_integration.py
      - run: python examples/langchain_quickstart.py
      - run: python examples/langgraph_quickstart.py

  llamaindex-integration:
    runs-on: ubuntu-latest
    steps:
