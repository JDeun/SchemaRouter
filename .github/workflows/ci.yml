  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[docs]"
      - name: Check canonical repository facts
        run: python scripts/sync_repository_facts.py --check
      - name: Prepare Korean documentation tree
        run: python scripts/prepare_korean_docs.py
      - name: Build English documentation
        run: mkdocs build --strict -f mkdocs.yml
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Build Korean documentation
        run: mkdocs build --strict -f mkdocs.ko.yml
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Verify rendered Markdown/code-block structure
        run: python scripts/check_rendered_docs.py site
      - name: Verify bilingual Pages layout
        run: |
          python - <<'PY'
          from pathlib import Path

          english = Path("site/index.html")
          korean = Path("site/ko/index.html")
          translated = Path("site/ko/getting-started/quickstart/index.html")
          fallback = Path("site/ko/guides/graphql/index.html")

          for path in (english, korean, translated, fallback):
              assert path.is_file(), f"missing bilingual docs output: {path}"

          english_html = english.read_text(encoding="utf-8")
          korean_html = korean.read_text(encoding="utf-8")
          assert 'hreflang="ko"' in english_html, "English site is missing Korean alternate"
          assert 'hreflang="en"' in korean_html, "Korean site is missing English alternate"
          assert "/SchemaRouter/ko/" in english_html, "English selector is missing Korean site link"
          assert "/SchemaRouter/" in korean_html, "Korean selector is missing English site link"
          PY
