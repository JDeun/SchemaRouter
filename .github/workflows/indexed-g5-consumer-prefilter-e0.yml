name: Indexed G5 Canonical Consumer Prefilter E0

on:
  pull_request:
    paths:
      - "src/schemarouter/native_graph_index.py"
      - "tests/test_native_graph_consumer_prefilter.py"
      - ".github/workflows/indexed-g5-consumer-prefilter-e0.yml"
      - "research/autoresearch/indexed-g5-consumer-prefilter-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-typed-candidate-prefilter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out source and isolated tests
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Prove pre-K original native scoping and canonical graph equivalence
        run: |
          ruff check src/schemarouter/native_graph_index.py tests/test_native_graph_consumer_prefilter.py
          python -m pytest -q tests/test_native_graph_consumer_prefilter.py tests/test_native_graph_index.py tests/test_native_semantic_index.py tests/test_benchmark_indexed_g5_selectivity_e0.py
          pyright src/schemarouter/native_graph_index.py
      - name: Compare broad and sparse same-source synthetic timings
        run: python -m scripts.benchmark_indexed_g5_selectivity_e0 --noise-routes 5100 --iterations 20 --broad-iterations 3
