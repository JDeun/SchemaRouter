name: Research V5E Corpus Freeze

on:
  push:
    branches:
      - "research/0.12-capability-set-membership-veto"
    paths:
      - ".github/workflows/research-v5e-corpus-freeze.yml"
      - "benchmarks/operation-routing-v5e-membership-veto-preregistration.json"
      - "benchmarks/capability_set_membership_veto.py"
      - "benchmarks/operation_routing_v5e_catalog.py"
      - "scripts/generate_operation_routing_v5e.py"
      - "tests/test_capability_set_membership_veto.py"
      - "tests/test_operation_routing_v5e_protocol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate preregistration and protocol
        run: |
          python -m json.tool benchmarks/operation-routing-v5e-membership-veto-preregistration.json >/dev/null
          ruff check \
            benchmarks/capability_set_membership_veto.py \
            benchmarks/operation_routing_v5e_catalog.py \
            scripts/generate_operation_routing_v5e.py \
            tests/test_capability_set_membership_veto.py \
            tests/test_operation_routing_v5e_protocol.py
          pytest -q \
            tests/test_capability_set_membership_veto.py \
            tests/test_operation_routing_v5e_protocol.py

      - name: Generate both corpora before any scoring
        run: |
          python scripts/generate_operation_routing_v5e.py \
            --out-dir artifacts/operation-routing-v5e
          cat artifacts/operation-routing-v5e/freeze-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operation-routing-v5e-freeze-${{ github.run_id }}
          path: artifacts/operation-routing-v5e/
          retention-days: 30
