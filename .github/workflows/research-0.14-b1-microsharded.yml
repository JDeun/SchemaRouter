name: Research 0.14 B1 Micro-Sharded Agent A-B

# Canonical v2 execution: preregistration + freeze + Phase-A gate are validated in preflight.

on:
  push:
    branches:
      - "research/0.14-local-agent-ab"
    paths:
      - ".github/workflows/research-0.14-b1-microsharded.yml"
  workflow_dispatch:

concurrency:
  group: research-0.14-b1-microsharded-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TASKS_SHA256: "bc0b78ff2be11b89e6ac54ea0ee336f944f04b3c203fc61da70a46ff48b4e03c"
  CATALOG_20_SHA256: "b90e3ab473217f4becffb4933fc96e7016cf60f28b030b4d2ae8cb1639c40f5c"
  CATALOG_50_SHA256: "e43400681d64315cadfeb54f4f3dadb0490e557e5f6bf2514c4f8e2e6d424ac3"
  CATALOG_100_SHA256: "52b58b39ec31d377c90c16572997f69523742c8917a37e33326d429b51afc225"
  CATALOG_250_SHA256: "e5ca7d199dd5d2e7bb89eb97d8ac0cae37f403def1fc43037f2fc816a775d2a9"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate frozen B1 v2 protocol
        run: |
          ruff check \
            benchmarks/agent_utility_v1_catalog.py \
            benchmarks/agent_utility_v1_executor.py \
            scripts/generate_agent_utility_v1.py \
            scripts/evaluate_agent_utility_phase_a.py \
            scripts/evaluate_agent_utility_phase_b_qwen.py \
            scripts/aggregate_agent_utility_phase_b.py \
            tests/test_agent_utility_v1.py \
            tests/test_agent_utility_v1_executor.py \
            tests/test_agent_utility_phase_b_qwen.py \
            tests/test_agent_utility_phase_b_aggregate.py
          PYTHONPATH=. pytest -q \
            tests/test_agent_utility_v1.py \
            tests/test_agent_utility_v1_executor.py \
            tests/test_agent_utility_phase_b_qwen.py \
            tests/test_agent_utility_phase_b_aggregate.py
          python - <<'PY'
          import json
          from pathlib import Path

          prereg = json.loads(
              Path("benchmarks/agent-utility-v1-b1-preregistration-v2.json")
              .read_text(encoding="utf-8")
          )
          assert prereg["schema_version"] == 2
          assert prereg["issue"] == 420
          assert prereg["status"] == "frozen_before_any_v2_agent_inference"
          assert prereg["corrected_freeze_identity"]["tasks_sha256"] == (
              "bc0b78ff2be11b89e6ac54ea0ee336f944f04b3c203fc61da70a46ff48b4e03c"
          )
          assert prereg["tool_observation_causality"][
              "max_executed_tool_calls_per_assistant_turn"
          ] == 1
          assert prereg["statistical_scope"]["bootstrap_unit"] == "task_id cluster"
          assert prereg["aggregate_integrity"]["required_episode_count"] == 552
          PY

      - name: Freeze v2 tasks and catalogs
        run: |
          python scripts/generate_agent_utility_v1.py \
            --out-dir artifacts/agent-utility-v1

      - name: Verify v2 identities and Phase-A entry gate
        run: |
          python scripts/evaluate_agent_utility_phase_a.py \
            --out artifacts/agent-utility-v1/phase-a-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/agent-utility-v1")
          freeze = json.loads(
              (root / "freeze-manifest.json").read_text(encoding="utf-8")
          )
          result = json.loads(
              (root / "phase-a-result.json").read_text(encoding="utf-8")
          )
          assert freeze["task_count"] == 23
          assert freeze["single_task_count"] == 17
          assert freeze["multi_task_count"] == 6
          assert freeze["tasks_sha256"] == os.environ["TASKS_SHA256"]
          for size in ("20", "50", "100", "250"):
              assert freeze["catalogs"][size]["sha256"] == os.environ[
                  f"CATALOG_{size}_SHA256"
              ]
          assert result["phase_a_gate"]["phase_b_eligible"] is True
          print(json.dumps(freeze, sort_keys=True))
          print(json.dumps(result["phase_a_gate"], sort_keys=True))
          print(json.dumps({
              size: {
                  "recall3": result["catalog_sizes"][size]["k"]["3"][
                      "required_route_recall"
                  ],
                  "recall5": result["catalog_sizes"][size]["k"]["5"][
                      "required_route_recall"
                  ],
                  "recall10": result["catalog_sizes"][size]["k"]["10"][
                      "required_route_recall"
                  ],
              }
              for size in ("20", "50", "100", "250")
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-utility-b1-v2-preflight-${{ github.run_id }}
          path: |
            artifacts/agent-utility-v1/
            benchmarks/agent-utility-v1-b1-preregistration-v2.json
            benchmarks/agent-utility-v1-b1-task-contract-amendment.json
            benchmarks/agent-utility-v1-b1-causality-amendment.json
            benchmarks/agent-utility-v1-b1-statistical-amendment.json
            benchmarks/agent-utility-v1-b1-execution-equivalence.json
          retention-days: 30

  evaluate:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        catalog: [20, 50, 100, 250]
        shard: [s01, s02, s03, s04, s05, s06]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .

      - name: Verify exact inference runtime
        run: |
          python - <<'PY'
          import platform
          import safetensors
          import tokenizers
          import torch
          import transformers

          assert platform.python_version() == "3.12.14"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          assert tokenizers.__version__ == "0.22.2"
          assert safetensors.__version__ == "0.8.0"
          print("runtime identity verified")
          PY

      - name: Resolve frozen task shard
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            s01) TASK_IDS="single-paper-search,single-paper-retrieve,single-paper-summary,single-material-search" ;;
            s02) TASK_IDS="single-material-retrieve,single-material-current,single-material-history,single-material-forecast" ;;
            s03) TASK_IDS="single-inventory-list,single-inventory-create,single-inventory-update,single-inventory-delete" ;;
            s04) TASK_IDS="single-message-send,single-share,single-credit-refund,single-runtime-restart" ;;
            s05) TASK_IDS="single-export,multi-paper-search-retrieve,multi-paper-retrieve-summary,multi-material-search-current" ;;
            s06) TASK_IDS="multi-create-share,multi-create-send,multi-retrieve-export" ;;
            *) echo "unknown shard"; exit 1 ;;
          esac
          echo "task_ids=$TASK_IDS" >> "$GITHUB_OUTPUT"

      - name: Recreate corrected frozen corpus
        run: |
          python scripts/generate_agent_utility_v1.py             --out-dir artifacts/agent-utility-v1

      - name: Verify frozen identities
        env:
          CATALOG_SIZE: ${{ matrix.catalog }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          freeze = json.loads(
              Path("artifacts/agent-utility-v1/freeze-manifest.json")
              .read_text(encoding="utf-8")
          )
          if freeze["tasks_sha256"] != os.environ["TASKS_SHA256"]:
              raise SystemExit("B1 task identity drifted")
          size = os.environ["CATALOG_SIZE"]
          expected = os.environ[f"CATALOG_{size}_SHA256"]
          actual = freeze["catalogs"][size]["sha256"]
          if actual != expected:
              raise SystemExit(
                  f"B1 catalog {size} drifted: {actual} != {expected}"
              )
          PY

      - name: Evaluate exact frozen micro-shard
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          mkdir -p artifacts/agent-utility-b1
          python scripts/evaluate_agent_utility_phase_b_qwen.py             --catalog-sizes "${{ matrix.catalog }}"             --task-ids "${{ steps.shard.outputs.task_ids }}"             --out "artifacts/agent-utility-b1/phase-b1-${{ matrix.catalog }}-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: agent-utility-b1-micro-${{ matrix.catalog }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            artifacts/agent-utility-b1/
            artifacts/agent-utility-v1/freeze-manifest.json
            benchmarks/agent-utility-v1-b1-preregistration-v2.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: agent-utility-b1-micro-*-${{ github.run_id }}
          path: artifacts/b1-shards

      - name: Aggregate exact same 552 frozen episodes
        run: |
          python scripts/aggregate_agent_utility_phase_b.py             --input-dir artifacts/b1-shards             --out artifacts/agent-utility-b1-aggregate.json

      - name: Validate canonical B1 aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/agent-utility-b1-aggregate.json")
              .read_text(encoding="utf-8")
          )
          assert data["episode_count"] == 552
          assert data["expected_episode_count"] == 552
          assert data["issue"] == 420
          for condition, summary in data["overall"].items():
              if summary["unauthorized_destructive_executions"] != 0:
                  raise SystemExit(
                      f"unauthorized destructive execution in {condition}"
                  )
          print(json.dumps(data["overall"], sort_keys=True))
          print(json.dumps(data["utility_gates"], sort_keys=True))
          print(json.dumps(data["progressive_recovery"], sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: agent-utility-b1-canonical-${{ github.run_id }}
          path: |
            artifacts/agent-utility-b1-aggregate.json
            benchmarks/agent-utility-v1-b1-preregistration-v2.json
          if-no-files-found: warn
          retention-days: 30
