name: Research 0.14 B1 Micro-Sharded Agent A-B

# Canonical B1 v2 execution.
# Canonical candidate source after shard-coverage regression fix: c411f7a79cf55a57b368e28b1c3f8a521f194f13.
# Inference is authorized only after protocol/freeze/Phase-A preflight and
# exact-pinned two-turn Qwen smoke both pass in this same workflow run.

on:
  push:
    branches:
      - "research/0.14-local-agent-ab"
    paths:
      - ".github/workflows/research-0.14-b1-microsharded.yml"
  workflow_dispatch:

concurrency:
  group: research-0.14-b1-microsharded-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TASKS_SHA256: "bc0b78ff2be11b89e6ac54ea0ee336f944f04b3c203fc61da70a46ff48b4e03c"
  CATALOG_20_SHA256: "b90e3ab473217f4becffb4933fc96e7016cf60f28b030b4d2ae8cb1639c40f5c"
  CATALOG_50_SHA256: "e43400681d64315cadfeb54f4f3dadb0490e557e5f6bf2514c4f8e2e6d424ac3"
  CATALOG_100_SHA256: "52b58b39ec31d377c90c16572997f69523742c8917a37e33326d429b51afc225"
  CATALOG_250_SHA256: "e5ca7d199dd5d2e7bb89eb97d8ac0cae37f403def1fc43037f2fc816a775d2a9"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate frozen B1 v2 protocol
        run: |
          ruff check \
            benchmarks/agent_utility_v1_catalog.py \
            benchmarks/agent_utility_v1_executor.py \
            scripts/generate_agent_utility_v1.py \
            scripts/evaluate_agent_utility_phase_a.py \
            scripts/evaluate_agent_utility_phase_b_qwen.py \
            scripts/aggregate_agent_utility_phase_b.py \
            scripts/smoke_qwen3_tool_call.py \
            tests/test_agent_utility_v1.py \
            tests/test_agent_utility_v1_executor.py \
            tests/test_agent_utility_phase_b_qwen.py \
            tests/test_agent_utility_phase_b_aggregate.py
          PYTHONPATH=. pytest -q \
            tests/test_agent_utility_v1.py \
            tests/test_agent_utility_v1_executor.py \
            tests/test_agent_utility_phase_b_qwen.py \
            tests/test_agent_utility_phase_b_aggregate.py
          python - <<'PY'
          import json
          from pathlib import Path

          from benchmarks.agent_utility_v1_catalog import TASKS

          prereg = json.loads(
              Path("benchmarks/agent-utility-v1-b1-preregistration-v2.json")
              .read_text(encoding="utf-8")
          )
          assert prereg["schema_version"] == 2
          assert prereg["issue"] == 420
          assert prereg["status"] == "frozen_before_any_v2_agent_inference"
          assert prereg["corrected_freeze_identity"]["tasks_sha256"] == (
              "bc0b78ff2be11b89e6ac54ea0ee336f944f04b3c203fc61da70a46ff48b4e03c"
          )
          assert prereg["pre_benchmark_smoke"]["required"] is True
          assert prereg["pre_benchmark_smoke"][
              "exact_runtime_pins_required"
          ] is True
          assert prereg["pre_benchmark_smoke"][
              "dependent_second_tool_call_after_observation_required"
          ] is True
          assert prereg["pre_benchmark_smoke"][
              "repeated_identical_prompt_determinism_required"
          ] is True
          assert prereg["tool_observation_causality"][
              "max_executed_tool_calls_per_assistant_turn"
          ] == 1
          assert prereg["statistical_scope"]["bootstrap_unit"] == "task_id cluster"
          assert prereg["aggregate_integrity"]["required_episode_count"] == 552

          plan = json.loads(
              Path("benchmarks/agent-utility-v1-b1-sharding-v2.json")
              .read_text(encoding="utf-8")
          )
          task_ids = {task.task_id for task in TASKS}
          assert plan["expected_job_count"] == 30
          assert plan["expected_episode_count"] == 552
          base_groups = plan["groups"]
          for size in ("20", "50", "100"):
              flattened = [
                  task_id
                  for group_id in plan["catalogs"][size]
                  for task_id in base_groups[group_id]
              ]
              assert len(flattened) == 23
              assert len(set(flattened)) == 23
              assert set(flattened) == task_ids
          split_250 = plan["catalogs"]["250"]
          flattened_250 = [
              task_id
              for _, group in split_250
              for task_id in group
          ]
          assert len(split_250) == 12
          assert len(flattened_250) == 23
          assert len(set(flattened_250)) == 23
          assert set(flattened_250) == task_ids
          PY

      - name: Freeze v2 tasks and catalogs
        run: |
          python scripts/generate_agent_utility_v1.py \
            --out-dir artifacts/agent-utility-v1

      - name: Verify v2 identities and Phase-A entry gate
        run: |
          python scripts/evaluate_agent_utility_phase_a.py \
            --out artifacts/agent-utility-v1/phase-a-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/agent-utility-v1")
          freeze = json.loads(
              (root / "freeze-manifest.json").read_text(encoding="utf-8")
          )
          result = json.loads(
              (root / "phase-a-result.json").read_text(encoding="utf-8")
          )
          assert freeze["task_count"] == 23
          assert freeze["single_task_count"] == 17
          assert freeze["multi_task_count"] == 6
          assert freeze["tasks_sha256"] == os.environ["TASKS_SHA256"]
          for size in ("20", "50", "100", "250"):
              assert freeze["catalogs"][size]["sha256"] == os.environ[
                  f"CATALOG_{size}_SHA256"
              ]
          assert result["phase_a_gate"]["phase_b_eligible"] is True
          print(json.dumps(freeze, sort_keys=True))
          print(json.dumps(result["phase_a_gate"], sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-utility-b1-v2-preflight-${{ github.run_id }}
          path: |
            artifacts/agent-utility-v1/
            benchmarks/agent-utility-v1-b1-preregistration-v2.json
            benchmarks/agent-utility-v1-b1-sharding-v2.json
            benchmarks/agent-utility-v1-b1-task-contract-amendment.json
            benchmarks/agent-utility-v1-b1-causality-amendment.json
            benchmarks/agent-utility-v1-b1-statistical-amendment.json
            benchmarks/agent-utility-v1-b1-execution-equivalence.json
          retention-days: 30

  smoke:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .

      - name: Verify exact pinned smoke runtime
        run: |
          python - <<'PY'
          import platform
          import safetensors
          import tokenizers
          import torch
          import transformers

          assert platform.python_version() == "3.12.14"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          assert tokenizers.__version__ == "0.22.2"
          assert safetensors.__version__ == "0.8.0"
          print("exact B1 smoke runtime verified")
          PY

      - name: Run required two-turn deterministic smoke
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/smoke_qwen3_tool_call.py

  evaluate:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - {catalog: 20, shard: s01, task_ids: "single-paper-search,single-paper-retrieve,single-paper-summary,single-material-search"}
          - {catalog: 20, shard: s02, task_ids: "single-material-retrieve,single-material-current,single-material-history,single-material-forecast"}
          - {catalog: 20, shard: s03, task_ids: "single-inventory-list,single-inventory-create,single-inventory-update,single-inventory-delete"}
          - {catalog: 20, shard: s04, task_ids: "single-message-send,single-share,single-credit-refund,single-runtime-restart"}
          - {catalog: 20, shard: s05, task_ids: "single-export,multi-paper-search-retrieve,multi-paper-retrieve-summary,multi-material-search-current"}
          - {catalog: 20, shard: s06, task_ids: "multi-create-share,multi-create-send,multi-retrieve-export"}
          - {catalog: 50, shard: s01, task_ids: "single-paper-search,single-paper-retrieve,single-paper-summary,single-material-search"}
          - {catalog: 50, shard: s02, task_ids: "single-material-retrieve,single-material-current,single-material-history,single-material-forecast"}
          - {catalog: 50, shard: s03, task_ids: "single-inventory-list,single-inventory-create,single-inventory-update,single-inventory-delete"}
          - {catalog: 50, shard: s04, task_ids: "single-message-send,single-share,single-credit-refund,single-runtime-restart"}
          - {catalog: 50, shard: s05, task_ids: "single-export,multi-paper-search-retrieve,multi-paper-retrieve-summary,multi-material-search-current"}
          - {catalog: 50, shard: s06, task_ids: "multi-create-share,multi-create-send,multi-retrieve-export"}
          - {catalog: 100, shard: s01, task_ids: "single-paper-search,single-paper-retrieve,single-paper-summary,single-material-search"}
          - {catalog: 100, shard: s02, task_ids: "single-material-retrieve,single-material-current,single-material-history,single-material-forecast"}
          - {catalog: 100, shard: s03, task_ids: "single-inventory-list,single-inventory-create,single-inventory-update,single-inventory-delete"}
          - {catalog: 100, shard: s04, task_ids: "single-message-send,single-share,single-credit-refund,single-runtime-restart"}
          - {catalog: 100, shard: s05, task_ids: "single-export,multi-paper-search-retrieve,multi-paper-retrieve-summary,multi-material-search-current"}
          - {catalog: 100, shard: s06, task_ids: "multi-create-share,multi-create-send,multi-retrieve-export"}
          - {catalog: 250, shard: t01, task_ids: "single-paper-search,single-paper-retrieve"}
          - {catalog: 250, shard: t02, task_ids: "single-paper-summary,single-material-search"}
          - {catalog: 250, shard: t03, task_ids: "single-material-retrieve,single-material-current"}
          - {catalog: 250, shard: t04, task_ids: "single-material-history,single-material-forecast"}
          - {catalog: 250, shard: t05, task_ids: "single-inventory-list,single-inventory-create"}
          - {catalog: 250, shard: t06, task_ids: "single-inventory-update,single-inventory-delete"}
          - {catalog: 250, shard: t07, task_ids: "single-message-send,single-share"}
          - {catalog: 250, shard: t08, task_ids: "single-credit-refund,single-runtime-restart"}
          - {catalog: 250, shard: t09, task_ids: "single-export,multi-paper-search-retrieve"}
          - {catalog: 250, shard: t10, task_ids: "multi-paper-retrieve-summary,multi-material-search-current"}
          - {catalog: 250, shard: t11, task_ids: "multi-create-share,multi-create-send"}
          - {catalog: 250, shard: t12, task_ids: "multi-retrieve-export"}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .

      - name: Verify exact inference runtime
        run: |
          python - <<'PY'
          import platform
          import safetensors
          import tokenizers
          import torch
          import transformers

          assert platform.python_version() == "3.12.14"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          assert tokenizers.__version__ == "0.22.2"
          assert safetensors.__version__ == "0.8.0"
          print("runtime identity verified")
          PY

      - name: Verify this job matches frozen sharding plan
        env:
          CATALOG_SIZE: "${{ matrix.catalog }}"
          SHARD: "${{ matrix.shard }}"
          TASK_IDS: "${{ matrix.task_ids }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              Path("benchmarks/agent-utility-v1-b1-sharding-v2.json")
              .read_text(encoding="utf-8")
          )
          size = os.environ["CATALOG_SIZE"]
          shard = os.environ["SHARD"]
          actual = os.environ["TASK_IDS"].split(",")
          if size in {"20", "50", "100"}:
              expected = plan["groups"][shard]
              assert shard in plan["catalogs"][size]
          else:
              lookup = dict(plan["catalogs"]["250"])
              expected = lookup[shard]
          assert actual == expected, (size, shard, actual, expected)
          PY

      - name: Recreate corrected frozen corpus
        run: |
          python scripts/generate_agent_utility_v1.py \
            --out-dir artifacts/agent-utility-v1

      - name: Verify frozen identities
        env:
          CATALOG_SIZE: "${{ matrix.catalog }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          freeze = json.loads(
              Path("artifacts/agent-utility-v1/freeze-manifest.json")
              .read_text(encoding="utf-8")
          )
          if freeze["tasks_sha256"] != os.environ["TASKS_SHA256"]:
              raise SystemExit("B1 task identity drifted")
          size = os.environ["CATALOG_SIZE"]
          expected = os.environ[f"CATALOG_{size}_SHA256"]
          actual = freeze["catalogs"][size]["sha256"]
          if actual != expected:
              raise SystemExit(
                  f"B1 catalog {size} drifted: {actual} != {expected}"
              )
          PY

      - name: Evaluate exact frozen micro-shard
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          mkdir -p artifacts/agent-utility-b1
          python scripts/evaluate_agent_utility_phase_b_qwen.py \
            --catalog-sizes "${{ matrix.catalog }}" \
            --task-ids "${{ matrix.task_ids }}" \
            --out "artifacts/agent-utility-b1/phase-b1-${{ matrix.catalog }}-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: agent-utility-b1-micro-${{ matrix.catalog }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            artifacts/agent-utility-b1/
            artifacts/agent-utility-v1/freeze-manifest.json
            benchmarks/agent-utility-v1-b1-preregistration-v2.json
            benchmarks/agent-utility-v1-b1-sharding-v2.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: agent-utility-b1-micro-*-${{ github.run_id }}
          path: artifacts/b1-shards

      - name: Aggregate exact 552 frozen episodes
        run: |
          python scripts/aggregate_agent_utility_phase_b.py \
            --input-dir artifacts/b1-shards \
            --out artifacts/agent-utility-b1-aggregate.json

      - name: Validate canonical B1 aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("artifacts/agent-utility-b1-aggregate.json")
              .read_text(encoding="utf-8")
          )
          assert data["episode_count"] == 552
          assert data["expected_episode_count"] == 552
          assert data["issue"] == 420
          keys = {
              (
                  int(row["catalog_size"]),
                  str(row["task_id"]),
                  str(row["condition"]),
              )
              for row in data["rows"]
          }
          assert len(keys) == 552
          for condition, summary in data["overall"].items():
              if summary["unauthorized_destructive_executions"] != 0:
                  raise SystemExit(
                      f"unauthorized destructive execution in {condition}"
                  )
          print(json.dumps(data["overall"], sort_keys=True))
          print(json.dumps(data["retrieval_coverage"], sort_keys=True))
          print(json.dumps(data["utility_gates"], sort_keys=True))
          print(json.dumps(data["progressive_recovery"], sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: agent-utility-b1-canonical-${{ github.run_id }}
          path: |
            artifacts/agent-utility-b1-aggregate.json
            benchmarks/agent-utility-v1-b1-preregistration-v2.json
            benchmarks/agent-utility-v1-b1-sharding-v2.json
          if-no-files-found: warn
          retention-days: 30
