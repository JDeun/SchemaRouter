# Historical v0.17/candidate lexical comparison is retained in Git history.
# The current wheel intentionally no longer exposes the lexical planner.
name: Installed Wheel Planner Boundary (No Model)

on:
  pull_request:
    paths:
      - "src/schemarouter/**"
      - "scripts/research_legacy_planning/**"
      - "pyproject.toml"
      - ".github/workflows/v018-candidate-wheel-lexical-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build and audit actual candidate wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir artifacts/wheels .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("artifacts/wheels").glob("*.whl")
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              for name in (
                  "planner", "planning_context", "planning_stages", "state_retrieval",
                  "retrieval_abstention", "retrieval_execution_gate", "native_graph_execution",
                  "native_deep_paths", "paper_observed_binding", "paper_field_retrieval",
                  "native_fork_index",
              ):
                  assert f"schemarouter/{name}.py" not in names, name
              assert not any("research_legacy" in name for name in names)
          PY
      - name: Verify isolated installed package has no lexical planner API
        run: |
          python -m venv /tmp/sr-wheel-boundary
          /tmp/sr-wheel-boundary/bin/python -m pip install artifacts/wheels/*.whl
          /tmp/sr-wheel-boundary/bin/python -I - <<'PY'
          import importlib.util
          import schemarouter

          for name in (
                  "planner", "planning_context", "planning_stages", "state_retrieval",
                  "retrieval_abstention", "retrieval_execution_gate", "native_graph_execution",
                  "native_deep_paths", "paper_observed_binding", "paper_field_retrieval",
                  "native_fork_index",
              ):
              assert importlib.util.find_spec(f"schemarouter.{name}") is None, name
          for name in (
              "KeywordAnalyzer", "QueryAnalyzer", "SchemaPlanner", "PlanRequest",
              "QueryIntent", "RetrievalMode", "FallbackScope",
              "StateAwareCapabilityCandidate", "StateAwareCapabilityRetrieval",
              "evaluate_candidate_state", "filter_retrieval_by_state",
              "ScoreComponent", "PlanExplanation", "FieldSelectionExplanation",
              "CandidateSelectionSource", "FieldSelectionReason",
              "CapabilityCandidate", "CapabilityRetrieval",
              "CapabilityRouteCandidate", "CapabilityRouteRetrieval",
              "RetrievalAbstentionPolicy", "SelectiveCapabilityRetrieval",
              "apply_retrieval_abstention", "validate_selective_execution", "execute_selective_plan",
              "PaperObservedBinding", "PaperExecutedToolSequence",
              "observe_and_bind_paper_plan", "observe_and_execute_paper_plan",
              "PaperFieldAlternative", "PaperFieldCoverage",
              "retrieve_paper_field_coverage", "compile_paper_typed_tool_plan",
          ):
              assert not hasattr(schemarouter, name), name
          from schemarouter import capability_graph, models, runtime
          for name in ("dependency_cycles", "dependency_strongly_connected_components",
                       "satisfiable_capability_ids"):
              assert not hasattr(schemarouter, name), name
              assert not hasattr(capability_graph, name), name
          assert callable(schemarouter.build_capability_dependency_graph)
          assert callable(schemarouter.update_capability_dependency_graph)
          assert {"score", "explanation"}.isdisjoint(models.ToolCall.model_fields)
          assert {"score", "explanation"}.isdisjoint(models.ToolCall.model_json_schema()["properties"])
          for name in ("ScoreComponent", "PlanExplanation", "FieldSelectionExplanation",
                       "CandidateSelectionSource", "FieldSelectionReason",
                       "QueryIntent", "RetrievalMode", "FallbackScope"):
              assert not hasattr(models, name), name
          assert not hasattr(models, "CapabilityCandidate")
          assert not hasattr(models, "CapabilityRetrieval")
          assert not hasattr(schemarouter.SchemaRouter, "_project_retrieval_data_scope")
          assert not hasattr(runtime, "_scoped_public_score_components")
          assert not hasattr(models, "CapabilityRouteCandidate")
          assert not hasattr(models, "CapabilityRouteRetrieval")
          assert not hasattr(schemarouter.SchemaRouter, "_project_route_retrieval_data_scope")
          assert callable(schemarouter.SchemaRouter)
          assert not hasattr(schemarouter.SchemaFieldRoutingSession, "discover")
          assert not hasattr(schemarouter.SchemaFieldRoutingSession, "compile")
          assert callable(schemarouter.SchemaFieldRoutingSession.compile_understood)
          assert callable(schemarouter.SchemaFieldRoutingSession.acompile_query)
          assert callable(schemarouter.PaperQueryUnderstanding)
          assert not hasattr(schemarouter.NativeSchemaGraphIndex, "lookup_bounded_paths")
          from inspect import signature
          from schemarouter.paper_query_understanding import compile_model_query
          for compiler in (schemarouter.SchemaFieldRoutingSession.acompile_query,
                           compile_model_query):
              assert "model_visible_concept_ids" not in signature(compiler).parameters
          for method in (schemarouter.NativeSchemaPostingIndex.lookup,
                         schemarouter.NativeSchemaPostingIndex.lookup_concepts,
                         schemarouter.NativeSchemaGraphIndex.lookup,
                         schemarouter.NativeSchemaGraphIndex._lookup_native_paths):
              assert {'_research_ranker', '_fork_arm_internal', '_fork_root_filter',
                      '_fork_target_filter'}.isdisjoint(signature(method).parameters)
          from dataclasses import fields
          from typing import get_args, get_type_hints
          for model in (schemarouter.IndexedNativeFieldResult, schemarouter.NativeIndexedGraphResult):
              assert 'experimental_ranked' not in {field.name for field in fields(model)}
              assert 'ranker_abstained_unverified' not in get_args(get_type_hints(model)['status'])
              assert 'internal_fork_arm' not in get_args(get_type_hints(model)['status'])
              assert 'ranked_unverified' in get_args(get_type_hints(model)['status'])
          assert callable(schemarouter.NativeSchemaGraphIndex.lookup_two_hop)
          assert not hasattr(schemarouter.NativeSchemaGraphIndex, "lookup_shared_root_forks")
          assert callable(schemarouter.evaluate_state_eligibility)
          assert callable(schemarouter.evaluate_preconditions)
          assert callable(schemarouter.validate_declared_operation_fit)
          PY
