name: Authorized Host Field Contract Scaled CPU DEV

on:
  pull_request:
    paths:
      - "scripts/research_host_field_contract_scaled_cpu_dev.py"
      - "tests/test_research_host_field_contract_scaled_cpu_dev.py"
      - "research/autoresearch/host-field-contract-scaled-cpu-dev.md"
      - ".github/workflows/research-host-field-contract-scaled-cpu-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-contract-scaled-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-contract-scaled-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install actual current product package and offline tests
        run: |
          python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "PyYAML>=6,<7"
          python -m pytest -q tests/test_research_host_field_contract_scaled_cpu_dev.py
      - name: Measure 100/250/500 complete scoped catalog selector with exact paired normal retrieval
        run: |
          python -m scripts.research_host_field_contract_scaled_cpu_dev \
            --repeats 5 --output artifacts/host-contract-scaled-dev/report.json
      - name: Preserve actual CPU timings, source hashes and all negative cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-field-contract-scaled-dev-${{ github.run_id }}
          path: artifacts/host-contract-scaled-dev/
          if-no-files-found: warn
          retention-days: 90
# Same-author synthetic typed fixtures; host action/fields are explicitly
# supplied, no model/real provider calls, tokens, authenticated principal,
# actual agent task completion, safety certification, or release promotion.
