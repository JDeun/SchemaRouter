name: Scoped Tool Endpoint Description Boundary E0

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "tests/test_scoped_tool_endpoint_descriptions.py"
      - ".github/workflows/scoped-tool-endpoint-description-e0.yml"
      - "research/autoresearch/scoped-tool-endpoint-description-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-description-contract-e0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify bounded description canary and existing scope authority
        run: |
          python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1" "pyright>=1.1,<2"
          ruff check src/schemarouter/runtime.py tests/test_scoped_tool_endpoint_descriptions.py
          python -m pytest -q tests/test_scoped_tool_endpoint_descriptions.py tests/test_scoped_visible_field_metadata.py tests/test_scoped_input_schema_metadata.py tests/test_host_field_contract.py tests/test_data_scope_authorization.py
          pyright src/schemarouter/runtime.py
      - name: Evidence label
        if: success()
        run: |
          echo "Local E0 protected metadata descriptor canaries; original executor and raw registry unchanged. Not a proof of ranking score side-channel noninterference, KO/JA model utility or E2 qualification." >> "$GITHUB_STEP_SUMMARY"
