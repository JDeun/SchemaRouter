name: V4 BGE-M3 Fine Fusion

on:
  push:
    branches:
      - "research/v4-bge-m3-fine-fusion"
    paths:
      - ".github/workflows/research-v4-bge-m3-fine-fusion.yml"
      - "benchmarks/operation-routing-v4-bge-m3-fine-fusion.json"
      - "scripts/analyze_bge_m3_fine_fusion_v4.py"
      - "scripts/analyze_dual_view_embedding_v4.py"
      - "scripts/analyze_embedding_backbone_screen_v4.py"
      - "tests/test_bge_m3_fine_fusion_v4.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "scripts/benchmark_decision_routing.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"

concurrency:
  group: v4-bge-m3-fine-fusion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-bge-m3-fine-fusion.json >/dev/null
          ruff check scripts/analyze_bge_m3_fine_fusion_v4.py tests/test_bge_m3_fine_fusion_v4.py
          pytest -q tests/test_bge_m3_fine_fusion_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate fixed DEV corpus
        run: |
          OUT="artifacts/v4-bge-m3-fine-fusion"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py             --seed "${V4_DEV_SEED}"             --source-revision "${SCHEMAROUTER_SOURCE_REVISION}"             --out "${OUT}/corpus.json"             --manifest "${OUT}/corpus-manifest.json"
      - name: Verify corpus identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path("artifacts/v4-bge-m3-fine-fusion/corpus-manifest.json").read_text())
          if manifest.get("corpus_sha256") != os.environ["V4_DEV_SHA256"]:
              raise SystemExit("corpus SHA mismatch")
          if manifest.get("case_count") != 1800:
              raise SystemExit("unexpected case count")
          PY
      - name: Audit corpus
        run: |
          OUT="artifacts/v4-bge-m3-fine-fusion"
          python scripts/audit_operation_routing_corpus.py             --corpus "${OUT}/corpus.json"             --out "${OUT}/corpus-audit.json"             --near-duplicate-threshold 0.80             --max-duplicate-examples 50
      - name: Run fine fusion sweep
        run: |
          OUT="artifacts/v4-bge-m3-fine-fusion"
          python scripts/analyze_bge_m3_fine_fusion_v4.py             --corpus "${OUT}/corpus.json"             --out "${OUT}/analysis.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-bge-m3-fine-fusion-${{ github.run_id }}
          path: |
            artifacts/v4-bge-m3-fine-fusion/analysis.json
            artifacts/v4-bge-m3-fine-fusion/corpus-manifest.json
            artifacts/v4-bge-m3-fine-fusion/corpus-audit.json
            benchmarks/operation-routing-v4-bge-m3-fine-fusion.json
          if-no-files-found: error
          retention-days: 30
