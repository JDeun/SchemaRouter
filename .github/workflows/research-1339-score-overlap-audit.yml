name: Frozen Multilingual Model Score Overlap DEV Audit

on:
  pull_request:
    paths:
      - "scripts/audit_multilingual_score_overlap_dev.py"
      - "tests/test_audit_multilingual_score_overlap_dev.py"
      - "benchmarks/1339-multilingual-model-scale-frozen-manifest.json"
      - "research/autoresearch/multilingual-score-overlap-dev.md"
      - ".github/workflows/research-1339-score-overlap-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multilingual-score-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-frozen-model-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify schema and negative threshold counterexamples offline
        run: |
          python -m pip install "pytest>=8,<10" "pytest-asyncio>=0.23"
          python -m pytest -q tests/test_audit_multilingual_score_overlap_dev.py
      - name: Retrieve only exact successful 2026-10-15 model reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=38729631022
          API="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          source=$(gh api "$API")
          test "$(jq -r '.status' <<<"$source")" = "completed"
          test "$(jq -r '.conclusion' <<<"$source")" = "success"
          test "$(jq -r '.head_sha' <<<"$source")" = \
            "bc448804d7205ffb4deb4853db6225a4755bb72d"
          mkdir -p artifacts/1339-score-overlap/sources/minilm
          mkdir -p artifacts/1339-score-overlap/sources/e5-small
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "catalog-scale-dev-minilm-$RUN_ID" \
            --dir artifacts/1339-score-overlap/sources/minilm
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "catalog-scale-dev-e5-small-$RUN_ID" \
            --dir artifacts/1339-score-overlap/sources/e5-small
          test -s artifacts/1339-score-overlap/sources/minilm/minilm.json
          test -s artifacts/1339-score-overlap/sources/e5-small/e5-small.json
          echo "e2221dbd0915fff789ee8f34b9c6aeca3e0d7b7deeaa1186afd75fbeadc721ff  artifacts/1339-score-overlap/sources/minilm/minilm.json" | sha256sum -c
          echo "998a79a8ea67271257216fa1b2e7fe8233deef030dc1c387577fff8054604215  artifacts/1339-score-overlap/sources/e5-small/e5-small.json" | sha256sum -c
      - name: Independently rederive every supported/OOD threshold impossibility
        run: |
          python -m scripts.audit_multilingual_score_overlap_dev \
            --minilm artifacts/1339-score-overlap/sources/minilm/minilm.json \
            --e5 artifacts/1339-score-overlap/sources/e5-small/e5-small.json \
            --manifest benchmarks/1339-multilingual-model-scale-frozen-manifest.json \
            --output artifacts/1339-score-overlap/audit.json
      - name: Archive real source-locked model scores and negative findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multilingual-score-overlap-${{ github.run_id }}
          path: artifacts/1339-score-overlap/
          if-no-files-found: warn
          retention-days: 90
# Read-only exact model-artifact CPU audit, no model downloads, GPU, agents,
# external providers, real tool execution, trained thresholds or release.
