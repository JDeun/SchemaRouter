name: Durable Central Reservation Synthetic E0 DEV

on:
  pull_request:
    paths:
      - "scripts/research_central_durable_reservation_e0.py"
      - "tests/test_research_central_durable_reservation_e0.py"
      - "research/autoresearch/central-durable-reservation-e0.md"
      - ".github/workflows/research-central-durable-reservation-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-process-revocation-no-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original read-only dependencies and offline checks
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Enforce durable admission, restart, and OS-process stop E0 only
        run: |
          ruff check scripts/research_central_durable_reservation_e0.py tests/test_research_central_durable_reservation_e0.py
          pyright scripts/research_central_durable_reservation_e0.py
          python -m pytest -q tests/test_research_central_durable_reservation_e0.py
