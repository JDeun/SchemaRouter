name: Research V6F Corpus Freeze

on:
  push:
    branches:
      - "research/0.13-naturalistic-operation-probe"
    paths:
      - ".github/workflows/research-v6f-corpus-freeze.yml"
      - "benchmarks/operation-routing-v6f-naturalistic-probe-preregistration.json"
      - "benchmarks/v6f-naturalistic-utterance-bank.json"
      - "benchmarks/operation_routing_v6f_catalog.py"
      - "benchmarks/schema_naturalistic_operation_probe.py"
      - "scripts/generate_operation_routing_v6f.py"
      - "tests/test_schema_naturalistic_operation_probe.py"
      - "tests/test_operation_routing_v6f_protocol.py"
  pull_request:
    paths:
      - ".github/workflows/research-v6f-corpus-freeze.yml"
      - "benchmarks/operation-routing-v6f-naturalistic-probe-preregistration.json"
      - "benchmarks/v6f-naturalistic-utterance-bank.json"
      - "benchmarks/operation_routing_v6f_catalog.py"
      - "benchmarks/schema_naturalistic_operation_probe.py"
      - "scripts/generate_operation_routing_v6f.py"
      - "tests/test_schema_naturalistic_operation_probe.py"
      - "tests/test_operation_routing_v6f_protocol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate preregistration and source
        run: |
          ruff check             benchmarks/operation_routing_v6f_catalog.py             benchmarks/schema_naturalistic_operation_probe.py             scripts/generate_operation_routing_v6f.py             tests/test_schema_naturalistic_operation_probe.py             tests/test_operation_routing_v6f_protocol.py
          PYTHONPATH=. pytest -q             tests/test_schema_naturalistic_operation_probe.py             tests/test_operation_routing_v6f_protocol.py

      - name: Generate DEV and confirmation together before scoring
        run: |
          python scripts/generate_operation_routing_v6f.py             --out-dir artifacts/operation-routing-v6f

      - name: Validate frozen counts and naturalistic bank identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/operation-routing-v6f")
          freeze = json.loads(
              (root / "freeze-manifest.json").read_text(encoding="utf-8")
          )
          bank_sha = hashlib.sha256(
              Path("benchmarks/v6f-naturalistic-utterance-bank.json").read_bytes()
          ).hexdigest()
          for role in ("development", "confirmation"):
              manifest = freeze[role]
              assert manifest["case_count"] == 552
              assert manifest["supported_cases"] == 228
              assert manifest["near_domain_cases"] == 252
              assert manifest["out_of_domain_cases"] == 72
              assert manifest["route_count"] == 19
              assert manifest["tool_count"] == 7
              assert manifest["endpoint_counts"] == [2, 2, 3, 3, 3, 3, 3]
              assert manifest["synthetic_positives_per_route"] == 18
              assert manifest["probe_operation_examples"] == 432
              assert manifest["probe_background_examples"] == 384
              assert manifest["probe_bank_sha256"] == bank_sha
              assert manifest["corpus_sha256"]
          assert (
              freeze["development"]["corpus_sha256"]
              != freeze["confirmation"]["corpus_sha256"]
          )
          print("V6F DEV+confirmation and naturalistic bank frozen without scoring")
          print("bank_sha256=", bank_sha)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operation-routing-v6f-freeze-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v6f/
            benchmarks/v6f-naturalistic-utterance-bank.json
            benchmarks/operation-routing-v6f-naturalistic-probe-preregistration.json
          retention-days: 30
