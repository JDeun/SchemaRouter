name: Research 0.14 Adaptive DEV

on:
  workflow_dispatch:
  push:
    branches:
      - "research/0.14-adaptive-dev-run"
    paths:
      - ".github/adaptive-dev-trigger.json"

permissions:
  contents: read

concurrency:
  group: research-0.14-adaptive-dev
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  ADAPTIVE_TOKENIZER: "HuggingFaceTB/SmolLM3-3B"
  ADAPTIVE_TOKENIZER_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "jinja2==3.1.6"
      - run: pip install -e .
      - id: tokenizer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: "adaptive-smollm3-tokenizer-a07cc9a04f16550a088caea529712d1d335b0ac1"
      - name: Populate exact tokenizer revision on cache miss
        if: steps.tokenizer-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["ADAPTIVE_TOKENIZER"],
              revision=os.environ["ADAPTIVE_TOKENIZER_REVISION"],
              allow_patterns=[
                  "config.json",
                  "tokenizer*",
                  "special_tokens_map.json",
                  "*.jinja",
                  "*.model",
              ],
          )
          PY
      - name: Freeze DEV content before scoring
        run: |
          python scripts/generate_agent_utility_v5_adaptive_dev.py \
            --out-dir artifacts/adaptive-dev/freeze
      - name: Verify frozen identities before any scoring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/adaptive-dev/freeze/freeze-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["status"] == "frozen_before_scoring"
          assert data["semantic_task_count"] == 240
          assert data["task_rows"] == 240
          assert data["cell_count"] == 48
          assert data["tasks_per_cell"] == 5
          assert data["exact_prior_query_overlap_count"] == 0
          assert set(data["catalogs"]) == {"100", "250", "500"}
          print(json.dumps(data, sort_keys=True))
          PY
      - name: Rank Top-10 and measure exact prefix tool tokens
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python scripts/rank_agent_utility_v5_adaptive_dev.py \
            --freeze-dir artifacts/adaptive-dev/freeze \
            --out artifacts/adaptive-dev/rankings.jsonl \
            --manifest-out artifacts/adaptive-dev/ranking-manifest.json \
            --local-files-only
      - name: Evaluate frozen adaptive policies
        run: |
          python scripts/evaluate_agent_utility_v5_adaptive_shortlist.py \
            --input artifacts/adaptive-dev/rankings.jsonl \
            --out artifacts/adaptive-dev/result.json
      - name: Verify canonical DEV output boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ranking = json.loads(
              Path("artifacts/adaptive-dev/ranking-manifest.json")
              .read_text(encoding="utf-8")
          )
          result = json.loads(
              Path("artifacts/adaptive-dev/result.json")
              .read_text(encoding="utf-8")
          )
          assert ranking["row_count"] == 720
          assert ranking["scoring_started_only_after_freeze_manifest_validation"] is True
          assert result["row_count"] == 720
          assert result["surface"] == "development"
          assert result["claim_boundary"].startswith("DEV policy selection only")
          assert "FIXED-5" in result["policy_metrics"]
          print(
              json.dumps(
                  {
                      "selected_adaptive_policy": result[
                          "selected_adaptive_policy"
                      ],
                      "eligible_adaptive_policies": result[
                          "eligible_adaptive_policies"
                      ],
                  },
                  sort_keys=True,
              )
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "adaptive-dev-${{ github.run_id }}"
          path: artifacts/adaptive-dev/
          if-no-files-found: error
          retention-days: 30
