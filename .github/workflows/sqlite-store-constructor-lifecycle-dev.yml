name: SQLite Store Constructor Lifecycle DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/registry.py"
      - "src/schemarouter/traces.py"
      - "tests/test_sqlite_store_constructor_lifecycle.py"
      - ".github/workflows/sqlite-store-constructor-lifecycle-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constructor-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15.0-rc.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Check edited runtime and regression files
        run: ruff check src/schemarouter/registry.py src/schemarouter/traces.py tests/test_sqlite_store_constructor_lifecycle.py
      - name: Verify lifecycle and pre-existing registry/trace regressions
        run: |
          python -m pytest -q -W error::ResourceWarning \
            tests/test_sqlite_store_constructor_lifecycle.py \
            tests/test_sqlite_registry.py \
            tests/test_run_traces.py
