name: Authorized E5 13-500 Native Source CPU DEV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/evaluate_authorized_e5_scale_500_cpu_dev.py"
      - "tests/test_evaluate_authorized_e5_scale_500_cpu_dev.py"
      - "research/autoresearch/authorized-e5-scale-500-cpu-dev.md"
      - ".github/workflows/research-authorized-e5-scale-500-cpu-dev.yml"

permissions:
  contents: read

concurrency:
  group: authorized-e5-500-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-source-and-no-model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install no-model E0 contract dependencies
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Verify 13 to 500 actual registry source and K5 bound, no E2 claims
        run: |
          ruff check scripts/evaluate_authorized_e5_scale_500_cpu_dev.py tests/test_evaluate_authorized_e5_scale_500_cpu_dev.py
          python -m pytest -q tests/test_evaluate_authorized_e5_scale_500_cpu_dev.py
          python -m scripts.evaluate_authorized_e5_scale_500_cpu_dev --mode validate

  actual-pinned-e5-cpu-scale-dev:
    needs: native-source-and-no-model-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install verified local CPU model runtime
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Run real pinned E5 with native authorized K5 at 13-500 source routes
        run: |
          python -m scripts.evaluate_authorized_e5_scale_500_cpu_dev \
            --mode real-e5-cpu \
            --out artifacts/authorized-e5-scale-500-dev/report.json
      - name: Publish non-E2, no-fit-not-calibrated summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("artifacts/authorized-e5-scale-500-dev/report.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Actual pinned E5 CPU × nested native 13/100/250/500 **synthetic DEV**\n\n")
              f.write("Previously disclosed 84 requests, 48 supported, 36 unsupported. Synthetic distractors are NOT 500 real native provider services. No real agent, E2, host invoker, calibrated no-fit or product release.\n\n")
              f.write("| Routes | Arm | Supported R@1 | Supported R@5 | Unsupported nonempty | Candidate selection p95 (ms) |\n|---:|---|---:|---:|---:|---:|\n")
              for size, scope in report["results"].items():
                  for arm, row in scope["arms"].items():
                      f.write(f"| {size} | {arm} | {row['supported_recall_at_1']:.3f} | {row['supported_recall_at_5']:.3f} | {row['unsupported_nonempty_shortlist_rate']:.3f} | {row['selection_latency_ms_p95']:.2f} |\n")
              f.write("\n### Profiled stage p95 CPU timing (ms)\n\n")
              f.write("Shared snapshot preparation is excluded from selection latency. The snapshot+selection metric includes it once. These are not end-to-end agent measurements.\n\n")
              f.write("| Routes | Arm | Source snapshot | Model decision | Other selection | Snapshot+selection |\n|---:|---|---:|---:|---:|---:|\n")
              for size, scope in report["results"].items():
                  for arm, row in scope["arms"].items():
                      stages = row["stage_latency_ms"]
                      capture = stages["source_capture_latency_ms"]["p95"]
                      model = stages["backend_decision_latency_ms"]["p95"]
                      other = stages["nonbackend_selection_latency_ms"]["p95"]
                      combined = stages["source_capture_plus_selection_latency_ms"]["p95"]
                      f.write(f"| {size} | {arm} | {capture:.2f} | {model:.2f} | {other:.2f} | {combined:.2f} |\n")
              f.write("Stage percentiles **cannot be added** to derive a total p95. Metrics use warm E5 passage cache; no production SLA.\n")
              f.write(f"\nFixed K: {report['fixed_k']}. Source SHA256: `{report['source_corpus_sha256']}`. No automatic promotion.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: authorized-e5-500-cpu-dev-${{ github.run_id }}
          path: artifacts/authorized-e5-scale-500-dev/report.json
          if-no-files-found: error
          retention-days: 30
