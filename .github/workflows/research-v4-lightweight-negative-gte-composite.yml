name: V4 Lightweight Negative + GTE Composition

on:
  push:
    branches:
      - "research/v4-lightweight-negative-gte-composite"
    paths:
      - ".github/workflows/research-v4-lightweight-negative-gte-composite.yml"
      - "benchmarks/operation-routing-v4-lightweight-negative-gte-composite.json"
      - "scripts/compose_lightweight_negative_gte_v4.py"
      - "tests/test_lightweight_negative_gte_composite_v4.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v4-lightweight-negative-gte-composite-${{ github.ref }}
  cancel-in-progress: true

env:
  GTE_ARTIFACT_ID: "10934337695"
  GTE_RUN_ID: "36326745694"
  GTE_ARTIFACT_SHA256: "7881a3594ecdab6a242a946a60cfde14d64e3c452ec9d0956c9cfa75a1e0c748"
  NEG_ARTIFACT_ID: "10942243493"
  NEG_RUN_ID: "36352558325"
  NEG_ARTIFACT_SHA256: "a831a35098b546c8003435ea04927fb8767aab1435320823ba4763e0b6608ae1"
  DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate preregistration and contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-lightweight-negative-gte-composite.json >/dev/null
          ruff check scripts/compose_lightweight_negative_gte_v4.py tests/test_lightweight_negative_gte_composite_v4.py
          pytest -q tests/test_lightweight_negative_gte_composite_v4.py

  compose:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Download and validate frozen source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gte /tmp/negative artifacts/v4-lightweight-negative-gte-composite
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          specs = [
              ("GTE", int(os.environ["GTE_ARTIFACT_ID"]), int(os.environ["GTE_RUN_ID"]), os.environ["GTE_ARTIFACT_SHA256"]),
              ("NEG", int(os.environ["NEG_ARTIFACT_ID"]), int(os.environ["NEG_RUN_ID"]), os.environ["NEG_ARTIFACT_SHA256"]),
          ]
          for label, artifact_id, run_id, digest in specs:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  data = json.load(response)
              if data.get("expired"):
                  raise SystemExit(f"{label}: artifact expired")
              actual_run = int(data["workflow_run"]["id"])
              if actual_run != run_id:
                  raise SystemExit(
                      f"{label}: expected run {run_id}, got {actual_run}"
                  )
              actual_digest = str(data.get("digest", ""))
              expected_digest = "sha256:" + digest
              if actual_digest != expected_digest:
                  raise SystemExit(
                      f"{label}: expected digest {expected_digest}, got {actual_digest}"
                  )
              print(
                  f"{label}: validated artifact={artifact_id} "
                  f"run={actual_run} digest={actual_digest}"
              )
          PY

          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${GTE_ARTIFACT_ID}/zip"             -o /tmp/gte.zip
          unzip -q /tmp/gte.zip -d /tmp/gte

          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NEG_ARTIFACT_ID}/zip"             -o /tmp/negative.zip
          unzip -q /tmp/negative.zip -d /tmp/negative

      - name: Verify source corpus identities
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifests = list(Path("/tmp/gte").rglob("corpus-manifest.json"))
          manifests += list(Path("/tmp/negative").rglob("corpus-manifest.json"))
          if len(manifests) != 2:
              raise SystemExit(f"expected 2 corpus manifests, found {len(manifests)}")
          expected = os.environ["DEV_SHA256"]
          for path in manifests:
              data = json.loads(path.read_text(encoding="utf-8"))
              actual = data.get("corpus_sha256")
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected corpus SHA {expected}, got {actual}"
                  )
              if data.get("case_count") != 1800:
                  raise SystemExit(f"{path}: unexpected case count")
              print(f"verified {path}: {actual}")
          PY

      - name: Compose frozen lightweight evidence
        run: |
          GTE_ANALYSIS="$(find /tmp/gte -type f -name analysis.json -print -quit)"
          NEG_ANALYSIS="$(find /tmp/negative -type f -name analysis.json -print -quit)"
          test -n "${GTE_ANALYSIS}"
          test -n "${NEG_ANALYSIS}"
          python scripts/compose_lightweight_negative_gte_v4.py             --gte-analysis "${GTE_ANALYSIS}"             --negative-analysis "${NEG_ANALYSIS}"             --out artifacts/v4-lightweight-negative-gte-composite/analysis.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v4-lightweight-negative-gte-composite-${{ github.run_id }}
          path: |
            artifacts/v4-lightweight-negative-gte-composite/analysis.json
            benchmarks/operation-routing-v4-lightweight-negative-gte-composite.json
          if-no-files-found: error
          retention-days: 30
