name: Python 3.12 Test Timing DEV

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/python-312-test-timing-dev.yml"
      - "scripts/ci_pytest_timing_summary.py"
      - "tests/test_ci_pytest_timing_summary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: python -m pip install "pytest>=8.2" "pytest-asyncio>=0.24" "ruff>=0.6"
      - name: Ruff source and regression tests
        run: ruff check scripts/ci_pytest_timing_summary.py tests/test_ci_pytest_timing_summary.py
      - name: Execute duration reporter regressions
        run: python -m pytest -q tests/test_ci_pytest_timing_summary.py
