name: Research V6B Corpus Freeze

on:
  push:
    branches:
      - "research/0.13-hard-negative-ellipsoid"
    paths:
      - ".github/workflows/research-v6b-corpus-freeze.yml"
      - "benchmarks/operation-routing-v6b-hard-negative-ellipsoid-preregistration.json"
      - "benchmarks/schema_hard_negative_ellipsoid.py"
      - "benchmarks/operation_routing_v6b_catalog.py"
      - "scripts/generate_operation_routing_v6b.py"
      - "tests/test_schema_hard_negative_ellipsoid.py"
      - "tests/test_operation_routing_v6b_protocol.py"
  pull_request:
    paths:
      - ".github/workflows/research-v6b-corpus-freeze.yml"
      - "benchmarks/operation-routing-v6b-hard-negative-ellipsoid-preregistration.json"
      - "benchmarks/schema_hard_negative_ellipsoid.py"
      - "benchmarks/operation_routing_v6b_catalog.py"
      - "scripts/generate_operation_routing_v6b.py"
      - "tests/test_schema_hard_negative_ellipsoid.py"
      - "tests/test_operation_routing_v6b_protocol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate preregistration and source
        run: |
          python -m json.tool benchmarks/operation-routing-v6b-hard-negative-ellipsoid-preregistration.json >/dev/null
          ruff check \
            benchmarks/schema_hard_negative_ellipsoid.py \
            benchmarks/operation_routing_v6b_catalog.py \
            scripts/generate_operation_routing_v6b.py \
            tests/test_schema_hard_negative_ellipsoid.py \
            tests/test_operation_routing_v6b_protocol.py
          PYTHONPATH=. pytest -q \
            tests/test_schema_hard_negative_ellipsoid.py \
            tests/test_operation_routing_v6b_protocol.py

      - name: Generate DEV and confirmation together before scoring
        run: |
          python scripts/generate_operation_routing_v6b.py \
            --out-dir artifacts/operation-routing-v6b
          cat artifacts/operation-routing-v6b/freeze-manifest.json

      - name: Validate frozen counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          freeze = json.loads(
              Path("artifacts/operation-routing-v6b/freeze-manifest.json").read_text()
          )
          for role in ("development", "confirmation"):
              manifest = freeze[role]
              assert manifest["case_count"] == 552
              assert manifest["supported_cases"] == 228
              assert manifest["near_domain_cases"] == 252
              assert manifest["out_of_domain_cases"] == 72
              assert manifest["route_count"] == 19
              assert manifest["tool_count"] == 7
              assert manifest["synthetic_positives_per_route"] == 18
              assert manifest["corpus_sha256"]
          assert (
              freeze["development"]["corpus_sha256"]
              != freeze["confirmation"]["corpus_sha256"]
          )
          print("V6B DEV+confirmation frozen together without scoring")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operation-routing-v6b-freeze-${{ github.run_id }}
          path: artifacts/operation-routing-v6b/
          retention-days: 30
