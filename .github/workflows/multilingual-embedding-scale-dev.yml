name: Multilingual Embedding Catalog Scale DEV

on:
  pull_request:
    paths:
      - ".github/workflows/multilingual-embedding-scale-dev.yml"
      - "scripts/evaluate_multilingual_embedding_scale_dev.py"
      - "tests/test_multilingual_embedding_scale_dev.py"
      - "scripts/evaluate_multilingual_embedding_cpu_dev.py"
      - "benchmarks/multilingual-embedding-cpu-dev-20261015.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multilingual-catalog-scale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - run: |
          python -m pytest -q tests/test_multilingual_embedding_scale_dev.py
          python scripts/evaluate_multilingual_embedding_scale_dev.py --model validate

  mini-cpu-stress:
    needs: catalog-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [minilm, e5-small]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Real CPU stress at 13 / 100 / 250 / 500 routes
        run: |
          python scripts/evaluate_multilingual_embedding_scale_dev.py \
            --model "${{ matrix.model }}" \
            --output "artifacts/catalog-scale-dev/${{ matrix.model }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-scale-dev-${{ matrix.model }}-${{ github.run_id }}
          path: artifacts/catalog-scale-dev/${{ matrix.model }}.json
          if-no-files-found: error
          retention-days: 30
