name: Authorized V1 to V3 Local Adapter DEV

on:
  pull_request:
    paths:
      - ".github/workflows/research-authorized-v3-adapter-dev.yml"
      - "scripts/research_v3_authorized_adapter_transfer_dev.py"
      - "tests/test_research_v3_authorized_adapter_transfer_dev.py"
      - "research/autoresearch/authorized-v3-transfer-dev.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-v3-transfer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-current-authorized-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install current checked-out SchemaRouter and pytest
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - name: Verify actual principal-scoped route and field invariants
        run: python -m pytest -q tests/test_research_v3_authorized_adapter_transfer_dev.py
      - name: Record V1/V3 current OpenAPI/MCP plus typed authorized DEV scores
        run: |
          python -m scripts.research_v3_authorized_adapter_transfer_dev \
            --output artifacts/authorized-v3-transfer-dev/report.json
      - name: Preserve every case-level gain, miss and source identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authorized-v3-transfer-dev-${{ github.run_id }}
          path: artifacts/authorized-v3-transfer-dev/report.json
          retention-days: 90
          if-no-files-found: error
# No live external tool execution, paid model, GPU or external coding agent.
# This source-visible handcrafted DEV is not a blind test.
