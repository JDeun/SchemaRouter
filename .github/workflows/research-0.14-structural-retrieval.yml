name: Research 0.14 Structural Retrieval DEV

on:
  workflow_dispatch:
  push:
    branches:
      - "research/0.14-structural-retrieval-run"
    paths:
      - ".github/structural-retrieval-trigger.json"

permissions:
  contents: read

concurrency:
  group: research-0.14-structural-retrieval-dev
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify frozen matcher semantics
        run: |
          pytest -q tests/test_agent_utility_structural_retrieval.py
      - name: Evaluate preregistered structural variants
        run: |
          mkdir -p artifacts/structural-retrieval
          python scripts/evaluate_agent_utility_v5_structural_retrieval.py \
            --out artifacts/structural-retrieval/result.json
      - name: Verify DEV-only claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/structural-retrieval/result.json")
              .read_text(encoding="utf-8")
          )
          assert result["issue"] == 430
          assert result["surface"] == "development"
          assert result["scorer_core_changed"] is False
          assert result["confirmation_surface_used"] is False
          assert result["b2_outcomes_used"] is False
          assert "BASELINE" in result["variant_metrics"]
          baseline = result["variant_metrics"]["BASELINE"]
          assert baseline["per_catalog"]["100"][
              "required_route_recall_at_10"
          ] == 205 / 210
          assert baseline["per_catalog"]["250"][
              "required_route_recall_at_10"
          ] == 203 / 210
          assert baseline["per_catalog"]["500"][
              "required_route_recall_at_10"
          ] == 183 / 210
          print(
              json.dumps(
                  {
                      "eligible_variants": result[
                          "eligible_variants"
                      ],
                      "selected_variant": result[
                          "selected_variant"
                      ],
                      "variant_metrics": {
                          key: {
                              "eligible": value["eligible"],
                              "worst_recall": value[
                                  "worst_catalog_required_route_recall_at_10"
                              ],
                              "worst_full_coverage": value[
                                  "worst_catalog_all_required_full_coverage_at_10"
                              ],
                              "recovered": value[
                                  "newly_recovered_required_routes"
                              ],
                              "lost": value[
                                  "newly_lost_required_routes"
                              ],
                          }
                          for key, value in result[
                              "variant_metrics"
                          ].items()
                      },
                  },
                  sort_keys=True,
              )
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "structural-retrieval-dev-${{ github.run_id }}"
          path: artifacts/structural-retrieval/
          if-no-files-found: error
          retention-days: 30
