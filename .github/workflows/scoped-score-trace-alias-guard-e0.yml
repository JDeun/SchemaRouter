name: Scoped Score Trace Alias Guard E0

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "tests/test_scoped_score_trace_alias_guard.py"
      - ".github/workflows/scoped-score-trace-alias-guard-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-score-trace-alias:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Scoped full and lightweight route score sidecar noninterference
        run: |
          python -m pip install -e ".[dev]"
          ruff check src/schemarouter/runtime.py tests/test_scoped_score_trace_alias_guard.py
          python -m pytest -q             tests/test_scoped_score_trace_alias_guard.py             tests/test_scoped_visible_field_metadata.py             tests/test_scoped_route_only_data_scope.py             tests/test_scoped_lexical_score_noninterference.py
      - name: Evidence boundary
        if: success()
        run: |
          echo "No-model synthetic post-ranking scope guard. Not external model E2 or release qualification." >> "$GITHUB_STEP_SUMMARY"
