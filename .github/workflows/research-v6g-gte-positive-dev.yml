name: Research V6G GTE Positive Retriever DEV

on:
  push:
    branches:
      - "research/0.13-gte-positive-retriever"
    paths:
      - ".github/workflows/research-v6g-gte-positive-dev.yml"
      - "scripts/evaluate_gte_positive_retriever_v6g.py"
  pull_request:
    paths:
      - ".github/workflows/research-v6g-gte-positive-dev.yml"
      - "scripts/evaluate_gte_positive_retriever_v6g.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SOURCE: "723038fd388ebc263bf923ff93eee79af1ce30f4"
  DEV_SHA256: "d30d0227f7ca78adf1d44a84ffc4f20bac4440dc5d2495dcdee673f8707e473d"
  CONFIRM_SHA256: "9934e5b6f88a2dc6dad50190530c4cac1c2a90617558448392c21dab75092e07"

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify frozen behavior and corpus source
        run: |
          git diff --exit-code "${FROZEN_SOURCE}" -- \
            benchmarks/operation-routing-v6g-gte-positive-retriever-preregistration.json \
            benchmarks/operation_routing_v6g_catalog.py \
            scripts/generate_operation_routing_v6g.py \
            tests/test_operation_routing_v6g_protocol.py
      - name: Validate evaluator and protocol
        run: |
          ruff check scripts/evaluate_gte_positive_retriever_v6g.py
          PYTHONPATH=. pytest -q tests/test_operation_routing_v6g_protocol.py

  evaluate-development:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"
      - name: Recreate both frozen corpora
        run: |
          python scripts/generate_operation_routing_v6g.py \
            --out-dir artifacts/operation-routing-v6g
      - name: Verify frozen identities
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("artifacts/operation-routing-v6g")
          freeze = json.loads((root / "freeze-manifest.json").read_text())
          if freeze["development"]["corpus_sha256"] != os.environ["DEV_SHA256"]:
              raise SystemExit("DEV corpus drifted")
          if freeze["confirmation"]["corpus_sha256"] != os.environ["CONFIRM_SHA256"]:
              raise SystemExit("confirmation corpus drifted")
          for role in ("development", "confirmation"):
              m = freeze[role]
              if m["case_count"] != 228 or m["supported_cases"] != 228:
                  raise SystemExit(f"unexpected {role} counts")
              if m["near_domain_cases"] != 0 or m["out_of_domain_cases"] != 0:
                  raise SystemExit(f"unexpected open-set rows in {role}")
          print("frozen #409 identities verified; confirmation unscored")
          PY
      - name: Score development only
        run: |
          python scripts/evaluate_gte_positive_retriever_v6g.py \
            --development artifacts/operation-routing-v6g/development.json \
            --out artifacts/operation-routing-v6g/dev-analysis.json
      - name: Validate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/operation-routing-v6g/dev-analysis.json").read_text())
          p = data["policy"]
          if p["confirmation_scored"]:
              raise SystemExit("confirmation scored")
          if not p["supported_only"] or not p["gte_is_sole_positive_selector"]:
              raise SystemExit("authority/protocol drift")
          if not p["bge_is_diagnostic_only"]:
              raise SystemExit("BGE affected authority")
          if p["schema_weight"] != 0.25 or p["action_weight"] != 0.75:
              raise SystemExit("GTE weights drifted")
          if p["bge_fusion"] or p["bge_consensus"] or p["reranker"] or p["abstention"]:
              raise SystemExit("unregistered composition")
          if p["score_threshold"] is not None or p["margin_threshold"] is not None:
              raise SystemExit("threshold detected")
          if p["rank2_fallback"] or p["pseudo_route"] or p["dev_selected_hyperparameters"]:
              raise SystemExit("forbidden routing/tuning")
          if data["metrics"]["execution_errors"] != 0:
              raise SystemExit("execution errors")
          print("quality_pass=", data["quality_pass"])
          print("runtime_gate=", data["runtime_gate"])
          print("surface_pass=", data["surface_pass"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operation-routing-v6g-gte-dev-${{ github.run_id }}
          path: |
            artifacts/operation-routing-v6g/dev-analysis.json
            artifacts/operation-routing-v6g/development-manifest.json
            artifacts/operation-routing-v6g/confirmation-manifest.json
            artifacts/operation-routing-v6g/freeze-manifest.json
            benchmarks/operation-routing-v6g-gte-positive-retriever-preregistration.json
          if-no-files-found: warn
          retention-days: 30
