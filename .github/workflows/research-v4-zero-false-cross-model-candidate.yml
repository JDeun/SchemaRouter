name: V4 Zero-False Cross-Model Candidate

on:
  push:
    branches:
      - "research/v4-zero-false-cross-model-candidate"
    paths:
      - ".github/workflows/research-v4-zero-false-cross-model-candidate.yml"
      - "benchmarks/bge_m3_frozen_candidate.py"
      - "benchmarks/cross_model_rescue_candidate.py"
      - "benchmarks/operation-routing-v4-zero-false-cross-model-candidate.json"
      - "scripts/evaluate_cross_model_rescue_candidate_v4.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/generate_decision_routing_quality_v4_confirmation.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "tests/test_cross_model_rescue_candidate_v4.py"
      - "tests/test_cross_model_rescue_confirmation_v4.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  V4_TUNING_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_TUNING_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"
  V4_FRESH_SEED: "operation-routing-quality-v4-zero-false-confirmation-2026-09-28-a"

concurrency:
  group: v4-zero-false-cross-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate frozen candidate contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-zero-false-cross-model-candidate.json >/dev/null
          ruff check             benchmarks/cross_model_rescue_candidate.py             scripts/evaluate_cross_model_rescue_candidate_v4.py             scripts/generate_decision_routing_quality_v4_confirmation.py             tests/test_cross_model_rescue_candidate_v4.py             tests/test_cross_model_rescue_confirmation_v4.py
          pytest -q             tests/test_cross_model_rescue_candidate_v4.py             tests/test_cross_model_rescue_confirmation_v4.py

  same-corpus-confirmation:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"
      - name: Generate frozen tuning DEV corpus
        run: |
          OUT="artifacts/v4-zero-false-cross-model/same"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py             --seed "${V4_TUNING_SEED}"             --source-revision "${SCHEMAROUTER_SOURCE_REVISION}"             --out "${OUT}/corpus.json"             --manifest "${OUT}/corpus-manifest.json"
      - name: Verify frozen corpus identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("artifacts/v4-zero-false-cross-model/same/corpus-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          actual = manifest.get("corpus_sha256")
          expected = os.environ["V4_TUNING_SHA256"]
          if actual != expected:
              raise SystemExit(f"corpus SHA mismatch: expected {expected}, got {actual}")
          if manifest.get("case_count") != 1800:
              raise SystemExit(f"unexpected case count: {manifest.get('case_count')}")
          print(f"verified corpus sha256={actual}")
          PY
      - name: Audit corpus
        run: |
          OUT="artifacts/v4-zero-false-cross-model/same"
          python scripts/audit_operation_routing_corpus.py             --corpus "${OUT}/corpus.json"             --out "${OUT}/corpus-audit.json"             --near-duplicate-threshold 0.80             --max-duplicate-examples 50
      - name: Confirm frozen candidate on tuning DEV
        run: |
          OUT="artifacts/v4-zero-false-cross-model/same"
          python scripts/evaluate_cross_model_rescue_candidate_v4.py             --corpus "${OUT}/corpus.json"             --dataset-role "same_corpus_executable_parity"             --out "${OUT}/report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-zero-false-cross-model-same-${{ github.run_id }}
          path: |
            artifacts/v4-zero-false-cross-model/same/report.json
            artifacts/v4-zero-false-cross-model/same/corpus-manifest.json
            artifacts/v4-zero-false-cross-model/same/corpus-audit.json
            benchmarks/operation-routing-v4-zero-false-cross-model-candidate.json
          if-no-files-found: error
          retention-days: 30

  fresh-surface-confirmation:
    needs: same-corpus-confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.44,<5" "sentence-transformers>=3,<6" einops
      - run: pip install -e ".[dev]"
      - name: Generate preregistered fresh-surface DEV
        run: |
          OUT="artifacts/v4-zero-false-cross-model/fresh"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4_confirmation.py             --seed "${V4_FRESH_SEED}"             --reference-seed "${V4_TUNING_SEED}"             --source-revision "${SCHEMAROUTER_SOURCE_REVISION}"             --out "${OUT}/corpus.json"             --manifest "${OUT}/corpus-manifest.json"
      - name: Verify fresh-surface corpus contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/v4-zero-false-cross-model/fresh/corpus-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("role") != "fresh_surface_development_confirmation":
              raise SystemExit(f"unexpected role: {manifest.get('role')}")
          if manifest.get("case_count") != 1800:
              raise SystemExit(f"unexpected case count: {manifest.get('case_count')}")
          if manifest.get("normalized_exact_overlap_with_reference_dev") != 0:
              raise SystemExit("fresh-surface corpus overlaps tuning DEV")
          print(
              "verified fresh corpus",
              manifest.get("corpus_sha256"),
              manifest.get("surface_version"),
          )
          PY
      - name: Audit fresh-surface corpus
        run: |
          OUT="artifacts/v4-zero-false-cross-model/fresh"
          python scripts/audit_operation_routing_corpus.py             --corpus "${OUT}/corpus.json"             --out "${OUT}/corpus-audit.json"             --near-duplicate-threshold 0.80             --max-duplicate-examples 50
      - name: Confirm frozen candidate on fresh-surface DEV
        run: |
          OUT="artifacts/v4-zero-false-cross-model/fresh"
          python scripts/evaluate_cross_model_rescue_candidate_v4.py             --corpus "${OUT}/corpus.json"             --dataset-role "fresh_surface_development_confirmation"             --out "${OUT}/report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-zero-false-cross-model-fresh-${{ github.run_id }}
          path: |
            artifacts/v4-zero-false-cross-model/fresh/report.json
            artifacts/v4-zero-false-cross-model/fresh/corpus-manifest.json
            artifacts/v4-zero-false-cross-model/fresh/corpus-audit.json
            benchmarks/operation-routing-v4-zero-false-cross-model-candidate.json
          if-no-files-found: error
          retention-days: 30
