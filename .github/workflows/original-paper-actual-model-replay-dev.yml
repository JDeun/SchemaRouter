name: Original Paper Actual Model Replay DEV

on:
  workflow_call:
    inputs:
      cohort:
        type: string
        default: pilot
  workflow_dispatch:
    inputs:
      cohort:
        description: "Public CPU checkpoint: pilot or full (not original 122B)"
        type: choice
        options: [pilot, full]
        default: pilot

permissions:
  contents: read

jobs:
  original-paper-local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JDeun/paper_SchemaRouter
          ref: 368116746170d6dd0d95a91352daba8abc42ca13
          path: original-paper
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install existing pinned-source CPU runtime
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . "transformers>=4.51,<5" "huggingface-hub>=0.30,<2" "pytest>=8,<10" "ruff>=0.9,<1"
      - name: Validate frozen sources and runtime prerequisites
        run: |
          ruff check scripts/research_original_paper_model_replay.py
          python - <<'PY'
          import shutil
          from pathlib import Path
          from scripts.research_original_paper_model_replay import _verify_original, _cohort, _jsonl
          _verify_original(Path("original-paper"))
          rows = _jsonl(Path("original-paper/experiments/dataset/queries.jsonl"))
          assert len(_cohort(rows, "pilot")) == 9 and len(_cohort(rows, "full")) == 110
          assert shutil.disk_usage(".").free >= 7 * 1024**3
          PY
      - name: Fetch existing pinned public Qwen weights
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from scripts.agent_utility_v7_dev_agent import MODEL_NAME, MODEL_REVISION
          assert MODEL_NAME == "Qwen/Qwen3-0.6B"
          assert MODEL_REVISION == "c1899de289a04d12100db370d81485cdf75e47ca"
          snapshot_download(repo_id=MODEL_NAME, revision=MODEL_REVISION,
                            allow_patterns=("*.json","*.safetensors","*.model","tokenizer*","*.jinja"))
          PY
      - name: Run genuine common-model three-arm frozen-fixture comparison
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          COHORT: ${{ inputs.cohort || 'pilot' }}
        run: |
          python -m scripts.research_original_paper_model_replay \
            --paper-root original-paper --backend local-qwen --cohort "$COHORT" \
            --out artifacts/paper-model/rows.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: original-paper-real-model-dev
          path: artifacts/paper-model/
          if-no-files-found: warn
