name: V4 Bounded Action Embedding Diagnostic
# research-trigger: lint-fixed

on:
  push:
    branches:
      - "research/v4-bounded-action-embedding"
    paths:
      - ".github/workflows/research-v4-bounded-action-embedding.yml"
      - "benchmarks/operation-routing-v4-bounded-action-embedding.json"
      - "scripts/analyze_bounded_action_embedding_v4.py"
      - "tests/test_bounded_action_embedding_v4.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "scripts/benchmark_decision_routing.py"
      - "benchmarks/multilingual_embedder.py"
      - "src/schemarouter/planner.py"
      - "src/schemarouter/decisions.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: v4-bounded-action-embedding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate diagnostic contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-bounded-action-embedding.json >/dev/null
          ruff check scripts/analyze_bounded_action_embedding_v4.py tests/test_bounded_action_embedding_v4.py
          pytest -q tests/test_bounded_action_embedding_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate identical fresh v4 development corpus
        run: |
          OUT="artifacts/v4-bounded-action-embedding"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py             --seed "${V4_DEV_SEED}"             --source-revision "${SCHEMAROUTER_SOURCE_REVISION}"             --out "${OUT}/corpus.json"             --manifest "${OUT}/corpus-manifest.json"
      - name: Audit corpus
        run: |
          OUT="artifacts/v4-bounded-action-embedding"
          python scripts/audit_operation_routing_corpus.py             --corpus "${OUT}/corpus.json"             --out "${OUT}/corpus-audit.json"             --near-duplicate-threshold 0.80             --max-duplicate-examples 50
      - name: Run bounded action embedding diagnostic
        run: |
          OUT="artifacts/v4-bounded-action-embedding"
          python scripts/analyze_bounded_action_embedding_v4.py             --corpus "${OUT}/corpus.json"             --warmup-cases 24             --out "${OUT}/analysis.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-bounded-action-embedding-${{ github.run_id }}
          path: |
            artifacts/v4-bounded-action-embedding/analysis.json
            artifacts/v4-bounded-action-embedding/corpus-manifest.json
            artifacts/v4-bounded-action-embedding/corpus-audit.json
            benchmarks/operation-routing-v4-bounded-action-embedding.json
          if-no-files-found: error
          retention-days: 30
