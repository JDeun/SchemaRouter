name: SQLite Connection Lifetime Python 3.15 DEV

on:
  pull_request:
    paths:
      - "tests/test_sqlite_native_graph_journal_e0.py"
      - "tests/test_sqlite_native_posting_journal_e0.py"
      - "tests/test_sqlite_registry_mutation_journal_e0.py"
      - "tests/test_sqlite_native_g5_graph_journal_e0.py"
      - "tests/test_research_central_durable_reservation_e0.py"
      - ".github/workflows/sqlite-315-lifecycle-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-connection-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.2"
          allow-prereleases: true
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check exact changed tests with Ruff
        run: |
          ruff check tests/test_sqlite_native_graph_journal_e0.py tests/test_sqlite_native_posting_journal_e0.py tests/test_sqlite_registry_mutation_journal_e0.py tests/test_sqlite_native_g5_graph_journal_e0.py tests/test_research_central_durable_reservation_e0.py
      - name: Exercise SQLite close, rollback, damaged journal and affected Python preview regressions
        # A global PYTHONTRACEMALLOC setting is inherited by spawned worker
        # processes and can exceed their independent 30-second test deadlines.
        # ResourceWarnings still fail the run explicitly below.
        run: |
          python -m pytest -q -W error::ResourceWarning \
            tests/test_sqlite_native_graph_journal_e0.py \
            tests/test_sqlite_native_posting_journal_e0.py \
            tests/test_sqlite_registry_mutation_journal_e0.py \
            tests/test_sqlite_native_g5_graph_journal_e0.py \
            tests/test_research_central_durable_reservation_e0.py \
            tests/test_research_codegraph_graph_frontier_e1.py::test_frontier_producer_consumer_then_empty_final_menu \
            tests/test_startup_rebinding.py::test_mcp_bound_transport_fingerprint_mismatch_is_incompatible
