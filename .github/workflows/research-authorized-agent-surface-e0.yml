name: Principal Scoped Agent Model View E0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_authorized_agent_tool_surface.py"
      - "scripts/research_scoped_host_invocation.py"
      - "tests/test_research_authorized_agent_tool_surface.py"
      - ".github/workflows/research-authorized-agent-surface-e0.yml"
      - "research/autoresearch/principal-scoped-agent-disclosure-e0.md"

permissions:
  contents: read

concurrency:
  group: scoped-agent-view-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-view-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install package and source-scope regression tools
        run: |
          python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Verify scoped model disclosure, output projection and metrics-only trace
        run: |
          ruff check scripts/research_authorized_agent_tool_surface.py scripts/research_scoped_host_invocation.py tests/test_research_authorized_agent_tool_surface.py
          python -m pytest -q tests/test_research_authorized_agent_tool_surface.py
      - name: Ensure no implied invoker authority or external E2
        run: |
          python - <<'PY'
          from dataclasses import fields
          from scripts.research_authorized_agent_tool_surface import (
              AuthorizedAgentToolSurface, MAX_TOOL_DEFINITIONS,
          )
          assert MAX_TOOL_DEFINITIONS == 5
          declared = {field.name: field.default for field in fields(AuthorizedAgentToolSurface)}
          assert declared["independent_quality_evidence"] is False
          assert declared["executable_authority"] is False
          print("Synthetic principal-scoped model disclosure only, not authorization receipt or E2")
          PY
