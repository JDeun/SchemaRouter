name: V4 Bounded Rerank Diagnostic

on:
  push:
    branches:
      - "research/v4-bounded-rerank-diagnostic"
    paths:
      - ".github/workflows/research-v4-bounded-rerank-diagnostic.yml"
      - "benchmarks/operation-routing-v4-bounded-rerank-diagnostic.json"
      - "scripts/analyze_operation_routing_v4_bounded_rerank.py"
      - "scripts/benchmark_decision_routing.py"
      - "src/schemarouter/planner.py"
      - "tests/test_operation_routing_v4_bounded_rerank_analysis.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: v4-bounded-rerank-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate diagnostic contracts
        run: |
          ruff check scripts/analyze_operation_routing_v4_bounded_rerank.py tests/test_operation_routing_v4_bounded_rerank_analysis.py
          pytest -q tests/test_operation_routing_v4_bounded_rerank_analysis.py tests/test_planner.py

  diagnostic:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate identical fresh v4 development corpus
        run: |
          mkdir -p artifacts/v4-bounded-rerank
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out artifacts/v4-bounded-rerank/corpus.json \
            --manifest artifacts/v4-bounded-rerank/corpus-manifest.json
      - name: Audit corpus before model scoring
        run: |
          python scripts/audit_operation_routing_corpus.py \
            --corpus artifacts/v4-bounded-rerank/corpus.json \
            --out artifacts/v4-bounded-rerank/corpus-audit.json \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50
      - name: Run zero-threshold bounded retrieve-rerank diagnostic
        run: |
          CANDIDATE="keyword+semantic-recall+operation-fit-all-candidates+accepted-selector"
          python scripts/benchmark_decision_routing.py \
            --corpus artifacts/v4-bounded-rerank/corpus.json \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 4 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.0 \
            --operation-fit-min-margin 0.0 \
            --operation-fit-scope all_candidates \
            --operation-fit-select-accepted \
            --planner-name "${CANDIDATE}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 bounded retrieve-rerank diagnostic" \
            --json-out artifacts/v4-bounded-rerank/report.json
      - name: Analyze raw score surface and winner-only frontier
        run: |
          python scripts/analyze_operation_routing_v4_bounded_rerank.py \
            --report artifacts/v4-bounded-rerank/report.json \
            --out artifacts/v4-bounded-rerank/analysis.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v4-bounded-rerank-diagnostic-${{ github.run_id }}
          path: |
            artifacts/v4-bounded-rerank/report.json
            artifacts/v4-bounded-rerank/analysis.json
            artifacts/v4-bounded-rerank/corpus-manifest.json
            artifacts/v4-bounded-rerank/corpus-audit.json
          if-no-files-found: error
          retention-days: 30
