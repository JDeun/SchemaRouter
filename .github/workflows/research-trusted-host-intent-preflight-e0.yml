name: Trusted Host Intent Preflight E0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_trusted_host_intent_preflight_e0.py"
      - "tests/test_research_trusted_host_intent_preflight_e0.py"
      - "research/autoresearch/trusted-host-intent-preflight-e0.md"
      - ".github/workflows/research-trusted-host-intent-preflight-e0.yml"

permissions:
  contents: read

concurrency:
  group: trusted-host-preflight-e0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorization-and-disposition-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install scoped native E0 runtime and testing
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Fail-closed EN KO JA typed host preflight and authorization regressions
        run: |
          ruff check scripts/research_trusted_host_intent_preflight_e0.py tests/test_research_trusted_host_intent_preflight_e0.py
          python -m pytest -q tests/test_research_trusted_host_intent_preflight_e0.py
          python -m pytest -q tests/test_research_authorized_agent_tool_surface.py
