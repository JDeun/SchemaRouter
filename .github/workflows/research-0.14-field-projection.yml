name: Research 0.14 Field Projection Confirmation
run-name: Research 0.14 Field Projection ${{ inputs.evidence_digest }} source=${{ inputs.source_sha }}

# Confirmation arm for #506, on the canonical strong-agent runtime. It refuses to
# start until the canonical B2 run is a verified success, and it verifies the
# artifact digest WITHOUT reading B2 outcomes, exactly as
# research-0.14-corrective-reretrieval.yml does.

on:
  workflow_dispatch:
    inputs:
      evidence_digest:
        description: >-
          Terminal-evidence digest from the conveyor. This stage is appended
          after the frozen DAG reaches terminal state, so its identity is the
          combined terminal digest rather than the B2 artifact digest.
        required: true
        type: string
      source_sha:
        description: Exact SchemaRouter source revision to freeze for this stage
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-0.14-projection-${{ inputs.evidence_digest }}
  cancel-in-progress: false

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/src"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_CACHE_KEY: "b2-smollm3-arm64-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"
  B2_ATTN_IMPLEMENTATION: "sdpa"
  CANONICAL_B2_RUN: "36642658406"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: "${{ steps.matrix.outputs.matrix }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Refuse a source revision that cannot run this experiment
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          required = [
              "scripts/agent_utility_v7_projection.py",
              "scripts/agent_utility_v7_dev_agent.py",
              "scripts/generate_agent_utility_v7_projection_corpus.py",
              "scripts/validate_agent_utility_v7_projection_corpus.py",
              "scripts/evaluate_agent_utility_v7_projection.py",
              "scripts/aggregate_agent_utility_v7_projection.py",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              print(
                  "This checkout does not contain the #506 experiment. The stage "
                  "was dispatched against a source revision that predates it.",
                  file=sys.stderr,
              )
              for path in missing:
                  print("  missing: " + path, file=sys.stderr)
              raise SystemExit(1)
          print("projection experiment present in this checkout")
          PY
      - name: Verify the canonical B2 run still succeeded without reading outcomes
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPOSITORY: "${{ github.repository }}"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          run_url = (
              "https://api.github.com/repos/"
              + os.environ["GH_REPOSITORY"]
              + "/actions/runs/"
              + os.environ["CANONICAL_B2_RUN"]
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          }
          with urllib.request.urlopen(
              urllib.request.Request(run_url, headers=headers)
          ) as response:
              run = json.load(response)
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"

          page = 1
          matches = []
          while True:
              url = run_url + f"/artifacts?per_page=100&page={page}"
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers)
              ) as response:
                  payload = json.load(response)
              batch = payload.get("artifacts", [])
              matches.extend(
                  item
                  for item in batch
                  if item["name"].startswith("b2-smollm3-canonical-")
                  and not item["expired"]
              )
              if len(batch) < 100:
                  break
              page += 1
          assert len(matches) == 1, matches
          # The supplied evidence_digest is the conveyor's terminal digest, which
          # is a hash over five stage artifacts and therefore cannot be compared
          # to any single one of them. Record the B2 artifact digest instead, so
          # the provenance of this run is still exact.
          print("canonical B2 artifact digest: " + matches[0]["digest"])
          print("canonical B2 success verified; outcomes unopened")
          PY
      - name: Generate and validate the projection corpus
        run: |
          mkdir -p artifacts/projection
          python scripts/generate_agent_utility_v7_projection_corpus.py \
            --source-revision "${{ inputs.source_sha }}" \
            --out artifacts/projection/projection-corpus.json
          python scripts/validate_agent_utility_v7_projection_corpus.py \
            --corpus artifacts/projection/projection-corpus.json
      - id: matrix
        name: Export the frozen evaluation matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("artifacts/projection/projection-corpus.json").read_text(encoding="utf-8")
          )
          ids = [str(task["semantic_task_id"]) for task in data["tasks"]]
          chunks = [ids[index:index + 3] for index in range(0, len(ids), 3)]
          include = []
          for catalog in data["catalog_sizes"]:
              for index, chunk in enumerate(chunks):
                  include.append(
                      {
                          "job_id": f"c{catalog}-g{index:02d}",
                          "catalog_size": catalog,
                          "task_ids": ",".join(chunk),
                      }
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps({"include": include}, separators=(",", ":")) + "\n")
          print(f"jobs={len(include)}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "projection-corpus-${{ github.run_id }}"
          path: artifacts/projection/projection-corpus.json
          if-no-files-found: error
          retention-days: 30

  model-cache:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - run: pip install -e .
      - id: hf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Populate exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(repo_id=os.environ["B2_MODEL"], revision=os.environ["B2_REVISION"])
          PY
      - name: Verify exact cached model offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python - <<'PY'
          import os
          from transformers import AutoConfig, AutoTokenizer

          for loader in (AutoConfig, AutoTokenizer):
              loader.from_pretrained(
                  os.environ["B2_MODEL"],
                  revision=os.environ["B2_REVISION"],
                  local_files_only=True,
                  trust_remote_code=False,
              )
          PY

  evaluate:
    needs:
      - prepare
      - model-cache
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: "${{ fromJSON(needs.prepare.outputs.matrix) }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
          fail-on-cache-miss: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "projection-corpus-${{ github.run_id }}"
          path: artifacts/projection
      - name: Verify exact ARM64 SDPA runtime
        run: |
          python - <<'PY'
          import os
          import platform
          import torch
          import transformers

          assert platform.python_version() == "3.12.14"
          assert platform.machine() in {"aarch64", "arm64"}
          assert os.environ["B2_ATTN_IMPLEMENTATION"] == "sdpa"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          PY
      - name: Evaluate one frozen confirmation shard
        run: |
          mkdir -p artifacts/projection-shard
          python -u scripts/evaluate_agent_utility_v7_projection.py \
            --corpus artifacts/projection/projection-corpus.json \
            --catalog-size "${{ matrix.catalog_size }}" \
            --task-ids "${{ matrix.task_ids }}" \
            --runtime confirmation \
            --out "artifacts/projection-shard/${{ matrix.job_id }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "projection-shard-${{ matrix.job_id }}-${{ github.run_id }}"
          path: artifacts/projection-shard/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: "${{ success() }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "projection-corpus-${{ github.run_id }}"
          path: artifacts/projection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          pattern: "projection-shard-*-${{ github.run_id }}"
          path: artifacts/projection-shards
      - name: Aggregate the frozen confirmation surface
        run: |
          python scripts/aggregate_agent_utility_v7_projection.py \
            --input-dir artifacts/projection-shards \
            --out artifacts/projection-canonical.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "projection-canonical-${{ github.run_id }}"
          path: |
            artifacts/projection-canonical.json
            artifacts/projection/projection-corpus.json
            benchmarks/agent-utility-v7-field-projection-preregistration.json
          if-no-files-found: error
          retention-days: 30
