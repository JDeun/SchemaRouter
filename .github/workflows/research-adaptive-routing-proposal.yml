name: Adaptive Routing Research Proposal DEV

on:
  pull_request:
    paths:
      - ".github/workflows/research-adaptive-routing-proposal.yml"
      - "scripts/research_adaptive_trial_planner.py"
      - "benchmarks/adaptive-routing-search-v1-policy.json"
      - "benchmarks/adaptive-routing-search-v1-dev-seed.json"
      - "tests/test_research_adaptive_trial_planner.py"
  workflow_dispatch:
  schedule:
    # Proposal-only: CPU tests, no model download. Pauses at two unmeasured proposals.
    - cron: "23 2 * * 1"

permissions:
  contents: read

concurrency:
  group: adaptive-routing-research-proposal-v1
  cancel-in-progress: false

jobs:
  bounded-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Guarded research grammar tests
        run: |
          python -m pip install -e . "pytest>=8,<10" "pytest-asyncio>=0.23"
          python -m pytest -q tests/test_research_adaptive_trial_planner.py
      - name: Retrieve strictly bot-owned pending receipts on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/issues/1412/comments?per_page=100" > /tmp/adaptive-comments.json
      - name: Empty PR preflight ledger
        if: github.event_name == 'pull_request'
        run: echo '[]' > /tmp/adaptive-comments.json
      - name: Automatically propose a new experiment from observed failure gaps
        run: |
          python scripts/research_adaptive_trial_planner.py \
            --comments /tmp/adaptive-comments.json \
            --output artifacts/adaptive-routing/proposal.json \
            --comment-output artifacts/adaptive-routing/issue-comment.md
      - name: Preserve versioned proposal artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adaptive-routing-proposal-${{ github.run_id }}
          path: artifacts/adaptive-routing/proposal.json
          if-no-files-found: error
          retention-days: 90
      - name: Record proposal on research issue, without executing model or tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f artifacts/adaptive-routing/issue-comment.md; then
            gh issue comment 1412 --repo "${{ github.repository }}" \
              --body-file artifacts/adaptive-routing/issue-comment.md
          fi
# This workflow never trains/tests a model, changes source, merges PRs, or releases.
# A generated proposal is not a measured experiment and cannot qualify v0.18.
