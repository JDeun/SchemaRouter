name: Research 0.14 B1 Protocol Freeze

on:
  push:
    branches:
      - "research/0.14-local-agent-ab"
    paths:
      - ".github/workflows/research-0.14-b1-protocol.yml"
      - "benchmarks/agent_utility_v1_catalog.py"
      - "benchmarks/agent_utility_v1_executor.py"
      - "benchmarks/agent-utility-v1-b1-statistical-amendment.json"
      - "benchmarks/agent-utility-v1-b1-execution-equivalence.json"
      - "benchmarks/agent-utility-v1-b1-task-contract-amendment.json"
      - "benchmarks/agent-utility-v1-b1-causality-amendment.json"
      - "benchmarks/agent-utility-v1-b1-preregistration-v2.json"
      - "scripts/generate_agent_utility_v1.py"
      - "scripts/evaluate_agent_utility_phase_a.py"
      - "scripts/evaluate_agent_utility_phase_b_qwen.py"
      - "scripts/aggregate_agent_utility_phase_b.py"
      - "tests/test_agent_utility_v1.py"
      - "tests/test_agent_utility_v1_executor.py"
      - "tests/test_agent_utility_phase_b_qwen.py"
      - "tests/test_agent_utility_phase_b_aggregate.py"
  workflow_dispatch:

concurrency:
  group: research-0.14-b1-protocol-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate B1 protocol mechanics
        run: |
          ruff check \
            benchmarks/agent_utility_v1_catalog.py \
            benchmarks/agent_utility_v1_executor.py \
            scripts/generate_agent_utility_v1.py \
            scripts/evaluate_agent_utility_phase_a.py \
            scripts/evaluate_agent_utility_phase_b_qwen.py \
            scripts/aggregate_agent_utility_phase_b.py \
            tests/test_agent_utility_v1.py \
            tests/test_agent_utility_v1_executor.py \
            tests/test_agent_utility_phase_b_qwen.py \
            tests/test_agent_utility_phase_b_aggregate.py
          PYTHONPATH=. pytest -q \
            tests/test_agent_utility_v1.py \
            tests/test_agent_utility_v1_executor.py \
            tests/test_agent_utility_phase_b_qwen.py \
            tests/test_agent_utility_phase_b_aggregate.py

      - name: Validate statistical amendment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          amendment = json.loads(
              Path("benchmarks/agent-utility-v1-b1-statistical-amendment.json")
              .read_text(encoding="utf-8")
          )
          assert amendment["issue"] == 420
          assert amendment["execution_protocol_changed"] is False
          assert amendment["statistical_change"]["canonical_bootstrap_unit"] == "task_id cluster"
          assert amendment["interpretation"]["unique_semantic_task_count"] == 23
          assert amendment["interpretation"]["catalog_repeats_per_task"] == 4
          PY

      - name: Validate task-contract correction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          amendment = json.loads(
              Path("benchmarks/agent-utility-v1-b1-task-contract-amendment.json")
              .read_text(encoding="utf-8")
          )
          assert amendment["issue"] == 420
          assert amendment["execution_protocol_changed"] is True
          assert amendment["previous_frozen_task_sha256"] == (
              "9663145d1e331007a45901a6426f62df4e67179ca44dc1b7e0e5bfa6390d1fd1"
          )
          assert {
              row["task_id"] for row in amendment["corrections"]
          } == {"single-message-send", "multi-create-share"}
          assert set(amendment["previous_episode_sources_invalidated"]) == {
              36520025834,
              36520831273,
          }
          assert amendment["already_invalid_source"] == 36517371433
          PY

      - name: Validate superseded execution-sharding equivalence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          amendment = json.loads(
              Path("benchmarks/agent-utility-v1-b1-execution-equivalence.json")
              .read_text(encoding="utf-8")
          )
          assert amendment["issue"] == 420
          assert amendment["execution_semantics_changed"] is False
          assert amendment["status"] == (
              "superseded_by_explicit_user_argument_contract_correction"
          )
          assert amendment["eligible_episode_sources"] == []
          assert {
              row["workflow_run_id"]
              for row in amendment["superseded_episode_sources"]
          } == {36520025834, 36520831273}
          assert amendment["acceptance_rule"]["required_episode_count"] == 552
          assert amendment["acceptance_rule"]["required_unique_key_count"] == 552
          assert amendment["excluded_source"]["workflow_run_id"] == 36517371433
          PY

      - name: Validate tool-observation causality amendment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          amendment = json.loads(
              Path("benchmarks/agent-utility-v1-b1-causality-amendment.json")
              .read_text(encoding="utf-8")
          )
          assert amendment["issue"] == 420
          assert amendment["execution_protocol_changed"] is True
          assert amendment["phase_a_affected"] is False
          assert amendment["old_episode_sources_eligible_for_final_b1"] == []
          assert set(amendment["previous_sources_superseded"]) == {
              36517371433,
              36520025834,
              36520831273,
          }
          changes = {
              row["surface"]: row["change"]
              for row in amendment["corrections"]
          }
          assert "agent system prompt" in changes
          assert "runner" in changes
          assert "executor" in changes
          assert "multi-create-send" in changes
          PY

      - name: Validate B1 preregistration v2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          prereg = json.loads(
              Path("benchmarks/agent-utility-v1-b1-preregistration-v2.json")
              .read_text(encoding="utf-8")
          )
          assert prereg["schema_version"] == 2
          assert prereg["issue"] == 420
          assert prereg["status"] == "frozen_before_any_v2_agent_inference"
          assert prereg["corrected_freeze_identity"]["tasks_sha256"] == (
              "bc0b78ff2be11b89e6ac54ea0ee336f944f04b3c203fc61da70a46ff48b4e03c"
          )
          assert prereg["tool_observation_causality"][
              "max_executed_tool_calls_per_assistant_turn"
          ] == 1
          assert prereg["statistical_scope"]["bootstrap_unit"] == "task_id cluster"
          assert prereg["aggregate_integrity"]["required_episode_count"] == 552
          assert prereg["aggregate_integrity"][
              "required_unique_episode_key_count"
          ] == 552
          assert set(prereg["excluded_or_superseded_episode_sources"]) == {
              36517371433,
              36520025834,
              36520831273,
          }
          assert prereg["runtime"] == {
              "runner": "ubuntu-24.04",
              "python": "3.12.14",
              "torch": "2.14.0+cpu",
              "transformers": "4.57.6",
              "tokenizers": "0.22.2",
              "safetensors": "0.8.0",
              "source": (
                  "versions observed in the successful pre-v2 Qwen "
                  "tool-calling smoke and frozen before v2 inference"
              ),
          }
          assert prereg["pre_benchmark_smoke"][
              "dependent_second_tool_call_after_observation_required"
          ] is True
          assert prereg["pre_benchmark_smoke"][
              "repeated_identical_prompt_determinism_required"
          ] is True
          assert prereg["stopping_rule"][
              "runtime_dependency_ranges_forbidden"
          ] is True
          PY

      - name: Freeze corrected tasks and catalogs
        run: |
          python scripts/generate_agent_utility_v1.py             --out-dir artifacts/agent-utility-v1

      - name: Re-evaluate Phase A after execution-validity correction
        run: |
          python scripts/evaluate_agent_utility_phase_a.py             --out artifacts/agent-utility-v1/phase-a-result.json

      - name: Require Phase-B entry gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/agent-utility-v1")
          freeze = json.loads(
              (root / "freeze-manifest.json").read_text(encoding="utf-8")
          )
          result = json.loads(
              (root / "phase-a-result.json").read_text(encoding="utf-8")
          )
          assert freeze["task_count"] == 23
          assert freeze["single_task_count"] == 17
          assert freeze["multi_task_count"] == 6
          assert freeze["tasks_sha256"] == (
              "bc0b78ff2be11b89e6ac54ea0ee336f944f04b3c203fc61da70a46ff48b4e03c"
          )
          assert result["phase_a_gate"]["phase_b_eligible"] is True
          print(json.dumps(freeze, sort_keys=True))
          print(json.dumps(result["phase_a_gate"], sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-utility-v1-b1-freeze-${{ github.run_id }}
          path: |
            artifacts/agent-utility-v1/
            benchmarks/agent-utility-v1-preregistration.json
            benchmarks/agent-utility-v1-b1-preregistration-v2.json
            benchmarks/agent-utility-v1-b1-statistical-amendment.json
            benchmarks/agent-utility-v1-b1-execution-equivalence.json
            benchmarks/agent-utility-v1-b1-task-contract-amendment.json
            benchmarks/agent-utility-v1-b1-causality-amendment.json
          retention-days: 30
