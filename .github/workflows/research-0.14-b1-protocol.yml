name: Research 0.14 B1 Protocol Freeze

on:
  push:
    branches:
      - "research/0.14-local-agent-ab"
    paths:
      - ".github/workflows/research-0.14-b1-protocol.yml"
      - "benchmarks/agent_utility_v1_catalog.py"
      - "benchmarks/agent_utility_v1_executor.py"
      - "scripts/generate_agent_utility_v1.py"
      - "scripts/evaluate_agent_utility_phase_a.py"
      - "scripts/evaluate_agent_utility_phase_b_qwen.py"
      - "scripts/aggregate_agent_utility_phase_b.py"
      - "tests/test_agent_utility_v1.py"
      - "tests/test_agent_utility_v1_executor.py"
      - "tests/test_agent_utility_phase_b_qwen.py"
      - "tests/test_agent_utility_phase_b_aggregate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate B1 protocol mechanics
        run: |
          ruff check \
            benchmarks/agent_utility_v1_catalog.py \
            benchmarks/agent_utility_v1_executor.py \
            scripts/generate_agent_utility_v1.py \
            scripts/evaluate_agent_utility_phase_a.py \
            scripts/evaluate_agent_utility_phase_b_qwen.py \
            scripts/aggregate_agent_utility_phase_b.py \
            tests/test_agent_utility_v1.py \
            tests/test_agent_utility_v1_executor.py \
            tests/test_agent_utility_phase_b_qwen.py \
            tests/test_agent_utility_phase_b_aggregate.py
          PYTHONPATH=. pytest -q \
            tests/test_agent_utility_v1.py \
            tests/test_agent_utility_v1_executor.py \
            tests/test_agent_utility_phase_b_qwen.py \
            tests/test_agent_utility_phase_b_aggregate.py

      - name: Freeze corrected tasks and catalogs
        run: |
          python scripts/generate_agent_utility_v1.py             --out-dir artifacts/agent-utility-v1

      - name: Re-evaluate Phase A after execution-validity correction
        run: |
          python scripts/evaluate_agent_utility_phase_a.py             --out artifacts/agent-utility-v1/phase-a-result.json

      - name: Require Phase-B entry gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/agent-utility-v1")
          freeze = json.loads(
              (root / "freeze-manifest.json").read_text(encoding="utf-8")
          )
          result = json.loads(
              (root / "phase-a-result.json").read_text(encoding="utf-8")
          )
          assert freeze["task_count"] == 23
          assert freeze["single_task_count"] == 17
          assert freeze["multi_task_count"] == 6
          assert result["phase_a_gate"]["phase_b_eligible"] is True
          print(json.dumps(freeze, sort_keys=True))
          print(json.dumps(result["phase_a_gate"], sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-utility-v1-b1-freeze-${{ github.run_id }}
          path: |
            artifacts/agent-utility-v1/
            benchmarks/agent-utility-v1-preregistration.json
          retention-days: 30
