name: Indexed G5 Synthetic CPU and Availability E0

on:
  pull_request:
    paths:
      - "src/schemarouter/native_graph_index.py"
      - "src/schemarouter/native_semantic_index.py"
      - "scripts/benchmark_indexed_native_graph_g5_cpu_e0.py"
      - "scripts/benchmark_native_fork_fieldgroup_e0.py"
      - "tests/test_benchmark_native_fork_fieldgroup_e0.py"
      - "research/autoresearch/native-fork-500-5000-cpu-e0.md"
      - "tests/test_benchmark_indexed_native_graph_g5_cpu_e0.py"
      - "tests/test_native_graph_index.py"
      - "tests/test_native_semantic_index.py"
      - "tests/test_native_g5_build_fingerprint_amortization.py"
      - "scripts/benchmark_native_g5_build_fingerprint_ab_e0.py"
      - ".github/workflows/indexed-native-g5-performance-e0.yml"
      - "research/autoresearch/indexed-native-g5-performance-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-g5-linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install source and isolated test tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Verify integrity and standalone telemetry contract
        run: |
          ruff check scripts/benchmark_indexed_native_graph_g5_cpu_e0.py tests/test_benchmark_indexed_native_graph_g5_cpu_e0.py scripts/benchmark_native_g5_build_fingerprint_ab_e0.py tests/test_native_g5_build_fingerprint_amortization.py scripts/benchmark_native_fork_fieldgroup_e0.py tests/test_benchmark_native_fork_fieldgroup_e0.py src/schemarouter/native_graph_index.py src/schemarouter/native_semantic_index.py
          python -m pytest -q tests/test_benchmark_indexed_native_graph_g5_cpu_e0.py tests/test_native_graph_index.py tests/test_native_semantic_index.py tests/test_native_g5_build_fingerprint_amortization.py tests/test_benchmark_native_fork_fieldgroup_e0.py
          pyright src/schemarouter/native_graph_index.py src/schemarouter/native_semantic_index.py
      - name: Record 5102 synthetic route CPU and RSS profile (DEV only)
        run: python -m scripts.benchmark_indexed_native_graph_g5_cpu_e0 --noise-routes 5100 --iterations 50
      - name: 5000 multi-endpoint original vs optimized native fingerprint scan CPU DEV
        run: |
          python -m scripts.benchmark_native_g5_build_fingerprint_ab_e0 --pairs 4 \
            > g5-multiendpoint-hash-ab.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path("g5-multiendpoint-hash-ab.json").read_text(encoding="utf-8"))
          assert r["evidence_tier"] == "E0_SYNTHETIC_5000_MULTIENTPOINT_G5_BUILD_DEV_ONLY"
          assert r["registered_source_routes"] == 5000
          assert r["all_original_vs_optimized_native_fingerprints_identical"] is True
          assert r["verified_permission_scoped_typed_one_hop_paths"] == 1
          assert r["independent_e2_qualified"] is False
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## G5 native source build: 5k multi-endpoint E0 CPU DEV\n\n")
              f.write("100 source-native synthetic tools × 50 endpoints; one verified current-policy typed CRM path. **Scan-only** A/B, not paired full-index build or model/agent E2.\n\n")
              for arm, stats in r["scan_wall_ms"].items():
                  f.write(f"- {arm} scan median: {stats['median']:.2f}ms\n")
              f.write(f"- Exact original and optimized route/tool/endpoint fingerprints: {r['all_original_vs_optimized_native_fingerprints_identical']}\n")
              f.write(f"- Paired optimized faster: {r['paired_scan_delta_ms']['optimized_faster_pairs']}/{r['paired_scans_per_arm']}\n")
              f.write(f"- Optimized posting + canonical graph build: {r['optimized_real_posting_plus_graph_build_wall_ms']:.2f}ms; peak process RSS: {r['peak_process_rss_kib']} KiB\n")
          PY
      - name: Original-source fork 500/5000 warm Linux CPU, RSS and exhaustive E0 parity
        run: |
          python -m scripts.benchmark_native_fork_fieldgroup_e0 --registered-routes 500 --iterations 30 > g5-source-fork-500-e0.json
          python -m scripts.benchmark_native_fork_fieldgroup_e0 --registered-routes 5000 --iterations 30 > g5-source-fork-5000-e0.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          results = [
              json.loads(Path(f"g5-source-fork-{n}-e0.json").read_text(encoding="utf-8"))
              for n in (500, 5000)
          ]
          for expected, item in zip((500, 5000), results, strict=True):
              assert item["evidence_tier"] == "E0_SYNTHETIC_500_5000_NATIVE_FORK_NOT_PUBLISHER_E2"
              assert item["registered_native_routes"] == expected
              assert item["exhaustive_original_source_forks"] == 1
              assert item["verified_source_pinned_forks"] == 1
              assert item["same_snapshot_health_revocation_refused"] is True
              assert item["en_ko_ja_exact_fieldgroup_parity"] is True
              assert item["strict_k"] == 5 and item["schema_execution_authority"] is False
              assert item["independent_e2_qualified"] is False
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("## #1560 source-native fork 500/5000 (DEV E0, NOT E2)\\n\\n")
              for r in results:
                  output.write(
                      f"- {r['registered_native_routes']} synthetic routes: "
                      f"indexed fork vs full original-source reference = 1/1; "
                      f"CPU p95={r['query_process_cpu_ms']['p95']:.2f} ms; "
                      f"query p95={r['query_wall_ms']['p95']:.2f} ms; "
                      f"RSS={r['peak_process_rss_kib']} KiB.\\n"
                  )
              output.write("No real publisher/agent/row join, no production SLO.\\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g5-native-multiendpoint-hash-ab-${{ github.run_id }}
          path: |\n            g5-multiendpoint-hash-ab.json\n            g5-source-fork-500-e0.json\n            g5-source-fork-5000-e0.json
          retention-days: 30
          if-no-files-found: error
