name: Research 0.14 B2 Llama32 Viability

on:
  pull_request:
    paths:
      - "benchmarks/agent-utility-b2-llama32-viability.json"
      - "scripts/smoke_llama32_b2_tool_call.py"
      - "tests/test_llama32_b2_viability.py"
      - ".github/workflows/research-0.14-b2-llama32-smoke.yml"
  workflow_dispatch:

concurrency:
  group: research-0.14-b2-llama32-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  llama32-viability:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LLAMA_BUILD: "b11193"
      LLAMA_ASSET_SHA256: "def277c3a4f0c5e2ec3b1413971878d7d5e7da7eee64f5120a0cd8f024f5a364"
      MODEL_REPO_REVISION: "54651d07cdbbd900b46c652cbf6672c935a22236"
      MODEL_FILE: "Llama-3.2-3B-Instruct-Q4_K_M.gguf"
      MODEL_SHA256: "6c1a2b41161032677be168d354123594c0e6e67d2b9227c84f296ad037c728ff"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify protocol/unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q tests/test_llama32_b2_viability.py
          python - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(
              Path("benchmarks/agent-utility-b2-llama32-viability.json")
              .read_text(encoding="utf-8")
          )
          assert protocol["status"] == "frozen_before_viability_inference"
          assert protocol["benchmark_rows_consumed"] is False
          assert protocol["runtime"]["tool_call_handler_expectation"] == (
              "native_llama_3_2"
          )
          PY

      - name: Record runner resources
        run: |
          mkdir -p artifacts/runtime artifacts/model
          uname -a | tee artifacts/runtime/uname.txt
          lscpu | tee artifacts/runtime/lscpu.txt
          free -h | tee artifacts/runtime/memory-before.txt
          df -h . | tee artifacts/runtime/disk-before.txt

      - name: Download and verify pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$URL" \
            --output artifacts/runtime/llama.tar.gz
          echo "${LLAMA_ASSET_SHA256}  artifacts/runtime/llama.tar.gz" | sha256sum --check -
          mkdir -p artifacts/runtime/llama
          tar -xzf artifacts/runtime/llama.tar.gz -C artifacts/runtime/llama
          SERVER="$(find artifacts/runtime/llama -type f -name llama-server -print -quit)"
          test -n "$SERVER"
          chmod +x "$SERVER"
          SERVER_DIR="$(dirname "$SERVER")"
          {
            echo "SERVER=$SERVER"
            echo "SERVER_DIR=$SERVER_DIR"
          } >> "$GITHUB_ENV"
          echo "$SERVER" > artifacts/runtime/server-path.txt
          LD_LIBRARY_PATH="$SERVER_DIR:${LD_LIBRARY_PATH:-}" "$SERVER" --version \
            2>&1 | tee artifacts/runtime/llama-version.txt

      - name: Download and verify pinned Llama 3.2 3B Q4_K_M
        shell: bash
        run: |
          set -euo pipefail
          URL="https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/${MODEL_REPO_REVISION}/${MODEL_FILE}?download=true"
          curl --fail --location --retry 3 --retry-delay 3 \
            "$URL" \
            --output "artifacts/model/${MODEL_FILE}"
          echo "${MODEL_SHA256}  artifacts/model/${MODEL_FILE}" | sha256sum --check -
          stat --printf='%n %s bytes\n' "artifacts/model/${MODEL_FILE}" \
            | tee artifacts/runtime/model-size.txt
          free -h | tee artifacts/runtime/memory-after-download.txt
          df -h . | tee artifacts/runtime/disk-after-download.txt

      - name: Start pinned llama-server
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${SERVER_DIR}:${LD_LIBRARY_PATH:-}"
          "${SERVER}" \
            -m "artifacts/model/${MODEL_FILE}" \
            --host 127.0.0.1 \
            --port 8080 \
            --jinja \
            -c 8192 \
            -t 4 \
            --temp 0 \
            --no-warmup \
            > artifacts/runtime/server.log 2>&1 &
          echo $! > artifacts/runtime/server.pid

          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/health \
              > artifacts/runtime/health.json 2>/dev/null; then
              cat artifacts/runtime/health.json
              exit 0
            fi
            if ! kill -0 "$(cat artifacts/runtime/server.pid)" 2>/dev/null; then
              echo "llama-server exited before becoming healthy"
              tail -n 200 artifacts/runtime/server.log || true
              exit 1
            fi
            sleep 2
          done

          echo "llama-server health timeout"
          tail -n 200 artifacts/runtime/server.log || true
          exit 1

      - name: Run two-turn structured tool-call viability smoke
        run: |
          python scripts/smoke_llama32_b2_tool_call.py \
            --base-url http://127.0.0.1:8080 \
            --timeout 180 \
            --out artifacts/llama32-viability-result.json

      - name: Validate PASS and record resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/llama32-viability-result.json")
              .read_text(encoding="utf-8")
          )
          assert result["status"] == "pass"
          assert result["issue"] == 447
          assert result["benchmark_rows_consumed"] is False
          assert len(result["initial_repetitions"]) == 2
          assert all(
              row["tool_name"] == "lookup_record"
              for row in result["initial_repetitions"]
          )
          second = result["dependent_second_turn"]
          assert second["tool_name"] == "send_message"
          assert second["arguments"]["recipient"] == "alice@example.org"
          assert "alpha" in second["arguments"]["message"]
          assert len(result["raw_response_trace"]) == 3
          print(json.dumps(result, sort_keys=True))
          PY
          free -h | tee artifacts/runtime/memory-after-smoke.txt
          df -h . | tee artifacts/runtime/disk-after-smoke.txt

      - name: Stop server
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/runtime
          if [ -f artifacts/runtime/server.pid ]; then
            PID="$(cat artifacts/runtime/server.pid)"
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi
          tail -n 250 artifacts/runtime/server.log \
            > artifacts/runtime/server-tail.log 2>/dev/null || true
          rm -f "artifacts/model/${MODEL_FILE}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: b2-llama32-viability-${{ github.run_id }}
          path: |
            artifacts/llama32-viability-result.json
            artifacts/runtime/
            benchmarks/agent-utility-b2-llama32-viability.json
          if-no-files-found: warn
          retention-days: 30
