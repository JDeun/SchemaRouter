name: Repository Facts Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-facts-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Synchronize mechanical repository facts
        id: sync
        run: |
          python scripts/sync_repository_facts.py --write
          if git diff --quiet --             README.md             README.ko.md             docs/index.md             docs_ko/index.md             docs/getting-started/installation.md             docs_ko/getting-started/installation.md             docs/project/trust-and-evidence.md             docs_ko/project/trust-and-evidence.md             docs/research/experiment-index.md             docs/research/routing-status.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or refresh synchronization PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/repository-facts-sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true
          git checkout -B "$SYNC_BRANCH"
          git add             README.md             README.ko.md             docs/index.md             docs_ko/index.md             docs/getting-started/installation.md             docs_ko/getting-started/installation.md             docs/project/trust-and-evidence.md             docs_ko/project/trust-and-evidence.md             docs/research/experiment-index.md             docs/research/routing-status.md
          git commit -m "docs: sync canonical repository facts"
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"

          existing="$(
            gh pr list               --repo "$GITHUB_REPOSITORY"               --head "$SYNC_BRANCH"               --base main               --state open               --json number               --jq '.[0].number // empty'
          )"
          if [[ -n "$existing" ]]; then
            echo "Updated existing repository-facts PR #$existing."
          else
            gh pr create               --repo "$GITHUB_REPOSITORY"               --base main               --head "$SYNC_BRANCH"               --title "docs: sync canonical repository facts"               --body "Automated synchronization of mechanical facts derived from CHANGELOG.md, pyproject.toml, and the canonical research experiment ledger. No semantic claims or research interpretation are generated by this workflow."
          fi
