name: Operation-Narrow NLI v4 Development

on:
  pull_request:
    paths:
      - ".github/workflows/research-v4-operation-narrow-nli.yml"
      - "benchmarks/operation-routing-v4-operation-narrow-nli-ablation.json"
      - "benchmarks/multilingual_nli.py"
      - "tests/test_benchmark_multilingual_nli.py"
      - "scripts/benchmark_decision_routing.py"
      - "src/schemarouter/planner.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_NLI_MODEL: "MoritzLaurer/multilingual-MiniLMv2-L6-mnli-xnli"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: operation-narrow-nli-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint NLI research surface
        run: |
          ruff check benchmarks/multilingual_nli.py tests/test_benchmark_multilingual_nli.py
      - name: Validate NLI and operation-narrow contracts
        run: |
          pytest -q tests/test_benchmark_multilingual_nli.py tests/test_planner.py

  nli-boundary:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: "020"
            min_score: 0.20
          - key: "035"
            min_score: 0.35
          - key: "050"
            min_score: 0.50
          - key: "065"
            min_score: 0.65
          - key: "080"
            min_score: 0.80
          - key: "090"
            min_score: 0.90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate identical fresh v4 development corpus
        run: |
          mkdir -p artifacts/nli-narrow-${{ matrix.key }}
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out artifacts/nli-narrow-${{ matrix.key }}/corpus.json \
            --manifest artifacts/nli-narrow-${{ matrix.key }}/corpus-manifest.json
      - name: Audit corpus before model scoring
        run: |
          python scripts/audit_operation_routing_corpus.py \
            --corpus artifacts/nli-narrow-${{ matrix.key }}/corpus.json \
            --out artifacts/nli-narrow-${{ matrix.key }}/corpus-audit.json \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50
      - name: Run operation-narrow NLI boundary candidate
        run: |
          CANDIDATE="keyword+graph-operation+graph-semantic-seed+graph-propagation+graph-corroboration+graph-static-option-cache+selective-semantic-recall+selective-operation-fit+operation-narrow"
          python scripts/benchmark_decision_routing.py \
            --corpus artifacts/nli-narrow-${{ matrix.key }}/corpus.json \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --operation-fit-pairwise-callable benchmarks.multilingual_nli:score_pairs \
            --operation-fit-min-score "${{ matrix.min_score }}" \
            --operation-fit-min-margin 0.0 \
            --operation-fit-mode narrow \
            --graph-operation-gate \
            --graph-semantic-seed-embedding-callable benchmarks.multilingual_embedder:embed \
            --graph-semantic-seed-min-similarity 0.45 \
            --graph-semantic-seed-min-margin 0.10 \
            --graph-semantic-direct-min-similarity 0.55 \
            --graph-semantic-direct-min-margin 0.15 \
            --graph-semantic-propagation \
            --graph-semantic-propagation-scope ranked_only \
            --graph-semantic-propagation-limit 2 \
            --graph-semantic-propagation-on-abstain reject \
            --graph-semantic-corroborate-abstain \
            --graph-cache-static-embedding-options \
            --warmup-cases 24 \
            --planner-name "${CANDIDATE}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 operation-narrow NLI" \
            --json-out artifacts/nli-narrow-${{ matrix.key }}/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-narrow-nli-v4-${{ matrix.key }}-${{ github.run_id }}
          path: |
            artifacts/nli-narrow-${{ matrix.key }}/report.json
            artifacts/nli-narrow-${{ matrix.key }}/corpus-manifest.json
            artifacts/nli-narrow-${{ matrix.key }}/corpus-audit.json
          if-no-files-found: error
          retention-days: 30
