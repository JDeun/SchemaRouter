name: Graph Static Option Cache Development

on:
  pull_request:
    paths:
      - ".github/workflows/research-operation-graph-static-cache.yml"
      - "scripts/benchmark_decision_routing.py"
      - "scripts/compare_graph_static_cache.py"
      - "benchmarks/operation-fit-0.10-graph-cycle.json"
      - "benchmarks/operation-fit-0.10-graph-static-cache-dev-plan.json"
      - "tests/test_graph_static_cache_comparison.py"
      - "tests/test_operation_graph_protocol.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  GRAPH_DEV_SEED: "graph-v1-development-2026-09-26"

concurrency:
  group: operation-graph-static-cache-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint static-cache research surface
        run: |
          ruff check \
            scripts/benchmark_decision_routing.py \
            scripts/compare_graph_static_cache.py \
            tests/test_graph_static_cache_comparison.py \
            tests/test_operation_graph_protocol.py
      - name: Validate static-cache contracts
        run: |
          pytest -q \
            tests/test_graph_static_cache_comparison.py \
            tests/test_operation_graph_protocol.py \
            tests/test_embedding_decision_backend.py \
            tests/test_graph_routing.py

  benchmark:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate fresh graph-v1 development corpus
        run: |
          mkdir -p artifacts/static-cache
          python scripts/generate_decision_routing_graph_v1.py \
            --seed "${GRAPH_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out artifacts/static-cache/corpus.json \
            --manifest artifacts/static-cache/corpus-manifest.json
      - name: Run behavior-preserving static option cache candidate
        run: |
          BASELINE="keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation"
          CANDIDATE="keyword+graph-operation+graph-semantic-seed+graph-propagation+graph-corroboration+graph-static-option-cache+selective-semantic-recall+selective-capability-fit+selective-operation-fit+selective-endpoint-disambiguation"
          python scripts/benchmark_decision_routing.py \
            --corpus artifacts/static-cache/corpus.json \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --graph-operation-gate \
            --graph-semantic-seed-embedding-callable benchmarks.multilingual_embedder:embed \
            --graph-semantic-seed-min-similarity 0.45 \
            --graph-semantic-seed-min-margin 0.10 \
            --graph-semantic-direct-min-similarity 0.55 \
            --graph-semantic-direct-min-margin 0.15 \
            --graph-semantic-propagation \
            --graph-semantic-propagation-scope ranked_only \
            --graph-semantic-propagation-limit 2 \
            --graph-semantic-propagation-on-abstain reject \
            --graph-semantic-corroborate-abstain \
            --graph-cache-static-embedding-options \
            --counterbalanced \
            --warmup-cases 24 \
            --planner-name "${BASELINE}" \
            --planner-name "${CANDIDATE}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU static option cache" \
            --json-out artifacts/static-cache/report.json
      - name: Apply preregistered static-cache gates
        run: |
          python scripts/compare_graph_static_cache.py \
            --report artifacts/static-cache/report.json \
            --out artifacts/static-cache/comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-graph-static-cache-${{ github.run_id }}
          path: |
            artifacts/static-cache/report.json
            artifacts/static-cache/comparison.json
            artifacts/static-cache/corpus-manifest.json
          if-no-files-found: error
          retention-days: 30
