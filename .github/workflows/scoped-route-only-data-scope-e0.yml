name: Scoped Route-Only Data Scope E0

on:
  pull_request:
    paths:
      - "src/schemarouter/planner.py"
      - "src/schemarouter/runtime.py"
      - "tests/test_scoped_route_only_data_scope.py"
      - ".github/workflows/scoped-route-only-data-scope-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-only-noninterference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Route-only scoped privacy and existing fast path
        run: |
          python -m pip install -e ".[dev]"
          ruff check src/schemarouter/planner.py src/schemarouter/runtime.py tests/test_scoped_route_only_data_scope.py
          python -m pytest -q tests/test_scoped_route_only_data_scope.py tests/test_scoped_lexical_score_noninterference.py tests/test_scoped_tool_endpoint_descriptions.py tests/test_data_scope_authorization.py
      - name: Evidence limitation
        if: success()
        run: echo "Offline E0 synthetic route metadata noninterference; not model or independent E2 qualification" >> "$GITHUB_STEP_SUMMARY"
