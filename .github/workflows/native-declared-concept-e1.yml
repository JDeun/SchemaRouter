name: Declared Concept Composition E1

on:
  pull_request:
    paths:
      - "src/schemarouter/concept_retrieval.py"
      - "src/schemarouter/field_group_retrieval.py"
      - "src/schemarouter/__init__.py"
      - "tests/test_native_concept_retrieval.py"
      - "tests/test_native_field_group_retrieval.py"
      - "tests/test_public_api.py"
      - ".github/workflows/native-declared-concept-e1.yml"
      - "research/autoresearch/native-declared-concept-e1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-declared-concept-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-concept-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install current source and test dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1"
      - name: Verify declared concept semantics and public ABI
        run: |
          ruff check src/schemarouter/concept_retrieval.py tests/test_native_concept_retrieval.py
          python -m pytest -q tests/test_native_concept_retrieval.py tests/test_native_field_group_retrieval.py tests/test_public_api.py
