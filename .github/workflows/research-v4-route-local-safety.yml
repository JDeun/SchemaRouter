name: V4 Route-Local Safety Ablation

on:
  push:
    branches:
      - "research/v4-route-local-safety"
    paths:
      - ".github/workflows/research-v4-route-local-safety.yml"
      - "benchmarks/operation-routing-v4-route-local-safety-ablation.json"
      - "benchmarks/operation-routing-v4-route-local-thresholds.json"
      - "scripts/benchmark_decision_routing.py"
      - "scripts/analyze_operation_routing_v4_route_local.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "src/schemarouter/planner.py"
      - "src/schemarouter/models.py"
      - "tests/test_planner.py"
      - "tests/test_operation_routing_v4_route_local_analysis.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: v4-route-local-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate route-local research surface
        run: |
          python -m py_compile scripts/analyze_operation_routing_v4_route_local.py
          ruff check scripts/analyze_operation_routing_v4_route_local.py tests/test_operation_routing_v4_route_local_analysis.py
          pytest -q tests/test_planner.py tests/test_operation_routing_v4_route_local_analysis.py

  benchmark:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate identical fresh v4 development corpus
        run: |
          mkdir -p artifacts/v4-route-local
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out artifacts/v4-route-local/corpus.json \
            --manifest artifacts/v4-route-local/corpus-manifest.json
      - name: Audit corpus
        run: |
          python scripts/audit_operation_routing_corpus.py \
            --corpus artifacts/v4-route-local/corpus.json \
            --out artifacts/v4-route-local/corpus-audit.json \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50
      - name: Run accepted-selector baseline
        run: |
          SELECTOR="keyword+semantic-recall+capability-fit+operation-fit+accepted-selector+endpoint-disambiguation"
          python scripts/benchmark_decision_routing.py \
            --corpus artifacts/v4-route-local/corpus.json \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.01 \
            --operation-fit-min-margin 0.0 \
            --operation-fit-select-accepted \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --warmup-cases 24 \
            --planner-name "${SELECTOR}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 route-local baseline" \
            --json-out artifacts/v4-route-local/baseline-report.json
      - name: Run dev-safety route-local candidate
        run: |
          SELECTOR="keyword+semantic-recall+capability-fit+operation-fit+accepted-selector+endpoint-disambiguation"
          SCORE_MAP="$(python -c 'import json; d=json.load(open("benchmarks/operation-routing-v4-route-local-thresholds.json")); print(json.dumps(d["dev_safety_budget_12"]["min_score_by_option"], separators=(",", ":")))')"
          python scripts/benchmark_decision_routing.py \
            --corpus artifacts/v4-route-local/corpus.json \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.0 \
            --operation-fit-min-score-by-option-json "${SCORE_MAP}" \
            --operation-fit-min-margin 0.0 \
            --operation-fit-select-accepted \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --warmup-cases 24 \
            --planner-name "${SELECTOR}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 route-local dev safety" \
            --json-out artifacts/v4-route-local/dev-safety-report.json
      - name: Run production-safety route-local candidate
        run: |
          SELECTOR="keyword+semantic-recall+capability-fit+operation-fit+accepted-selector+endpoint-disambiguation"
          SCORE_MAP="$(python -c 'import json; d=json.load(open("benchmarks/operation-routing-v4-route-local-thresholds.json")); print(json.dumps(d["production_safety_budget_6"]["min_score_by_option"], separators=(",", ":")))')"
          python scripts/benchmark_decision_routing.py \
            --corpus artifacts/v4-route-local/corpus.json \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs \
            --operation-fit-min-score 0.0 \
            --operation-fit-min-score-by-option-json "${SCORE_MAP}" \
            --operation-fit-min-margin 0.0 \
            --operation-fit-select-accepted \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --warmup-cases 24 \
            --planner-name "${SELECTOR}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 route-local production safety" \
            --json-out artifacts/v4-route-local/production-safety-report.json
      - name: Analyze route-local safety candidates
        run: |
          python scripts/analyze_operation_routing_v4_route_local.py \
            --baseline-report artifacts/v4-route-local/baseline-report.json \
            --dev-safety-report artifacts/v4-route-local/dev-safety-report.json \
            --production-safety-report artifacts/v4-route-local/production-safety-report.json \
            --out artifacts/v4-route-local/analysis.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-routing-v4-route-local-${{ github.run_id }}
          path: |
            artifacts/v4-route-local/baseline-report.json
            artifacts/v4-route-local/dev-safety-report.json
            artifacts/v4-route-local/production-safety-report.json
            artifacts/v4-route-local/analysis.json
            artifacts/v4-route-local/corpus-manifest.json
            artifacts/v4-route-local/corpus-audit.json
          if-no-files-found: error
          retention-days: 30
