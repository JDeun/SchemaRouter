name: Research V5B Semantic Ontology Freeze

on:
  push:
    branches:
      - "research/0.12-semantic-action-ontology-349"
    paths:
      - ".github/workflows/research-v5b-semantic-ontology-freeze.yml"
      - "benchmarks/operation-routing-v5b-semantic-ontology-preregistration.json"
      - "benchmarks/semantic_action_ontology.py"
      - "benchmarks/operation_routing_v5b_catalog.py"
      - "scripts/generate_operation_routing_v5b.py"
      - "tests/test_semantic_action_ontology.py"
      - "tests/test_operation_routing_v5b_protocol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate preregistration and source
        run: |
          python -m json.tool benchmarks/operation-routing-v5b-semantic-ontology-preregistration.json >/dev/null
          ruff check \
            benchmarks/semantic_action_ontology.py \
            benchmarks/operation_routing_v5b_catalog.py \
            scripts/generate_operation_routing_v5b.py \
            tests/test_semantic_action_ontology.py \
            tests/test_operation_routing_v5b_protocol.py
          pytest -q \
            tests/test_semantic_action_ontology.py \
            tests/test_operation_routing_v5b_protocol.py
      - name: Generate DEV and confirmation together before scoring
        run: |
          python scripts/generate_operation_routing_v5b.py \
            --out-dir artifacts/operation-routing-v5b
          cat artifacts/operation-routing-v5b/freeze-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operation-routing-v5b-freeze-${{ github.run_id }}
          path: artifacts/operation-routing-v5b/
          retention-days: 30
