name: Public Python Callable Execution Negative DEV

on:
  pull_request:
    paths:
      - "src/schemarouter/runtime.py"
      - "src/schemarouter/executor.py"
      - "src/schemarouter/adapters/python.py"
      - "tests/test_public_callable_execution_negatives.py"
      - ".github/workflows/public-callable-execution-negatives-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-callable-real-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install registered Python dispatch dependencies
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.11,<1"
      - name: Verify denied/invalid/availability/revoked/stale and mutation effects
        run: |
          ruff check tests/test_public_callable_execution_negatives.py
          python -m pytest -q tests/test_public_callable_execution_negatives.py
