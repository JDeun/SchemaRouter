name: Research 0.14 Final Answer
run-name: Research 0.14 Final Answer ${{ inputs.evidence_digest }} source=${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      evidence_digest:
        description: Exact canonical held-out artifact digest
        required: true
        type: string
      source_sha:
        description: Exact SchemaRouter source revision to freeze for this stage
        required: true
        type: string
      heldout_run_id:
        description: Terminal held-out workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: research-0.14-final-answer-${{ inputs.evidence_digest }}
  cancel-in-progress: false

env:
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/src"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_CACHE_KEY: "b2-smollm3-arm64-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"
  B2_ATTN_IMPLEMENTATION: "sdpa"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: "${{ steps.matrix.outputs.matrix }}"
      conditions: "${{ steps.matrix.outputs.conditions }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify exact terminal held-out artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPOSITORY: "${{ github.repository }}"
          EVIDENCE_DIGEST: "${{ inputs.evidence_digest }}"
          HELDOUT_RUN_ID: "${{ inputs.heldout_run_id }}"
        run: |
          python - <<'PY'
          import os
          from scripts.research_014_conveyor import GitHubAPI

          api = GitHubAPI(os.environ["GH_REPOSITORY"], os.environ["GH_TOKEN"])
          run = api.run(int(os.environ["HELDOUT_RUN_ID"]))
          assert run["status"] == "completed" and run["conclusion"] == "success"
          artifact = api.artifact(
              int(os.environ["HELDOUT_RUN_ID"]),
              "heldout-generalization-canonical-",
          )
          assert artifact is not None
          assert artifact["digest"] == os.environ["EVIDENCE_DIGEST"]
          print("held-out terminal artifact digest verified; row outcomes unopened")
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "heldout-generalization-canonical-${{ inputs.heldout_run_id }}"
          path: artifacts/upstream-heldout
          run-id: "${{ inputs.heldout_run_id }}"
          github-token: "${{ github.token }}"
      - name: Locate held-out forbidden-query corpus
        run: |
          mkdir -p artifacts/final
          HELDOUT_CORPUS="$(find artifacts/upstream-heldout -name heldout-corpus.json -print -quit)"
          test -n "$HELDOUT_CORPUS"
          cp "$HELDOUT_CORPUS" artifacts/final/heldout-forbidden-corpus.json
      - name: Generate and validate fresh final-answer corpus
        run: |
          python scripts/generate_agent_utility_v4_final_answer_corpus.py             --source-revision "${{ inputs.source_sha }}"             --forbidden-corpus artifacts/final/heldout-forbidden-corpus.json             --out artifacts/final/final-answer-corpus.json
          python scripts/validate_agent_utility_v4_final_answer_corpus.py             --corpus artifacts/final/final-answer-corpus.json             --forbidden-corpus artifacts/final/heldout-forbidden-corpus.json
      - id: matrix
        name: Export frozen 72-job final-answer matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("artifacts/final/final-answer-corpus.json").read_text(encoding="utf-8")
          )
          ids = [str(task["semantic_task_id"]) for task in data["tasks"]]
          chunks = [ids[index:index + 4] for index in range(0, len(ids), 4)]
          assert len(chunks) == 36
          include = []
          for catalog in (100, 250):
              for index, chunk in enumerate(chunks):
                  include.append(
                      {
                          "job_id": f"c{catalog}-g{index:02d}",
                          "catalog_size": catalog,
                          "task_ids": ",".join(chunk),
                      }
                  )
          assert len(include) == 72
          conditions = ",".join(data["condition_manifest"]["conditions"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  "matrix="
                  + json.dumps({"include": include}, separators=(",", ":"))
                  + "\n"
              )
              handle.write("conditions=" + conditions + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "final-answer-corpus-${{ github.run_id }}"
          path: artifacts/final/
          if-no-files-found: error
          retention-days: 30

  model-cache:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - run: pip install -e .
      - id: hf-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Populate exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
          )
          PY
      - name: Publish exact model cache before evaluator fan-out
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"

  evaluate:
    needs:
      - prepare
      - model-cache
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: "${{ fromJSON(needs.prepare.outputs.matrix) }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0"
      - run: pip install -e .
      - id: evaluator-hf-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Recover exact model revision after cache eviction
        if: steps.evaluator-hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
          )
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "final-answer-corpus-${{ github.run_id }}"
          path: artifacts/final
      - name: Verify exact ARM64 SDPA runtime
        run: |
          python - <<'PY'
          import os
          import platform
          import torch
          import transformers

          assert platform.python_version() == "3.12.14"
          assert platform.machine() in {"aarch64", "arm64"}
          assert os.environ["B2_ATTN_IMPLEMENTATION"] == "sdpa"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          PY
      - name: Evaluate frozen final-answer shard
        run: |
          mkdir -p artifacts/final-shard
          python -u scripts/evaluate_agent_utility_v4_final_answer.py             --corpus artifacts/final/final-answer-corpus.json             --catalog-size "${{ matrix.catalog_size }}"             --task-ids "${{ matrix.task_ids }}"             --conditions "${{ needs.prepare.outputs.conditions }}"             --out "artifacts/final-shard/${{ matrix.job_id }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "final-answer-shard-${{ matrix.job_id }}-${{ github.run_id }}"
          path: artifacts/final-shard/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: "${{ success() }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.source_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "final-answer-corpus-${{ github.run_id }}"
          path: artifacts/final
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          pattern: "final-answer-shard-*-${{ github.run_id }}"
          path: artifacts/final-shards
      - name: Aggregate frozen final-answer evidence
        run: |
          python scripts/aggregate_agent_utility_v4_final_answer.py             --input-dir artifacts/final-shards             --corpus artifacts/final/final-answer-corpus.json             --out artifacts/final-answer-canonical.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "final-answer-canonical-${{ github.run_id }}"
          path: |
            artifacts/final-answer-canonical.json
            artifacts/final/final-answer-corpus.json
            artifacts/final/heldout-forbidden-corpus.json
            benchmarks/agent-utility-v4-final-answer-preregistration.json
          if-no-files-found: error
          retention-days: 30
