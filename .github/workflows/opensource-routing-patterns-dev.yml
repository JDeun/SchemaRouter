name: Open-source Routing Patterns CPU DEV

on:
  pull_request:
    paths:
      - ".github/workflows/opensource-routing-patterns-dev.yml"
      - "scripts/evaluate_opensource_routing_patterns_dev.py"
      - "tests/test_opensource_routing_patterns_dev.py"
      - "benchmarks/operation-intent-trilingual-dev-20261015.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensource-routing-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - run: |
          python -m pytest -q tests/test_opensource_routing_patterns_dev.py
          python scripts/evaluate_opensource_routing_patterns_dev.py --preflight

  real-patterns-cpu:
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . "sentence-transformers>=5.1,<6" "transformers>=4.51,<5"
      - name: Real CPU embedding examples and bounded multilingual cross encoder
        run: |
          python scripts/evaluate_opensource_routing_patterns_dev.py \
            --output artifacts/opensource-routing-patterns-dev/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensource-inspired-routing-72-dev-${{ github.run_id }}
          path: artifacts/opensource-routing-patterns-dev/results.json
          if-no-files-found: error
          retention-days: 30
