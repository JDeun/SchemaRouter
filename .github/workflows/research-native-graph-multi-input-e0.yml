name: Native G5 Multi-Input Typed Binding E0

on:
  pull_request:
    paths:
      - "src/schemarouter/native_graph_index.py"
      - "tests/test_native_graph_multi_input.py"
      - "tests/test_native_graph_index.py"
      - ".github/workflows/research-native-graph-multi-input-e0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify existing G5 and complete multi-input binding
        run: |
          python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
          ruff check src/schemarouter/native_graph_index.py tests/test_native_graph_index.py tests/test_native_graph_multi_input.py
          python -m pytest -q tests/test_native_graph_index.py tests/test_native_graph_multi_input.py
      - name: Mark bounded E0 status, not E2
        if: success()
        run: |
          echo "G5 native source/typed multi-input regression PASS (E0 only). No actual tool/provider call, independent E2, default-product promotion, or release approval." >> "$GITHUB_STEP_SUMMARY"
