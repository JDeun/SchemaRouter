name: Research V6H Corpus Freeze

on:
  push:
    branches:
      - "research/0.13-end-to-end-operation-parser"
    paths:
      - ".github/workflows/research-v6h-corpus-freeze.yml"
      - "benchmarks/operation-routing-v6h-finetuned-operation-parser-preregistration.json"
      - "benchmarks/operation_routing_v6h_catalog.py"
      - "benchmarks/schema_finetuned_operation_parser.py"
      - "scripts/generate_operation_routing_v6h.py"
      - "tests/test_schema_finetuned_operation_parser.py"
      - "tests/test_operation_routing_v6h_protocol.py"
  pull_request:
    paths:
      - ".github/workflows/research-v6h-corpus-freeze.yml"
      - "benchmarks/operation-routing-v6h-finetuned-operation-parser-preregistration.json"
      - "benchmarks/operation_routing_v6h_catalog.py"
      - "benchmarks/schema_finetuned_operation_parser.py"
      - "scripts/generate_operation_routing_v6h.py"
      - "tests/test_schema_finetuned_operation_parser.py"
      - "tests/test_operation_routing_v6h_protocol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Validate frozen source protocol
        run: |
          ruff check \
            benchmarks/operation_routing_v6h_catalog.py \
            benchmarks/schema_finetuned_operation_parser.py \
            scripts/generate_operation_routing_v6h.py \
            tests/test_schema_finetuned_operation_parser.py \
            tests/test_operation_routing_v6h_protocol.py
          PYTHONPATH=. pytest -q \
            tests/test_schema_finetuned_operation_parser.py \
            tests/test_operation_routing_v6h_protocol.py

      - name: Generate DEV and confirmation together
        run: |
          python scripts/generate_operation_routing_v6h.py \
            --out-dir artifacts/operation-routing-v6h

      - name: Validate frozen counts and training-bank provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/operation-routing-v6h")
          freeze = json.loads(
              (root / "freeze-manifest.json").read_text(encoding="utf-8")
          )
          bank = Path("benchmarks/v6f-naturalistic-utterance-bank.json")
          bank_sha = hashlib.sha256(bank.read_bytes()).hexdigest()
          expected_bank = "c9bf9d378f8f9ef7388fde833e9a04c941871514319961b4a0666d97983caa68"
          assert bank_sha == expected_bank

          hashes = []
          for role in ("development", "confirmation"):
              manifest = freeze[role]
              assert manifest["case_count"] == 552
              assert manifest["supported_cases"] == 228
              assert manifest["near_domain_cases"] == 252
              assert manifest["out_of_domain_cases"] == 72
              assert manifest["route_count"] == 19
              assert manifest["tool_count"] == 7
              assert manifest["endpoint_counts"] == [2, 2, 3, 3, 3, 3, 3]
              assert manifest["training_operation_examples"] == 432
              assert manifest["training_background_examples"] == 384
              assert manifest["training_bank_sha256"] == expected_bank
              hashes.append(manifest["corpus_sha256"])
          assert len(set(hashes)) == 2
          print("V6H DEV+confirmation frozen before training/model scoring")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operation-routing-v6h-freeze-${{ github.run_id }}
          path: artifacts/operation-routing-v6h/
          retention-days: 30
