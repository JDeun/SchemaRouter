name: Paired Native Concept Agent E0

on:
  pull_request:
    paths:
      - "scripts/research_paired_native_concept_agent_e0.py"
      - "tests/test_research_paired_native_concept_agent_e0.py"
      - "scripts/research_authorized_concept_fixed5_agent_bridge.py"
      - ".github/workflows/research-paired-native-concept-agent-e0.yml"
      - "research/autoresearch/paired-native-concept-agent-e0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-agent-lexical-vs-concept:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install checked-out source and test tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1"
      - name: Verify same-source strict K5 pairing and legacy evaluator regressions
        run: |
          ruff check scripts/research_paired_native_concept_agent_e0.py tests/test_research_paired_native_concept_agent_e0.py
          python -m pytest -q tests/test_research_paired_native_concept_agent_e0.py tests/test_research_authorized_concept_fixed5_agent_bridge.py tests/test_integrated_fixed5_agent_selector.py
