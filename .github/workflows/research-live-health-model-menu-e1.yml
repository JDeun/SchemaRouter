name: Trusted Live Health to Model Tool Menu E1

on:
  pull_request:
    paths:
      - "scripts/research_live_health_model_menu_e1.py"
      - "tests/test_research_live_health_model_menu_e1.py"
      - "research/autoresearch/live-health-model-menu-e1.md"
      - ".github/workflows/research-live-health-model-menu-e1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-network-health-model-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install core/test dependencies
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Verify isolated opt-in route health and exact model disclosure
        run: |
          ruff check scripts/research_live_health_model_menu_e1.py tests/test_research_live_health_model_menu_e1.py
          pyright scripts/research_live_health_model_menu_e1.py
          python -m pytest -q tests/test_research_live_health_model_menu_e1.py tests/test_health.py tests/test_research_source_ready_native_tool_menu_e1.py
