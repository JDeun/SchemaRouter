name: Real Qwen Nous User-Role Bound Host E0 DEV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_qwen_nous_user_transcript_e0.py"
      - "scripts/research_real_qwen_bound_two_step_e0.py"
      - "tests/test_research_qwen_nous_user_transcript_e0.py"
      - "research/autoresearch/qwen-nous-user-bound-e0.md"
      - ".github/workflows/research-qwen-nous-user-bound-e0.yml"

permissions:
  contents: read

concurrency:
  group: qwen-nous-user-bound-e0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-model-source-host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
      - name: Verify new Nous replay and unchanged trusted host safety
        run: |
          ruff check scripts/research_qwen_nous_user_transcript_e0.py scripts/research_real_qwen_bound_two_step_e0.py tests/test_research_qwen_nous_user_transcript_e0.py
          python -m pytest -q tests/test_research_qwen_nous_user_transcript_e0.py tests/test_research_real_qwen_bound_two_step_e0.py tests/test_research_bound_two_step_host_e0.py

  real-pinned-qwen-nous-user:
    needs: no-model-source-host-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install CPU model runtime without paid endpoint
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "transformers>=4.51,<5"
      - name: Execute source-aligned Qwen Nous user history after real bound host calls
        run: |
          python -m scripts.research_real_qwen_bound_two_step_e0 \
            --mode real-cpu --transcript-mode nous-user \
            --out artifacts/qwen-nous-user-bound-e0/report.json
      - name: Assert E0-only result and report honest full-task failures
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          d = json.loads(Path("artifacts/qwen-nous-user-bound-e0/report.json").read_text(encoding="utf-8"))
          assert d["evidence_tier"] == "REAL_QWEN3_CPU_BOUND_NOUS_USER_E0_DEV_ONLY"
          assert d["transcript_mode"] == "nous-user"
          assert d["case_count"] == 3
          assert d["independent_e2_qualified"] is False
          assert d["real_external_native_provider_execution"] is False
          assert d["actual_model_final_answer_correctness_measured"] is True
          assert d["model_default_promoted"] is False
          assert d["release_safety_gate_passed"] is False
          assert {r["language"] for r in d["cases"]} == {"en", "ko", "ja"}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("## Source-aligned pinned Qwen3 Nous user-role real bound host E0\\n\\n")
              out.write("Role-only history transport change; synthetic exposed prompts and same original source/host. No E2.\\n\\n")
              out.write("| Language | Actual bound calls | Stop | Strict final correct | Complete |\\n|---|---:|---|---|---|\\n")
              for r in d["cases"]:
                  assert r["transcript_mode"] == "nous-user"
                  assert r["actual_model_inference_measured"] is True
                  assert r["independent_e2_qualified"] is False
                  assert 0 <= r["actual_bound_host_calls"] <= r["attempted_calls"] <= 4
                  assert r["full_task_correct"] <= r["two_stage_completed"]
                  out.write(f"| {r['language']} | {r['actual_bound_host_calls']} | {r['termination_reason']} | {r['correct_strict_final_answer']} | {r['full_task_correct']} |\\n")
              out.write("\\nA02/R05 NOT_VERIFIED, E2 0/19, #1356/default model HOLD.\\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qwen-nous-user-bound-e0-${{ github.run_id }}
          path: artifacts/qwen-nous-user-bound-e0/report.json
          if-no-files-found: error
          retention-days: 30
