name: Research 0.14 B2 SDPA Memory Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "research/0.14-b2-sdpa-memory-run"
    paths:
      - ".github/b2-sdpa-memory-trigger.json"

permissions:
  contents: read

concurrency:
  group: research-0.14-b2-sdpa-memory-validation
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_CACHE_KEY: "b2-smollm3-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - run: pip install -e .
      - id: hf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Populate exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          path = snapshot_download(
              repo_id=os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
          )
          print(path)
          PY
      - name: Verify frozen implementation and runtime
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import torch
          import transformers

          trigger = json.loads(
              Path(".github/b2-sdpa-memory-trigger.json")
              .read_text(encoding="utf-8")
          )
          assert trigger["experiment"] == "0.14-b2-sdpa-memory-validation"
          assert trigger["behavioral_equivalence_required"] is True
          assert trigger["canonical_b2_semantics_changed"] is False
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          print(json.dumps(trigger, sort_keys=True))
          PY
      - name: Eager reference behavior
        env:
          B2_ATTN_IMPLEMENTATION: "eager"
        run: |
          mkdir -p artifacts/b2-sdpa
          /usr/bin/time -v -o artifacts/b2-sdpa/eager-time.txt             python -u scripts/evaluate_agent_utility_phase_b_smollm3.py               --catalog-sizes "20"               --task-ids "single-material-current,multi-create-send"               --conditions "FULL,ORACLE"               --out artifacts/b2-sdpa/eager.json
      - name: SDPA candidate behavior
        env:
          B2_ATTN_IMPLEMENTATION: "sdpa"
        run: |
          /usr/bin/time -v -o artifacts/b2-sdpa/sdpa-equivalence-time.txt             python -u scripts/evaluate_agent_utility_phase_b_smollm3.py               --catalog-sizes "20"               --task-ids "single-material-current,multi-create-send"               --conditions "FULL,ORACLE"               --out artifacts/b2-sdpa/sdpa-equivalence.json
      - name: Require exact behavioral equivalence
        run: |
          python scripts/compare_b2_attention_backends.py             --eager artifacts/b2-sdpa/eager.json             --sdpa artifacts/b2-sdpa/sdpa-equivalence.json
      - name: SDPA 250-tool FULL memory smoke
        env:
          B2_ATTN_IMPLEMENTATION: "sdpa"
        run: |
          /usr/bin/time -v -o artifacts/b2-sdpa/sdpa-250-full-time.txt             python -u scripts/evaluate_agent_utility_phase_b_smollm3.py               --catalog-sizes "250"               --task-ids "multi-create-send"               --conditions "FULL"               --out artifacts/b2-sdpa/sdpa-250-full.json
      - name: Validate 250-tool completion and report RSS
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          result = json.loads(
              Path("artifacts/b2-sdpa/sdpa-250-full.json")
              .read_text(encoding="utf-8")
          )
          assert result["model"]["attention_implementation"] == "sdpa"
          assert result["catalog_sizes"] == [250]
          assert result["conditions"] == ["FULL"]
          assert result["task_ids"] == ["multi-create-send"]
          assert len(result["rows"]) == 1

          timing = Path(
              "artifacts/b2-sdpa/sdpa-250-full-time.txt"
          ).read_text(encoding="utf-8")
          match = re.search(
              r"Maximum resident set size \(kbytes\):\s*(\d+)",
              timing,
          )
          assert match is not None
          peak_kib = int(match.group(1))
          Path("artifacts/b2-sdpa/memory-summary.json").write_text(
              json.dumps(
                  {
                      "sdpa_250_full_completed": True,
                      "peak_rss_kib": peak_kib,
                      "peak_rss_gib": peak_kib / 1024 / 1024,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "sdpa_250_full_completed": True,
                      "peak_rss_kib": peak_kib,
                      "peak_rss_gib": peak_kib / 1024 / 1024,
                  },
                  sort_keys=True,
              )
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "b2-sdpa-memory-${{ github.run_id }}"
          path: artifacts/b2-sdpa/
          if-no-files-found: error
          retention-days: 30
