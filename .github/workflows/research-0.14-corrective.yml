name: Research 0.14 Corrective Retrieval
run-name: "Research 0.14 Corrective [${{ inputs.upstream_digest }}]"

on:
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact conveyor implementation commit
        required: true
        type: string
      upstream_digest:
        description: Frozen canonical B2 evidence digest
        required: true
        type: string
      b2_run_id:
        description: Canonical B2 workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: "research-0.14-corrective-${{ inputs.upstream_digest }}"
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: "${{ github.workspace }}/.hf-cache"
  B2_MODEL: "HuggingFaceTB/SmolLM3-3B"
  B2_REVISION: "a07cc9a04f16550a088caea529712d1d335b0ac1"
  B2_CACHE_KEY: "b2-smollm3-arm64-a07cc9a04f16550a088caea529712d1d335b0ac1-torch2.14-transformers4.57.6"
  B2_ATTN_IMPLEMENTATION: "sdpa"

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: "${{ steps.plan.outputs.matrix }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.implementation_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify exact canonical B2 evidence digest
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          python scripts/research_0_14_conveyor.py verify \
            --stage corrective \
            --expected "${{ inputs.upstream_digest }}" \
            --b2-run-id "${{ inputs.b2_run_id }}"
      - name: Generate and validate frozen 180-task corpus
        run: |
          mkdir -p artifacts/corrective-freeze
          python scripts/generate_agent_utility_v6_corrective_corpus.py \
            --source-revision "${{ inputs.implementation_sha }}" \
            --out artifacts/corrective-freeze/corrective-corpus.json
          python scripts/validate_agent_utility_v6_corrective_corpus.py \
            --corpus artifacts/corrective-freeze/corrective-corpus.json
      - id: plan
        name: Export exact 180-job matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          corpus = json.loads(
              Path("artifacts/corrective-freeze/corrective-corpus.json")
              .read_text(encoding="utf-8")
          )
          task_ids = [str(task["semantic_task_id"]) for task in corpus["tasks"]]
          chunks = [task_ids[index:index + 3] for index in range(0, len(task_ids), 3)]
          assert len(chunks) == 60
          include = []
          for catalog_size in (100, 250, 500):
              for chunk_index, chunk in enumerate(chunks):
                  include.append(
                      {
                          "job_id": f"c{catalog_size}-g{chunk_index:02d}",
                          "catalog_size": catalog_size,
                          "task_ids": ",".join(chunk),
                          "expected_episodes": len(chunk) * 5,
                      }
                  )
          assert len(include) == 180
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  "matrix="
                  + json.dumps({"include": include}, separators=(",", ":"))
                  + "\n"
              )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "corrective-freeze-${{ github.run_id }}"
          path: |
            artifacts/corrective-freeze/corrective-corpus.json
            benchmarks/agent-utility-v6-corrective-reretrieval-preregistration.json
          if-no-files-found: error
          retention-days: 30

  model-cache:
    needs: freeze
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.implementation_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - id: hf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
      - name: Populate exact model revision on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          print(
              snapshot_download(
                  repo_id=os.environ["B2_MODEL"],
                  revision=os.environ["B2_REVISION"],
              )
          )
          PY
      - name: Verify exact cached revision offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python - <<'PY'
          import os
          from transformers import AutoConfig, AutoTokenizer
          AutoConfig.from_pretrained(
              os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
              local_files_only=True,
              trust_remote_code=False,
          )
          AutoTokenizer.from_pretrained(
              os.environ["B2_MODEL"],
              revision=os.environ["B2_REVISION"],
              local_files_only=True,
              trust_remote_code=False,
          )
          PY

  evaluate:
    needs:
      - freeze
      - model-cache
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: "${{ fromJSON(needs.freeze.outputs.matrix) }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.implementation_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers==4.57.6" "tokenizers==0.22.2" "safetensors==0.8.0" "jinja2==3.1.6"
      - run: pip install -e .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: "${{ env.B2_CACHE_KEY }}"
          fail-on-cache-miss: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "corrective-freeze-${{ github.run_id }}"
          path: artifacts/corrective-freeze
      - name: Verify exact ARM64 SDPA runtime
        run: |
          python - <<'PY'
          import os
          import platform
          import torch
          import transformers
          assert platform.python_version() == "3.12.14"
          assert platform.machine() in {"aarch64", "arm64"}
          assert os.environ["B2_ATTN_IMPLEMENTATION"] == "sdpa"
          assert torch.__version__ == "2.14.0+cpu"
          assert transformers.__version__ == "4.57.6"
          PY
      - name: Evaluate frozen corrective shard
        run: |
          mkdir -p artifacts/corrective-shard
          python -u scripts/evaluate_agent_utility_v6_corrective.py \
            --corpus artifacts/corrective-freeze/corrective-corpus.json \
            --catalog-size "${{ matrix.catalog_size }}" \
            --task-ids "${{ matrix.task_ids }}" \
            --out "artifacts/corrective-shard/${{ matrix.job_id }}.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(next(Path("artifacts/corrective-shard").glob("*.json")).read_text())
          assert len(data["rows"]) == int(os.environ["EXPECTED_EPISODES"])
          PY
        env:
          EXPECTED_EPISODES: "${{ matrix.expected_episodes }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "corrective-shard-${{ matrix.job_id }}-${{ github.run_id }}"
          path: artifacts/corrective-shard/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: evaluate
    if: "${{ success() }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.implementation_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          name: "corrective-freeze-${{ github.run_id }}"
          path: artifacts/corrective-freeze
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7
        with:
          pattern: "corrective-shard-*-${{ github.run_id }}"
          path: artifacts/corrective-shards
      - name: Aggregate exact 2,700 episodes
        run: |
          python scripts/aggregate_agent_utility_v6_corrective.py \
            --input-dir artifacts/corrective-shards \
            --corpus artifacts/corrective-freeze/corrective-corpus.json \
            --out artifacts/corrective-canonical.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/corrective-canonical.json").read_text())
          assert data["episode_count"] == 2700
          print(json.dumps(data["primary_gate"], sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "corrective-canonical-${{ github.run_id }}"
          path: |
            artifacts/corrective-canonical.json
            artifacts/corrective-freeze/corrective-corpus.json
            benchmarks/agent-utility-v6-corrective-reretrieval-preregistration.json
          if-no-files-found: error
          retention-days: 30
