name: Research Benchmark

on:
  workflow_dispatch:
    inputs:
      run_full_research_matrix:
        description: "Run the historical calibration and diagnostic research suites"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/research-benchmark.yml"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: research-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  config-smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_benchmark_corpus.py

  deterministic-full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run full deterministic benchmark
        run: |
          mkdir -p artifacts/deterministic
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v1.json \
            --repeat 5 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/deterministic/report.json \
            --csv-out artifacts/deterministic/rows.csv \
            --html-out artifacts/deterministic/report.html
          python scripts/render_benchmark_history.py \
            artifacts/deterministic/report.json \
            --output artifacts/deterministic/history.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-deterministic-full-${{ github.run_id }}
          path: artifacts/deterministic/
          if-no-files-found: error
          retention-days: 30

  laya-full-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,laya]"
      - name: Run Laya CPU lexical versus recall-on-empty benchmark
        env:
          # Keep both language checkpoints resident. Preloading happens before the
          # timed per-case loop so steady-state latency excludes model-load churn.
          SCHEMAROUTER_LAYA_RESIDENT_CHECKPOINTS: "2"
        run: |
          mkdir -p \
            artifacts/laya/lexical \
            artifacts/laya/recall-on-empty \
            artifacts/laya/calibrated-no-route
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v1.json \
            --laya \
            --laya-device cpu \
            --laya-max-loaded 2 \
            --laya-preload \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/laya/lexical/report.json \
            --csv-out artifacts/laya/lexical/rows.csv \
            --html-out artifacts/laya/lexical/report.html
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v1.json \
            --laya \
            --laya-device cpu \
            --laya-max-loaded 2 \
            --laya-preload \
            --decision-recall-on-empty \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/laya/recall-on-empty/report.json \
            --csv-out artifacts/laya/recall-on-empty/rows.csv \
            --html-out artifacts/laya/recall-on-empty/report.html
          # 0.25 is a measured comparison point for this corpus, not a library default.
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v1.json \
            --laya \
            --laya-device cpu \
            --laya-max-loaded 2 \
            --laya-preload \
            --laya-min-confidence 0.25 \
            --decision-recall-on-empty \
            --candidate-abstention no_route \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/laya/calibrated-no-route/report.json \
            --csv-out artifacts/laya/calibrated-no-route/rows.csv \
            --html-out artifacts/laya/calibrated-no-route/report.html
          python scripts/render_benchmark_history.py \
            artifacts/laya/lexical/report.json \
            artifacts/laya/recall-on-empty/report.json \
            artifacts/laya/calibrated-no-route/report.json \
            --output artifacts/laya/history.html
          python scripts/calibrate_decision_threshold.py \
            artifacts/laya/recall-on-empty/report.json \
            --backend laya:auto \
            --abstention-mode deterministic \
            --json-out artifacts/laya/calibration-deterministic.json \
            --csv-out artifacts/laya/calibration-deterministic.csv \
            --html-out artifacts/laya/calibration-deterministic.html
          python scripts/calibrate_decision_threshold.py \
            artifacts/laya/recall-on-empty/report.json \
            --backend laya:auto \
            --abstention-mode no_route \
            --json-out artifacts/laya/calibration-no-route.json \
            --csv-out artifacts/laya/calibration-no-route.csv \
            --html-out artifacts/laya/calibration-no-route.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-laya-full-cpu-${{ github.run_id }}
          path: artifacts/laya/
          if-no-files-found: warn
          retention-days: 30

  semantic-recall-calibration-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        candidate_recall_limit: [2, 4, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev,laya]"
      - name: Run v2 calibration split with bounded multilingual semantic recall
        env:
          SCHEMAROUTER_LAYA_RESIDENT_CHECKPOINTS: "2"
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          CANDIDATE_RECALL_LIMIT: ${{ matrix.candidate_recall_limit }}
        run: |
          K="${CANDIDATE_RECALL_LIMIT}"
          mkdir -p "artifacts/semantic-recall/top-${K}"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v2.json \
            --split calibration \
            --laya \
            --laya-device cpu \
            --laya-max-loaded 2 \
            --laya-preload \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit "${K}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out "artifacts/semantic-recall/top-${K}/report.json" \
            --csv-out "artifacts/semantic-recall/top-${K}/rows.csv" \
            --html-out "artifacts/semantic-recall/top-${K}/report.html"
          python scripts/calibrate_decision_threshold.py \
            "artifacts/semantic-recall/top-${K}/report.json" \
            --backend laya:auto \
            --abstention-mode no_route \
            --json-out "artifacts/semantic-recall/top-${K}/calibration.json" \
            --csv-out "artifacts/semantic-recall/top-${K}/calibration.csv" \
            --html-out "artifacts/semantic-recall/top-${K}/calibration.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-semantic-recall-calibration-k${{ matrix.candidate_recall_limit }}-${{ github.run_id }}
          path: artifacts/semantic-recall/
          if-no-files-found: warn
          retention-days: 30


  semantic-recall-heldout-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev,laya]"
      - name: Run frozen v2 held-out semantic recall evaluation
        env:
          SCHEMAROUTER_LAYA_RESIDENT_CHECKPOINTS: "2"
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
        run: |
          mkdir -p artifacts/semantic-recall/heldout
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v2.json \
            --split test \
            --laya \
            --laya-device cpu \
            --laya-max-loaded 2 \
            --laya-preload \
            --laya-min-confidence 0.05 \
            --candidate-abstention no_route \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/semantic-recall/heldout/report.json \
            --csv-out artifacts/semantic-recall/heldout/rows.csv \
            --html-out artifacts/semantic-recall/heldout/report.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-semantic-recall-heldout-${{ github.run_id }}
          path: artifacts/semantic-recall/heldout/
          if-no-files-found: warn
          retention-days: 30


  capability-fit-calibration-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        fit_similarity: [0.15, 0.25, 0.35, 0.45, 0.55, 0.65]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Calibrate capability-fit similarity on v2 calibration split
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          FIT_SIMILARITY: ${{ matrix.fit_similarity }}
        run: |
          T="${FIT_SIMILARITY}"
          mkdir -p "artifacts/capability-fit/sim-${T}"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v2.json \
            --split calibration \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity "${T}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out "artifacts/capability-fit/sim-${T}/report.json" \
            --csv-out "artifacts/capability-fit/sim-${T}/rows.csv" \
            --html-out "artifacts/capability-fit/sim-${T}/report.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-capability-fit-sim-${{ matrix.fit_similarity }}-${{ github.run_id }}
          path: artifacts/capability-fit/
          if-no-files-found: warn
          retention-days: 30

  capability-fit-v3-heldout-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Run frozen capability-fit configuration on untouched v3 holdout
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
        run: |
          mkdir -p artifacts/capability-fit/heldout-v3
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v3.json \
            --split test \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/capability-fit/heldout-v3/report.json \
            --csv-out artifacts/capability-fit/heldout-v3/rows.csv \
            --html-out artifacts/capability-fit/heldout-v3/report.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-capability-fit-v3-heldout-${{ github.run_id }}
          path: artifacts/capability-fit/heldout-v3/
          if-no-files-found: warn
          retention-days: 30

  endpoint-disambiguation-calibration-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        endpoint_margin: [0.03, 0.06, 0.10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Calibrate same-tool endpoint disambiguation on v2 calibration
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          ENDPOINT_MARGIN: ${{ matrix.endpoint_margin }}
        run: |
          SAFE_MARGIN="${ENDPOINT_MARGIN//./_}"
          OUT="artifacts/endpoint-disambiguation/calibration-margin-${SAFE_MARGIN}"
          mkdir -p "${OUT}"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v2.json \
            --split calibration \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin "${ENDPOINT_MARGIN}" \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out "${OUT}/report.json" \
            --csv-out "${OUT}/rows.csv" \
            --html-out "${OUT}/report.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: endpoint-disambiguation-calibration-margin-${{ matrix.endpoint_margin }}-${{ github.run_id }}
          path: artifacts/endpoint-disambiguation/
          if-no-files-found: warn
          retention-days: 30

  endpoint-disambiguation-v4-heldout-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Run frozen endpoint-disambiguation configuration on untouched v4 holdout
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
        run: |
          mkdir -p artifacts/endpoint-disambiguation/heldout-v4
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v4-operation-holdout.json \
            --split test \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/endpoint-disambiguation/heldout-v4/report.json \
            --csv-out artifacts/endpoint-disambiguation/heldout-v4/rows.csv \
            --html-out artifacts/endpoint-disambiguation/heldout-v4/report.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: endpoint-disambiguation-v4-heldout-${{ github.run_id }}
          path: artifacts/endpoint-disambiguation/heldout-v4/
          if-no-files-found: warn
          retention-days: 30


  operation-fit-calibration-cpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_research_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        operation_similarity: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Screen alias-aware operation-fit threshold on v5 and consumed v7 diagnostic
        env:
          SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
          OPERATION_SIMILARITY: ${{ matrix.operation_similarity }}
        run: |
          T="${OPERATION_SIMILARITY}"
          SAFE_T="${T//./_}"
          for SPLIT in dev calibration; do
            OUT="artifacts/operation-fit/sim-${SAFE_T}/${SPLIT}"
            mkdir -p "${OUT}"
            python scripts/benchmark_decision_routing.py \
              --corpus benchmarks/decision-routing-v5-operation-calibration.json \
              --split "${SPLIT}" \
              --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
              --candidate-recall-limit 2 \
              --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
              --candidate-fit-min-similarity 0.25 \
              --operation-fit-embedding-callable benchmarks.multilingual_embedder:embed \
              --operation-fit-min-similarity "${T}" \
              --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
              --endpoint-disambiguation-min-margin 0.03 \
              --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
              --json-out "${OUT}/report.json" \
              --csv-out "${OUT}/rows.csv" \
              --html-out "${OUT}/report.html"
          done

          OUT="artifacts/operation-fit/sim-${SAFE_T}/diagnostic-v7"
          mkdir -p "${OUT}"
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v7-operation-post-change-holdout.json \
            --split test \
            --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-recall-limit 2 \
            --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --candidate-fit-min-similarity 0.25 \
            --operation-fit-embedding-callable benchmarks.multilingual_embedder:embed \
            --operation-fit-min-similarity "${T}" \
            --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed \
            --endpoint-disambiguation-min-margin 0.03 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out "${OUT}/report.json" \
            --csv-out "${OUT}/rows.csv" \
            --html-out "${OUT}/report.html"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-operation-fit-sim-${{ matrix.operation_similarity }}-${{ github.run_id }}
          path: artifacts/operation-fit/
          if-no-files-found: warn
          retention-days: 30
