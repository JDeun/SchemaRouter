name: Research Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/research-benchmark.yml"

permissions:
  contents: read

jobs:
  deterministic-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run full deterministic benchmark
        run: |
          mkdir -p artifacts/deterministic
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v1.json \
            --repeat 5 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/deterministic/report.json \
            --csv-out artifacts/deterministic/rows.csv \
            --html-out artifacts/deterministic/report.html
          python scripts/render_benchmark_history.py \
            artifacts/deterministic/report.json \
            --output artifacts/deterministic/history.html
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-deterministic-full-${{ github.run_id }}
          path: artifacts/deterministic/
          if-no-files-found: error
          retention-days: 30

  laya-full-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,laya]"
      - name: Run Laya CPU lexical versus recall-on-empty benchmark
        run: |
          mkdir -p artifacts/laya/lexical artifacts/laya/recall-on-empty
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v1.json \
            --laya \
            --laya-device cpu \
            --laya-max-loaded 1 \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/laya/lexical/report.json \
            --csv-out artifacts/laya/lexical/rows.csv \
            --html-out artifacts/laya/lexical/report.html
          python scripts/benchmark_decision_routing.py \
            --corpus benchmarks/decision-routing-v1.json \
            --laya \
            --laya-device cpu \
            --laya-max-loaded 1 \
            --decision-recall-on-empty \
            --hardware-label "GitHub Actions ubuntu-latest x64 CPU" \
            --json-out artifacts/laya/recall-on-empty/report.json \
            --csv-out artifacts/laya/recall-on-empty/rows.csv \
            --html-out artifacts/laya/recall-on-empty/report.html
          python scripts/render_benchmark_history.py \
            artifacts/laya/lexical/report.json \
            artifacts/laya/recall-on-empty/report.json \
            --output artifacts/laya/history.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-laya-full-cpu-${{ github.run_id }}
          path: artifacts/laya/
          if-no-files-found: warn
          retention-days: 30
