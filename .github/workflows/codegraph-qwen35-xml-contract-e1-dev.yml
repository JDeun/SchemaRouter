name: CodeGraph Qwen35 XML Contract E1 DEV

on:
  pull_request:
    paths:
      - "scripts/research_qwen35_native_tool_adapter_e1.py"
      - "tests/test_research_qwen35_native_tool_adapter_e1.py"
      - "research/autoresearch/codegraph-qwen35-model-compatibility-e1.md"
      - ".github/workflows/codegraph-qwen35-xml-contract-e1-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen35-native-grammar-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install static gate requirements
        run: python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1"
      - name: Verify canonical parser unchanged and Qwen3.5 native protocol safety
        run: |
          ruff check scripts/research_qwen35_native_tool_adapter_e1.py tests/test_research_qwen35_native_tool_adapter_e1.py
          python -m pytest -q tests/test_research_qwen35_native_tool_adapter_e1.py tests/test_research_codegraph_bare_json_adapter_e1.py tests/test_research_codegraph_surgical_agent_e1.py
