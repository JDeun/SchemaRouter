name: V4 Routing Stage Diagnostics\n\non:\n  push:\n    branches:\n      - "research/v4-stage-diagnostics"\n    paths:\n      - ".github/workflows/research-v4-stage-diagnostics.yml"\n      - "benchmarks/operation-routing-v4-stage-diagnostics.json"\n      - "scripts/benchmark_decision_routing.py"\n      - "scripts/analyze_operation_routing_v4_stage_diagnostics.py"\n      - "scripts/generate_decision_routing_quality_v4.py"\n      - "scripts/audit_operation_routing_corpus.py"\n      - "tests/test_operation_routing_v4_stage_diagnostics.py"\n\npermissions:\n  contents: read\n\nenv:\n  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}\n  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"\n  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"\n  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"\n  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"\n\nconcurrency:\n  group: v4-stage-diagnostics-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  contracts:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7\n        with:\n          python-version: "3.12"\n          cache: pip\n      - run: python -m pip install --upgrade pip\n      - run: pip install -e ".[dev]"\n      - name: Validate diagnostic code\n        run: |\n          python -m py_compile scripts/benchmark_decision_routing.py scripts/analyze_operation_routing_v4_stage_diagnostics.py\n          ruff check scripts/benchmark_decision_routing.py scripts/analyze_operation_routing_v4_stage_diagnostics.py tests/test_operation_routing_v4_stage_diagnostics.py\n          pytest -q tests/test_operation_routing_v4_stage_diagnostics.py\n\n  diagnostic:\n    needs: contracts\n    runs-on: ubuntu-latest\n    timeout-minutes: 120\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7\n        with:\n          python-version: "3.12"\n          cache: pip\n      - run: python -m pip install --upgrade pip\n      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu\n      - run: pip install "sentence-transformers>=3,<6"\n      - run: pip install -e ".[dev]"\n      - name: Generate identical v4 development corpus\n        run: |\n          mkdir -p artifacts/v4-stage-diagnostics\n          python scripts/generate_decision_routing_quality_v4.py --seed "${V4_DEV_SEED}" --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" --out artifacts/v4-stage-diagnostics/corpus.json --manifest artifacts/v4-stage-diagnostics/corpus-manifest.json\n      - name: Audit corpus before model scoring\n        run: |\n          python scripts/audit_operation_routing_corpus.py --corpus artifacts/v4-stage-diagnostics/corpus.json --out artifacts/v4-stage-diagnostics/corpus-audit.json --near-duplicate-threshold 0.80 --max-duplicate-examples 50\n      - name: Run behavior-preserving stage diagnostic\n        run: |\n          BASELINE="keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation"\n          python scripts/benchmark_decision_routing.py --corpus artifacts/v4-stage-diagnostics/corpus.json --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed --candidate-recall-limit 2 --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed --candidate-fit-min-similarity 0.25 --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs --operation-fit-min-score 0.01 --operation-fit-min-margin 0.0 --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed --endpoint-disambiguation-min-margin 0.03 --counterbalanced --warmup-cases 24 --planner-name "${BASELINE}" --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 stage diagnostics" --json-out artifacts/v4-stage-diagnostics/report.json\n      - name: Analyze candidate-fit geometry\n        run: |\n          python scripts/analyze_operation_routing_v4_stage_diagnostics.py --report artifacts/v4-stage-diagnostics/report.json --out artifacts/v4-stage-diagnostics/analysis.json\n      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1\n        if: always()\n        with:\n          name: operation-routing-v4-stage-diagnostics-${{ github.run_id }}\n          path: |\n            artifacts/v4-stage-diagnostics/report.json\n            artifacts/v4-stage-diagnostics/analysis.json\n            artifacts/v4-stage-diagnostics/corpus-manifest.json\n            artifacts/v4-stage-diagnostics/corpus-audit.json\n          if-no-files-found: error\n          retention-days: 30\n