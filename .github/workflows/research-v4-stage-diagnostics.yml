name: V4 Routing Stage Diagnostics

on:
  push:
    branches:
      - "research/v4-stage-diagnostics"
    paths:
      - ".github/workflows/research-v4-stage-diagnostics.yml"
      - "benchmarks/operation-routing-v4-stage-diagnostics.json"
      - "scripts/benchmark_decision_routing.py"
      - "scripts/analyze_operation_routing_v4_stage_diagnostics.py"
      - "scripts/generate_decision_routing_quality_v4.py"
      - "scripts/audit_operation_routing_corpus.py"
      - "tests/test_operation_routing_v4_stage_diagnostics.py"

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  SCHEMAROUTER_BENCHMARK_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  SCHEMAROUTER_BENCHMARK_RERANKER_MODEL: "BAAI/bge-reranker-v2-m3"
  SCHEMAROUTER_BENCHMARK_CONTRASTIVE_BETA: "1.00"
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"

concurrency:
  group: v4-stage-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate diagnostic code
        run: |
          python -m py_compile scripts/benchmark_decision_routing.py scripts/analyze_operation_routing_v4_stage_diagnostics.py
          ruff check scripts/benchmark_decision_routing.py scripts/analyze_operation_routing_v4_stage_diagnostics.py tests/test_operation_routing_v4_stage_diagnostics.py
          pytest -q tests/test_operation_routing_v4_stage_diagnostics.py

  diagnostic:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "sentence-transformers>=3,<6"
      - run: pip install -e ".[dev]"
      - name: Generate identical v4 development corpus
        run: |
          mkdir -p artifacts/v4-stage-diagnostics
          python scripts/generate_decision_routing_quality_v4.py --seed "${V4_DEV_SEED}" --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" --out artifacts/v4-stage-diagnostics/corpus.json --manifest artifacts/v4-stage-diagnostics/corpus-manifest.json
      - name: Audit corpus before model scoring
        run: |
          python scripts/audit_operation_routing_corpus.py --corpus artifacts/v4-stage-diagnostics/corpus.json --out artifacts/v4-stage-diagnostics/corpus-audit.json --near-duplicate-threshold 0.80 --max-duplicate-examples 50
      - name: Run behavior-preserving stage diagnostic
        run: |
          BASELINE="keyword+semantic-recall+capability-fit+operation-fit+endpoint-disambiguation"
          python scripts/benchmark_decision_routing.py --corpus artifacts/v4-stage-diagnostics/corpus.json --candidate-recall-embedding-callable benchmarks.multilingual_embedder:embed --candidate-recall-limit 2 --candidate-fit-embedding-callable benchmarks.multilingual_embedder:embed --candidate-fit-min-similarity 0.25 --operation-fit-pairwise-callable benchmarks.bge_contrastive:score_pairs --operation-fit-min-score 0.01 --operation-fit-min-margin 0.0 --endpoint-disambiguation-embedding-callable benchmarks.multilingual_embedder:embed --endpoint-disambiguation-min-margin 0.03 --counterbalanced --warmup-cases 24 --planner-name "${BASELINE}" --hardware-label "GitHub Actions ubuntu-latest x64 CPU v4 stage diagnostics" --json-out artifacts/v4-stage-diagnostics/report.json
      - name: Analyze candidate-fit geometry
        run: |
          python scripts/analyze_operation_routing_v4_stage_diagnostics.py --report artifacts/v4-stage-diagnostics/report.json --out artifacts/v4-stage-diagnostics/analysis.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operation-routing-v4-stage-diagnostics-${{ github.run_id }}
          path: |
            artifacts/v4-stage-diagnostics/report.json
            artifacts/v4-stage-diagnostics/analysis.json
            artifacts/v4-stage-diagnostics/corpus-manifest.json
            artifacts/v4-stage-diagnostics/corpus-audit.json
          if-no-files-found: error
          retention-days: 30
