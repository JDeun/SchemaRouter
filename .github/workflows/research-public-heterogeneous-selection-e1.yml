name: Public Heterogeneous Natural-Language Selection E1

on:
  pull_request:
    paths:
      - "scripts/research_public_heterogeneous_selection_e1.py"
      - "tests/test_research_public_heterogeneous_selection_e1.py"
      - "research/autoresearch/public-anonymous-route-selection-e1-design.md"
      - "research/autoresearch/public-anonymous-route-selection-e1-plan.md"
      - ".github/workflows/research-public-heterogeneous-selection-e1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-native-unhinted-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install original router and offline evaluation tools
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.9,<1"
      - name: Verify actual native planner scoring and no-label-leak boundaries
        run: |
          ruff check scripts/research_public_heterogeneous_selection_e1.py tests/test_research_public_heterogeneous_selection_e1.py
          python -m pytest -q tests/test_research_public_heterogeneous_selection_e1.py
      - name: Preserve offline-only qualification
        run: |
          echo "Deterministic native-router offline tests; not live source discovery, independently adjudicated gold, or real-model E2 quality. No default routing changed." >> "$GITHUB_STEP_SUMMARY"

  optin-real-unhinted-three-source-selection:
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic-native-unhinted-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install public source read-only discovery adapter
        run: python -m pip install ".[mcp]"
      - name: Retrieve twelve unhinted queries against actual source schemas
        run: python -m scripts.research_public_heterogeneous_selection_e1 --live > "$RUNNER_TEMP/public-selection-e1.json"
      - name: Report actual measured misses and success without quality gate promotion
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'public-selection-e1.json').read_text())
          assert report['status'] == 'success'
          assert report['evidence_tier'] == 'E1_LIVE_SOURCE_RETRIEVAL_HOST_LABELS_NOT_E2'
          assert report['live_source_discovery'] is True
          assert report['registry_tool_count'] == 3
          assert report['live_remote_schema_discovered_tool_count'] == 2
          assert report['source_contract_provenance']['crossref']['live_remote_schema_discovered'] is False
          assert report['source_contract_provenance']['cod_public']['live_remote_schema_discovered'] is True
          assert report['source_contract_provenance']['deepwiki_public']['live_remote_schema_discovered'] is True
          assert report['model_calls'] == 0
          assert report['provider_invocations'] == 0
          assert report['independent_e2_gold'] is False
          assert report['default_ranking_changed'] is False
          m = report['metrics']
          assert m['total_cases'] == 12
          assert m['labeled_cases'] == 9
          assert m['offtopic_cases'] == 3
          assert 0 <= m['positive_top1_hits'] <= m['positive_top5_hits'] <= 9
          assert 0 <= m['offtopic_abstentions'] <= 3
          assert len(report['rows']) == 12
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('## Genuine-source unhinted router selection E1\n\n')
              out.write(f"Frozen user queries: {m['total_cases']}; source-labeled: {m['labeled_cases']}; negative: {m['offtopic_cases']}.\n\n")
              out.write('Contract provenance: Crossref bundled native profile (not live remote schema discovery); COD live OPTIMADE discovery; DeepWiki live MCP discovery.\n\n')
              out.write(f"Actual nonzero-score Top-1 {m['positive_top1_hits']}/9; Top-5 {m['positive_top5_hits']}/9. Native off-topic plans proposed: {m['offtopic_native_plan_proposals']}/3. These are observed failures or successes, not thresholds.\n\n")
              out.write('Host-labeled original source tasks, no selected endpoint execution, no model/independent semantic gold, not E2 or production release qualification.\n')
          PY
