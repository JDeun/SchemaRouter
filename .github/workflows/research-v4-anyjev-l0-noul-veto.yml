name: V4 AnyJev L0 Noul Veto

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMAROUTER_SOURCE_REVISION: ${{ github.sha }}
  V4_DEV_SEED: "operation-routing-quality-v4-development-2026-09-27"
  V4_DEV_SHA256: "fc085c58ed7c667d71024e60cf9e213e66da8f7b43f6e79551ed810a9e328216"
  ANYJEV_SOURCE_REVISION: "45add301a7aa60ed3420c83d15c061e84e5bce61"
  USE_TF: "0"

concurrency:
  group: v4-anyjev-l0-noul-veto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate AnyJev protocol contracts
        run: |
          python -m json.tool benchmarks/operation-routing-v4-anyjev-l0-noul-veto.json >/dev/null
          ruff check scripts/analyze_anyjev_l0_noul_veto_v4.py tests/test_anyjev_l0_noul_veto_v4.py
          pytest -q tests/test_anyjev_l0_noul_veto_v4.py

  evaluate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install pinned AnyJev runtime
        run: |
          pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.57.6"
          pip install "git+https://github.com/nokia-applied-research/AnyJev.git@${ANYJEV_SOURCE_REVISION}#egg=anyjev[hf]"
          pip install "sentence-transformers>=3,<6"
          pip install -e ".[dev]"

      - name: Verify installed AnyJev source
        run: |
          python - <<'PY'
          from importlib.metadata import version

          assert version("anyjev") == "0.1.0"
          print("anyjev", version("anyjev"))
          PY

      - name: Generate immutable v4 tuning DEV
        run: |
          OUT="artifacts/v4-anyjev-l0-noul-veto"
          mkdir -p "${OUT}"
          python scripts/generate_decision_routing_quality_v4.py \
            --seed "${V4_DEV_SEED}" \
            --source-revision "${SCHEMAROUTER_SOURCE_REVISION}" \
            --out "${OUT}/corpus.json" \
            --manifest "${OUT}/corpus-manifest.json"

      - name: Verify corpus identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/v4-anyjev-l0-noul-veto/corpus-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          actual = manifest.get("corpus_sha256")
          expected = os.environ["V4_DEV_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"corpus SHA mismatch: expected {expected}, got {actual}"
              )
          if manifest.get("case_count") != 1800:
              raise SystemExit(
                  f"unexpected case count: {manifest.get('case_count')}"
              )
          print(f"verified corpus sha256={actual}")
          PY

      - name: Audit tuning DEV
        run: |
          OUT="artifacts/v4-anyjev-l0-noul-veto"
          python scripts/audit_operation_routing_corpus.py \
            --corpus "${OUT}/corpus.json" \
            --out "${OUT}/corpus-audit.json" \
            --near-duplicate-threshold 0.80 \
            --max-duplicate-examples 50

      - name: Run AnyJev L0 content-free noul veto
        run: |
          OUT="artifacts/v4-anyjev-l0-noul-veto"
          python scripts/analyze_anyjev_l0_noul_veto_v4.py \
            --corpus "${OUT}/corpus.json" \
            --out "${OUT}/analysis.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v4-anyjev-l0-noul-veto-${{ github.run_id }}
          path: |
            artifacts/v4-anyjev-l0-noul-veto/analysis.json
            artifacts/v4-anyjev-l0-noul-veto/corpus-manifest.json
            artifacts/v4-anyjev-l0-noul-veto/corpus-audit.json
            benchmarks/operation-routing-v4-anyjev-l0-noul-veto.json
          if-no-files-found: error
          retention-days: 30
