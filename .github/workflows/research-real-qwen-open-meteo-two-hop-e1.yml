name: Real Qwen Open-Meteo Two-Hop Native Agent E1 DEV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_real_qwen_open_meteo_two_hop_e1.py"
      - "scripts/research_scoped_host_invocation.py"
      - "tests/test_research_real_qwen_open_meteo_two_hop_e1.py"
      - "research/autoresearch/real-qwen-open-meteo-two-hop-e1.md"
      - ".github/workflows/research-real-qwen-open-meteo-two-hop-e1.yml"

permissions:
  contents: read

concurrency:
  group: qwen-native-open-meteo-e1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scoped-execution-and-oracle-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing Router, Qwen parser, scoped host and mock provider contracts
        run: |
          python -m pip install ".[mcp]" "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "ruff>=0.6,<1"
          ruff check scripts/research_real_qwen_open_meteo_two_hop_e1.py tests/test_research_real_qwen_open_meteo_two_hop_e1.py
          python -m pytest -q tests/test_research_real_qwen_open_meteo_two_hop_e1.py tests/test_research_real_qwen_concept_graph_e1.py tests/test_research_real_qwen_concept_graph_workflow.py tests/test_research_open_meteo_live_two_hop_e1.py tests/test_research_qwen_nous_user_transcript_e0.py

  pinned-qwen-real-native-provider:
    needs: scoped-execution-and-oracle-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install frozen local Qwen CPU model and existing product
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[mcp]" "transformers>=4.51,<5"
      - name: Real model proposes route and arguments, trusted host attempts actual provider
        run: |
          python -m scripts.research_real_qwen_open_meteo_two_hop_e1 \
            --out artifacts/real-qwen-open-meteo-e1/report.json
      - name: Verify honest candidate results even if actual Qwen agent fails
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          d = json.loads(Path("artifacts/real-qwen-open-meteo-e1/report.json").read_text())
          assert d["study"] == "REAL_QWEN_NATIVE_OPEN_METEO_TWO_STEP_E1_DEV"
          assert d["case_count"] == 3
          assert d["model_revision"] == "c1899de289a04d12100db370d81485cdf75e47ca"
          assert d["actual_pinned_model_inference"] is True
          assert d["source_is_live_public_api"] is True
          assert d["scripted_host_route_order_scoring"] is True
          assert not d["independently_authored_private_e2"]
          assert not d["original_provider_benchmark_gold"]
          assert not d["product_default_changed"]
          assert not d["release_qualified"]
          assert {row["language"] for row in d["outcomes"]} == {"en", "ko", "ja"}
          assert 0 <= d["model_generated_full_task_successes"] <= 3
          calls = 0
          attempts = 0
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## Real local Qwen3 0.6B + actual Open-Meteo API E1 DEV\\n\\n")
              f.write("| Language | HTTP attempts | Generated calls | Validated geocodes | Validated forecasts | Complete two-step | Strict final | Stop | Failure stage |\\n|---|---:|---:|---:|---:|---|---|---|---|\\n")
              for row in d["outcomes"]:
                  assert row["independent_e2_qualified"] is False
                  assert 0 <= row["real_geocoding_calls"] <= 1
                  assert 0 <= row["real_forecast_calls"] <= row["real_geocoding_calls"]
                  assert row["full_task_complete"] <= row["model_generated_two_step_complete"]
                  assert row["model_generated_two_step_complete"] <= bool(row["real_forecast_calls"])
                  assert row["trusted_failure_stage"] is None or row["termination_reason"] == "host_or_native_source_denied"
                  calls += row["real_geocoding_calls"] + row["real_forecast_calls"]
                  assert row["real_geocoding_calls"] <= row["real_geocoding_http_attempts"] <= 1
                  assert row["real_forecast_calls"] <= row["real_forecast_http_attempts"] <= 1
                  attempts += row["real_geocoding_http_attempts"] + row["real_forecast_http_attempts"]
                  f.write(f"| {row['language']} | {row['real_geocoding_http_attempts'] + row['real_forecast_http_attempts']} | {row['attempted_model_calls']} | {row['real_geocoding_calls']} | {row['real_forecast_calls']} | {row['model_generated_two_step_complete']} | {row['strict_final_answer_correct']} | {row['termination_reason']} | {row['trusted_failure_stage']} |\\n")
              f.write("\\nOriginal provider HTTPS only for permitted model calls. Failures remain FAILED cases, not rescue-filled host success. This is exposed self-authored multilingual DEV, no independently qualified E2 or product promotion.\\n")
          assert calls == d["total_real_source_calls"]
          assert attempts == d["total_real_http_attempts"]
          assert d["legacy_call_counter_measures_validated_responses_only"] is True
          PY
      - name: Compare FULL, lexical K5 and qualified native G5 with cached pinned Qwen
        run: |
          # 앞 단계에서 다운로드된 동일 revision의 Qwen 가중치만 오프라인 재사용.
          # 이 실행은 무료 비상업 Open-Meteo API에 대한 공개 E1 연구입니다.
          python -m scripts.research_real_qwen_open_meteo_two_hop_e1 \
            --compare-graph --documented-noncommercial-e1 \
            --out artifacts/real-qwen-open-meteo-g5-paired-e1/report.json
      - name: Record real G5 E1 outcomes or exact blocker without fabricated rates
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("artifacts/real-qwen-open-meteo-g5-paired-e1/report.json")
          row = json.loads(report.read_text())
          assert row["study"] == "REAL_QWEN_NATIVE_G5_PAIRED_E1_DEV"
          assert row["model_revision"] == "c1899de289a04d12100db370d81485cdf75e47ca"
          assert row["requested_k"] == 5
          assert row["arms"] == ["all_visible", "lexical_k5", "concept_graph_optin"]
          assert row["independently_authored_private_e2"] is False
          assert row["release_qualified"] is False

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n## Original-provider G5 paired E1 DEV (non-commercial)\n\n")
              summary.write(f"Status: `{row['status']}`. Same pinned Qwen runner, live Open-Meteo. Not E2.\n\n")
              if row["status"] == "E1_MEASURED_DEV_NOT_E2":
                  assert len(row["outcomes"]) == 9
                  assert {o["condition"] for o in row["outcomes"]} == set(row["arms"])
                  assert {o["language"] for o in row["outcomes"]} == {"en", "ko", "ja"}
                  assert set(row["task_success_rate"]) == set(row["arms"])
                  for rate in row["task_success_rate"].values():
                      assert type(rate) is float and 0 <= rate <= 1
                  summary.write("| Language | Arm | Strict task success | Native source calls | Stop |\n")
                  summary.write("|---|---|---|---:|---|\n")
                  for outcome in row["outcomes"]:
                      assert outcome["original_provider_e1"] is True
                      assert outcome["independent_e2_qualified"] is False
                      summary.write(
                          f"| {outcome['language']} | {outcome['condition']} | "
                          f"{outcome['full_task_complete']} | "
                          f"{outcome['real_geocoding_calls'] + outcome['real_forecast_calls']} | "
                          f"{outcome['termination_reason']} |\n"
                      )
              else:
                  assert row["status"] in {
                      "BLOCKED_SOURCE_SEMANTICS", "BLOCKED_MODEL_RUNTIME",
                      "INCOMPARABLE_SOURCE_DRIFT",
                  }
                  assert row["task_success_rate"] is None
                  assert not row["outcomes"]
                  summary.write("No comparable success denominator; inspect the sanitized status artifact.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-qwen-open-meteo-two-hop-e1-${{ github.run_id }}
          path: artifacts/real-qwen-open-meteo-e1/report.json
          if-no-files-found: warn
          retention-days: 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-qwen-open-meteo-g5-paired-e1-${{ github.run_id }}
          path: artifacts/real-qwen-open-meteo-g5-paired-e1/report.json
          if-no-files-found: warn
          retention-days: 60
