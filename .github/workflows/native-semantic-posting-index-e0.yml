name: Native Catalog Semantic Posting Index E0

on:
  pull_request:
    paths:
      - "src/schemarouter/native_semantic_index.py"
      - "src/schemarouter/__init__.py"
      - "tests/test_native_semantic_index.py"
      - "tests/test_public_api.py"
      - ".github/workflows/native-semantic-posting-index-e0.yml"
      - "research/autoresearch/native-catalog-semantic-index-e0.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-catalog-index-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-registered-source-postings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install current tested source
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1" "pyright>=1.1.400"
      - name: Validate source-versioned field postings and stable public API
        run: |
          ruff check src/schemarouter/native_semantic_index.py tests/test_native_semantic_index.py
          python -m pytest -q tests/test_native_semantic_index.py tests/test_native_field_group_retrieval.py tests/test_native_concept_retrieval.py tests/test_public_api.py
          pyright src/schemarouter/native_semantic_index.py
