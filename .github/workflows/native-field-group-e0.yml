name: Native FieldGroup Pre-K E0

on:
  pull_request:
    paths:
      - "src/schemarouter/field_group_retrieval.py"
      - "src/schemarouter/__init__.py"
      - "tests/test_native_field_group_retrieval.py"
      - "tests/test_public_api.py"
      - ".github/workflows/native-field-group-e0.yml"
      - "research/autoresearch/native-field-group-pre-k-e0.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-field-group-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-typed-field-group:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install tested source and tooling
        run: python -m pip install . "pytest>=8,<10" "pytest-asyncio>=0.23" "ruff>=0.9,<1"
      - name: Native opt-in contracts and existing E1 parity
        run: |
          ruff check src/schemarouter/field_group_retrieval.py tests/test_native_field_group_retrieval.py
          python -m pytest -q tests/test_native_field_group_retrieval.py tests/test_research_required_field_group_e1.py tests/test_public_api.py
