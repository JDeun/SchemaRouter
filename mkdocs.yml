site_name: SchemaRouter
site_description: Schema-aware planning and execution for LLM tool ecosystems
site_author: Yong-eun Cho
site_url: https://jdeun.github.io/SchemaRouter/
copyright: © 2026 Yong-eun Cho · MIT License
repo_url: https://github.com/JDeun/SchemaRouter
repo_name: JDeun/SchemaRouter
edit_uri: edit/main/docs/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JDeun/SchemaRouter
      name: SchemaRouter on GitHub
    - icon: fontawesome/solid/book
      link: https://github.com/JDeun/paper_SchemaRouter
      name: SchemaRouter research

theme:
  name: material
  language: en
  logo: assets/brand/schemarouter-mark-dark.svg
  favicon: assets/brand/schemarouter-mark-light.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/brand.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Choose an ingestion path: getting-started/ingestion-paths.md
  - Concepts:
      - What SchemaRouter is: concepts/schema-router.md
      - Tool and endpoint contracts: concepts/tool-endpoint.md
      - Planning and field projection: concepts/planning.md
      - Registry and schema identity: concepts/registry.md
      - Execution and trust boundaries: concepts/execution.md
      - Adapter ecosystem: concepts/adapters.md
      - Decision backends: concepts/decision-backends.md
  - Guides:
      - Python tools: guides/python-tools.md
      - OpenAPI: guides/openapi.md
      - OpenAPI compatibility: guides/openapi-compatibility.md
      - OPTIMADE: guides/optimade.md
      - MCP: guides/mcp.md
      - Human-readable documentation: guides/html-documentation.md
      - Model-assisted analysis: guides/model-analyzer.md
      - Field projection: guides/field-projection.md
      - Candidate indexing: guides/candidate-indexing.md
      - Decision routing benchmark: guides/decision-benchmark.md
      - Batch, streaming, and events: guides/runtime.md
      - Persistent run traces: guides/run-traces.md
      - Retry policy: guides/retry.md
      - Execution policy: guides/execution-policy.md
      - Trusted execution hooks: guides/execution-hooks.md
      - Third-party adapter plugins: guides/adapter-plugins.md
  - Integrations:
      - LangChain: integrations/langchain.md
      - LangGraph: integrations/langgraph.md
      - LlamaIndex: integrations/llamaindex.md
      - Jev / TypeSafe: integrations/jev.md
      - Ollama decisions: integrations/ollama.md
      - OpenTelemetry: integrations/opentelemetry.md
  - Recipes:
      - OpenAPI agent boundary: recipes/openapi-agent.md
      - MCP agent boundary: recipes/mcp-agent.md
      - Many-tool catalogs: recipes/many-tools.md
  - API reference:
      - Public API: reference/api.md
      - Runtime: reference/runtime.md
      - Models: reference/models.md
      - Registry and planner: reference/planning.md
  - Architecture:
      - Architecture: architecture.md
      - Framework maturity: framework-maturity.md
      - Compatibility testing: compatibility.md
      - Adapter authoring: adapter-authoring.md
  - Security:
      - Threat model: security/threat-model.md
  - Project:
      - Versioning: versioning.md
      - Release notes:
          - 0.2.0a1: releases/0.2.0a1.md
      - Release checklist: release-checklist.md
      - Contributing: contributing.md
