site_name: SchemaRouter
site_description: Typed capability retrieval and schema-aware execution for LLM/RAG agents and tools
site_author: Yong-eun Cho
site_url: https://jdeun.github.io/SchemaRouter/
copyright: © 2026 Yong-eun Cho · MIT License
repo_url: https://github.com/JDeun/SchemaRouter
repo_name: JDeun/SchemaRouter
edit_uri: edit/main/docs/

# A page that is written but never added to `nav` builds cleanly and is then
# unreachable on the published site. MkDocs reports that at INFO level, so
# `--strict` does not catch it. Promoting it to a warning makes the existing
# strict docs gate fail instead, which is how 0.12.0 and seven research pages
# were able to go missing from the site while CI stayed green.
validation:
  nav:
    omitted_files: warn

not_in_nav: |
  assets/brand/README.md

extra:
  alternate:
    - name: English
      link: /SchemaRouter/
      lang: en
    - name: 한국어
      link: /SchemaRouter/ko/
      lang: ko
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JDeun/SchemaRouter
      name: SchemaRouter on GitHub
    - icon: fontawesome/solid/book
      link: https://github.com/JDeun/paper_SchemaRouter
      name: SchemaRouter research

theme:
  name: material
  language: en
  logo: assets/brand/schemarouter-mark-dark.svg
  favicon: assets/brand/schemarouter-mark-light.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/brand.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

